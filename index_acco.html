<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣 TAIWAN top</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Roboto Mono with Thin/Light/Regular/Medium/Bold & Italic weights -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:ital,wght@0,200;0,300;0,400;0,500;0,700;1,200;1,300;1,400&display=swap" rel="stylesheet">
  <!-- PapaParse for robust CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Roboto Mono"', '"Noto Sans TC"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --outer-gap: clamp(10px, 2vmin, 28px);
    }

    * {
      font-family: 'Roboto Mono', 'Noto Sans TC', monospace;
    }

    body {
      background-color: #e7e7e7;
      color: #000000;
      padding: var(--outer-gap);
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    #pageWrapper {
      background-color: #F4F3EF;
      transition: background-color 0.35s ease;
    }

    body.dark-mode #pageWrapper {
      background-color: #161615;
    }

    .place-divider {
      border-color: #000000;
    }

    /* Smooth accordion transition with elastic settle */
    .accordion-content {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition:
        grid-template-rows 0.55s cubic-bezier(0.34, 1.45, 0.64, 1),
        opacity 0.35s ease;
    }

    .accordion-item.is-open .accordion-content {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .accordion-inner {
      overflow: hidden;
    }

    .accordion-inner > div {
      transform: translateY(-10px);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .accordion-item.is-open .accordion-inner > div {
      transform: translateY(0);
    }

    .accordion-header-btn {
      transition:
        height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        min-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.35s ease,
        color 0.35s ease,
        padding 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.25s ease;
    }

    .accordion-header-btn .city-zh,
    .accordion-header-btn .city-en {
      transition: font-size 0.45s cubic-bezier(0.22, 1, 0.36, 1), width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fixed-width Chinese label column so English titles always align on the exact same vertical line */
    .city-zh-col {
      width: 3.1rem;
    }

    @media (min-width: 640px) {
      .city-zh-col {
        width: 4.5rem;
      }
    }

    @media (min-width: 768px) {
      .city-zh-col {
        width: 5.25rem;
      }
    }

    .accordion-item.is-open .accordion-header-btn {
      position: sticky;
      top: 0;
      z-index: 30;
      height: calc((100dvh - (2 * var(--outer-gap))) / 14);
      min-height: 2.35rem;
    }

    @media (min-width: 640px) {
      .accordion-item.is-open .accordion-header-btn {
        min-height: 2.65rem;
      }
    }

    .accordion-item.is-open .accordion-header-btn .city-zh {
      font-size: 0.95rem;
    }

    .accordion-item.is-open .accordion-header-btn .city-en {
      font-size: 1.45rem;
    }

    @media (min-width: 640px) {
      .accordion-item.is-open .accordion-header-btn .city-zh {
        font-size: 1.15rem;
      }
      .accordion-item.is-open .accordion-header-btn .city-en {
        font-size: 1.85rem;
      }
    }

    .accordion-header-btn:hover {
      filter: brightness(0.97);
    }

    body.dark-mode .accordion-header-btn:hover {
      filter: brightness(1.08);
    }

    /* Dark mode toggle inspired by the Yin-Yang icon in the top right */
    body.dark-mode {
      background-color: #121211;
      color: #F4F3EF;
    }

    body.dark-mode .place-divider {
      border-color: rgba(244, 243, 239, 0.45);
    }

    body.dark-mode .yin-yang-icon {
      transform: rotate(180deg);
    }

    .yin-yang-icon {
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #themeToggle:hover .yin-yang-icon {
      transform: scale(1.12);
    }

    body.dark-mode #themeToggle:hover .yin-yang-icon {
      transform: rotate(180deg) scale(1.12);
    }

    /* Place Detail Modal Transitions */
    #placeModal {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #placeModal.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    #placeModalCard {
      background-color: #F4F3EF;
      color: #000000;
      border-color: #000000;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    }

    #placeModal.is-visible #placeModalCard {
      transform: translateY(0) scale(1);
    }

    body.dark-mode #placeModalCard {
      background-color: #1A1A19;
      color: #F4F3EF;
      border-color: #F4F3EF;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
    }

    /* Vertically responsive row height: 1/7 of browser viewport height minus outer vertical padding */
    .viewport-row {
      height: calc((100dvh - 1rem) / 7);
      min-height: 3.75rem;
    }

    /* Vertically responsive row height: 1/7 of browser viewport height minus symmetrical top & bottom outer padding */
    .viewport-row {
      height: calc((100dvh - (2 * var(--outer-gap))) / 7);
      min-height: 3.75rem;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-black selection:text-white">

  <!-- Main Container with subtle padding around the whole page -->
  <div id="pageWrapper" class="w-full max-w-full mx-auto">

    <!-- Header Section matching 1/7 of the browser window height -->
    <header class="w-full flex items-center justify-between px-3 sm:px-6 viewport-row">
      <div class="flex items-center overflow-hidden">
        <!-- Traditional Chinese Taiwan label -->
        <span class="city-zh-col text-left text-xl sm:text-2xl md:text-[26px] font-normal tracking-normal [font-kerning:none] shrink-0">
          台灣
        </span>

        <!-- Thin geometric TAIWAN + italic top aligned with city names -->
        <h1 class="text-3xl sm:text-5xl md:text-[54px] leading-none tracking-normal [font-kerning:none] font-extralight select-none truncate">
          TAIWAN<span class="italic font-extralight tracking-normal [font-kerning:none]">top</span>
        </h1>
      </div>

      <!-- Interactive Yin-Yang Theme Toggle Button -->
      <button
        id="themeToggle"
        type="button"
        aria-label="Toggle Light/Dark Theme"
        title="Toggle theme"
        class="p-2 -mr-2 rounded-full focus:outline-none shrink-0 cursor-pointer"
      >
        <svg class="yin-yang-icon w-7 h-7 sm:w-8 sm:h-8" xmlns="http://www.w3.org/2000/svg" viewBox="-42 -42 84 84">
          <circle r="39" fill="#000" stroke="#000" stroke-width="4"/>
          <path fill="#fff" d="M0,38a38,38 0 0 1 0,-76a19,19 0 0 1 0,38a19,19 0 0 0 0,38"/>
          <circle r="5" cy="19" fill="#fff"/>
          <circle r="5" cy="-19" fill="#000"/>
        </svg>
      </button>
    </header>

    <!-- Status / Filter Bar (subtle, minimalist) -->
    <div id="statusBanner" class="hidden px-3 sm:px-6 pb-3 text-xs opacity-70 flex items-center justify-between">
      <span id="statusText">Loading places from Google Sheets...</span>
      <button id="retryBtn" class="hidden underline hover:opacity-100 cursor-pointer">Retry</button>
    </div>

    <!-- Full-width Colorful City Accordions Container -->
    <main id="citiesContainer" class="w-full flex flex-col"></main>

    <!-- Minimalist Footer matching 1/7 of the browser window height -->
    <footer class="w-full px-3 sm:px-6 viewport-row flex items-center justify-end text-xs sm:text-sm">
      <span>Curated by <a href="https://www.instagram.com/alby.food/" target="_blank" rel="noopener noreferrer" class="underline underline-offset-4 hover:no-underline">@alby.food</a></span>
    </footer>

  </div>

  <!-- Place Detail Modal -->
  <div
    id="placeModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    class="fixed inset-0 z-50 flex items-center justify-center p-2.5 sm:p-6 bg-black/60 backdrop-blur-[2px]"
  >
    <div
      id="placeModalCard"
      class="relative w-full max-w-4xl h-auto md:h-[65dvh] max-h-[760px] flex flex-col overflow-hidden border-2 rounded-xl shadow-2xl"
    >
      <!-- Floating Close Button directly on the top-right corner -->
      <button
        id="closeModalBtn"
        type="button"
        aria-label="Close modal"
        class="absolute top-3 right-3 z-20 w-8 h-8 flex items-center justify-center rounded-lg bg-[#F4F3EF]/90 dark:bg-[#1A1A19]/90 md:bg-transparent md:dark:bg-transparent hover:bg-black/10 dark:hover:bg-white/10 transition-colors cursor-pointer text-base sm:text-lg leading-none font-bold"
      >
        ✕
      </button>

      <!-- Responsive Content Layout: Stacked on mobile, Side-by-side on desktop so modal never scrolls -->
      <div class="flex-1 min-h-0 flex flex-col md:flex-row overflow-hidden">
        <!-- 1:1 Square Picture Container -->
        <div id="modalImageWrapper" class="relative w-full md:w-auto md:h-full aspect-square max-h-[38dvh] md:max-h-none shrink-0 bg-black/5 overflow-hidden border-b-2 md:border-b-0 md:border-r-2 border-current/20 mx-auto md:mx-0">
          <img
            id="modalImage"
            src=""
            alt=""
            class="w-full h-full object-cover"
          />
        </div>

        <!-- Details Body -->
        <div class="flex-1 min-h-0 p-4 sm:p-6 flex flex-col justify-between gap-2.5 sm:gap-4 overflow-hidden">
          <div class="min-h-0 flex flex-col gap-2 sm:gap-3 overflow-hidden pr-7">
            <h2 id="modalTitle" class="text-lg sm:text-xl lg:text-2xl font-bold leading-tight tracking-normal [font-kerning:none] line-clamp-2 shrink-0">
              Place Title
            </h2>

            <!-- Description -->
            <p id="modalDescription" class="text-xs sm:text-sm lg:text-base font-normal leading-relaxed opacity-90 line-clamp-4 sm:line-clamp-none overflow-hidden">
              Description
            </p>
          </div>

          <!-- Bottom Section: City Badge + Category Badges Above Separation Line + Google Maps Button Below -->
          <div class="flex flex-col gap-2.5 sm:gap-3 shrink-0">
            <!-- City Badge & Categories as Badges (Above Separation Line) -->
            <div id="modalCategories" class="flex flex-wrap items-center gap-1.5 sm:gap-2"></div>

            <!-- Action Footer Below Separation Line -->
            <div class="pt-2.5 sm:pt-3.5 border-t border-current/20 flex items-center justify-end">
              <a
                id="modalMapsLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 sm:gap-2 px-3 py-2 sm:px-4 sm:py-2.5 rounded-lg border-2 border-current font-bold text-xs sm:text-sm hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors shrink-0"
              >
                <span>Open in Google Maps</span>
                <span aria-hidden="true">↗</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv';
    const CACHE_KEY = 'taiwantop_csv_cache_v1';

    // City configuration matching screenshot light colors + creative dark mode palette with white text
    const CITY_META = {
      'taipei': {
        en: 'Taipei',
        zh: '台北',
        bg: '#F7D249',
        text: '#0A0A0A',
        darkBg: '#8A5A19', // Deep warm amber/ochre
        darkText: '#FFFFFF',
        order: 1
      },
      'taichung': {
        en: 'Taichung',
        zh: '台中',
        bg: '#C6BEB8',
        text: '#0A0A0A',
        darkBg: '#4E4946', // Warm charcoal taupe
        darkText: '#FFFFFF',
        order: 2
      },
      'tainan': {
        en: 'Tainan',
        zh: '台南',
        bg: '#F6BBF5',
        text: '#0A0A0A',
        darkBg: '#7A3B6E', // Deep plum magenta
        darkText: '#FFFFFF',
        order: 3
      },
      'kaohsiung': {
        en: 'Kaohsiung',
        zh: '高雄',
        bg: '#8FA3D9',
        text: '#0A0A0A',
        darkBg: '#2E436E', // Deep indigo harbor blue
        darkText: '#FFFFFF',
        order: 4
      },
      'hengchun': {
        en: 'Hengchun',
        zh: '墾丁',
        bg: '#65754A',
        text: '#0A0A0A',
        darkBg: '#37472C', // Deep coastal forest moss
        darkText: '#FFFFFF',
        order: 5
      },
      'kenting': {
        en: 'Hengchun',
        zh: '墾丁',
        bg: '#65754A',
        text: '#0A0A0A',
        darkBg: '#37472C',
        darkText: '#FFFFFF',
        order: 5
      }
    };

    // Fallback curated palettes if additional cities exist in the CSV
    const EXTRA_PALETTE = [
      { bg: '#E59866', darkBg: '#7E4627', zh: '台灣' },
      { bg: '#82B3A6', darkBg: '#2D594E', zh: '台灣' },
      { bg: '#D4A373', darkBg: '#6B4C2E', zh: '台灣' },
      { bg: '#A3B18A', darkBg: '#424F32', zh: '台灣' }
    ];

    // Fallback data (without image URLs) in case CORS/network blocks live CSV in an offline sandbox
    const FALLBACK_ROWS = [
      { City: 'Taipei', Title: '真珠 JIN ZHU', Description: 'Nice Taiwanese cuisine chain', Category: 'taiwanese, restaurant' },
      { City: 'Taipei', Title: '阿石北平烤鴨店', Description: 'Beiping style roasted duck', Category: 'roast duck, takeaway' },
      { City: 'Taipei', Title: '口福黑輪', Description: 'Taiwanese-style oden', Category: 'oden, street food' },
      { City: 'Taichung', Title: '第二市場 Second Market', Description: 'Historic market famous for braised pork rice and radish cake', Category: 'market, local food' },
      { City: 'Tainan', Title: '文章牛肉湯', Description: 'Classic Tainan fresh beef soup served with rice', Category: 'beef soup, breakfast' },
      { City: 'Kaohsiung', Title: '駁二藝術特區 Pier-2', Description: 'Waterfront warehouse district with cafes and exhibitions', Category: 'art, coffee, walk' },
      { City: 'Hengchun', Title: '樹夏飲事', Description: 'Glasshouse cafe built inside historic ruins', Category: 'coffee, dessert' }
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * Generates a clean SVG fallback image for places without a photo URL
     */
    function getFallbackSquareImage(title, bgHex) {
      const safeTitle = (title || 'TAIWANtop').slice(0, 18);
      const fill = bgHex || '#C6BEB8';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
        <rect width="600" height="600" fill="${fill}"/>
        <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#0A0A0A">${safeTitle}</text>
        <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-family="monospace" font-size="16" fill="#0A0A0A" opacity="0.65">TAIWAN top</text>
      </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    /**
     * Groups parsed CSV rows by city and sorts them in the canonical order
     */
    function groupPlacesByCity(rows) {
      const groupsMap = new Map();
      let extraIndex = 0;

      rows.forEach((row) => {
        const rawCity = (row.City || row.city || row['城市'] || '').trim();
        const title = (row.Title || row.title || row.Name || row.name || row['店名'] || '').trim();
        if (!rawCity || !title) return;

        const key = rawCity.toLowerCase();
        const meta = CITY_META[key];
        const canonicalKey = meta ? meta.en.toLowerCase() : key;

        if (!groupsMap.has(canonicalKey)) {
          if (meta) {
            groupsMap.set(canonicalKey, {
              key: canonicalKey,
              en: meta.en,
              zh: meta.zh,
              bg: meta.bg,
              text: meta.text,
              darkBg: meta.darkBg,
              darkText: meta.darkText,
              order: meta.order,
              places: []
            });
          } else {
            const extra = EXTRA_PALETTE[extraIndex % EXTRA_PALETTE.length];
            extraIndex++;
            groupsMap.set(canonicalKey, {
              key: canonicalKey,
              en: rawCity,
              zh: extra.zh,
              bg: extra.bg,
              text: '#0A0A0A',
              darkBg: extra.darkBg,
              darkText: '#FFFFFF',
              order: 100 + extraIndex,
              places: []
            });
          }
        }

        const description = (row.Description || row.description || row.Notes || row.notes || row['簡介'] || '').trim();
        const rawCategory = (row.Category || row.category || row.Categories || row.categories || row.Tags || row.tags || row['分類'] || '').trim();
        const categories = rawCategory
          ? rawCategory.split(/[,;/]+/).map((c) => c.trim()).filter(Boolean)
          : [];
        const image = (row.Image || row.image || row.Photo || row.photo || row.Thumbnail || row.thumbnail || '').trim();
        const mapsUrl = (row['Google Maps'] || row.Maps || row.maps || row.Map || row.map || row.URL || row.url || row.Link || row.link || '').trim();

        groupsMap.get(canonicalKey).places.push({
          title,
          description,
          categories,
          image,
          mapsUrl
        });
      });

      // Ensure all 5 default cities appear even if empty in a custom CSV
      Object.values(CITY_META).forEach((meta) => {
        const canonicalKey = meta.en.toLowerCase();
        if (!groupsMap.has(canonicalKey)) {
          groupsMap.set(canonicalKey, {
            key: canonicalKey,
            en: meta.en,
            zh: meta.zh,
            bg: meta.bg,
            text: meta.text,
            darkBg: meta.darkBg,
            darkText: meta.darkText,
            order: meta.order,
            places: []
          });
        }
      });

      return Array.from(groupsMap.values()).sort((a, b) => a.order - b.order);
    }

    /**
     * Updates accordion header colors when toggling light/dark theme
     */
    function applyAccordionThemeColors() {
      const isDark = document.body.classList.contains('dark-mode');
      document.querySelectorAll('.accordion-header-btn').forEach((btn) => {
        btn.style.backgroundColor = isDark ? btn.dataset.darkBg : btn.dataset.lightBg;
        btn.style.color = isDark ? btn.dataset.darkText : btn.dataset.lightText;
      });
    }

    /**
     * Opens the place detail modal with 1:1 image, city + uppercase category badges, and Google Maps link
     */
    function openPlaceModal(place, cityGroup) {
      const modal = document.getElementById('placeModal');
      const modalImg = document.getElementById('modalImage');
      const modalTitle = document.getElementById('modalTitle');
      const modalDesc = document.getElementById('modalDescription');
      const modalCats = document.getElementById('modalCategories');
      const modalMaps = document.getElementById('modalMapsLink');

      const isDark = document.body.classList.contains('dark-mode');

      modalTitle.textContent = place.title;
      modalDesc.textContent = place.description || 'No description provided.';

      const fallbackSrc = getFallbackSquareImage(place.title, cityGroup.bg);
      modalImg.onerror = () => {
        modalImg.onerror = null;
        modalImg.src = fallbackSrc;
      };
      modalImg.src = place.image || fallbackSrc;
      modalImg.alt = place.title;

      // Render city badge first (with city-specific color), followed by uppercase category badges of identical height & text size
      modalCats.innerHTML = '';

      const cityBadge = document.createElement('span');
      cityBadge.className = 'inline-flex items-center px-2.5 py-0.5 text-[11px] sm:text-xs font-bold uppercase tracking-wider border border-transparent rounded-full';
      cityBadge.textContent = `${cityGroup.zh} ${cityGroup.en}`;
      cityBadge.style.backgroundColor = isDark ? cityGroup.darkBg : cityGroup.bg;
      cityBadge.style.color = isDark ? cityGroup.darkText : cityGroup.text;
      modalCats.appendChild(cityBadge);

      if (place.categories && place.categories.length > 0) {
        place.categories.forEach((cat) => {
          const badge = document.createElement('span');
          badge.className = 'inline-flex items-center px-2.5 py-0.5 text-[11px] sm:text-xs font-bold uppercase tracking-wider border border-current rounded-full';
          badge.textContent = cat;
          modalCats.appendChild(badge);
        });
      }

      // Set direct Google Maps URL or fallback search query
      if (place.mapsUrl && /^https?:\/\//i.test(place.mapsUrl)) {
        modalMaps.href = place.mapsUrl;
      } else {
        const query = encodeURIComponent(`${place.title} ${cityGroup.en} Taiwan`);
        modalMaps.href = `https://www.google.com/maps/search/?api=1&query=${query}`;
      }

      modal.classList.add('is-visible');
    }

    /**
     * Closes the place detail modal
     */
    function closePlaceModal() {
      const modal = document.getElementById('placeModal');
      if (modal) {
        modal.classList.remove('is-visible');
      }
    }

    /**
     * Renders full-width city accordions with sticky half-size open headers and snap-to-top scrolling
     */
    function renderAccordions(cityGroups) {
      const container = document.getElementById('citiesContainer');
      container.innerHTML = '';
      const isDark = document.body.classList.contains('dark-mode');

      cityGroups.forEach((group) => {
        const item = document.createElement('section');
        item.className = 'accordion-item w-full';

        // Accordion Header Bar (1/7 viewport height closed, 1/14 sticky open)
        const headerBtn = document.createElement('button');
        headerBtn.type = 'button';
        headerBtn.setAttribute('aria-expanded', 'false');
        headerBtn.className = 'accordion-header-btn w-full viewport-row px-3 sm:px-6 flex items-center justify-between text-left cursor-pointer focus:outline-none select-none';
        headerBtn.dataset.lightBg = group.bg;
        headerBtn.dataset.lightText = group.text;
        headerBtn.dataset.darkBg = group.darkBg;
        headerBtn.dataset.darkText = group.darkText;
        headerBtn.style.backgroundColor = isDark ? group.darkBg : group.bg;
        headerBtn.style.color = isDark ? group.darkText : group.text;

        headerBtn.innerHTML = `
          <div class="flex items-center overflow-hidden">
            <span class="city-zh city-zh-col text-left text-xl sm:text-2xl md:text-[26px] font-normal tracking-normal [font-kerning:none] shrink-0">
              ${escapeHtml(group.zh)}
            </span>
            <span class="city-en text-3xl sm:text-5xl md:text-[54px] font-bold leading-none tracking-normal [font-kerning:none] truncate">
              ${escapeHtml(group.en)}
            </span>
          </div>
          <span class="text-xs sm:text-sm font-normal opacity-80 shrink-0 ml-3">
            (${group.places.length})
          </span>
        `;

        // Accordion Drawer Wrapper
        const contentWrapper = document.createElement('div');
        contentWrapper.className = 'accordion-content w-full';

        const inner = document.createElement('div');
        inner.className = 'accordion-inner w-full';

        const listContainer = document.createElement('div');
        listContainer.className = 'w-full px-3 sm:px-6 py-4 sm:py-6';

        if (group.places.length === 0) {
          const emptyMsg = document.createElement('p');
          emptyMsg.className = 'text-sm opacity-70 py-2';
          emptyMsg.textContent = 'No places listed yet.';
          listContainer.appendChild(emptyMsg);
        } else {
          const ul = document.createElement('ul');
          ul.className = 'w-full flex flex-col';

          group.places.forEach((place) => {
            const li = document.createElement('li');
            li.className = 'w-full py-3.5 sm:py-4 border-b-2 place-divider flex flex-col md:flex-row md:items-baseline gap-1.5 md:gap-12';

            // Left Column: Place Title (clickable to open modal)
            const titleCol = document.createElement('div');
            titleCol.className = 'w-full md:w-[36%] lg:w-[34%] shrink-0';

            const titleBtn = document.createElement('button');
            titleBtn.type = 'button';
            titleBtn.className = 'text-left text-lg sm:text-[20px] font-bold leading-snug tracking-normal [font-kerning:none] hover:underline underline-offset-4 cursor-pointer';
            titleBtn.textContent = place.title;
            titleBtn.addEventListener('click', () => openPlaceModal(place, group));

            titleCol.appendChild(titleBtn);

            // Right Column: Description shifted horizontally to the right
            const descCol = document.createElement('div');
            descCol.className = 'flex-1 text-sm sm:text-[16px] font-normal leading-relaxed';
            descCol.textContent = place.description;

            li.appendChild(titleCol);
            li.appendChild(descCol);
            ul.appendChild(li);
          });

          listContainer.appendChild(ul);
        }

        inner.appendChild(listContainer);
        contentWrapper.appendChild(inner);

        // Single-city accordion toggle with snap-to-top scroll
        headerBtn.addEventListener('click', () => {
          const wasOpen = item.classList.contains('is-open');

          // Close all accordions
          document.querySelectorAll('.accordion-item').forEach((el) => {
            el.classList.remove('is-open');
            const btn = el.querySelector('.accordion-header-btn');
            if (btn) btn.setAttribute('aria-expanded', 'false');
          });

          if (!wasOpen) {
            item.classList.add('is-open');
            headerBtn.setAttribute('aria-expanded', 'true');

            // Smoothly snap clicked city header to the sticky top position
            requestAnimationFrame(() => {
              item.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
          }
        });

        item.appendChild(headerBtn);
        item.appendChild(contentWrapper);
        container.appendChild(item);
      });
    }

    /**
     * Parses CSV string and renders accordions immediately
     */
    function parseAndRenderCsv(csvText) {
      return new Promise((resolve, reject) => {
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: (results) => {
            if (results.data && results.data.length > 0) {
              const grouped = groupPlacesByCity(results.data);
              renderAccordions(grouped);
              resolve(true);
            } else {
              reject(new Error('CSV returned zero rows'));
            }
          },
          error: (err) => reject(err)
        });
      });
    }

    /**
     * Instant-first boot: renders cached CSV or fallback immediately, then refreshes live in background
     */
    async function initDirectory() {
      const statusBanner = document.getElementById('statusBanner');
      const statusText = document.getElementById('statusText');
      const retryBtn = document.getElementById('retryBtn');

      // 1. Render instantly from localStorage cache or built-in fallback (zero waiting)
      let cachedCsv = null;
      try {
        cachedCsv = localStorage.getItem(CACHE_KEY);
      } catch (e) {}

      if (cachedCsv) {
        try {
          await parseAndRenderCsv(cachedCsv);
        } catch (e) {
          renderAccordions(groupPlacesByCity(FALLBACK_ROWS));
        }
      } else {
        renderAccordions(groupPlacesByCity(FALLBACK_ROWS));
      }

      // 2. Fetch fresh CSV in background with a fast 4s timeout so slow Google endpoints never stall UI
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      try {
        const response = await fetch(CSV_URL, {
          cache: 'default',
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`HTTP error ${response.status}`);
        }
        const freshCsv = await response.text();

        // Only re-render if data actually changed or nothing was cached yet
        if (freshCsv && freshCsv !== cachedCsv) {
          await parseAndRenderCsv(freshCsv);
          try {
            localStorage.setItem(CACHE_KEY, freshCsv);
          } catch (e) {}
        }
        statusBanner.classList.add('hidden');
      } catch (err) {
        clearTimeout(timeoutId);
        console.warn('Background CSV sync skipped/failed:', err);
        if (!cachedCsv) {
          statusBanner.classList.remove('hidden');
          statusText.textContent = 'Offline preview mode.';
          retryBtn.classList.remove('hidden');
        }
      }
    }

    // Theme toggle handler
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      applyAccordionThemeColors();
    });

    // Retry button handler
    document.getElementById('retryBtn').addEventListener('click', () => {
      document.getElementById('statusText').textContent = 'Retrying CSV fetch...';
      initDirectory();
    });

    // Modal close interactions (close button, backdrop click, Escape key)
    document.getElementById('closeModalBtn').addEventListener('click', closePlaceModal);
    document.getElementById('placeModal').addEventListener('click', (e) => {
      if (e.target.id === 'placeModal') {
        closePlaceModal();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('placeModal').classList.contains('is-visible')) {
        closePlaceModal();
      }
    });

    // Boot application
    window.addEventListener('DOMContentLoaded', initDirectory);
  </script>
</body>
