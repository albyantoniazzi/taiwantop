<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAIWAN TOP</title>

  <!-- Open Graph & SEO Metadata -->
  <meta name="description" content="A curated directory of places in Taiwan by @albyantoniazzi" />
  <meta property="og:title" content="TAIWAN TOP" />
  <meta property="og:description" content="A curated directory of places in Taiwan by @albyantoniazzi" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TAIWAN TOP" />
  <meta name="twitter:description" content="A curated directory of places in Taiwan by @albyantoniazzi" />
  <meta name="twitter:image" content="https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg" />

  <!-- Pixelify Sans & Crisp Monospace Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,400..700;1,400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PapaParse for Google Sheets CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Pixelify Sans"', 'monospace'],
            mono: ['"Google Sans Code"', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --desk: #5a2fd8;
      --desk-2: #5129cc;
      --face: #cfd2c6;
      --lite: #f7f8f0;
      --shade: #858a7b;
      --ink: #17180f;
      --amber: #ffb400;
      --paper: #fdfdf6;
      --drop: #1f0a66;
    }

    html.dark {
      --desk: #1e1347;
      --desk-2: #180f3a;
      --face: #383b34;
      --lite: #54584e;
      --shade: #1e201b;
      --ink: #11120b;
      --amber: #e09c00;
      --paper: #23251f;
      --drop: #0b0524;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: conic-gradient(var(--desk-2) 25%, var(--desk) 0 50%, var(--desk-2) 0 75%, var(--desk) 0) 0 0 / 8px 8px;
      color: var(--ink);
      font-family: "Pixelify Sans", monospace;
    }

    html.dark body {
      color: var(--lite);
    }

    /* Scrollbar utility */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Retro Bevel Window & Controls */
    .retro-win {
      border: 2px solid var(--ink);
      background: var(--face);
      box-shadow: inset 4px 4px 0 var(--lite), inset -4px -4px 0 var(--shade), 8px 8px 0 var(--drop);
    }

    .retro-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
      padding: 4px 10px;
      border: 2px solid var(--ink);
      background: var(--amber);
      color: #17180f;
    }

    .retro-close-box {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid var(--ink);
      background: var(--face);
      box-shadow: inset 2px 2px 0 var(--lite), inset -2px -2px 0 var(--shade);
      display: grid;
      place-items: center;
      color: #17180f;
      cursor: pointer;
    }
    .retro-close-box:active {
      box-shadow: inset -2px -2px 0 var(--lite), inset 2px 2px 0 var(--shade);
    }

    .retro-inset-field {
      border: 2px solid var(--ink);
      background: var(--paper);
      box-shadow: -2px -2px 0 var(--shade), 2px 2px 0 var(--lite);
    }

    .retro-inset-field:has(input:focus-visible) {
      outline: 4px solid var(--desk);
      outline-offset: 0;
      box-shadow: none;
    }

    .retro-btn {
      border: 2px solid var(--ink);
      background: var(--face);
      color: #17180f;
      box-shadow: inset 3px 3px 0 var(--lite), inset -3px -3px 0 var(--shade);
      cursor: pointer;
      transition: transform 60ms steps(2, end);
    }

    html.dark .retro-btn {
      color: var(--lite);
    }

    .retro-btn:hover {
      background: var(--amber);
      color: #17180f;
    }

    .retro-btn:active,
    .retro-btn.is-active {
      background: var(--amber);
      color: #17180f;
      box-shadow: inset -3px -3px 0 var(--lite), inset 3px 3px 0 var(--shade);
    }

    .retro-trigger-btn {
      border: 0;
      border-left: 2px solid var(--ink);
      background: var(--face);
      box-shadow: inset 4px 4px 0 var(--lite), inset -4px -4px 0 var(--shade);
      cursor: pointer;
    }
    .retro-trigger-btn:active {
      box-shadow: inset -4px -4px 0 var(--lite), inset 4px 4px 0 var(--shade);
    }

    /* Stepped Clip-Path Dropdown Popover */
    .retro-pop {
      border: 2px solid var(--ink);
      border-top: 0;
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--drop);
      color: var(--ink);
      clip-path: inset(0 0 0 0);
      transition: clip-path 140ms steps(4, end);
    }
    html.dark .retro-pop {
      color: var(--lite);
    }
    .retro-pop.is-closed {
      clip-path: inset(0 0 100% 0);
      pointer-events: none;
    }

    .retro-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      padding: 4px 10px;
      cursor: pointer;
      outline: none;
    }
    .retro-item:hover,
    .retro-item[data-highlighted="true"] {
      background: #5a2fd8;
      color: #fdfdf6;
    }
    .retro-item mark {
      display: inline-block;
      background: linear-gradient(#ffb400, #ffb400) left / calc(100% - 2px) 100% no-repeat;
      box-shadow: -2px 0 0 #ffb400;
      color: #17180f;
      padding: 0 1px;
    }

    /* Retro Photo Card Frame */
    .retro-card {
      border: 2px solid var(--ink);
      background: var(--face);
      padding: 6px;
      box-shadow: inset 3px 3px 0 var(--lite), inset -3px -3px 0 var(--shade), 6px 6px 0 var(--drop);
      transition: transform 100ms steps(2, end), box-shadow 100ms steps(2, end);
    }
    .retro-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: inset 3px 3px 0 var(--lite), inset -3px -3px 0 var(--shade), 8px 8px 0 var(--drop);
    }
    .retro-card:focus-visible {
      outline: 4px solid var(--amber);
      outline-offset: 2px;
    }

    /* Unified badge styling */
    .badge-pill {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.1rem;
      letter-spacing: 0.02em;
    }

    /* Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body class="selection:bg-[#ffb400] selection:text-[#17180f]">

  <script>
    // CSV URL & Fallback Image
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv";
    const DEFAULT_FALLBACK_IMAGE = "https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCityName(str) {
      if (!str) return '';
      return str
        .split(/\s+/)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
    }

    // Highlight matching substring segments with <mark> per the design spec
    function highlightMatchSegments(label, query) {
      const cleanQuery = (query || '').trim();
      if (!cleanQuery) return escapeHtml(label);

      const tokens = cleanQuery.split(/\s+/).filter(Boolean);
      const activeToken = tokens[tokens.length - 1] || cleanQuery;
      const lowerLabel = label.toLowerCase();
      const lowerFull = cleanQuery.toLowerCase();
      const lowerTok = activeToken.toLowerCase();

      let matchIdx = lowerLabel.indexOf(lowerFull);
      let matchLen = lowerFull.length;

      if (matchIdx === -1 && lowerTok.length >= 1) {
        matchIdx = lowerLabel.indexOf(lowerTok);
        matchLen = lowerTok.length;
      }

      if (matchIdx === -1) return escapeHtml(label);

      const before = escapeHtml(label.slice(0, matchIdx));
      const matched = escapeHtml(label.slice(matchIdx, matchIdx + matchLen));
      const after = escapeHtml(label.slice(matchIdx + matchLen));
      return `${before}<mark>${matched}</mark>${after}`;
    }

    // State Variables
    let allPlaces = [];
    let visiblePlaces = [];
    let displayedCount = 24;
    const PAGE_SIZE = 24;
    let activeCategory = "ALL";
    let searchQuery = "";
    let searchDebounceTimer = null;
    let rotationDeg = 0;
    let activeModalIndex = -1;
    let autocompleteIndex = [];
    let activeSuggestionIdx = -1;

    // DOM Elements
    const gridEl = document.getElementById("places-grid");
    const loadMoreContainer = document.getElementById("load-more-container");
    const loadMoreBtn = document.getElementById("load-more-btn");
    const loadingEl = document.getElementById("loading-state");
    const emptyEl = document.getElementById("empty-state");
    const emptyTitleEl = document.getElementById("empty-state-title");
    const categoryContainer = document.getElementById("category-filters");
    const searchWrapper = document.getElementById("search-wrapper");
    const searchInput = document.getElementById("search-input");
    const dropdownToggleBtn = document.getElementById("dropdown-toggle-btn");
    const searchAutocompleteEl = document.getElementById("search-autocomplete");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const themeToggleBtn = document.getElementById("theme-toggle");
    const yinYangIcon = document.getElementById("yin-yang-icon");

    // Modal & Toast Elements
    const modalEl = document.getElementById("detail-modal");
    const modalCardEl = document.getElementById("modal-card");
    const modalImageEl = document.getElementById("modal-image");
    const modalTitleEl = document.getElementById("modal-title");
    const modalDescEl = document.getElementById("modal-description");
    const modalCityBadge = document.getElementById("modal-city-badge");
    const modalTags = document.getElementById("modal-tags");
    const modalMapLink = document.getElementById("modal-map-link");
    const modalShareBtn = document.getElementById("modal-share-btn");
    const modalShareLabel = document.getElementById("modal-share-label");
    const modalShareCopyIcon = document.getElementById("modal-share-copy-icon");
    const modalShareCheckIcon = document.getElementById("modal-share-check-icon");
    const modalPrevBtn = document.getElementById("modal-prev-btn");
    const modalNextBtn = document.getElementById("modal-next-btn");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const modalCounterEl = document.getElementById("modal-counter");
    const toastEl = document.getElementById("toast-notification");
    const toastMsg = document.getElementById("toast-message");
    let shareResetTimeout = null;

    // Extract Flickr numerical photo ID safely as BigInt
    function extractFlickrPhotoId(url) {
      if (!url || typeof url !== 'string') return 0n;
      const match = url.match(/\/(\d+)_/);
      try {
        return match ? BigInt(match[1]) : 0n;
      } catch {
        return 0n;
      }
    }

    function slugify(str) {
      return String(str || '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function showToast(message) {
      if (!toastEl || !toastMsg) return;
      toastMsg.textContent = message;
      toastEl.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toastEl.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
      }, 2400);
    }

    function createCardElement(place, index) {
      const card = document.createElement('article');
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `${place.title}${place.city ? ` in ${place.city}` : ''}`);
      card.className = "retro-card w-full group cursor-pointer select-none flex flex-col";

      const fullImageSource = place.photo || DEFAULT_FALLBACK_IMAGE;
      const safeTitle = escapeHtml(place.title);
      const safeDesc = escapeHtml(place.description);

      card.innerHTML = `
        <div class="relative aspect-square w-full border-2 border-[#17180f] bg-stone-800 overflow-hidden">
          <!-- 1:1 Square Photo -->
          <img 
            src="${escapeHtml(fullImageSource)}" 
            alt="${safeTitle}" 
            loading="lazy"
            decoding="async"
            onerror="if(this.dataset.triedOriginal!=='true'){this.dataset.triedOriginal='true';this.src='${escapeHtml(place.photo || DEFAULT_FALLBACK_IMAGE)}';}else{this.onerror=null;this.src='${DEFAULT_FALLBACK_IMAGE}';}"
            class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300 ease-out"
          />

          <!-- Smooth Dark Gradient Overlay for Legibility -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent pointer-events-none"></div>

          <!-- Overlaid Title & Subtitle (Categories hidden until modal open) -->
          <div class="absolute inset-x-0 bottom-0 p-3 sm:p-3.5 flex flex-col justify-end text-left pointer-events-none">
            <h2 class="text-base sm:text-lg font-bold text-[#fdfdf6] tracking-tight leading-snug line-clamp-1 drop-shadow-[2px_2px_0_#17180f]">
              ${safeTitle}
            </h2>
            ${safeDesc ? `
              <p class="font-mono text-[11px] sm:text-xs text-[#fdfdf6]/90 font-normal mt-0.5 line-clamp-1 leading-snug">
                ${safeDesc}
              </p>
            ` : ''}
          </div>
        </div>
      `;

      // Card click and keyboard Enter/Space opens modal
      card.addEventListener('click', () => openModal(index));
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal(index);
        }
      });

      return card;
    }

    function renderCards() {
      gridEl.innerHTML = "";
      if (visiblePlaces.length === 0) {
        emptyEl.classList.remove("hidden");
        loadMoreContainer.classList.add("hidden");
        startDinoGame();
        return;
      }

      emptyEl.classList.add("hidden");
      stopDinoGame();

      const slice = visiblePlaces.slice(0, displayedCount);
      const fragment = document.createDocumentFragment();
      slice.forEach((place, idx) => {
        fragment.appendChild(createCardElement(place, idx));
      });
      gridEl.appendChild(fragment);

      loadMoreContainer.classList.toggle("hidden", displayedCount >= visiblePlaces.length);
    }

    function appendNextBatch() {
      const start = displayedCount;
      const end = Math.min(displayedCount + PAGE_SIZE, visiblePlaces.length);
      if (start >= end) return;

      const fragment = document.createDocumentFragment();
      for (let i = start; i < end; i++) {
        fragment.appendChild(createCardElement(visiblePlaces[i], i));
      }
      gridEl.appendChild(fragment);
      displayedCount = end;

      loadMoreContainer.classList.toggle("hidden", displayedCount >= visiblePlaces.length);
    }

    function filterPlaces() {
      const q = searchQuery.toLowerCase().trim();
      const rawTokens = q.split(/\s+/).filter(Boolean);

      visiblePlaces = allPlaces.filter(place => {
        const matchesCategory = (activeCategory === "ALL") || place.categories.some(c => c.toLowerCase() === activeCategory.toLowerCase());
        const searchable = `${place.title} ${place.description} ${place.categories.join(' ')} ${place.city}`.toLowerCase();
        const matchesSearch = rawTokens.length === 0 || rawTokens.every(tok => searchable.includes(tok));
        return matchesCategory && matchesSearch;
      });

      displayedCount = PAGE_SIZE;
      renderCards();
    }

    function updateToolbarStyles() {
      const buttons = categoryContainer.querySelectorAll(".cat-filter-btn");
      buttons.forEach(btn => {
        const btnCat = btn.getAttribute("data-category");
        const isActive = btnCat.toLowerCase() === activeCategory.toLowerCase();
        btn.classList.toggle("is-active", isActive);
        btn.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
    }

    window.setCategory = function(cat) {
      activeCategory = (activeCategory.toLowerCase() === cat.toLowerCase() && cat.toLowerCase() !== "all") ? "ALL" : cat;
      updateToolbarStyles();
      updateUrlState();
      filterPlaces();
    };

    function populateCategoryFilters() {
      const catCount = {};
      const catDisplay = {};

      allPlaces.forEach(p => {
        const seenInPlace = new Set();
        p.categories.forEach(c => {
          const clean = c.trim().replace(/\s+/g, ' ');
          const key = clean.toLowerCase();
          if (key && !seenInPlace.has(key)) {
            seenInPlace.add(key);
            catCount[key] = (catCount[key] || 0) + 1;
            if (!catDisplay[key]) catDisplay[key] = clean;
          }
        });
      });

      // Sort categories alphabetically
      const sortedKeys = Object.keys(catCount).sort((a, b) => a.localeCompare(b));

      // Keep "ALL" button with total count and append sorted categories
      const allBtn = categoryContainer.querySelector('[data-category="ALL"]');
      categoryContainer.innerHTML = "";
      if (allBtn) {
        allBtn.innerHTML = `<span>ALL</span><span class="ml-1.5 text-[10px] leading-none font-bold opacity-80">${allPlaces.length}</span>`;
        allBtn.onclick = () => setCategory("ALL");
        categoryContainer.appendChild(allBtn);
      }

      sortedKeys.forEach(key => {
        const count = catCount[key] || 0;
        const displayLabel = catDisplay[key];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("data-category", displayLabel);
        btn.className = "cat-filter-btn retro-btn badge-pill inline-flex items-center justify-center flex-shrink-0 px-3 py-1 uppercase";
        btn.innerHTML = `<span>${escapeHtml(displayLabel.toUpperCase())}</span><span class="ml-1.5 text-[10px] leading-none font-bold opacity-80">${count}</span>`;
        btn.onclick = () => setCategory(displayLabel);
        categoryContainer.appendChild(btn);
      });
    }

    function parseUrlState() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.has("cat")) activeCategory = params.get("cat");
        const initialCity = params.get("city");
        const initialQ = params.get("q");
        if (initialQ || initialCity) {
          searchQuery = [initialCity, initialQ].filter(Boolean).join(" ").trim();
          searchInput.value = searchQuery;
          clearSearchBtn.classList.toggle("hidden", !searchQuery);
        }
        return params.get("spot");
      } catch (err) {
        return null;
      }
    }

    function updateUrlState(targetSpotSlug = null) {
      if (window.location.protocol === 'blob:' || !window.location.origin || window.location.origin === 'null') {
        return;
      }
      try {
        const params = new URLSearchParams();
        if (activeCategory !== "ALL") params.set("cat", activeCategory);
        if (searchQuery.trim()) params.set("q", searchQuery.trim());
        if (targetSpotSlug) params.set("spot", targetSpotSlug);

        const queryString = params.toString();
        const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
        window.history.replaceState({}, '', newUrl);
      } catch (err) {
        // Silently catch history API access errors in constrained iframes
      }
    }

    // Modal Operations with Scroll-Lock Prevention
    window.openModal = function(index) {
      if (!visiblePlaces[index]) return;
      activeModalIndex = index;
      const place = visiblePlaces[index];

      // Reset Share button state when opening a spot
      if (shareResetTimeout) clearTimeout(shareResetTimeout);
      if (modalShareLabel) modalShareLabel.textContent = "Share Place";
      if (modalShareCopyIcon) modalShareCopyIcon.classList.remove("hidden");
      if (modalShareCheckIcon) modalShareCheckIcon.classList.add("hidden");

      // Lock body scroll to prevent background scroll bleed
      document.body.style.overflow = 'hidden';

      if (modalCounterEl) {
        modalCounterEl.textContent = `${index + 1} / ${visiblePlaces.length}`;
      }

      // Full resolution for modal hero
      modalImageEl.src = place.photo || DEFAULT_FALLBACK_IMAGE;
      modalImageEl.alt = place.title;
      modalTitleEl.textContent = place.title;
      modalDescEl.textContent = place.description || "No description provided for this curated spot.";

      // City Badge in Modal (clickable to filter via rich search)
      if (place.city) {
        modalCityBadge.className = "retro-btn is-active badge-pill inline-flex items-center gap-1 px-2.5 py-1 uppercase";
        modalCityBadge.innerHTML = `
          <svg class="w-3 h-3 flex-shrink-0 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
          <span>${escapeHtml(place.city.toUpperCase())}</span>
        `;
        modalCityBadge.onclick = (e) => {
          e.stopPropagation();
          searchQuery = formatCityName(place.city);
          searchInput.value = searchQuery;
          clearSearchBtn.classList.remove("hidden");
          closeModal();
          updateUrlState();
          filterPlaces();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        modalCityBadge.classList.remove("hidden");
      } else {
        modalCityBadge.classList.add("hidden");
      }

      // Categories in Modal (clickable to filter by category)
      modalTags.innerHTML = "";
      place.categories.forEach(cat => {
        const tagBtn = document.createElement("button");
        tagBtn.type = "button";
        tagBtn.className = "retro-btn badge-pill px-2.5 py-1 uppercase";
        tagBtn.textContent = cat.toUpperCase();
        tagBtn.onclick = (e) => {
          e.stopPropagation();
          closeModal();
          setCategory(cat);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        modalTags.appendChild(tagBtn);
      });

      // Google Maps Link
      const queryMap = encodeURIComponent(`${place.title} ${place.city || 'Taiwan'}`);
      modalMapLink.href = place.link || `https://www.google.com/maps/search/?api=1&query=${queryMap}`;

      // Prev / Next arrow states
      if (modalPrevBtn) modalPrevBtn.disabled = index <= 0;
      if (modalNextBtn) modalNextBtn.disabled = index >= visiblePlaces.length - 1;

      updateUrlState(place.slug);

      modalEl.classList.remove("opacity-0", "pointer-events-none");
      modalEl.setAttribute("aria-hidden", "false");
      modalCardEl.classList.remove("scale-95");
      modalCardEl.classList.add("scale-100");
    };

    window.closeModal = function() {
      activeModalIndex = -1;
      document.body.style.overflow = '';
      modalEl.classList.add("opacity-0", "pointer-events-none");
      modalEl.setAttribute("aria-hidden", "true");
      modalCardEl.classList.remove("scale-100");
      modalCardEl.classList.add("scale-95");
      updateUrlState();
    };

    function navigateModal(delta) {
      if (activeModalIndex === -1) return;
      const nextIdx = activeModalIndex + delta;
      if (nextIdx >= 0 && nextIdx < visiblePlaces.length) {
        openModal(nextIdx);
      }
    }

    // Parse CSV Data & Hydrate UI
    function processPlacesData(rows) {
      const parsedPlaces = [];

      rows.forEach((row, idx) => {
        const title = (row.Title || row.title || row.Name || row.name || "").trim();
        if (!title) return;

        const city = (row.City || row.city || row.Location || row.location || "").trim();
        const rawCats = (row.Category || row.category || row.Categories || row.categories || row.Tags || row.tags || "").trim();
        const seenCats = new Set();
        const categories = [];
        if (rawCats) {
          rawCats.split(/[,;|]+/).forEach(c => {
            const clean = c.trim().replace(/\s+/g, ' ');
            const key = clean.toLowerCase();
            if (clean && !seenCats.has(key)) {
              seenCats.add(key);
              categories.push(clean);
            }
          });
        }
        const description = (row.Description || row.description || row.Notes || row.notes || "").trim();
        const photo = (row.Photo || row.photo || row.Image || row.image || row.URL || "").trim();
        const link = (row.Link || row.link || row.Maps || row.maps || row["Google Maps"] || "").trim();

        parsedPlaces.push({
          id: idx,
          slug: slugify(title),
          title,
          city,
          categories,
          description,
          photo,
          link,
          flickrId: extractFlickrPhotoId(photo)
        });
      });

      // Sort in descending order by Flickr photo ID (highest ID / newest first)
      allPlaces = parsedPlaces.sort((a, b) => {
        if (b.flickrId > a.flickrId) return 1;
        if (b.flickrId < a.flickrId) return -1;
        return 0;
      });

      buildAutocompleteIndex();
      populateCategoryFilters();

      const deepLinkedSpotSlug = parseUrlState();
      updateToolbarStyles();
      filterPlaces();

      if (deepLinkedSpotSlug) {
        const targetIndex = visiblePlaces.findIndex(p => p.slug === deepLinkedSpotSlug);
        if (targetIndex !== -1) openModal(targetIndex);
      }

      loadingEl.classList.add("hidden");
    }

    async function fetchPlaces() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: results => processPlacesData(results.data || []),
          error: err => {
            console.error("CSV Parse Error:", err);
            loadingEl.classList.add("hidden");
            emptyEl.classList.remove("hidden");
            startDinoGame();
          }
        });
      } catch (err) {
        console.error("Fetch Error:", err);
        loadingEl.classList.add("hidden");
        emptyEl.classList.remove("hidden");
        startDinoGame();
      }
    }

    // Rich Search Autocomplete Indexing & Rendering
    function buildAutocompleteIndex() {
      const seen = new Map();
      const stopWords = new Set(["the", "and", "for", "with", "from", "that", "this", "are", "was", "have", "has", "not", "but", "you", "your", "all", "can", "into", "very", "just", "one", "out", "about"]);

      const addTerm = (label, type, priority) => {
        const clean = label.trim();
        if (!clean || clean.length < 2) return;
        const key = clean.toLowerCase();
        const existing = seen.get(key);
        if (!existing || priority < existing.priority) {
          seen.set(key, { label: clean, type, priority });
        }
      };

      allPlaces.forEach(p => {
        if (p.city) addTerm(formatCityName(p.city), "city", 1);
        p.categories.forEach(c => addTerm(c.toLowerCase(), "food", 2));
        if (p.title) addTerm(p.title, "place", 3);

        const words = `${p.title} ${p.description}`.toLowerCase().match(/[a-z0-9\u4e00-\u9fa5]{3,}/g) || [];
        words.forEach(w => {
          if (!stopWords.has(w)) addTerm(w, "word", 4);
        });
      });

      autocompleteIndex = Array.from(seen.values()).sort((a, b) => a.priority - b.priority || a.label.localeCompare(b.label));
    }

    function hideAutocomplete() {
      activeSuggestionIdx = -1;
      searchAutocompleteEl.classList.add("is-closed");
      searchInput.setAttribute("aria-expanded", "false");
    }

    function applyAutocompleteSuggestion(suggestionLabel) {
      const currentVal = searchInput.value;
      const parts = currentVal.split(/\s+/);
      if (parts.length > 1 && currentVal.slice(-1) !== " ") {
        parts[parts.length - 1] = suggestionLabel;
        searchInput.value = parts.join(" ");
      } else {
        searchInput.value = suggestionLabel;
      }
      searchQuery = searchInput.value;
      clearSearchBtn.classList.toggle("hidden", !searchQuery);
      hideAutocomplete();
      updateUrlState();
      filterPlaces();
    }

    function renderAutocompleteSuggestions(val, showDefaultCities = false) {
      const raw = val.trim().toLowerCase();
      let topMatches = [];

      if (!raw && showDefaultCities) {
        topMatches = autocompleteIndex.filter(item => item.type === "city" || item.type === "food").slice(0, 8);
      } else if (!raw) {
        hideAutocomplete();
        return;
      } else {
        const tokens = raw.split(/\s+/);
        const lastToken = tokens[tokens.length - 1];

        topMatches = autocompleteIndex
          .filter(item => {
            const lower = item.label.toLowerCase();
            return lower.includes(raw) || (lastToken.length >= 2 && lower.startsWith(lastToken));
          })
          .slice(0, 8);
      }

      if (topMatches.length === 0) {
        hideAutocomplete();
        return;
      }

      activeSuggestionIdx = -1;
      searchAutocompleteEl.innerHTML = "";

      topMatches.forEach((match) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.className = "retro-item gap-2";

        const highlightedText = highlightMatchSegments(match.label, val);
        const badgeLabel = match.type === 'word'
          ? ''
          : `<span class="text-[11px] uppercase tracking-wider opacity-75 font-bold flex-shrink-0">[${escapeHtml(match.type)}]</span>`;

        li.innerHTML = `
          <span class="truncate">${highlightedText}</span>
          ${badgeLabel}
        `;

        li.addEventListener('mousedown', (e) => {
          e.preventDefault();
          applyAutocompleteSuggestion(match.label);
        });

        searchAutocompleteEl.appendChild(li);
      });

      searchAutocompleteEl.classList.remove('is-closed');
      searchInput.setAttribute("aria-expanded", "true");
    }

    // Trigger arrow button opens/closes city & food list
    if (dropdownToggleBtn) {
      dropdownToggleBtn.addEventListener("click", () => {
        const isClosed = searchAutocompleteEl.classList.contains("is-closed");
        if (isClosed) {
          searchInput.focus();
          renderAutocompleteSuggestions(searchInput.value, true);
        } else {
          hideAutocomplete();
        }
      });
    }

    // Debounced Search Input Events
    searchInput.addEventListener("input", () => {
      const val = searchInput.value;
      clearSearchBtn.classList.toggle("hidden", !val);
      renderAutocompleteSuggestions(val, false);

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchQuery = val;
        updateUrlState();
        filterPlaces();
      }, 150);
    });

    searchInput.addEventListener("keydown", (e) => {
      const items = searchAutocompleteEl.querySelectorAll("li");
      if (searchAutocompleteEl.classList.contains("is-closed") || items.length === 0) return;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        activeSuggestionIdx = (activeSuggestionIdx + 1) % items.length;
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeSuggestionIdx = (activeSuggestionIdx - 1 + items.length) % items.length;
      } else if (e.key === "Enter" && activeSuggestionIdx >= 0) {
        e.preventDefault();
        const label = items[activeSuggestionIdx].querySelector("span").textContent;
        applyAutocompleteSuggestion(label);
        return;
      } else if (e.key === "Escape") {
        hideAutocomplete();
        return;
      } else {
        return;
      }

      items.forEach((el, i) => {
        el.setAttribute("data-highlighted", i === activeSuggestionIdx ? "true" : "false");
        if (i === activeSuggestionIdx) {
          el.scrollIntoView({ block: "nearest" });
        }
      });
    });

    document.addEventListener("click", (e) => {
      if (searchWrapper && !searchWrapper.contains(e.target)) {
        hideAutocomplete();
      }
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      hideAutocomplete();
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      updateUrlState();
      filterPlaces();
    });

    // Modal & Global Keyboard / Touch Listeners
    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl || e.target.id === "modal-container") {
        closeModal();
      }
    });

    if (modalPrevBtn) modalPrevBtn.addEventListener("click", (e) => { e.stopPropagation(); navigateModal(-1); });
    if (modalNextBtn) modalNextBtn.addEventListener("click", (e) => { e.stopPropagation(); navigateModal(1); });
    if (modalCloseBtn) modalCloseBtn.addEventListener("click", (e) => { e.stopPropagation(); closeModal(); });

    if (modalShareBtn) {
      modalShareBtn.addEventListener("click", () => {
        const tempInput = document.createElement("input");
        tempInput.value = window.location.href;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          document.execCommand("copy");
          if (modalShareLabel) modalShareLabel.textContent = "Copied";
          if (modalShareCopyIcon) modalShareCopyIcon.classList.add("hidden");
          if (modalShareCheckIcon) modalShareCheckIcon.classList.remove("hidden");
          if (shareResetTimeout) clearTimeout(shareResetTimeout);
          shareResetTimeout = setTimeout(() => {
            if (modalShareLabel) modalShareLabel.textContent = "Share Place";
            if (modalShareCopyIcon) modalShareCopyIcon.classList.remove("hidden");
            if (modalShareCheckIcon) modalShareCheckIcon.classList.add("hidden");
          }, 2200);
        } catch {
          // Silently ignore if copy command fails
        }
        document.body.removeChild(tempInput);
      });
    }

    // Touch Swipe Support inside Modal
    let touchStartX = 0;
    modalCardEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    modalCardEl.addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 50) {
        navigateModal(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if (activeModalIndex !== -1) {
        if (e.key === "Escape") closeModal();
        else if (e.key === "ArrowLeft") navigateModal(-1);
        else if (e.key === "ArrowRight") navigateModal(1);
      }
    });

    // 404 Mini-Game: Long-Necked Goose Runner with Web Audio Quack
    const dinoCanvas = document.getElementById("dino-canvas");
    const dinoCtx = dinoCanvas ? dinoCanvas.getContext("2d") : null;
    let gameLoopId = null;
    let gameRunning = false;
    let gameOver = false;
    let gameScore = 0;
    let gameSpeed = 4.2;
    let frameTick = 0;
    let audioCtx = null;

    const goose = {
      x: 48,
      y: 112,
      w: 28,
      h: 34,
      vy: 0,
      gravity: 0.58,
      jumpPower: -8.8,
      grounded: true
    };
    let obstacles = [];

    function playQuackSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(210, now + 0.14);

        filter.type = "bandpass";
        filter.frequency.setValueAtTime(950, now);
        filter.Q.setValueAtTime(3.2, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.17);
      } catch {
        // Ignore audio errors if blocked
      }
    }

    function resetDinoGame() {
      goose.y = 112;
      goose.vy = 0;
      goose.grounded = true;
      obstacles = [];
      gameScore = 0;
      gameSpeed = 4.2;
      gameOver = false;
      gameRunning = true;
      if (emptyTitleEl) emptyTitleEl.classList.add("opacity-0");
    }

    function jumpGoose() {
      if (emptyEl.classList.contains("hidden")) return;
      if (!gameRunning || gameOver) {
        resetDinoGame();
      }
      if (goose.grounded) {
        goose.vy = goose.jumpPower;
        goose.grounded = false;
        playQuackSound();
      }
    }

    function spawnObstacle() {
      const types = ["hotpot", "flame", "oven"];
      const type = types[Math.floor(Math.random() * types.length)];
      const specs = {
        hotpot: { w: 28, h: 24 },
        flame: { w: 20, h: 28 },
        oven: { w: 30, h: 30 }
      };
      const spec = specs[type];
      obstacles.push({
        x: 620,
        y: 146 - spec.h,
        w: spec.w,
        h: spec.h,
        type
      });
    }

    function drawGoose(ctx, ink) {
      const x = Math.round(goose.x);
      const y = Math.round(goose.y);
      ctx.fillStyle = ink;

      // Body
      ctx.fillRect(x, y + 14, 18, 11);
      ctx.fillRect(x - 3, y + 12, 5, 5);

      // Long Upright Neck & Head
      ctx.fillRect(x + 13, y + 2, 5, 14);
      ctx.fillRect(x + 13, y, 9, 6);

      // Beak
      ctx.fillStyle = "#ffb400";
      ctx.fillRect(x + 22, y + 2, 6, 3);

      // Eye
      ctx.fillStyle = document.documentElement.classList.contains("dark") ? "#23251f" : "#fdfdf6";
      ctx.fillRect(x + 18, y + 1, 2, 2);

      // Animated Legs
      ctx.fillStyle = "#ffb400";
      const step = goose.grounded ? Math.floor(frameTick / 5) % 2 : 0;
      if (step === 0) {
        ctx.fillRect(x + 5, y + 25, 2, 9);
        ctx.fillRect(x + 12, y + 25, 2, 6);
      } else {
        ctx.fillRect(x + 5, y + 25, 2, 6);
        ctx.fillRect(x + 12, y + 25, 2, 9);
      }
    }

    function drawObstacle(ctx, obs, ink) {
      const x = Math.round(obs.x);
      const y = Math.round(obs.y);
      const flicker = Math.floor(frameTick / 4) % 2 === 0;

      if (obs.type === "hotpot") {
        ctx.fillStyle = ink;
        ctx.fillRect(x + 3, y + 5, 22, 13);
        ctx.fillRect(x, y + 7, 3, 4);
        ctx.fillRect(x + 25, y + 7, 3, 4);
        ctx.fillStyle = "#ffb400";
        ctx.fillRect(x + 7, y + 19, 14, flicker ? 5 : 3);
      } else if (obs.type === "flame") {
        ctx.fillStyle = ink;
        ctx.fillRect(x + 2, y + 23, 16, 5);
        ctx.fillStyle = "#ffb400";
        ctx.fillRect(x + 4, y + 8, 12, 15);
        ctx.fillRect(x + 7, y + (flicker ? 1 : 4), 6, 8);
      } else {
        ctx.fillStyle = ink;
        ctx.fillRect(x + 4, y, 22, 6);
        ctx.fillRect(x, y + 6, 30, 24);
        ctx.fillStyle = "#ffb400";
        ctx.fillRect(x + 9, y + 16, 12, flicker ? 14 : 12);
      }
    }

    function updateDinoGame() {
      if (!dinoCtx || emptyEl.classList.contains("hidden")) {
        gameLoopId = null;
        return;
      }

      const isDark = document.documentElement.classList.contains("dark");
      const ink = isDark ? "#f7f8f0" : "#17180f";
      dinoCtx.clearRect(0, 0, dinoCanvas.width, dinoCanvas.height);

      // Ground line
      dinoCtx.fillStyle = ink;
      dinoCtx.fillRect(0, 146, dinoCanvas.width, 2);

      if (gameRunning && !gameOver) {
        frameTick++;
        goose.vy += goose.gravity;
        goose.y += goose.vy;

        if (goose.y >= 112) {
          goose.y = 112;
          goose.vy = 0;
          goose.grounded = true;
        }

        if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 360 - Math.random() * 140) {
          spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= gameSpeed;
          if (obs.x + obs.w < 0) {
            obstacles.splice(i, 1);
            gameScore++;
            gameSpeed = Math.min(8.2, 4.2 + gameScore * 0.12);
            continue;
          }

          if (
            goose.x + 4 < obs.x + obs.w - 4 &&
            goose.x + goose.w - 6 > obs.x + 4 &&
            goose.y + 4 < obs.y + obs.h - 2 &&
            goose.y + goose.h - 2 > obs.y + 4
          ) {
            gameOver = true;
            gameRunning = false;
            if (emptyTitleEl) emptyTitleEl.classList.remove("opacity-0");
          }
        }
      }

      drawGoose(dinoCtx, ink);
      obstacles.forEach(obs => drawObstacle(dinoCtx, obs, ink));

      // HUD Score
      dinoCtx.fillStyle = ink;
      dinoCtx.font = "bold 14px 'Pixelify Sans', monospace";
      dinoCtx.textAlign = "right";
      dinoCtx.fillText(`SCORE ${String(gameScore).padStart(3, "0")}`, dinoCanvas.width - 12, 22);

      if (gameOver) {
        dinoCtx.textAlign = "center";
        dinoCtx.fillText("GAME OVER — TAP OR SPACE TO RETRY", dinoCanvas.width / 2, 74);
      }

      gameLoopId = requestAnimationFrame(updateDinoGame);
    }

    function startDinoGame() {
      if (!dinoCanvas || gameLoopId) return;
      gameLoopId = requestAnimationFrame(updateDinoGame);
    }

    function stopDinoGame() {
      if (gameLoopId) {
        cancelAnimationFrame(gameLoopId);
        gameLoopId = null;
      }
      gameRunning = false;
      if (emptyTitleEl) emptyTitleEl.classList.remove("opacity-0");
    }

    if (dinoCanvas) {
      dinoCanvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        jumpGoose();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && document.activeElement !== searchInput && !emptyEl.classList.contains("hidden")) {
        e.preventDefault();
        jumpGoose();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopDinoGame();
      } else if (!emptyEl.classList.contains("hidden")) {
        startDinoGame();
      }
    });

    // Theme Initialization & Yin-Yang Toggle (Defaults to Light Mode)
    function initTheme() {
      const savedTheme = localStorage.getItem("taiwantop-theme");
      const isDark = savedTheme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      rotationDeg = isDark ? 180 : 0;
      if (yinYangIcon) yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("taiwantop-theme", isDark ? "dark" : "light");
        rotationDeg += 180;
        if (yinYangIcon) yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;
      });
    }

    loadMoreBtn.addEventListener("click", () => {
      appendNextBatch();
    });

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      fetchPlaces();
    });
  </script>
</body>
</html>
