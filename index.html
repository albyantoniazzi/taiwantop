<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAIWAN TOP</title>

  <!-- Google Sans Code Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PapaParse for Google Sheets CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Google Sans Code"', 'monospace']
          },
          colors: {
            surface: {
              DEFAULT: '#0f131a',
              card: '#161b24',
              border: '#232b3b'
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Dotted background pattern */
    body {
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      background-attachment: fixed;
    }
    .dark body,
    html.dark body {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      background-attachment: fixed;
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    .shimmer {
      animation: shimmer 1.5s infinite ease-in-out;
      background-color: rgba(148, 163, 184, 0.15);
    }

    /* Card image zoom motion */
    .gallery-item {
      transition: transform 0.25s ease, opacity 0.2s ease;
    }
    .gallery-item .img-wrapper img {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .gallery-item:hover .img-wrapper img {
      transform: scale(1.04);
    }

    /* Custom scrollbar hiding utility */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="min-h-screen font-mono flex flex-col bg-slate-50 dark:bg-[#0c0e14] text-slate-800 dark:text-slate-100 transition-colors duration-200 selection:bg-cyan-500 selection:text-black overflow-x-hidden">

  <header class="border-b border-slate-200 dark:border-surface-border bg-white/80 dark:bg-surface/80 backdrop-blur-md sticky top-0 z-40 transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyan-500 dark:bg-cyan-400 animate-pulse"></span>
          <h1 class="text-base sm:text-lg md:text-xl font-bold tracking-tight uppercase flex items-center gap-1.5 flex-wrap">
            <a 
              href="index.html" 
              class="text-slate-900 dark:text-white hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors"
              title="Return to home"
            >
              TAIWAN TOP
            </a>
            <span class="text-slate-500 dark:text-slate-400 font-normal text-xs sm:text-sm lowercase">by</span>
            <a 
              href="https://albyantoniazzi.github.io/" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="text-slate-500 dark:text-slate-400 underline hover:text-slate-700 dark:hover:text-slate-200 transition-colors text-xs sm:text-sm font-medium lowercase"
            >
              @albyantoniazzi
            </a>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <div class="relative flex-1 md:w-64">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search..." 
            class="w-full bg-slate-100 dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-md px-4 py-2 text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-cyan-500 dark:focus:border-cyan-400 transition"
          />
          <span id="clear-search-btn" class="hidden absolute right-3 top-2 text-slate-400 hover:text-slate-700 dark:hover:text-white cursor-pointer text-xs font-bold">×</span>
        </div>

        <!-- City Filter Dropdown -->
        <div class="relative">
          <select 
            id="city-filter" 
            aria-label="Filter by City"
            class="appearance-none bg-slate-100 dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-md pl-3 pr-8 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:border-cyan-500 dark:focus:border-cyan-400 transition cursor-pointer"
          >
            <option value="ALL">All Cities</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-400 dark:text-slate-500">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>

        <!-- Live Place Counter -->
        <div class="px-3 py-1.5 bg-slate-100 dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-md text-xs font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">
          <span id="places-count" class="text-cyan-600 dark:text-cyan-400 font-bold">0</span> places
        </div>

        <!-- Taoist Yin Yang Theme Toggle Button -->
        <button 
          id="theme-toggle" 
          type="button" 
          title="Toggle Taoist Yin/Yang Mode"
          aria-label="Toggle Light and Dark Mode" 
          class="relative p-1 flex items-center justify-center group focus:outline-none"
        >
          <svg 
            id="yin-yang-icon" 
            class="w-7 h-7 transition-transform duration-500 ease-in-out cursor-pointer group-hover:scale-110 drop-shadow-sm" 
            viewBox="0 0 100 100"
          >
            <circle cx="50" cy="50" r="46" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
            <path d="M 50 4 A 46 46 0 0 1 50 96 A 23 23 0 0 1 50 50 A 23 23 0 0 0 50 4 Z" fill="#0f172a"/>
            <circle cx="50" cy="27" r="6.5" fill="#0f172a"/>
            <circle cx="50" cy="73" r="6.5" fill="#f8fafc"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-2.5">
      <div id="category-filters" class="flex items-center gap-2 overflow-x-auto py-0.5 scrollbar-none text-xs">
        <button 
          data-category="ALL"
          class="cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 bg-cyan-500 text-black border border-cyan-400 shadow-sm whitespace-nowrap"
        >
          All
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    
    <!-- Loading skeleton state -->
    <div id="loading-state" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <div class="space-y-4 bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-lg p-4">
        <div class="w-full h-52 rounded shimmer"></div>
        <div class="h-5 w-2/3 rounded shimmer"></div>
        <div class="h-4 w-full rounded shimmer"></div>
        <div class="h-6 w-1/3 rounded-full shimmer"></div>
      </div>
      <div class="space-y-4 bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-lg p-4 hidden sm:block">
        <div class="w-full h-52 rounded shimmer"></div>
        <div class="h-5 w-2/3 rounded shimmer"></div>
        <div class="h-4 w-full rounded shimmer"></div>
        <div class="h-6 w-1/3 rounded-full shimmer"></div>
      </div>
      <div class="space-y-4 bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-lg p-4 hidden lg:block">
        <div class="w-full h-52 rounded shimmer"></div>
        <div class="h-5 w-2/3 rounded shimmer"></div>
        <div class="h-4 w-full rounded shimmer"></div>
        <div class="h-6 w-1/3 rounded-full shimmer"></div>
      </div>
    </div>

    <!-- Empty state notification -->
    <div id="empty-state" class="hidden text-center py-20 mx-auto max-w-lg border border-dashed border-slate-300 dark:border-surface-border rounded-lg bg-white/40 dark:bg-surface-card/40 px-6">
      <p class="text-base text-slate-800 dark:text-slate-300 font-semibold mb-2">No matching spots found</p>
      <p class="text-xs text-slate-500 mb-6">Try picking another category or clear your search term</p>
      <button 
        id="reset-filter-btn" 
        class="px-4 py-2 text-xs font-bold uppercase rounded-lg bg-cyan-500 hover:bg-cyan-400 text-black transition"
      >
        Reset Filters
      </button>
    </div>

    <!-- Responsive Multi-Column Places Grid -->
    <div id="places-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 items-stretch w-full"></div>

  </main>

  <footer class="border-t border-slate-200 dark:border-surface-border bg-white/80 dark:bg-surface/80 backdrop-blur-sm py-6 text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="inline-flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span class="font-medium tracking-wide">Update: 09/2026</span>
      </div>

      <p class="text-slate-500 dark:text-slate-400">
        Curated by <a href="https://albyantoniazzi.github.io/" target="_blank" rel="noopener noreferrer" class="text-slate-500 dark:text-slate-400 underline hover:text-slate-700 dark:hover:text-slate-200 transition-colors">@albyantoniazzi</a>
      </p>
    </div>
  </footer>

  <script>
    // Published Google Sheets CSV Feed URL
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv";

    // Alternating badge color themes for cards: Blue, Red, Green
    const BADGE_COLORS = [
      "bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-600 hover:text-white dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/35 dark:hover:bg-blue-500 dark:hover:text-slate-950 dark:hover:border-blue-400",
      "bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-600 hover:text-white dark:bg-rose-500/15 dark:text-rose-400 dark:border-rose-500/35 dark:hover:bg-rose-500 dark:hover:text-slate-950 dark:hover:border-rose-400",
      "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/35 dark:hover:bg-emerald-500 dark:hover:text-slate-950 dark:hover:border-emerald-400"
    ];

    // Toolbar button themes for Blue, Red, and Green alternating states
    const TOOLBAR_COLORS = [
      {
        inactive: "bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100 dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/35 dark:hover:bg-blue-500/25",
        active: "bg-blue-600 text-white border-blue-500 shadow-sm shadow-blue-500/25 dark:bg-blue-500 dark:text-slate-950 dark:border-blue-400 dark:shadow-blue-500/20"
      },
      {
        inactive: "bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100 dark:bg-rose-500/15 dark:text-rose-400 dark:border-rose-500/35 dark:hover:bg-rose-500/25",
        active: "bg-rose-600 text-white border-rose-500 shadow-sm shadow-rose-500/25 dark:bg-rose-500 dark:text-slate-950 dark:border-rose-400 dark:shadow-rose-500/20"
      },
      {
        inactive: "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/35 dark:hover:bg-emerald-500/25",
        active: "bg-emerald-600 text-white border-emerald-500 shadow-sm shadow-emerald-500/25 dark:bg-emerald-500 dark:text-slate-950 dark:border-emerald-400 dark:shadow-emerald-500/20"
      }
    ];

    // Reactive Application State
    let allPlaces = [];
    let dismissedPlaces = new Set();
    let activeCity = "ALL";
    let activeCategory = "ALL";
    let searchQuery = "";
    let rotationDeg = 0;

    // DOM Elements
    const gridEl = document.getElementById("places-grid");
    const loadingEl = document.getElementById("loading-state");
    const emptyEl = document.getElementById("empty-state");
    const counterEl = document.getElementById("places-count");
    const categoryContainer = document.getElementById("category-filters");
    const cityFilterSelect = document.getElementById("city-filter");
    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const resetFilterBtn = document.getElementById("reset-filter-btn");
    const themeToggleBtn = document.getElementById("theme-toggle");
    const yinYangIcon = document.getElementById("yin-yang-icon");

    // Initialize Theme (Default to Dark Mode)
    function initTheme() {
      const savedTheme = localStorage.getItem("tot-theme");
      const isDark = savedTheme !== null ? savedTheme === "dark" : true;
      document.documentElement.classList.toggle("dark", isDark);

      themeToggleBtn.addEventListener("click", () => {
        rotationDeg += 180;
        yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;
        
        const currentlyDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("tot-theme", currentlyDark ? "dark" : "light");
      });
    }

    async function fetchPlaces() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error("Network response was not ok");
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            processPlacesData(results.data);
          },
          error: function(err) {
            console.error("PapaParse error:", err);
            handleFetchError();
          }
        });
      } catch (err) {
        console.error("Fetch failed:", err);
        handleFetchError();
      }
    }

    function handleFetchError() {
      loadingEl.classList.add("hidden");
      emptyEl.classList.remove("hidden");
      emptyEl.querySelector("p").textContent = "Could not load data from Google Sheets.";
    }

    function getFieldValue(row, possibleKeys) {
      const rowKeys = Object.keys(row);
      for (const key of possibleKeys) {
        const match = rowKeys.find(k => k.trim().toLowerCase() === key.toLowerCase());
        if (match && row[match] !== undefined && row[match] !== null && String(row[match]).trim() !== '') {
          return String(row[match]).trim();
        }
      }
      return '';
    }

    function processPlacesData(rows) {
      allPlaces = rows
        .map(row => {
          const title = getFieldValue(row, ['title', 'name', 'place']);
          if (!title) return null;

          const rawCategories = getFieldValue(row, ['categories', 'category', 'tags', 'tag']);
          const categories = rawCategories 
            ? rawCategories.split(',').map(s => s.trim()).filter(Boolean) 
            : [];

          const city = getFieldValue(row, ['city', 'location', 'town']);
          const description = getFieldValue(row, ['description', 'desc', 'notes', 'about']);
          const photo = getFieldValue(row, ['photo', 'image', 'picture', 'url', 'photo_url']);
          const mapLink = getFieldValue(row, ['map_link', 'map', 'google_map_url', 'google map url link', 'link']);

          return {
            title,
            city,
            categories,
            description,
            photo,
            mapLink
          };
        })
        .filter(Boolean);

      populateCityFilter();
      populateCategoryFilters();
      renderPlaces();
      loadingEl.classList.add("hidden");
    }

    function populateCityFilter() {
      const cities = Array.from(new Set(allPlaces.map(p => p.city).filter(Boolean))).sort();
      cityFilterSelect.innerHTML = '<option value="ALL">All Cities</option>';
      cities.forEach(city => {
        const opt = document.createElement("option");
        opt.value = city;
        opt.textContent = city;
        cityFilterSelect.appendChild(opt);
      });
    }

    function populateCategoryFilters() {
      const catCount = {};
      allPlaces.forEach(p => {
        p.categories.forEach(c => {
          catCount[c] = (catCount[c] || 0) + 1;
        });
      });

      const sortedCategories = Object.keys(catCount).sort();
      categoryContainer.innerHTML = '';

      // "All" Button
      const allBtn = document.createElement("button");
      allBtn.dataset.category = "ALL";
      allBtn.className = "cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 whitespace-nowrap " +
        (activeCategory === "ALL" 
          ? "bg-cyan-500 text-black border border-cyan-400 shadow-sm" 
          : "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200 dark:bg-surface-card dark:text-slate-300 dark:border-surface-border dark:hover:bg-surface-border");
      allBtn.textContent = "All";
      allBtn.addEventListener("click", () => setCategory("ALL"));
      categoryContainer.appendChild(allBtn);

      sortedCategories.forEach((cat, index) => {
        const theme = TOOLBAR_COLORS[index % TOOLBAR_COLORS.length];
        const btn = document.createElement("button");
        btn.dataset.category = cat;
        btn.dataset.colorIndex = index % TOOLBAR_COLORS.length;

        const isCurrentActive = activeCategory === cat;
        btn.className = `cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 border whitespace-nowrap ${
          isCurrentActive ? theme.active : theme.inactive
        }`;
        btn.textContent = cat;
        btn.addEventListener("click", () => setCategory(cat));
        categoryContainer.appendChild(btn);
      });
    }

    function updateToolbarStyles() {
      const buttons = categoryContainer.querySelectorAll(".cat-filter-btn");
      buttons.forEach(btn => {
        const cat = btn.dataset.category;
        const colorIdx = parseInt(btn.dataset.colorIndex, 10);

        if (cat === "ALL") {
          btn.className = "cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 whitespace-nowrap " +
            (activeCategory === "ALL" 
              ? "bg-cyan-500 text-black border border-cyan-400 shadow-sm" 
              : "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200 dark:bg-surface-card dark:text-slate-300 dark:border-surface-border dark:hover:bg-surface-border");
        } else {
          const theme = TOOLBAR_COLORS[colorIdx];
          const isCurrentActive = activeCategory === cat;
          btn.className = `cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 border whitespace-nowrap ${
            isCurrentActive ? theme.active : theme.inactive
          }`;
        }
      });
    }

    // Filter Trigger Helpers
    window.setCategory = function(cat) {
      activeCategory = (activeCategory === cat && cat !== "ALL") ? "ALL" : cat;
      updateToolbarStyles();
      renderPlaces();
    };

    window.setCity = function(city) {
      activeCity = (activeCity.toLowerCase() === city.toLowerCase()) ? "ALL" : city;
      cityFilterSelect.value = activeCity;
      renderPlaces();
    };

    function renderPlaces() {
      gridEl.innerHTML = "";

      const q = searchQuery.toLowerCase().trim();
      const stopWords = new Set(["in", "at", "the", "on", "of", "and", "&", "a", "an"]);
      const rawTokens = q.split(/\s+/).filter(Boolean);
      const searchTokens = rawTokens.filter(word => !stopWords.has(word));
      const tokensToMatch = searchTokens.length > 0 ? searchTokens : rawTokens;

      const filtered = allPlaces.filter(place => {
        if (dismissedPlaces.has(place.title)) return false;

        const matchesCity = (activeCity === "ALL") || (place.city.toLowerCase() === activeCity.toLowerCase());
        const matchesCategory = (activeCategory === "ALL") || place.categories.includes(activeCategory);
        
        const searchableContent = `${place.title} ${place.description} ${place.categories.join(' ')} ${place.city}`.toLowerCase();
        const matchesSearch = tokensToMatch.length === 0 || tokensToMatch.every(token => searchableContent.includes(token));

        return matchesCity && matchesCategory && matchesSearch;
      });

      counterEl.textContent = filtered.length;

      if (filtered.length === 0) {
        emptyEl.classList.remove("hidden");
        gridEl.classList.add("hidden");
        return;
      } else {
        emptyEl.classList.add("hidden");
        gridEl.classList.remove("hidden");
      }

      filtered.forEach((place, index) => {
        const card = document.createElement("article");
        card.className = "gallery-item group relative bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-lg overflow-hidden flex flex-col transition hover:border-slate-300 dark:hover:border-slate-600 shadow-sm";

        // Category Tags HTML
        const tagsHtml = place.categories.map((cat, idx) => {
          const colorClass = BADGE_COLORS[idx % BADGE_COLORS.length];
          return `
            <button 
              type="button" 
              onclick="setCategory('${cat.replace(/'/g, "\\'")}')" 
              class="h-6 px-2.5 inline-flex items-center justify-center rounded-full text-[10px] font-bold tracking-wider uppercase leading-none border transition-colors ${colorClass}"
            >
              ${cat}
            </button>
          `;
        }).join("");

        // Uniform pill city badge (green by default)
        const cityBadgeHtml = place.city 
          ? `<button 
              type="button"
              onclick="setCity('${place.city.replace(/'/g, "\\'")}')"
              title="Filter by ${place.city}"
              class="h-6 px-2.5 inline-flex items-center justify-center gap-1 rounded-full text-[10px] font-bold tracking-wider uppercase leading-none border transition-colors bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white hover:border-emerald-500 dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/35 dark:hover:bg-emerald-500 dark:hover:text-slate-950 dark:hover:border-emerald-400"
            >
              <svg class="w-2.5 h-2.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
              </svg>
              <span>${place.city}</span>
             </button>`
          : '';

        const fallbackImg = "https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=1400&q=80";
        const imageSource = place.photo || fallbackImg;

        const photoTag = `
          <div class="img-wrapper relative w-full h-52 overflow-hidden bg-slate-200 dark:bg-surface-card border-b border-slate-200/80 dark:border-surface-border">
            <img 
              src="${imageSource}" 
              alt="${place.title}" 
              loading="lazy" 
              onerror="this.onerror=null; this.src='${fallbackImg}';"
              class="w-full h-full object-cover object-center"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          </div>
        `;

        const photoElement = place.mapLink 
          ? `<a href="${place.mapLink}" target="_blank" rel="noopener noreferrer" class="block relative w-full overflow-hidden cursor-pointer" title="Open ${place.title} on Google Maps">${photoTag}</a>`
          : `<div class="relative w-full overflow-hidden">${photoTag}</div>`;

        const titleElement = place.mapLink
          ? `<a href="${place.mapLink}" target="_blank" rel="noopener noreferrer" class="inline-flex items-baseline gap-1.5 text-base sm:text-lg font-bold text-slate-900 dark:text-white tracking-tight hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors" title="Open on Google Maps">
              <span>${place.title}</span>
              <span class="text-xs opacity-60 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">↗</span>
             </a>`
          : `<span class="text-base sm:text-lg font-bold text-slate-900 dark:text-white tracking-tight">${place.title}</span>`;

        card.innerHTML = `
          <!-- Dismiss "X" Button (visible only on hover) -->
          <button 
            type="button" 
            title="Temporarily dismiss this spot" 
            aria-label="Dismiss spot" 
            class="dismiss-card-btn absolute top-3 right-3 z-30 w-7 h-7 flex items-center justify-center rounded-full bg-black/60 hover:bg-white text-white hover:text-slate-900 border border-white/25 hover:border-white backdrop-blur-md transition-all duration-200 opacity-0 group-hover:opacity-100 focus:opacity-100 hover:scale-110 shadow-md focus:outline-none"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>

          <!-- Photo Container -->
          ${photoElement}

          <!-- Information block -->
          <div class="p-4 sm:p-5 flex flex-col flex-1 justify-between">
            <div>
              <div class="flex items-baseline justify-between gap-3 mb-2">
                <h2>${titleElement}</h2>
                <span class="text-[11px] text-slate-400 dark:text-slate-600 font-mono font-medium select-none">
                  #${String(index + 1).padStart(2, '0')}
                </span>
              </div>

              <!-- Description -->
              <p class="text-xs sm:text-sm leading-relaxed text-slate-600 dark:text-slate-400 line-clamp-3 mb-4 font-normal">
                ${place.description || "No description provided."}
              </p>
            </div>

            <!-- Badges -->
            <div class="flex flex-wrap items-center gap-1.5 pt-1">
              ${cityBadgeHtml}
              ${tagsHtml}
            </div>
          </div>
        `;

        // Smooth dismiss interaction
        const dismissBtn = card.querySelector(".dismiss-card-btn");
        dismissBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          e.preventDefault();

          card.classList.add("scale-95", "opacity-0", "pointer-events-none");
          setTimeout(() => {
            dismissedPlaces.add(place.title);
            renderPlaces();
          }, 200);
        });

        gridEl.appendChild(card);
      });
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("hidden", !searchQuery);
      dismissedPlaces.clear();
      renderPlaces();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      renderPlaces();
    });

    cityFilterSelect.addEventListener("change", (e) => {
      activeCity = e.target.value;
      renderPlaces();
    });

    resetFilterBtn.addEventListener("click", () => {
      activeCategory = "ALL";
      activeCity = "ALL";
      searchQuery = "";
      searchInput.value = "";
      cityFilterSelect.value = "ALL";
      clearSearchBtn.classList.add("hidden");
      dismissedPlaces.clear();
      updateToolbarStyles();
      renderPlaces();
    });

    // Start fetching sheet data and theme on page load
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      fetchPlaces();
    });
  </script>
</body>
</html>
