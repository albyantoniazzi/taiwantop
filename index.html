  <script>
    // CSV URL & Fallback Image
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv";
    const DEFAULT_FALLBACK_IMAGE = "https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function capitalizeFirstLetter(str) {
      if (!str) return '';
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function formatCityName(str) {
      if (!str) return '';
      return str
        .split(/\s+/)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
    }

    // State Variables
    let allPlaces = [];
    let visiblePlaces = [];
    let displayedCount = 24;
    const PAGE_SIZE = 24;
    let activeCity = "ALL";
    let activeCategory = "ALL";
    let searchQuery = "";
    let rotationDeg = 0;
    let activeModalIndex = -1;

    // DOM Elements
    const gridEl = document.getElementById("places-grid");
    const loadMoreContainer = document.getElementById("load-more-container");
    const loadMoreBtn = document.getElementById("load-more-btn");
    const loadingEl = document.getElementById("loading-state");
    const emptyEl = document.getElementById("empty-state");
    const categoryContainer = document.getElementById("category-filters");
    const categoryScrollContainer = document.getElementById("category-scroll-container");
    const cityFilterSelect = document.getElementById("city-filter");
    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const themeToggleBtn = document.getElementById("theme-toggle");
    const yinYangIcon = document.getElementById("yin-yang-icon");

    // Stats Footer Elements
    const footerPlacesCount = document.getElementById("footer-total-places");
    const footerCitiesCount = document.getElementById("footer-total-cities");
    const footerCatsCount = document.getElementById("footer-total-cats");
    const statsChartEl = document.getElementById("stats-chart");

    // Dino Game Elements & State
    const dinoCanvas = document.getElementById("dino-canvas");
    const dinoCtx = dinoCanvas ? dinoCanvas.getContext("2d") : null;
    let dinoAnimId = null;
    let dinoGameActive = false;
    let dinoState = null;

    // Modal & Toast Elements
    const modalEl = document.getElementById("detail-modal");
    const modalCardEl = document.getElementById("modal-card");
    const modalShareBtn = document.getElementById("modal-share-btn");
    const modalImageEl = document.getElementById("modal-image");
    const modalTitleEl = document.getElementById("modal-title");
    const modalDescEl = document.getElementById("modal-description");
    const modalMapLink = document.getElementById("modal-map-link");
    const modalCityBadge = document.getElementById("modal-city-badge");
    const modalTags = document.getElementById("modal-tags");
    const modalPrevBtn = document.getElementById("modal-prev-btn");
    const modalNextBtn = document.getElementById("modal-next-btn");
    const toastEl = document.getElementById("toast-notification");
    const toastMsg = document.getElementById("toast-message");

    // Deterministic PRNG seeded by today's calendar date
    function seededRandom(seed) {
      let state = seed % 2147483647;
      if (state <= 0) state += 2147483646;
      return function() {
        state = (state * 16807) % 2147483647;
        return (state - 1) / 2147483646;
      };
    }

    function dailyShuffle(array) {
      const now = new Date();
      const dateSeed = (now.getFullYear() * 10000) + ((now.getMonth() + 1) * 100) + now.getDate();
      const rng = seededRandom(dateSeed);
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function createSlug(title) {
      return (title || '')
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function createCardElement(place, index) {
      const card = document.createElement('article');
      card.className = "flex flex-col group cursor-pointer pb-6 border-b border-[#292929] dark:border-white";

      const imageSource = place.photo || DEFAULT_FALLBACK_IMAGE;
      const safeTitle = escapeHtml(place.title);
      const safeDesc = escapeHtml(place.description);

      const cityHtml = place.city ? `
        <button 
          type="button"
          data-city="${escapeHtml(place.city)}"
          class="card-city-badge badge-pill inline-flex items-center gap-1 px-3 py-1 rounded-full font-bold capitalize border border-[#292929] bg-[#292929] text-[#EBF1E5] hover:bg-transparent hover:text-[#292929] dark:border-white dark:bg-white dark:text-[#292929] dark:hover:bg-transparent dark:hover:text-white transition-all duration-150 cursor-pointer shadow-sm"
        >
          <svg class="w-3 h-3 flex-shrink-0 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
          <span>${escapeHtml(formatCityName(place.city))}</span>
        </button>
      ` : '';

      const tagsHtml = place.categories.map(cat => `
        <button 
          type="button"
          data-category="${escapeHtml(cat.toLowerCase())}"
          class="card-cat-badge badge-pill inline-flex items-center px-3 py-1 rounded-full font-bold lowercase border border-[#292929] bg-[#292929] text-[#EBF1E5] hover:bg-transparent hover:text-[#292929] dark:border-white dark:bg-white dark:text-[#292929] dark:hover:bg-transparent dark:hover:text-white transition-all duration-150 cursor-pointer shadow-sm"
        >
          ${escapeHtml(cat.toLowerCase())}
        </button>
      `).join('');

      const mapArrowHtml = place.mapLink ? `
        <a 
          href="${encodeURI(place.mapLink)}" 
          target="_blank" 
          rel="noopener noreferrer" 
          title="Open in Google Maps"
          aria-label="Open ${safeTitle} in Google Maps"
          class="card-map-arrow flex-shrink-0 text-base sm:text-lg font-bold text-[#292929] dark:text-white hover:opacity-70 transition p-0.5 leading-none focus:outline-none"
        >
          ↗
        </a>
      ` : '';

      card.innerHTML = `
        <!-- Image Box (Aspect ~16/10) -->
        <div class="relative w-full aspect-[16/10] bg-stone-300 dark:bg-stone-800 overflow-hidden mb-3">
          <img 
            src="${escapeHtml(imageSource)}" 
            alt="${safeTitle}" 
            loading="lazy"
            onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_IMAGE}';"
            class="w-full h-full object-cover object-center group-hover:scale-[1.02] transition-transform duration-300"
          />
        </div>

        <!-- Title Row with Right-Aligned Maps Arrow -->
        <div class="flex items-baseline justify-between gap-2">
          <h2 class="text-base sm:text-lg font-bold text-[#292929] dark:text-white tracking-tight leading-snug">
            ${safeTitle}
          </h2>
          ${mapArrowHtml}
        </div>

        <!-- Description (Semibold) -->
        ${safeDesc ? `
          <p class="text-[11px] sm:text-xs text-[#292929] dark:text-white font-semibold mt-1 line-clamp-2 leading-relaxed">
            ${safeDesc}
          </p>
        ` : ''}

        <!-- Badges Row (City + Categories) -->
        <div class="mt-2.5 flex items-center gap-1 flex-wrap">
          ${cityHtml}
          ${tagsHtml}
        </div>
      `;

      // Card click opens modal
      card.addEventListener('click', () => openModal(index));

      // Maps arrow click stops card modal trigger
      const arrowEl = card.querySelector('.card-map-arrow');
      if (arrowEl) {
        arrowEl.addEventListener('click', (e) => {
          e.stopPropagation();
        });
      }

      // City badge click filters by city without opening modal
      const cityBtn = card.querySelector('.card-city-badge');
      if (cityBtn) {
        cityBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const city = cityBtn.getAttribute('data-city');
          if (city) {
            activeCity = city;
            cityFilterSelect.value = city;
            updateUrlState();
            filterPlaces();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      }

      // Badges click sets category without opening modal
      card.querySelectorAll('.card-cat-badge').forEach(badgeBtn => {
        badgeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const cat = badgeBtn.getAttribute('data-category');
          if (cat) {
            setCategory(cat);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      });

      return card;
    }

    function renderCards() {
      gridEl.innerHTML = '';

      if (visiblePlaces.length === 0) {
        emptyEl.classList.remove('hidden');
        loadMoreContainer.classList.add('hidden');
        startDinoGame();
        return;
      }
      emptyEl.classList.add('hidden');
      stopDinoGame();

      const itemsToRender = visiblePlaces.slice(0, displayedCount);
      itemsToRender.forEach((place, index) => {
        const card = createCardElement(place, index);
        gridEl.appendChild(card);
      });

      updateLoadMoreVisibility();
    }

    function appendNextBatch() {
      const start = displayedCount;
      const nextBatchEnd = Math.min(start + PAGE_SIZE, visiblePlaces.length);

      for (let i = start; i < nextBatchEnd; i++) {
        const card = createCardElement(visiblePlaces[i], i);
        gridEl.appendChild(card);
      }

      displayedCount = nextBatchEnd;
      updateLoadMoreVisibility();
    }

    function updateLoadMoreVisibility() {
      if (displayedCount < visiblePlaces.length) {
        loadMoreContainer.classList.remove('hidden');
        loadMoreBtn.innerHTML = `<span>LOAD MORE</span><span class="text-xs">↓</span>`;
      } else {
        loadMoreContainer.classList.add('hidden');
      }
    }

    function filterPlaces() {
      const q = searchQuery.toLowerCase().trim();
      const rawTokens = q.split(/\s+/).filter(Boolean);

      visiblePlaces = allPlaces.filter(place => {
        const matchesCity = (activeCity === "ALL") || (place.city.toLowerCase() === activeCity.toLowerCase());
        const matchesCategory = (activeCategory === "ALL") || place.categories.some(c => c.toLowerCase() === activeCategory.toLowerCase());
        const searchable = `${place.title} ${place.description} ${place.categories.join(' ')} ${place.city}`.toLowerCase();
        const matchesSearch = rawTokens.length === 0 || rawTokens.every(tok => searchable.includes(tok));
        return matchesCity && matchesCategory && matchesSearch;
      });

      displayedCount = PAGE_SIZE;
      renderCards();
    }

    function updateToolbarStyles() {
      const buttons = categoryContainer.querySelectorAll(".cat-filter-btn");
      buttons.forEach(btn => {
        const cat = btn.dataset.category;
        const isCurrentActive = activeCategory.toLowerCase() === cat.toLowerCase();

        if (cat.toUpperCase() === "ALL") {
          if (isCurrentActive) {
            btn.className = "cat-filter-btn badge-pill flex-shrink-0 px-3 py-1 font-bold rounded-full lowercase tracking-normal transition-all duration-150 border border-[#292929] bg-[#EBF1E5] text-[#292929] hover:bg-[#292929] hover:text-[#EBF1E5] dark:border-white dark:bg-[#333333] dark:text-white dark:hover:bg-white dark:hover:text-[#292929] shadow-sm ring-1 ring-[#292929]/30 dark:ring-white/40 cursor-pointer";
          } else {
            btn.className = "cat-filter-btn badge-pill flex-shrink-0 px-3 py-1 font-bold rounded-full lowercase tracking-normal transition-all duration-150 border border-[#292929] bg-[#EBF1E5] text-[#292929] hover:bg-[#292929] hover:text-[#EBF1E5] dark:border-white dark:bg-[#333333] dark:text-white dark:hover:bg-white dark:hover:text-[#292929] cursor-pointer";
          }
        } else {
          if (isCurrentActive) {
            btn.className = "cat-filter-btn badge-pill flex-shrink-0 px-3 py-1 font-bold rounded-full lowercase tracking-normal transition-all duration-150 border border-[#292929] bg-[#292929] text-[#EBF1E5] dark:border-white dark:bg-white dark:text-[#292929] shadow-sm ring-1 ring-[#292929]/30 dark:ring-white/40 cursor-pointer";
          } else {
            btn.className = "cat-filter-btn badge-pill flex-shrink-0 px-3 py-1 font-bold rounded-full lowercase tracking-normal transition-all duration-150 border border-[#292929] bg-[#292929] text-[#EBF1E5] hover:bg-[#EBF1E5] hover:text-[#292929] hover:border-[#292929] dark:border-white dark:bg-white dark:text-[#292929] dark:hover:bg-[#333333] dark:hover:text-white dark:hover:border-white cursor-pointer";
          }
        }
      });
    }

    window.setCategory = function(cat) {
      activeCategory = (activeCategory.toLowerCase() === cat.toLowerCase() && cat.toLowerCase() !== "all") ? "ALL" : cat;
      updateToolbarStyles();
      updateUrlState();
      filterPlaces();
    };

    function populateCityFilter() {
      const cities = Array.from(new Set(allPlaces.map(p => p.city).filter(Boolean))).sort();
      cityFilterSelect.innerHTML = '<option value="ALL" class="dark:bg-[#333333]">All Cities</option>';
      cities.forEach(city => {
        const opt = document.createElement("option");
        opt.value = city;
        opt.textContent = city;
        opt.className = "dark:bg-[#333333]";
        cityFilterSelect.appendChild(opt);
      });
    }

    function populateCategoryFilters() {
      const catCount = {};
      allPlaces.forEach(p => {
        p.categories.forEach(c => {
          const formatted = c.trim().toLowerCase();
          catCount[formatted] = (catCount[formatted] || 0) + 1;
        });
      });

      const sortedCategories = Object.keys(catCount).sort();
      categoryContainer.innerHTML = '';

      // "all" Button
      const allBtn = document.createElement("button");
      allBtn.dataset.category = "ALL";
      allBtn.className = "cat-filter-btn badge-pill flex-shrink-0 px-3 py-1 font-bold rounded-full lowercase tracking-normal transition-all duration-150 border border-[#292929] bg-[#EBF1E5] text-[#292929] hover:bg-[#292929] hover:text-[#EBF1E5] dark:border-white dark:bg-[#333333] dark:text-white dark:hover:bg-white dark:hover:text-[#292929] shadow-sm cursor-pointer";
      allBtn.textContent = "all";
      allBtn.addEventListener("click", () => setCategory("ALL"));
      categoryContainer.appendChild(allBtn);

      sortedCategories.forEach(cat => {
        const btn = document.createElement("button");
        btn.dataset.category = cat;
        btn.className = "cat-filter-btn badge-pill flex-shrink-0 px-3 py-1 font-bold rounded-full lowercase tracking-normal transition-all duration-150 border border-[#292929] bg-[#292929] text-[#EBF1E5] hover:bg-[#EBF1E5] hover:text-[#292929] hover:border-[#292929] dark:border-white dark:bg-white dark:text-[#292929] dark:hover:bg-[#333333] dark:hover:text-white dark:hover:border-white cursor-pointer";
        btn.textContent = cat;
        btn.addEventListener("click", () => setCategory(cat));
        categoryContainer.appendChild(btn);
      });
    }

    function renderStatsChart() {
      const catCount = {};
      allPlaces.forEach(p => {
        p.categories.forEach(c => {
          const lower = c.trim().toLowerCase();
          catCount[lower] = (catCount[lower] || 0) + 1;
        });
      });

      const sorted = Object.entries(catCount)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5); // Top 5 categories

      const uniqueCities = new Set(allPlaces.map(p => p.city).filter(Boolean)).size;
      const totalUniqueCats = Object.keys(catCount).length;

      footerPlacesCount.textContent = allPlaces.length;
      footerCitiesCount.textContent = uniqueCities;
      footerCatsCount.textContent = totalUniqueCats;

      const maxCount = sorted.length > 0 ? sorted[0][1] : 1;

      statsChartEl.innerHTML = sorted.map(([category, count]) => {
        const percent = Math.round((count / maxCount) * 100);
        return `
          <div class="flex items-center gap-3 text-xs group cursor-pointer" onclick="setCategory('${escapeHtml(category)}')">
            <div class="w-28 sm:w-36 flex-shrink-0">
              <span class="badge-pill inline-flex items-center px-3 py-1 rounded-full font-bold lowercase border border-[#292929] bg-transparent text-[#292929] dark:border-white dark:bg-transparent dark:text-white group-hover:bg-[#292929] group-hover:text-[#EBF1E5] dark:group-hover:bg-white dark:group-hover:text-[#292929] transition-all duration-150">
                ${escapeHtml(category)}
              </span>
            </div>
            <div class="flex-1 h-[1px] rounded-full bg-[#292929]/20 dark:bg-white/20 overflow-hidden">
              <div 
                class="h-full bg-[#292929] dark:bg-white rounded-full transition-all duration-500 ease-out" 
                style="width: ${percent}%;"
              ></div>
            </div>
            <div class="w-8 text-right font-bold text-[#292929] dark:text-white font-mono text-xs">
              ${count}
            </div>
          </div>
        `;
      }).join('');
    }

    function parseUrlState() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.has("city")) activeCity = params.get("city");
        if (params.has("cat")) activeCategory = params.get("cat");
        if (params.has("q")) {
          searchQuery = params.get("q");
          searchInput.value = searchQuery;
          clearSearchBtn.classList.toggle("hidden", !searchQuery);
        }
        return params.get("spot");
      } catch (err) {
        return null;
      }
    }

    function updateUrlState(targetSpotSlug = null) {
      if (window.location.protocol === 'blob:' || !window.location.origin || window.location.origin === 'null') {
        return;
      }
      try {
        const params = new URLSearchParams();
        if (activeCity !== "ALL") params.set("city", activeCity);
        if (activeCategory !== "ALL") params.set("cat", activeCategory);
        if (searchQuery.trim()) params.set("q", searchQuery.trim());
        if (targetSpotSlug) params.set("spot", targetSpotSlug);

        const queryString = params.toString();
        const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
        window.history.replaceState({}, "", newUrl);
      } catch (err) {
        console.warn("Could not sync URL history:", err);
      }
    }

    // Modal Operations
    window.openModal = function(index) {
      if (!visiblePlaces[index]) return;
      activeModalIndex = index;
      const place = visiblePlaces[index];

      modalImageEl.src = place.photo || DEFAULT_FALLBACK_IMAGE;
      modalImageEl.alt = place.title;
      modalTitleEl.textContent = place.title;
      modalDescEl.textContent = place.description || "No description provided for this curated spot.";

      // City Badge in Modal (clickable to filter by city)
      if (place.city) {
        modalCityBadge.className = "badge-pill inline-flex items-center gap-1 px-3 py-1 rounded-full font-bold capitalize tracking-normal border border-[#292929] bg-[#292929] text-[#EBF1E5] hover:bg-transparent hover:text-[#292929] dark:border-white dark:bg-white dark:text-[#292929] dark:hover:bg-transparent dark:hover:text-white transition-all duration-150 cursor-pointer shadow-sm";
        modalCityBadge.innerHTML = `
          <svg class="w-3 h-3 flex-shrink-0 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
          <span>${escapeHtml(formatCityName(place.city))}</span>
        `;
        modalCityBadge.onclick = (e) => {
          e.stopPropagation();
          activeCity = place.city;
          cityFilterSelect.value = place.city;
          closeModal();
          updateUrlState();
          filterPlaces();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        modalCityBadge.classList.remove("hidden");
      } else {
        modalCityBadge.classList.add("hidden");
      }

      // Categories in Modal (clickable to filter by category)
      modalTags.innerHTML = place.categories.map(cat => `
        <button 
          type="button"
          data-category="${escapeHtml(cat.toLowerCase())}"
          class="modal-cat-badge badge-pill inline-flex items-center px-3 py-1 rounded-full font-bold lowercase tracking-normal border border-[#292929] bg-[#292929] text-[#EBF1E5] hover:bg-transparent hover:text-[#292929] dark:border-white dark:bg-white dark:text-[#292929] dark:hover:bg-transparent dark:hover:text-white transition-all duration-150 cursor-pointer shadow-sm"
        >
          ${escapeHtml(cat.toLowerCase())}
        </button>
      `).join('');

      modalTags.querySelectorAll('.modal-cat-badge').forEach(badgeBtn => {
        badgeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const cat = badgeBtn.getAttribute('data-category');
          if (cat) {
            closeModal();
            setCategory(cat);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      });

      // Maps Link
      if (place.mapLink) {
        modalMapLink.href = encodeURI(place.mapLink);
        modalMapLink.classList.remove("hidden");
      } else {
        modalMapLink.classList.add("hidden");
      }

      // Prev/Next Arrows
      modalPrevBtn.disabled = index <= 0;
      modalNextBtn.disabled = index >= visiblePlaces.length - 1;

      // If user navigates forward in modal past the currently rendered card count, auto-load more
      if (index >= displayedCount) {
        displayedCount = Math.min(index + PAGE_SIZE, visiblePlaces.length);
        renderCards();
      }

      // Reveal Modal
      modalEl.classList.remove("opacity-0", "pointer-events-none");
      modalEl.classList.add("opacity-100");
      modalCardEl.classList.remove("scale-95");
      modalCardEl.classList.add("scale-100");

      updateUrlState(place.slug);
    };

    window.closeModal = function() {
      modalEl.classList.remove("opacity-100");
      modalEl.classList.add("opacity-0", "pointer-events-none");
      modalCardEl.classList.remove("scale-100");
      modalCardEl.classList.add("scale-95");
      activeModalIndex = -1;
      updateUrlState(null);
    };

    function navigateModal(direction) {
      const targetIndex = activeModalIndex + direction;
      if (targetIndex >= 0 && targetIndex < visiblePlaces.length) {
        openModal(targetIndex);
      }
    }

    modalEl.addEventListener("click", (e) => {
      if (!modalCardEl.contains(e.target) && !modalPrevBtn.contains(e.target) && !modalNextBtn.contains(e.target)) {
        closeModal();
      }
    });
    modalPrevBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      navigateModal(-1);
    });
    modalNextBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      navigateModal(1);
    });

    // Touch swipe left / right gestures for mobile navigation
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const SWIPE_THRESHOLD = 45;

    modalCardEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchEndX = touchStartX;
        touchEndY = touchStartY;
      }
    }, { passive: true });

    modalCardEl.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        touchEndX = e.touches[0].clientX;
        touchEndY = e.touches[0].clientY;
      }
    }, { passive: true });

    modalCardEl.addEventListener('touchend', () => {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      // Verify that horizontal gesture is dominant over vertical scrolling
      if (Math.abs(deltaX) > SWIPE_THRESHOLD && Math.abs(deltaX) > Math.abs(deltaY) * 1.35) {
        if (deltaX < 0) {
          // Swipe left -> view next place
          navigateModal(1);
        } else {
          // Swipe right -> view previous place
          navigateModal(-1);
        }
      }
    }, { passive: true });

    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const tempInput = document.createElement("input");
      tempInput.style.position = "fixed";
      tempInput.style.opacity = "0";
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Copy fallback failed', err);
      }
      document.body.removeChild(tempInput);
    }

    let toastTimeout = null;
    function showToast(message) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = message;
      toastEl.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
      toastEl.classList.add("opacity-100", "translate-y-0");

      toastTimeout = setTimeout(() => {
        toastEl.classList.remove("opacity-100", "translate-y-0");
        toastEl.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
      }, 2500);
    }

    modalShareBtn.addEventListener("click", () => {
      if (activeModalIndex !== -1 && visiblePlaces[activeModalIndex]) {
        let base = `${window.location.origin}${window.location.pathname}`;
        if (window.location.protocol === 'blob:' || !window.location.origin || window.location.origin === 'null') {
          base = window.location.href.split('?')[0];
        }
        const shareUrl = `${base}?spot=${visiblePlaces[activeModalIndex].slug}`;
        copyTextToClipboard(shareUrl);
        showToast("Direct spot link copied!");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (modalEl.classList.contains("opacity-100")) {
        if (e.key === "Escape") closeModal();
        else if (e.key === "ArrowLeft") navigateModal(-1);
        else if (e.key === "ArrowRight") navigateModal(1);
      }
    });

    function getFieldValue(row, possibleKeys) {
      const rowKeys = Object.keys(row);
      for (const key of possibleKeys) {
        const match = rowKeys.find(k => k.trim().toLowerCase() === key.toLowerCase());
        if (match && row[match] !== undefined && row[match] !== null && String(row[match]).trim() !== '') {
          return String(row[match]).trim();
        }
      }
      return '';
    }

    function processPlacesData(rows) {
      const parsedPlaces = rows
        .map(row => {
          const title = getFieldValue(row, ['title', 'name', 'place']);
          if (!title) return null;

          const rawCategories = getFieldValue(row, ['categories', 'category', 'tags', 'tag']);
          const categories = rawCategories 
            ? rawCategories.split(',').map(s => s.trim()).filter(Boolean)
            : [];

          const city = getFieldValue(row, ['city', 'location', 'town']);
          const description = getFieldValue(row, ['description', 'desc', 'notes', 'about']);
          const photo = getFieldValue(row, ['photo', 'image', 'picture', 'url', 'photo_url']);
          const mapLink = getFieldValue(row, ['map_link', 'map', 'google_map_url', 'google map url link', 'link']);
          const slug = createSlug(title);

          return { title, slug, city, categories, description, photo, mapLink };
        })
        .filter(Boolean);

      allPlaces = dailyShuffle(parsedPlaces);

      populateCityFilter();
      populateCategoryFilters();
      renderStatsChart();

      const deepLinkedSpotSlug = parseUrlState();
      cityFilterSelect.value = activeCity;
      updateToolbarStyles();
      filterPlaces();

      if (deepLinkedSpotSlug) {
        const targetIndex = visiblePlaces.findIndex(p => p.slug === deepLinkedSpotSlug);
        if (targetIndex !== -1) openModal(targetIndex);
      }

      loadingEl.classList.add("hidden");
    }

    async function fetchPlaces() {
      try {
        const cacheBuster = `&_t=${Date.now()}`;
        const response = await fetch(`${SHEET_CSV_URL}${cacheBuster}`);
        if (!response.ok) throw new Error("Network error fetching CSV");
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          transformHeader: h => h.trim().toLowerCase(),
          complete: results => processPlacesData(results.data),
          error: () => handleFetchError()
        });
      } catch (err) {
        console.error("Fetch failed:", err);
        handleFetchError();
      }
    }

    function handleFetchError() {
      loadingEl.classList.add("hidden");
      emptyEl.classList.remove("hidden");
      const titleP = emptyEl.querySelector("p");
      if (titleP) titleP.textContent = "Sorry, nothing here...";
      startDinoGame();
    }

    // Duck Runner Game Engine (Slower Pace, Duck Sprite & Hot Pot Obstacles)
    const DUCK_SPRITE = [
      "          #####      ",
      "         #######     ",
      "         ## # ###    ",
      "         ########    ",
      "         ####        ",
      "         ######      ",
      "         #####       ",
      "         #####       ",
      "         #####       ",
      "         #####       ",
      "       ########      ",
      "     ############    ",
      "    ##############   ",
      "   ################  ",
      "  #################  ",
      "  #################  ",
      "   ###############   ",
      "    #############    ",
      "      ##########     ",
      "        ######       ",
      "        #    #       ",
      "        #    #       ",
      "        ##   ##      "
    ];

    // Cooking Hot Pot with handles and rim
    const HOTPOT_SPRITE = [
      "   ############   ",
      "   #          #   ",
      "##################",
      "#                #",
      "##  ##########  ##",
      " #  ##########  # ",
      " ###############  ",
      "  #############   ",
      "   ###########    ",
      "    #########     ",
      "    #########     ",
      "   ###########    "
    ];

    function initDinoState() {
      return {
        dino: {
          x: 40,
          y: 112,
          vy: 0,
          width: 21,
          height: 23,
          isJumping: false,
          legTimer: 0,
          legToggle: false
        },
        obstacles: [],
        clouds: [
          { x: 120, y: 35, speed: 0.25 },
          { x: 380, y: 25, speed: 0.3 }
        ],
        score: 0,
        highScore: parseInt(localStorage.getItem('tot-dino-hi') || '0', 10),
        speed: 2.2, // Significantly slowed down base speed
        spawnTimer: 0,
        isGameOver: false,
        groundTicks: [],
        flameTick: 0
      };
    }

    function jumpDino() {
      if (!dinoState) return;
      if (dinoState.isGameOver) {
        dinoState = initDinoState();
        return;
      }
      if (!dinoState.dino.isJumping) {
        dinoState.dino.vy = -6.8; // Tuned for gentle, slow-paced jump
        dinoState.dino.isJumping = true;
      }
    }

    function drawPixelMap(ctx, map, startX, startY, pixelSize, color) {
      ctx.fillStyle = color;
      for (let r = 0; r < map.length; r++) {
        const row = map[r];
        for (let c = 0; c < row.length; c++) {
          if (row[c] === '#') {
            ctx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize, pixelSize);
          }
        }
      }
    }

    function updateDinoGame() {
      if (!dinoGameActive || !dinoCtx || !dinoState) return;

      const canvasW = dinoCanvas.width;
      const canvasH = dinoCanvas.height;
      const groundY = 135;
      const themeColor = document.documentElement.classList.contains('dark') ? '#ffffff' : '#292929';

      dinoCtx.clearRect(0, 0, canvasW, canvasH);

      // Clouds
      dinoCtx.fillStyle = themeColor;
      dinoState.clouds.forEach(cloud => {
        if (!dinoState.isGameOver) cloud.x -= cloud.speed;
        if (cloud.x < -50) cloud.x = canvasW + Math.random() * 80;

        dinoCtx.globalAlpha = 0.35;
        dinoCtx.fillRect(cloud.x, cloud.y, 28, 6);
        dinoCtx.fillRect(cloud.x + 6, cloud.y - 4, 16, 4);
        dinoCtx.globalAlpha = 1.0;
      });

      // Ground Line & Dotted Texture
      dinoCtx.fillStyle = themeColor;
      dinoCtx.fillRect(0, groundY, canvasW, 1);

      if (!dinoState.isGameOver) {
        if (Math.random() < 0.12) {
          dinoState.groundTicks.push({ x: canvasW, y: groundY + 3 + Math.floor(Math.random() * 4), w: 2 + Math.floor(Math.random() * 4) });
        }
        for (let i = dinoState.groundTicks.length - 1; i >= 0; i--) {
          dinoState.groundTicks[i].x -= dinoState.speed;
          if (dinoState.groundTicks[i].x < -10) {
            dinoState.groundTicks.splice(i, 1);
          }
        }
      }
      dinoState.groundTicks.forEach(tick => {
        dinoCtx.fillRect(tick.x, tick.y, tick.w, 1);
      });

      // Duck Physics
      const dino = dinoState.dino;
      if (!dinoState.isGameOver) {
        dino.y += dino.vy;
        dino.vy += 0.35; // Gentle gravity for slower gameplay

        if (dino.y >= groundY - dino.height) {
          dino.y = groundY - dino.height;
          dino.vy = 0;
          dino.isJumping = false;
        }

        dino.legTimer++;
        if (dino.legTimer > 8) {
          dino.legToggle = !dino.legToggle;
          dino.legTimer = 0;
        }

        // Score & Speed (gentle scaling)
        dinoState.score += 0.08;
        if (dinoState.score > dinoState.highScore) {
          dinoState.highScore = Math.floor(dinoState.score);
          localStorage.setItem('tot-dino-hi', String(dinoState.highScore));
        }
        dinoState.speed = Math.min(4.8, 2.2 + Math.floor(dinoState.score / 100) * 0.18);

        // Hot Pot Obstacles Spawning (well-spaced)
        dinoState.spawnTimer++;
        const spawnThreshold = Math.max(90, 160 - Math.floor(dinoState.speed * 8));
        if (dinoState.spawnTimer > spawnThreshold && Math.random() < 0.03) {
          dinoState.obstacles.push({
            x: canvasW + 15,
            y: groundY - 14,
            width: 18,
            height: 14
          });
          dinoState.spawnTimer = 0;
        }
      }

      // Draw Duck (with beak)
      drawPixelMap(dinoCtx, DUCK_SPRITE, dino.x, dino.y, 1, themeColor);
      // Flat duck bill / beak
      dinoCtx.fillStyle = themeColor;
      dinoCtx.fillRect(dino.x + 16, dino.y + 2, 5, 2);

      // Running feet animation
      if (!dino.isJumping && !dinoState.isGameOver) {
        dinoCtx.fillStyle = themeColor;
        if (dino.legToggle) {
          dinoCtx.fillRect(dino.x + 8, dino.y + 21, 4, 2);
        } else {
          dinoCtx.fillRect(dino.x + 13, dino.y + 21, 4, 2);
        }
      }

      // Tick flame animation
      dinoState.flameTick++;

      // Draw & Update Hot Pot Obstacles
      for (let i = dinoState.obstacles.length - 1; i >= 0; i--) {
        const obs = dinoState.obstacles[i];
        if (!dinoState.isGameOver) {
          obs.x -= dinoState.speed;
        }

        // Draw Hot Pot Body
        drawPixelMap(dinoCtx, HOTPOT_SPRITE, obs.x, obs.y + 2, 1, themeColor);

        // Animated Flame on top
        const flamePhase = Math.floor((dinoState.flameTick + i * 5) / 6) % 3;
        const flameCenterX = obs.x + 9;
        const flameBaseY = obs.y + 1;

        dinoCtx.fillStyle = themeColor;
        if (flamePhase === 0) {
          dinoCtx.fillRect(flameCenterX - 2, flameBaseY - 6, 4, 5);
          dinoCtx.fillRect(flameCenterX - 1, flameBaseY - 9, 2, 3);
          dinoCtx.fillRect(flameCenterX + 3, flameBaseY - 4, 2, 3);
        } else if (flamePhase === 1) {
          dinoCtx.fillRect(flameCenterX - 3, flameBaseY - 5, 5, 4);
          dinoCtx.fillRect(flameCenterX, flameBaseY - 8, 2, 4);
          dinoCtx.fillRect(flameCenterX - 3, flameBaseY - 7, 2, 2);
        } else {
          dinoCtx.fillRect(flameCenterX - 1, flameBaseY - 7, 3, 6);
          dinoCtx.fillRect(flameCenterX + 1, flameBaseY - 10, 2, 3);
          dinoCtx.fillRect(flameCenterX - 3, flameBaseY - 4, 2, 3);
        }

        // Collision Check (AABB with friendly hitbox)
        const dBox = { x: dino.x + 3, y: dino.y + 2, w: dino.width - 6, h: dino.height - 3 };
        const oBox = { x: obs.x + 2, y: obs.y - 4, w: obs.width - 4, h: obs.height + 4 };

        if (
          dBox.x < oBox.x + oBox.w &&
          dBox.x + dBox.w > oBox.x &&
          dBox.y < oBox.y + oBox.h &&
          dBox.y + dBox.h > oBox.y
        ) {
          dinoState.isGameOver = true;
        }

        if (obs.x < -30) {
          dinoState.obstacles.splice(i, 1);
        }
      }

      // Draw HUD (Scores)
      dinoCtx.fillStyle = themeColor;
      dinoCtx.font = "bold 11px 'Google Sans Code', monospace";
      dinoCtx.textAlign = "right";
      const curScoreStr = String(Math.floor(dinoState.score)).padStart(5, '0');
      const hiScoreStr = String(dinoState.highScore).padStart(5, '0');
      dinoCtx.fillText(`HI ${hiScoreStr}  ${curScoreStr}`, canvasW - 8, 20);

      // Game Over Message
      if (dinoState.isGameOver) {
        dinoCtx.textAlign = "center";
        dinoCtx.font = "bold 14px 'Google Sans Code', monospace";
        dinoCtx.fillText("G A M E   O V E R", canvasW / 2, 70);
        dinoCtx.font = "11px 'Google Sans Code', monospace";
        dinoCtx.fillText("TAP OR PRESS SPACE TO RESTART", canvasW / 2, 92);
      }

      dinoAnimId = requestAnimationFrame(updateDinoGame);
    }

    function startDinoGame() {
      if (dinoGameActive) return;
      dinoGameActive = true;
      dinoState = initDinoState();
      dinoAnimId = requestAnimationFrame(updateDinoGame);
    }

    function stopDinoGame() {
      dinoGameActive = false;
      if (dinoAnimId) {
        cancelAnimationFrame(dinoAnimId);
        dinoAnimId = null;
      }
    }

    if (dinoCanvas) {
      dinoCanvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        jumpDino();
      });
    }

    document.addEventListener('keydown', (e) => {
      if (dinoGameActive && !emptyEl.classList.contains('hidden')) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          jumpDino();
        }
      }
    });

    function initTheme() {
      const savedTheme = localStorage.getItem("tot-theme");
      const isDark = savedTheme !== null ? savedTheme === "dark" : false;
      document.documentElement.classList.toggle("dark", isDark);

      themeToggleBtn.addEventListener("click", () => {
        rotationDeg += 180;
        yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;

        const toggleThemeLogic = () => {
          const currentlyDark = document.documentElement.classList.toggle("dark");
          localStorage.setItem("tot-theme", currentlyDark ? "dark" : "light");
          updateToolbarStyles();
        };

        if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.startViewTransition(() => toggleThemeLogic());
        } else {
          document.documentElement.classList.add("theme-transition");
          toggleThemeLogic();
          setTimeout(() => document.documentElement.classList.remove("theme-transition"), 300);
        }
      });
    }

    // Input Events
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("hidden", !searchQuery);
      updateUrlState();
      filterPlaces();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      updateUrlState();
      filterPlaces();
    });

    cityFilterSelect.addEventListener("change", (e) => {
      activeCity = e.target.value;
      updateUrlState();
      filterPlaces();
    });

    loadMoreBtn.addEventListener("click", () => {
      appendNextBatch();
    });

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      fetchPlaces();
    });
  </script>
</body>
</html>
