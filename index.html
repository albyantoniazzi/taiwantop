<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAIWAN TOP</title>

  <!-- Open Graph & SEO Metadata -->
  <meta name="description" content="A curated directory of exceptional places in Taiwan by @albyantoniazzi." />
  <meta property="og:title" content="TAIWAN TOP" />
  <meta property="og:description" content="A curated directory of exceptional places in Taiwan by @albyantoniazzi." />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />

  <!-- Google Sans Code Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PapaParse for Google Sheets CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Google Sans Code"', 'monospace']
          },
          colors: {
            surface: {
              DEFAULT: '#0f131a',
              card: '#161b24',
              border: '#232b3b'
            }
          }
        }
      }
    };

  <style>
    /* Dotted background pattern */
    body {
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      background-attachment: fixed;
    }
    .dark body,
    html.dark body {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      background-attachment: fixed;
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    .shimmer {
      animation: shimmer 1.5s infinite ease-in-out;
      background-color: rgba(148, 163, 184, 0.15);
    }

    /* Category bar edge fade/mask effect */
    .scroll-mask-edges {
      mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent 100%);
    }

    /* Card image zoom motion */
    .gallery-item {
      transition: transform 0.25s ease, opacity 0.2s ease;
    }
    .gallery-item .img-wrapper img {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .gallery-item:hover .img-wrapper img {
      transform: scale(1.04);
    }

    /* Custom scrollbar hiding utility */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Touchscreen accessibility: keep dismiss button subtly visible on devices without hover pointer */
    @media (hover: none) and (pointer: coarse) {
      .dismiss-card-btn {
        opacity: 0.75 !important;
      }
    }
  </style>
</head>

<body class="min-h-screen font-mono flex flex-col bg-slate-50 dark:bg-[#0c0e14] text-slate-800 dark:text-slate-100 transition-colors duration-200 selection:bg-cyan-500 selection:text-black overflow-x-hidden">

  <header class="border-b border-slate-200 dark:border-surface-border bg-white/80 dark:bg-surface/80 backdrop-blur-md sticky top-0 z-40 transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-3">

        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyan-500 dark:bg-cyan-400 animate-pulse"></span>
          <h1 class="text-base sm:text-lg md:text-xl font-bold tracking-tight uppercase flex items-center gap-1.5 flex-wrap">
            <a 
              href="index.html" 
              class="text-slate-900 dark:text-white hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors"
              title="Return to home"
            >
              TAIWAN TOP
            </a>
            <span class="text-slate-500 dark:text-slate-400 font-normal text-xs sm:text-sm lowercase">by</span>
            <a

      <div class="flex items-center gap-3 w-full md:w-auto">

        </div>

        <!-- City Filter Dropdown -->

            <path d="M 50 4 A 46 46 0 0 1 50 96 A 23 23 0 0 1 50 50 A 23 23 0 0 0 50 4 Z" fill="#0f172a"/>
            <circle cx="50" cy="27" r="6.5" fill="#0f172a"/>
            <circle cx="50" cy="73" r="6.5" fill="#f8fafc"/>
          </svg>
        </button>

    </div>

    <!-- Category Toolbar with subtle blurred edge fading -->

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <div class="w-full h-52 rounded shimmer"></div>
        <div class="h-5 w-2/3 rounded shimmer"></div>
        <div class="h-4 w-full rounded shimmer"></div>
        <div class="h-6 w-1/3 rounded-full shimmer"></div>
      </div>
      <div class="space-y-4 bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-lg p-4 hidden sm:block">

        <div class="h-5 w-2/3 rounded shimmer"></div>
        <div class="h-4 w-full rounded shimmer"></div>
        <div class="h-6 w-1/3 rounded-full shimmer"></div>
      </div>

        <div class="h-5 w-2/3 rounded shimmer"></div>

    <div id="places-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 items-stretch w-full"></div>

  </main>

  <!-- Interactive Detail Modal -->
  <div 
    id="detail-modal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 lg:p-12 bg-black/75 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
  >
    <!-- Modal Wrapper with Outside Navigation Controls -->
    <div id="modal-container" class="relative w-full max-w-2xl flex items-center justify-center">

      <!-- Previous Arrow (Outside card, left of photo) -->
      <button 
        id="modal-prev-btn" 
        type="button" 
        title="Previous spot (←)"
        aria-label="Previous spot"
        class="absolute -left-2 sm:-left-12 md:-left-14 top-28 sm:top-36 md:top-40 -translate-y-1/2 z-30 w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-full bg-black/60 hover:bg-white text-white hover:text-slate-900 border border-white/20 backdrop-blur-md transition shadow-xl disabled:opacity-20 disabled:pointer-events-none focus:outline-none"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Next Arrow (Outside card, right of photo) -->
      <button 
        id="modal-next-btn" 
        type="button" 
        title="Next spot (→)"
        aria-label="Next spot"
        class="absolute -right-2 sm:-right-12 md:-right-14 top-28 sm:top-36 md:top-40 -translate-y-1/2 z-30 w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-full bg-black/60 hover:bg-white text-white hover:text-slate-900 border border-white/20 backdrop-blur-md transition shadow-xl disabled:opacity-20 disabled:pointer-events-none focus:outline-none"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
        </svg>
      </button>

      <!-- Modal Card Box -->
      <div 
        id="modal-card" 
        class="relative w-full max-h-[92vh] flex flex-col bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-xl shadow-2xl overflow-hidden transform scale-95 transition-all duration-200"
      >
        <!-- Modal Top Action Controls -->
        <div class="absolute top-3.5 right-3.5 z-20 flex items-center gap-2">
          <button 
            id="modal-close-btn" 
            type="button" 
            title="Close dialog (Esc)" 
            aria-label="Close dialog"
            class="w-8 h-8 flex items-center justify-center rounded-full bg-black/60 hover:bg-white text-white hover:text-slate-900 border border-white/20 backdrop-blur-md transition shadow-md focus:outline-none"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Scrollable Modal Content -->
        <div class="overflow-y-auto flex-1 scrollbar-none">
          <!-- Hero Image -->
          <div class="relative w-full aspect-[16/10] sm:aspect-[16/9] bg-slate-900 overflow-hidden border-b border-slate-200 dark:border-surface-border">
            <img 
              id="modal-image" 
              src="" 
              alt="" 
              class="w-full h-full object-cover object-center" 
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
          </div>

          <!-- Body Details -->
          <div class="p-5 sm:p-6 space-y-4">
            <div>
              <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                <span id="modal-city-badge"></span>
                <div id="modal-tags" class="flex flex-wrap items-center gap-1.5"></div>
              </div>

            <p id="modal-description" class="text-xs sm:text-sm leading-relaxed text-slate-600 dark:text-slate-300 font-normal italic whitespace-pre-line"></p>

            <!-- External Action Button Bar -->
            <div class="pt-2 flex flex-wrap items-center gap-2.5">
              <button 
                id="modal-share-btn" 
                type="button" 
                title="Copy direct link to this spot" 
                aria-label="Copy direct link"

              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span>Copy link</span>
              </button>

              <a 
                id="modal-map-link" 
                href="#" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="h-8 inline-flex items-center gap-1.5 px-3 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-surface dark:hover:bg-surface-border border border-slate-200 dark:border-surface-border text-slate-800 dark:text-slate-200 font-medium text-xs normal-case tracking-normal transition shadow-sm"
              >
                <span>View on Google Maps</span>
                <span class="text-xs">↗</span>
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast Notification for Link Copying -->
  <div 
    id="toast-notification" 
    class="fixed bottom-6 right-6 z-50 px-4 py-2.5 bg-slate-900/90 dark:bg-white/90 text-white dark:text-slate-900 text-xs font-semibold rounded-lg shadow-xl backdrop-blur-md opacity-0 translate-y-3 pointer-events-none transition-all duration-200 flex items-center gap-2"
  >
    <svg class="w-4 h-4 text-emerald-400 dark:text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
    </svg>
    <span id="toast-message">Link copied to clipboard!</span>
  </div>

  <footer class="border-t border-slate-200 dark:border-surface-border bg-white/80 dark:bg-surface/80 backdrop-blur-sm py-8 text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
      
      <!-- Top 10 Tags Infographic Section -->
      <div id="top-tags-infographic" class="pt-1 pb-2">
        <div class="flex items-center justify-between gap-3 mb-3.5">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-cyan-500"></span>
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
              TOP 10 CATEGORIES
            </span>
          </div>
        </div>

        <!-- Horizontal Bar Chart Container -->
        <div id="top-tags-bars" class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2.5">

        </div>
      </div>

      <!-- Footer Info Row -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-1">
        <div class="inline-flex items-center gap-2">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span class="font-medium tracking-wide">Update: 09/2026</span>
        </div>

        <p class="text-slate-500 dark:text-slate-400">
          Curated by <a href="https://albyantoniazzi.github.io/" target="_blank" rel="noopener noreferrer" class="text-slate-500 dark:text-slate-400 underline hover:text-slate-700 dark:hover:text-slate-200 transition-colors">@albyantoniazzi</a>
        </p>
      </div>

    </div>
  </footer>

  <script>
    // Published Google Sheets CSV Feed URL
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv";

    // Lightweight sanitization helper to prevent unescaped strings/XSS from breaking DOM
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Alternating badge color themes for cards: Blue, Red, Green
    const BADGE_COLORS = [
      "bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-600 hover:text-white dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/35 dark:hover:bg-blue-500 dark:hover:text-slate-950 dark:hover:border-blue-400",
      "bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-600 hover:text-white dark:bg-rose-500/15 dark:text-rose-400 dark:border-rose-500/35 dark:hover:bg-rose-500 dark:hover:text-slate-950 dark:hover:border-rose-400",
      "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/35 dark:hover:bg-emerald-500 dark:hover:text-slate-950 dark:hover:border-emerald-400"
    ];

    // Toolbar button themes for Blue, Red, and Green alternating states
    const TOOLBAR_COLORS = [
      {
        inactive: "bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100 dark:bg-blue-500/15 dark:text-blue-400 dark:border-blue-500/35 dark:hover:bg-blue-500/25",
        active: "bg-blue-600 text-white border-blue-500 shadow-sm shadow-blue-500/25 dark:bg-blue-500 dark:text-slate-950 dark:border-blue-400 dark:shadow-blue-500/20"
      },
      {
        inactive: "bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100 dark:bg-rose-500/15 dark:text-rose-400 dark:border-rose-500/35 dark:hover:bg-rose-500/25",
        active: "bg-rose-600 text-white border-rose-500 shadow-sm shadow-rose-500/25 dark:bg-rose-500 dark:text-slate-950 dark:border-rose-400 dark:shadow-rose-500/20"
      },
      {
        inactive: "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/35 dark:hover:bg-emerald-500/25",
        active: "bg-emerald-600 text-white border-emerald-500 shadow-sm shadow-emerald-500/25 dark:bg-emerald-500 dark:text-slate-950 dark:border-emerald-400 dark:shadow-emerald-500/20"
      }
    ];

    // Reactive Application State
    let allPlaces = [];
    let dismissedPlaces = new Set();
    let activeCity = "ALL";
    let activeCategory = "ALL";
    let searchQuery = "";
    let rotationDeg = 0;
    let activeModalIndex = -1;
    let visiblePlaces = [];

    // DOM Elements
    const gridEl = document.getElementById("places-grid");
    const loadingEl = document.getElementById("loading-state");
    const emptyEl = document.getElementById("empty-state");
    const counterEl = document.getElementById("places-count");
    const categoryContainer = document.getElementById("category-filters");
    const cityFilterSelect = document.getElementById("city-filter");
    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const resetFilterBtn = document.getElementById("reset-filter-btn");
    const themeToggleBtn = document.getElementById("theme-toggle");
    const yinYangIcon = document.getElementById("yin-yang-icon");

    // Modal & Toast Elements
    const modalEl = document.getElementById("detail-modal");
    const modalCardEl = document.getElementById("modal-card");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const modalShareBtn = document.getElementById("modal-share-btn");
    const modalImageEl = document.getElementById("modal-image");
    const modalTitleEl = document.getElementById("modal-title");
    const modalDescEl = document.getElementById("modal-description");
    const modalMapLink = document.getElementById("modal-map-link");
    const modalCityBadge = document.getElementById("modal-city-badge");
    const modalTags = document.getElementById("modal-tags");
    const modalPrevBtn = document.getElementById("modal-prev-btn");
    const modalNextBtn = document.getElementById("modal-next-btn");
    const modalIndexCounter = document.getElementById("modal-index-counter");
    const toastEl = document.getElementById("toast-notification");
    const toastMsg = document.getElementById("toast-message");

    // Helper: Deterministic PRNG seeded by today's calendar date (YYYYMMDD)
    function seededRandom(seed) {
      let state = seed % 2147483647;
      if (state <= 0) state += 2147483646;
      return function() {
        state = (state * 16807) % 2147483647;
        return (state - 1) / 2147483646;
      };
    }

    // Helper: Daily Seeded Fisher-Yates Shuffle
    function dailyShuffle(array) {
      const now = new Date();
      // Date seed: YYYYMMDD based on client local date
      const dateSeed = (now.getFullYear() * 10000) + ((now.getMonth() + 1) * 100) + now.getDate();
      const rng = seededRandom(dateSeed);
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // Helper: Create URL friendly slug from place title
    function createSlug(title) {
      return (title || '')
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // Helper: Copy text with iFrame fallback support
    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const tempInput = document.createElement("input");
      tempInput.style.position = "fixed";
      tempInput.style.opacity = "0";
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Copy fallback failed', err);
      }
      document.body.removeChild(tempInput);
    }

    // Toast Feedback
    let toastTimeout = null;
    function showToast(message) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = message;
      toastEl.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
      toastEl.classList.add("opacity-100", "translate-y-0");

      toastTimeout = setTimeout(() => {
        toastEl.classList.remove("opacity-100", "translate-y-0");
        toastEl.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
      }, 2500);
    }

    // Two-Way URL Sync: Read State from URL Query
    function parseUrlState() {
      const params = new URLSearchParams(window.location.search);
      if (params.has("city")) activeCity = params.get("city");
      if (params.has("cat")) activeCategory = params.get("cat");
      if (params.has("q")) {
        searchQuery = params.get("q");
        searchInput.value = searchQuery;
        clearSearchBtn.classList.toggle("hidden", !searchQuery);
      }
      return params.get("spot");
    }

    // Two-Way URL Sync: Update URL Query without full page reload
    function updateUrlState(targetSpotSlug = null) {
      const params = new URLSearchParams();
      if (activeCity !== "ALL") params.set("city", activeCity);
      if (activeCategory !== "ALL") params.set("cat", activeCategory);
      if (searchQuery.trim()) params.set("q", searchQuery.trim());
      if (targetSpotSlug) params.set("spot", targetSpotSlug);

      const queryString = params.toString();
      const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
      window.history.replaceState({}, "", newUrl);
    }

    // Initialize Theme (Default to Dark Mode)
    function initTheme() {
      const savedTheme = localStorage.getItem("tot-theme");
      const isDark = savedTheme !== null ? savedTheme === "dark" : true;
      document.documentElement.classList.toggle("dark", isDark);

      themeToggleBtn.addEventListener("click", () => {
        rotationDeg += 180;
        yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;
        
        const currentlyDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("tot-theme", currentlyDark ? "dark" : "light");
      });
    }

    async function fetchPlaces() {
      try {
        // Cache-busting timestamp bypasses Google's edge cache for immediate refresh on edits
        const cacheBuster = `&_t=${Date.now()}`;
        const response = await fetch(`${SHEET_CSV_URL}${cacheBuster}`);
        if (!response.ok) throw new Error("Network response was not ok");
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          transformHeader: function(h) {
            return h.trim().toLowerCase();
          },
          complete: function(results) {
            processPlacesData(results.data);
          },
          error: function(err) {
            console.error("PapaParse error:", err);
            handleFetchError();
          }
        });
      } catch (err) {
        console.error("Fetch failed:", err);
        handleFetchError();
      }
    }

    function handleFetchError() {
      loadingEl.classList.add("hidden");
      emptyEl.classList.remove("hidden");
      emptyEl.querySelector("p").textContent = "Could not load data from Google Sheets.";
    }

    function getFieldValue(row, possibleKeys) {
      const rowKeys = Object.keys(row);
      for (const key of possibleKeys) {
        const match = rowKeys.find(k => k.trim().toLowerCase() === key.toLowerCase());
        if (match && row[match] !== undefined && row[match] !== null && String(row[match]).trim() !== '') {
          return String(row[match]).trim();
        }
      }
      return '';
    }

    function processPlacesData(rows) {
      const parsedPlaces = rows
        .map(row => {
          const title = getFieldValue(row, ['title', 'name', 'place']);
          if (!title) return null;

          const rawCategories = getFieldValue(row, ['categories', 'category', 'tags', 'tag']);
          const categories = rawCategories 
            ? rawCategories.split(',').map(s => {
                const trimmed = s.trim();
                return trimmed ? (trimmed.charAt(0).toUpperCase() + trimmed.slice(1)) : '';
              }).filter(Boolean) 
            : [];

          const city = getFieldValue(row, ['city', 'location', 'town']);
          const description = getFieldValue(row, ['description', 'desc', 'notes', 'about']);
          const photo = getFieldValue(row, ['photo', 'image', 'picture', 'url', 'photo_url']);
          const mapLink = getFieldValue(row, ['map_link', 'map', 'google_map_url', 'google map url link', 'link']);
          const slug = createSlug(title);

          return {
            title,
            slug,
            city,
            categories,
            description,
            photo,
            mapLink
          };
        })
        .filter(Boolean);

      // Apply Daily Seeded Shuffle so the order feels fresh every day but stays consistent throughout the day
      allPlaces = dailyShuffle(parsedPlaces);

      populateCityFilter();
      populateCategoryFilters();
      renderTopTagsChart();

      // Read URL deep links and restore query states
      const deepLinkedSpotSlug = parseUrlState();
      cityFilterSelect.value = activeCity;
      updateToolbarStyles();
      renderPlaces();

      if (deepLinkedSpotSlug) {
        const targetIndex = visiblePlaces.findIndex(p => p.slug === deepLinkedSpotSlug);
        if (targetIndex !== -1) {
          openModal(targetIndex);
        } else {
          // If not in current filtered list, check allPlaces
          const globalIndex = allPlaces.findIndex(p => p.slug === deepLinkedSpotSlug);
          if (globalIndex !== -1) {
            // Reset filters to show the linked spot
            activeCity = "ALL";
            activeCategory = "ALL";
            searchQuery = "";
            cityFilterSelect.value = "ALL";
            searchInput.value = "";
            updateToolbarStyles();
            renderPlaces();
            const recheckIndex = visiblePlaces.findIndex(p => p.slug === deepLinkedSpotSlug);
            if (recheckIndex !== -1) openModal(recheckIndex);
          }
        }
      }

      loadingEl.classList.add("hidden");
    }

    function populateCityFilter() {
      const cities = Array.from(new Set(allPlaces.map(p => p.city).filter(Boolean))).sort();
      cityFilterSelect.innerHTML = '<option value="ALL">All Cities</option>';
      cities.forEach(city => {
        const opt = document.createElement("option");
        opt.value = city;
        opt.textContent = city;
        cityFilterSelect.appendChild(opt);
      });
    }

    function populateCategoryFilters() {
      const catCount = {};
      allPlaces.forEach(p => {
        p.categories.forEach(c => {
          catCount[c] = (catCount[c] || 0) + 1;
        });
      });

      const sortedCategories = Object.keys(catCount).sort();
      categoryContainer.innerHTML = '';

      // "All" Button
      const allBtn = document.createElement("button");
      allBtn.dataset.category = "ALL";
      allBtn.className = "cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 whitespace-nowrap " +
        (activeCategory === "ALL" 
          ? "bg-cyan-500 text-black border border-cyan-400 shadow-sm" 
          : "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200 dark:bg-surface-card dark:text-slate-300 dark:border-surface-border dark:hover:bg-surface-border");
      allBtn.textContent = "All";
      allBtn.addEventListener("click", () => setCategory("ALL"));
      categoryContainer.appendChild(allBtn);

      sortedCategories.forEach((cat, index) => {
        const theme = TOOLBAR_COLORS[index % TOOLBAR_COLORS.length];
        const btn = document.createElement("button");
        btn.dataset.category = cat;
        btn.dataset.colorIndex = index % TOOLBAR_COLORS.length;

        const isCurrentActive = activeCategory === cat;
        btn.className = `cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 border whitespace-nowrap ${
          isCurrentActive ? theme.active : theme.inactive
        }`;
        btn.textContent = cat;
        btn.addEventListener("click", () => setCategory(cat));
        categoryContainer.appendChild(btn);
      });
    }

    // Render horizontal bar chart infographic for Top 10 categories
    function renderTopTagsChart() {
      const barsContainer = document.getElementById("top-tags-bars");
      if (!barsContainer) return;

      const catCount = {};
      allPlaces.forEach(p => {
        p.categories.forEach(c => {
          catCount[c] = (catCount[c] || 0) + 1;
        });
      });

      // Sort categories descending by count and take the top 10
      const sortedEntries = Object.entries(catCount)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      if (sortedEntries.length === 0) {
        barsContainer.innerHTML = '<p class="text-slate-400 text-xs">No tags recorded yet.</p>';
        return;
      }

      const maxCount = sortedEntries[0][1] || 1;
      const barThemeAccents = [
        "bg-blue-500",
        "bg-rose-500",
        "bg-emerald-500"
      ];

      barsContainer.innerHTML = sortedEntries.map(([cat, count], idx) => {
        const pct = Math.round((count / maxCount) * 100);
        const barColor = barThemeAccents[idx % barThemeAccents.length];
        const formattedCat = cat ? (cat.charAt(0).toUpperCase() + cat.slice(1)) : '';
        const safeCat = escapeHtml(formattedCat);
        const escapedJsCat = cat.replace(/'/g, "\\'");

        return `
          <button 
            type="button"
            onclick="setCategory('${escapedJsCat}')" 
            title="Filter by ${safeCat} (${count} places)"
            class="group w-full flex items-center gap-2.5 text-left py-0.5 hover:opacity-85 focus:outline-none transition-opacity"
          >
            <!-- Tag Name & Badge -->
            <span class="w-24 sm:w-28 truncate font-medium text-[11px] text-slate-700 dark:text-slate-300 group-hover:text-cyan-500 transition-colors">
              ${safeCat}
            </span>

            <!-- Progress Bar Rail (Ultra-thin line, squared edges) -->
            <div class="flex-1 h-[2px] bg-slate-200 dark:bg-surface-border overflow-hidden relative">
              <div 
                class="h-full ${barColor} transition-all duration-500 ease-out"
                style="width: ${pct}%;"
              ></div>
            </div>

            <!-- Total Count -->
            <span class="w-6 text-right font-mono font-bold text-[11px] text-slate-500 dark:text-slate-400 group-hover:text-cyan-500">
              ${count}
            </span>
          </button>
        `;
      }).join('');
    }

    function updateToolbarStyles() {
      const buttons = categoryContainer.querySelectorAll(".cat-filter-btn");
      buttons.forEach(btn => {
        const cat = btn.dataset.category;
        const colorIdx = parseInt(btn.dataset.colorIndex, 10);

        if (cat === "ALL") {
          btn.className = "cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 whitespace-nowrap " +
            (activeCategory === "ALL" 
              ? "bg-cyan-500 text-black border border-cyan-400 shadow-sm" 
              : "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200 dark:bg-surface-card dark:text-slate-300 dark:border-surface-border dark:hover:bg-surface-border");
        } else {
          const theme = TOOLBAR_COLORS[colorIdx];
          const isCurrentActive = activeCategory === cat;
          btn.className = `cat-filter-btn h-7 px-3.5 inline-flex items-center justify-center rounded-full font-bold uppercase tracking-wider text-[11px] leading-none transition-all duration-150 border whitespace-nowrap ${
            isCurrentActive ? theme.active : theme.inactive
          }`;
        }
      });
    }

    // Filter Trigger Helpers
    window.setCategory = function(cat) {
      activeCategory = (activeCategory === cat && cat !== "ALL") ? "ALL" : cat;
      updateToolbarStyles();
      updateUrlState();
      renderPlaces();
    };

    window.setCity = function(city) {
      activeCity = (activeCity.toLowerCase() === city.toLowerCase()) ? "ALL" : city;
      cityFilterSelect.value = activeCity;
      updateUrlState();
      renderPlaces();
    };

    // Card & Modal Share Helper
    window.copyPlaceLink = function(slug, e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      const shareUrl = `${window.location.origin}${window.location.pathname}?spot=${slug}`;
      copyTextToClipboard(shareUrl);
      showToast("Direct spot link copied!");
    };

    // Modal Manager
    window.openModal = function(index) {
      if (!visiblePlaces[index]) return;
      activeModalIndex = index;
      const place = visiblePlaces[index];

      const fallbackImg = "https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=1400&q=80";
      modalImageEl.src = place.photo || fallbackImg;
      modalImageEl.alt = place.title;
      modalTitleEl.textContent = place.title;
      modalDescEl.textContent = place.description || "No description provided for this curated spot.";

      // City Pill in Modal
      if (place.city) {
        modalCityBadge.className = "h-6 px-2.5 inline-flex items-center gap-1 rounded-full text-[10px] font-bold tracking-wider uppercase leading-none border bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/35";
        modalCityBadge.innerHTML = `
          <svg class="w-2.5 h-2.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
          </svg>
          <span>${escapeHtml(place.city)}</span>
        `;
        modalCityBadge.classList.remove("hidden");
      } else {
        modalCityBadge.classList.add("hidden");
      }

      // Tags in Modal
      modalTags.innerHTML = place.categories.map((cat, idx) => {
        const colorClass = BADGE_COLORS[idx % BADGE_COLORS.length];
        return `
          <span class="h-6 px-2.5 inline-flex items-center justify-center rounded-full text-[10px] font-bold tracking-wider uppercase leading-none border ${colorClass}">
            ${escapeHtml(cat)}
          </span>
        `;
      }).join('');

      // Map Link
      if (place.mapLink) {
        modalMapLink.href = encodeURI(place.mapLink);
        modalMapLink.classList.remove("hidden");
      } else {
        modalMapLink.classList.add("hidden");
      }

      // Prev / Next State
      modalPrevBtn.disabled = index <= 0;
      modalNextBtn.disabled = index >= visiblePlaces.length - 1;
      if (modalIndexCounter) {
        modalIndexCounter.textContent = `${index + 1} / ${visiblePlaces.length}`;
      }

      // Open Modal Dialog
      modalEl.classList.remove("opacity-0", "pointer-events-none");
      modalEl.classList.add("opacity-100");
      modalCardEl.classList.remove("scale-95");
      modalCardEl.classList.add("scale-100");
      document.body.classList.add("overflow-hidden");

      updateUrlState(place.slug);
    };

    window.closeModal = function() {
      modalEl.classList.remove("opacity-100");
      modalEl.classList.add("opacity-0", "pointer-events-none");
      modalCardEl.classList.remove("scale-100");
      modalCardEl.classList.add("scale-95");
      document.body.classList.remove("overflow-hidden");
      activeModalIndex = -1;
      updateUrlState(null);
    };

    function navigateModal(direction) {
      const targetIndex = activeModalIndex + direction;
      if (targetIndex >= 0 && targetIndex < visiblePlaces.length) {
        openModal(targetIndex);
      }
    }

    function renderPlaces() {
      gridEl.innerHTML = "";

      const q = searchQuery.toLowerCase().trim();
      const stopWords = new Set(["in", "at", "the", "on", "of", "and", "&", "a", "an"]);
      const rawTokens = q.split(/\s+/).filter(Boolean);
      const searchTokens = rawTokens.filter(word => !stopWords.has(word));
      const tokensToMatch = searchTokens.length > 0 ? searchTokens : rawTokens;

      visiblePlaces = allPlaces.filter(place => {
        if (dismissedPlaces.has(place.title)) return false;

        const matchesCity = (activeCity === "ALL") || (place.city.toLowerCase() === activeCity.toLowerCase());
        const matchesCategory = (activeCategory === "ALL") || place.categories.includes(activeCategory);
        
        const searchableContent = `${place.title} ${place.description} ${place.categories.join(' ')} ${place.city}`.toLowerCase();
        const matchesSearch = tokensToMatch.length === 0 || tokensToMatch.every(token => searchableContent.includes(token));

        return matchesCity && matchesCategory && matchesSearch;
      });

      counterEl.textContent = visiblePlaces.length;

      if (visiblePlaces.length === 0) {
        emptyEl.classList.remove("hidden");
        gridEl.classList.add("hidden");
        return;
      } else {
        emptyEl.classList.add("hidden");
        gridEl.classList.remove("hidden");
      }

      visiblePlaces.forEach((place, index) => {
        const card = document.createElement("article");
        card.className = "gallery-item group relative bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border rounded-lg overflow-hidden flex flex-col transition hover:border-slate-300 dark:hover:border-slate-600 shadow-sm cursor-pointer";

        // Category Tags HTML
        const tagsHtml = place.categories.map((cat, idx) => {
          const colorClass = BADGE_COLORS[idx % BADGE_COLORS.length];
          const safeCat = escapeHtml(cat);
          const escapedJsCat = cat.replace(/'/g, "\\'");
          return `
            <button 
              type="button" 
              onclick="event.stopPropagation(); setCategory('${escapedJsCat}')" 
              class="h-6 px-2.5 inline-flex items-center justify-center rounded-full text-[10px] font-bold tracking-wider uppercase leading-none border transition-colors ${colorClass}"
            >
              ${safeCat}
            </button>
          `;
        }).join("");

        // Uniform pill city badge (green by default)
        const cityBadgeHtml = place.city 
          ? `<button 
              type="button"
              onclick="event.stopPropagation(); setCity('${place.city.replace(/'/g, "\\'")}')"
              title="Filter by ${escapeHtml(place.city)}"
              class="h-6 px-2.5 inline-flex items-center justify-center gap-1 rounded-full text-[10px] font-bold tracking-wider uppercase leading-none border transition-colors bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-600 hover:text-white hover:border-emerald-500 dark:bg-emerald-500/15 dark:text-emerald-400 dark:border-emerald-500/35 dark:hover:bg-emerald-500 dark:hover:text-slate-950 dark:hover:border-emerald-400"
            >
              <svg class="w-2.5 h-2.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
              </svg>
              <span>${escapeHtml(place.city)}</span>
             </button>`
          : '';

        const fallbackImg = "https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=1400&q=80";
        const imageSource = place.photo || fallbackImg;
        const safeTitle = escapeHtml(place.title);
        const safeDesc = escapeHtml(place.description || "No description provided.");
        const safeSlug = escapeHtml(place.slug);

        card.innerHTML = `
          <!-- Top Right Action: Dismiss Only -->
          <div class="absolute top-3 right-3 z-30 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity duration-200">
            <!-- Dismiss "X" Button -->
            <button 
              type="button" 
              title="Temporarily dismiss this spot" 
              aria-label="Dismiss spot" 
              class="dismiss-card-btn w-7 h-7 flex items-center justify-center rounded-full bg-black/60 hover:bg-white text-white hover:text-slate-900 border border-white/25 hover:border-white backdrop-blur-md transition shadow-md focus:outline-none"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>

          <!-- Photo Container -->
          <div class="img-wrapper relative w-full aspect-[16/10] overflow-hidden bg-slate-200 dark:bg-surface-card border-b border-slate-200/80 dark:border-surface-border">
            <img 
              src="${escapeHtml(imageSource)}" 
              alt="${safeTitle}" 
              loading="lazy" 
              onerror="this.onerror=null; this.src='${fallbackImg}';"
              class="w-full h-full object-cover object-center"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          </div>

          <!-- Information block -->
          <div class="p-4 sm:p-5 flex flex-col flex-1 justify-between">
            <div>
              <div class="mb-2 flex items-baseline justify-between gap-2">
                <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white tracking-tight group-hover:text-cyan-600 dark:group-hover:text-cyan-400 transition-colors">
                  ${safeTitle}
                </h2>
                ${place.mapLink ? `<a href="${encodeURI(place.mapLink)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open on Google Maps" class="text-xs text-slate-400 hover:text-cyan-500 transition-colors">↗</a>` : ''}
              </div>

              <!-- Description -->
              <p class="text-xs sm:text-sm leading-relaxed text-slate-600 dark:text-slate-400 line-clamp-3 mb-4 font-normal italic">
                ${safeDesc}
              </p>
            </div>

            <!-- Badges -->
            <div class="flex flex-wrap items-center gap-1.5 pt-1">
              ${cityBadgeHtml}
              ${tagsHtml}
            </div>
          </div>
        `;

        // Card Click opens Modal
        card.addEventListener("click", () => {
          openModal(index);
        });

        // Smooth dismiss interaction
        const dismissBtn = card.querySelector(".dismiss-card-btn");
        dismissBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          e.preventDefault();

          card.classList.add("scale-95", "opacity-0", "pointer-events-none");
          setTimeout(() => {
            dismissedPlaces.add(place.title);
            renderPlaces();
          }, 200);
        });

        gridEl.appendChild(card);
      });
    }

    // Modal Event Handlers
    modalCloseBtn.addEventListener("click", closeModal);
    modalEl.addEventListener("click", (e) => {
      // Close modal if user clicks outside the modal card and outside navigation buttons
      if (!modalCardEl.contains(e.target) && !modalPrevBtn.contains(e.target) && !modalNextBtn.contains(e.target)) {
        closeModal();
      }
    });
    modalPrevBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      navigateModal(-1);
    });
    modalNextBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      navigateModal(1);
    });

    modalShareBtn.addEventListener("click", () => {
      if (activeModalIndex !== -1 && visiblePlaces[activeModalIndex]) {
        copyPlaceLink(visiblePlaces[activeModalIndex].slug);
      }
    });

    // Keyboard Shortcuts: Esc to close, Left/Right arrows to navigate
    document.addEventListener("keydown", (e) => {
      if (modalEl.classList.contains("opacity-100")) {
        if (e.key === "Escape") {
          closeModal();
        } else if (e.key === "ArrowLeft") {
          navigateModal(-1);
        } else if (e.key === "ArrowRight") {
          navigateModal(1);
        }
      }
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("hidden", !searchQuery);
      dismissedPlaces.clear();
      updateUrlState();
      renderPlaces();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      updateUrlState();
      renderPlaces();
    });

    cityFilterSelect.addEventListener("change", (e) => {
      activeCity = e.target.value;
      updateUrlState();
      renderPlaces();
    });

    resetFilterBtn.addEventListener("click", () => {
      activeCategory = "ALL";
      activeCity = "ALL";
      searchQuery = "";
      searchInput.value = "";
      cityFilterSelect.value = "ALL";
      clearSearchBtn.classList.add("hidden");
      dismissedPlaces.clear();
      updateToolbarStyles();
      updateUrlState();
      renderPlaces();
    });

    // Start fetching sheet data and theme on page load
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      fetchPlaces();
    });
  </script>
</body>
</html>
