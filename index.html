<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAIWAN TOP — Curated Places by @albyantoniazzi</title>
  <meta name="description" content="A curated directory of top places, eats, and hidden gems across Taiwan compiled by @albyantoniazzi (@alby.food)." />

  <!-- Fonts: Roboto Flex & Material Symbols Outlined per Material Design 3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CSS for responsive layout utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PapaParse for client-side CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaTfpa48djpNbZ18legh+9h+9h6Q1A1jYx81Y1b+9h6Q1A1jYx81Y1b+9w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Fallback CDN for PapaParse if integrity hash differs across mirrors -->
  <script>
    if (typeof Papa === 'undefined') {
      document.write('<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"><\/script>');
    }
  </script>

  <style>
    /* ==========================================================================
       MATERIAL DESIGN 3 (MD3) DESIGN TOKENS
       Dynamic Taiwan-inspired seed palette (Alishan Jade & Night Market Lantern Terracotta)
       ========================================================================== */
    :root {
      /* Light Scheme Color Tokens */
      --md-sys-color-primary: #1B6B52;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #A5F2D3;
      --md-sys-color-on-primary-container: #002116;

      --md-sys-color-secondary: #4C6358;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #CEE9DA;
      --md-sys-color-on-secondary-container: #092017;

      --md-sys-color-tertiary: #9C4233;
      --md-sys-color-on-tertiary: #FFFFFF;
      --md-sys-color-tertiary-container: #FFDAD4;
      --md-sys-color-on-tertiary-container: #410000;

      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #410002;

      --md-sys-color-surface: #F6FBF7;
      --md-sys-color-on-surface: #171D1A;
      --md-sys-color-on-surface-variant: #3F4944;

      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F0F5F1;
      --md-sys-color-surface-container: #EAEFEB;
      --md-sys-color-surface-container-high: #E4EAE5;
      --md-sys-color-surface-container-highest: #DFE4E0;

      --md-sys-color-inverse-surface: #2C322F;
      --md-sys-color-inverse-on-surface: #EDF2EE;
      --md-sys-color-inverse-primary: #8AD6B8;

      --md-sys-color-outline: #707973;
      --md-sys-color-outline-variant: #BFC9C2;
      --md-sys-color-scrim: rgba(0, 0, 0, 0.48);

      /* Typography Tokens */
      --md-sys-typescale-font-family: 'Roboto Flex', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Shape Tokens */
      --md-sys-shape-corner-extra-small: 4px;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-large: 16px;
      --md-sys-shape-corner-large-increased: 20px;
      --md-sys-shape-corner-extra-large: 28px;
      --md-sys-shape-corner-full: 9999px;

      /* Motion Tokens */
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
      --md-sys-motion-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
      --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-duration-short: 200ms;
      --md-sys-motion-duration-medium: 300ms;
      --md-sys-motion-duration-long: 450ms;
    }

    /* Dark Mode Theme Tokens */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #8AD6B8;
        --md-sys-color-on-primary: #003828;
        --md-sys-color-primary-container: #00513C;
        --md-sys-color-on-primary-container: #A5F2D3;

        --md-sys-color-secondary: #B3CCBE;
        --md-sys-color-on-secondary: #1E352B;
        --md-sys-color-secondary-container: #354B41;
        --md-sys-color-on-secondary-container: #CEE9DA;

        --md-sys-color-tertiary: #FFB4A7;
        --md-sys-color-on-tertiary: #5F150B;
        --md-sys-color-tertiary-container: #7D2B1F;
        --md-sys-color-on-tertiary-container: #FFDAD4;

        --md-sys-color-error: #FFB4AB;
        --md-sys-color-on-error: #690005;
        --md-sys-color-error-container: #93000A;
        --md-sys-color-on-error-container: #FFDAD6;

        --md-sys-color-surface: #0F1512;
        --md-sys-color-on-surface: #DFE4E0;
        --md-sys-color-on-surface-variant: #BFC9C2;

        --md-sys-color-surface-container-lowest: #0A0F0D;
        --md-sys-color-surface-container-low: #171D1A;
        --md-sys-color-surface-container: #1B211E;
        --md-sys-color-surface-container-high: #262B28;
        --md-sys-color-surface-container-highest: #303633;

        --md-sys-color-inverse-surface: #DFE4E0;
        --md-sys-color-inverse-on-surface: #2C322F;
        --md-sys-color-inverse-primary: #1B6B52;

        --md-sys-color-outline: #89938D;
        --md-sys-color-outline-variant: #3F4944;
        --md-sys-color-scrim: rgba(0, 0, 0, 0.68);
      }
    }

    :root[data-theme="dark"] {
      --md-sys-color-primary: #8AD6B8;
      --md-sys-color-on-primary: #003828;
      --md-sys-color-primary-container: #00513C;
      --md-sys-color-on-primary-container: #A5F2D3;

      --md-sys-color-secondary: #B3CCBE;
      --md-sys-color-on-secondary: #1E352B;
      --md-sys-color-secondary-container: #354B41;
      --md-sys-color-on-secondary-container: #CEE9DA;

      --md-sys-color-tertiary: #FFB4A7;
      --md-sys-color-on-tertiary: #5F150B;
      --md-sys-color-tertiary-container: #7D2B1F;
      --md-sys-color-on-tertiary-container: #FFDAD4;

      --md-sys-color-surface: #0F1512;
      --md-sys-color-on-surface: #DFE4E0;
      --md-sys-color-on-surface-variant: #BFC9C2;

      --md-sys-color-surface-container-lowest: #0A0F0D;
      --md-sys-color-surface-container-low: #171D1A;
      --md-sys-color-surface-container: #1B211E;
      --md-sys-color-surface-container-high: #262B28;
      --md-sys-color-surface-container-highest: #303633;

      --md-sys-color-inverse-surface: #DFE4E0;
      --md-sys-color-inverse-on-surface: #2C322F;
      --md-sys-color-inverse-primary: #1B6B52;

      --md-sys-color-outline: #89938D;
      --md-sys-color-outline-variant: #3F4944;
      --md-sys-color-scrim: rgba(0, 0, 0, 0.68);
    }

    /* Spots Badge: Consistent #FFDAD4 / #410000 in both light and dark modes */
    #header-total-badge {
      background-color: #FFDAD4;
      color: #410000;
    }

    html {
      font-family: var(--md-sys-typescale-font-family);
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 68px;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      transition: background-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard),
                  color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      vertical-align: middle;
    }

    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

    /* MD3 Top App Bar */
    .md3-top-app-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--md-sys-color-surface);
      border-bottom: 1px solid transparent;
      transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }

    .md3-top-app-bar.scrolled {
      background-color: var(--md-sys-color-surface-container);
      border-bottom-color: var(--md-sys-color-outline-variant);
    }

    /* MD3 Search Bar (Docked Pill) */
    .md3-search-bar {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid transparent;
      transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  box-shadow var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }

    .md3-search-bar:focus-within {
      background-color: var(--md-sys-color-surface-container-highest);
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Autocomplete Dropdown Menu (MD3 Menu) */
    .md3-autocomplete-menu {
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-sys-shape-corner-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      transform-origin: top center;
      animation: menuEnter var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized-decelerate);
    }

    @keyframes menuEnter {
      from { opacity: 0; transform: translateY(-6px) scaleY(0.96); }
      to { opacity: 1; transform: translateY(0) scaleY(1); }
    }

    .md3-autocomplete-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      min-height: 48px;
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    .md3-autocomplete-item:hover,
    .md3-autocomplete-item.active {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* MD3 Filter Chips */
    .md3-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface-variant);
      transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
    }

    .md3-filter-chip:hover {
      background-color: var(--md-sys-color-surface-container-high);
      border-color: var(--md-sys-color-outline);
    }

    .md3-filter-chip:active {
      transform: scale(0.97);
    }

    .md3-filter-chip[aria-pressed="true"] {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: transparent;
      font-weight: 600;
    }

    .md3-filter-chip .chip-count {
      font-size: 0.75rem;
      padding: 1px 7px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
    }

    .md3-filter-chip[aria-pressed="true"] .chip-count {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    /* Horizontal chip scroll container with subtle scrollbar hiding */
    .chip-scroll-strip {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chip-scroll-strip::-webkit-scrollbar {
      display: none;
    }

    /* MD3 Place Card (Square aspect-ratio visual card) */
    .md3-place-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--md-sys-shape-corner-large);
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  box-shadow var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
    }

    .md3-place-card:hover {
      transform: translateY(-3px);
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    }

    .md3-place-card:focus-visible {
      outline: 3px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    .md3-place-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 500ms var(--md-sys-motion-easing-emphasized);
    }

    .md3-place-card:hover img {
      transform: scale(1.05);
    }

    .md3-card-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(10, 16, 13, 0.88) 0%,
        rgba(10, 16, 13, 0.45) 26%,
        rgba(10, 16, 13, 0) 42%
      );
      pointer-events: none;
    }

    /* MD3 Buttons */
    .md3-btn-filled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 24px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-weight: 600;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      border: none;
      transition: filter 150ms ease, transform 150ms ease;
    }

    .md3-btn-filled:hover {
      filter: brightness(1.06);
    }

    .md3-btn-filled:active {
      transform: scale(0.98);
    }

    .md3-btn-tonal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      border: none;
      transition: filter 150ms ease, transform 150ms ease;
    }

    .md3-btn-tonal:hover {
      filter: brightness(0.96);
    }

    .md3-btn-tonal:active {
      transform: scale(0.98);
    }

    .md3-btn-outlined {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: transparent;
      color: var(--md-sys-color-primary);
      border: 1px solid var(--md-sys-color-outline);
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .md3-btn-outlined:hover {
      background-color: var(--md-sys-color-surface-container-high);
    }

    .md3-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .md3-icon-btn:hover {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .md3-icon-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* MD3 Dialog / Detail Modal */
    .md3-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background-color: var(--md-sys-color-scrim);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }

    .md3-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .md3-modal-dialog {
      width: 100%;
      max-width: 860px;
      max-height: 92vh;
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-sys-shape-corner-extra-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.94) translateY(12px);
      transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized-decelerate);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
    }

    .md3-modal-backdrop.open .md3-modal-dialog {
      transform: scale(1) translateY(0);
    }

    /* MD3 Snackbar */
    .md3-snackbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      z-index: 80;
      background-color: var(--md-sys-color-inverse-surface);
      color: var(--md-sys-color-inverse-on-surface);
      padding: 12px 20px;
      border-radius: var(--md-sys-shape-corner-small);
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.24);
      opacity: 0;
      pointer-events: none;
      transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized),
                  opacity var(--md-sys-motion-duration-short) ease;
    }

    .md3-snackbar.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Skeleton Shimmer for Loading State */
    .skeleton-pulse {
      background: linear-gradient(
        90deg,
        var(--md-sys-color-surface-container) 25%,
        var(--md-sys-color-surface-container-highest) 50%,
        var(--md-sys-color-surface-container) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Dino / Duck Runner Canvas */
    #dino-canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--md-sys-shape-corner-large);
      background-color: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      outline: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    #dino-canvas:focus,
    #dino-canvas:focus-visible {
      outline: none;
      box-shadow: none;
      border-color: var(--md-sys-color-outline-variant);
    }
  </style>
</head>
<body class="antialiased selection:bg-emerald-500/20">

  <!-- ========================================================================
       MD3 TOP APP BAR & INTEGRATED SEARCH / FILTER HEADER
       ======================================================================== -->
  <header id="top-app-bar" class="md3-top-app-bar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-3 pb-3">
      <!-- Top Row: Brand Identity, Social Attribution & Controls -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <!-- Brand Logo & Title -->
        <div class="flex items-center gap-3">
          <button
            id="brand-reset-btn"
            type="button"
            class="flex items-center gap-3 text-left group focus:outline-none"
            title="Reset all filters and return to top"
          >
            <div
              class="w-12 h-12 flex items-center justify-center shrink-0 transition-transform duration-300 group-hover:scale-105"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="w-full h-full block" aria-hidden="true">
                <path style="fill: var(--md-sys-color-on-surface);" d="M120 0L165 0L165 45L150 45L150 180L135 180L135 195L30 195L30 180L15 180L15 135L0 135L0 120L45 120L45 135L120 135L120 0ZM150 15L135 15L135 30L150 30L150 15Z"/>
                <path fill="#fadad4" d="M135 240L105 240L105 195L120 195L120 225L135 225L135 240ZM75 240L45 240L45 195L60 195L60 225L75 225L75 240ZM165 15L210 15L210 30L195 30L195 45L165 45L165 15Z"/>
              </svg>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight" style="color: var(--md-sys-color-on-surface);">
                  TAIWAN TOP
                </h1>

  <!-- ========================================================================
       APPLICATION LOGIC
       ======================================================================== -->
  <script>
    (() => {
      'use strict';

      /* ----------------------------------------------------------------------
         CONSTANTS & CONFIGURATION
         ---------------------------------------------------------------------- */
      const CSV_URL =
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv';
      const FALLBACK_PHOTO =
        'https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg';
      const PAGE_SIZE = 24;

      const STOP_WORDS = new Set([
        'the', 'and', 'for', 'with', 'that', 'this', 'from', 'are', 'was',
        'were', 'have', 'has', 'had', 'not', 'but', 'what', 'all', 'when',
        'can', 'there', 'use', 'each', 'which', 'their', 'if', 'will', 'way',
        'about', 'many', 'then', 'them', 'would', 'like', 'into', 'has', 'more',
        'two', 'see', 'out', 'very', 'just', 'one', 'also', 'its', 'you', 'your',
        'taiwan', 'place', 'spot', 'great', 'good', 'best', 'really'
      ]);

      /* ----------------------------------------------------------------------
         APPLICATION STATE
         ---------------------------------------------------------------------- */
      let allPlaces = [];
      let visiblePlaces = [];
      let displayedCount = PAGE_SIZE;

      let activeCategory = 'ALL';
      let searchQuery = '';
      let sortOrder = 'newest'; // 'newest' | 'alpha'
      let activeModalIndex = -1;
      let pendingSpotSlug = null;

      // Autocomplete state
      let autocompleteIndex = [];
      let currentSuggestions = [];
      let highlightedSuggestionIdx = -1;
      let searchDebounceTimer = null;

      // Runner game state
      let dinoAnimFrameId = null;
      let dinoGameRunning = false;
      let audioCtx = null;

      /* ----------------------------------------------------------------------
         DOM ELEMENT REFERENCES
         ---------------------------------------------------------------------- */
      const els = {
        topAppBar: document.getElementById('top-app-bar'),
        brandResetBtn: document.getElementById('brand-reset-btn'),
        headerTotalBadge: document.getElementById('header-total-badge'),
        searchInput: document.getElementById('search-input'),
        clearSearchBtn: document.getElementById('clear-search-btn'),
        autocompleteDropdown: document.getElementById('autocomplete-dropdown'),
        autocompleteList: document.getElementById('autocomplete-list'),
        themeToggleBtn: document.getElementById('theme-toggle-btn'),
        themeIcon: document.getElementById('theme-icon'),
        categoryFilters: document.getElementById('category-filters'),
        resultsSummary: document.getElementById('results-summary'),
        resetFiltersInlineBtn: document.getElementById('reset-filters-inline-btn'),
        sortToggleBtn: document.getElementById('sort-toggle-btn'),
        sortToggleIcon: document.getElementById('sort-toggle-icon'),
        sortToggleLabel: document.getElementById('sort-toggle-label'),
        loadingSkeleton: document.getElementById('loading-skeleton'),
        placesGrid: document.getElementById('places-grid'),
        loadMoreContainer: document.getElementById('load-more-container'),
        loadMoreBtn: document.getElementById('load-more-btn'),
        loadMoreLabel: document.getElementById('load-more-label'),
        emptyState: document.getElementById('empty-state'),
        emptyStateTitle: document.getElementById('empty-state-title'),
        emptyStateSubtitle: document.getElementById('empty-state-subtitle'),
        emptyResetBtn: document.getElementById('empty-reset-btn'),
        retryFetchBtn: document.getElementById('retry-fetch-btn'),
        dinoCanvas: document.getElementById('dino-canvas'),
        gameScoreReadout: document.getElementById('game-score-readout'),
        placeModal: document.getElementById('place-modal'),
        modalDialogCard: document.getElementById('modal-dialog-card'),
        modalPrevBtn: document.getElementById('modal-prev-btn'),
        modalNextBtn: document.getElementById('modal-next-btn'),
        modalCounter: document.getElementById('modal-counter'),
        modalShareBtn: document.getElementById('modal-share-btn'),
        modalShareIcon: document.getElementById('modal-share-icon'),
        modalShareLabel: document.getElementById('modal-share-label'),
        modalCloseBtn: document.getElementById('modal-close-btn'),
        modalImage: document.getElementById('modal-image'),
        modalCityBtn: document.getElementById('modal-city-btn'),
        modalCityText: document.getElementById('modal-city-text'),
        modalTitle: document.getElementById('modal-title'),
        modalCategories: document.getElementById('modal-categories'),
        modalDescription: document.getElementById('modal-description'),
        modalMapsLink: document.getElementById('modal-maps-link'),
        snackbar: document.getElementById('snackbar'),
        snackbarText: document.getElementById('snackbar-text')
      };

      /* ----------------------------------------------------------------------
         NORMALIZATION & UTILITY HELPERS
         ---------------------------------------------------------------------- */

      function slugify(str) {
        return String(str || '')
          .toLowerCase()
          .normalize('NFKD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9\u4e00-\u9fff]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'spot';
      }

      function formatCityName(raw) {
        const clean = String(raw || '').trim().replace(/\s+/g, ' ');
        if (!clean) return '';
        return clean
          .split(' ')
          .map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
          .join(' ');
      }

      function extractFlickrPhotoId(photoUrl) {
        const url = String(photoUrl || '');
        const match = url.match(/\/(\d{8,})_[a-z0-9]+/i) || url.match(/(\d{9,})/);
        if (!match) return 0n;
        try {
          return BigInt(match[1]);
        } catch {
          return 0n;
        }
      }

      function parseCategories(rawCat) {
        if (!rawCat) return [];
        const seen = new Set();
        const result = [];
        String(rawCat)
          .split(/[,;|]/)
          .forEach((token) => {
            const clean = token.trim().replace(/\s+/g, ' ');
            if (!clean) return;
            const key = clean.toLowerCase();
            if (!seen.has(key)) {
              seen.add(key);
              result.push(clean);
            }
          });
        return result;
      }

      function normalizePlaceRow(row, index) {
        if (!row || typeof row !== 'object') return null;

        const title = String(
          row.Title ?? row.title ?? row.Name ?? row.name ?? ''
        )
          .trim()
          .replace(/\s+/g, ' ');
        if (!title) return null;

        const city = formatCityName(
          row.City ?? row.city ?? row.Location ?? row.location ?? ''
        );

        const rawCategories =
          row.Category ??
          row.category ??
          row.Categories ??
          row.categories ??
          row.Tags ??
          row.tags ??
          '';
        const categories = parseCategories(rawCategories);

        const description = String(
          row.Description ?? row.description ?? row.Notes ?? row.notes ?? ''
        ).trim();

        const rawPhoto = String(
          row.Photo ?? row.photo ?? row.Image ?? row.image ?? row.URL ?? ''
        ).trim();
        const photo = rawPhoto || FALLBACK_PHOTO;
        const flickrId = extractFlickrPhotoId(rawPhoto);

        const link = String(
          row.Link ?? row.link ?? row.Maps ?? row.maps ?? row['Google Maps'] ?? ''
        ).trim();

        return {
          id: index,
          title,
          slug: slugify(title),
          city,
          categories,
          description,
          photo,
          flickrId,
          link
        };
      }

      /* ----------------------------------------------------------------------
         1. STATE MANAGEMENT & URL SYNCHRONIZATION
         ---------------------------------------------------------------------- */

      function parseUrlState() {
        try {
          const params = new URLSearchParams(window.location.search);
          const catParam = params.get('cat');
          const cityParam = params.get('city');
          const qParam = params.get('q');
          const spotParam = params.get('spot');

          if (catParam) {
            activeCategory = catParam.trim().toLowerCase();
          }

          if (qParam) {
            searchQuery = qParam.trim();
            els.searchInput.value = searchQuery;
            els.clearSearchBtn.classList.remove('hidden');
          } else if (cityParam) {
            searchQuery = cityParam.trim();
            els.searchInput.value = searchQuery;
            els.clearSearchBtn.classList.remove('hidden');
          }

          if (spotParam) {
            pendingSpotSlug = spotParam.trim();
          }
        } catch {
          // Ignore URL parsing issues in restricted environments
        }
      }

      function updateUrlState(targetSpotSlug) {
        try {
          const origin = window.location.origin;
          if (!origin || origin === 'null' || window.location.protocol === 'blob:') {
            return;
          }

          const url = new URL(window.location.href);
          if (activeCategory && activeCategory !== 'ALL') {
            url.searchParams.set('cat', activeCategory);
          } else {
            url.searchParams.delete('cat');
          }

          if (searchQuery && searchQuery.trim()) {
            url.searchParams.set('q', searchQuery.trim());
          } else {
            url.searchParams.delete('q');
          }
          url.searchParams.delete('city');

          if (targetSpotSlug) {
            url.searchParams.set('spot', targetSpotSlug);
          } else {
            url.searchParams.delete('spot');
          }

          window.history.replaceState({}, '', url.toString());
        } catch {
          // Skip history updates when running inside sandboxed/blob origins
        }
      }

      /* ----------------------------------------------------------------------
         2. FILTERING, SEARCH & AUTOCOMPLETE ENGINE
         ---------------------------------------------------------------------- */

      function populateCategoryFilters() {
        const counts = new Map();
        const labels = new Map();

        allPlaces.forEach((place) => {
          place.categories.forEach((cat) => {
            const key = cat.toLowerCase();
            counts.set(key, (counts.get(key) || 0) + 1);
            if (!labels.has(key)) labels.set(key, cat);
          });
        });

        const sortedKeys = Array.from(counts.keys()).sort((a, b) => a.localeCompare(b));
        const frag = document.createDocumentFragment();

        // ALL button
        const allBtn = document.createElement('button');
        allBtn.type = 'button';
        allBtn.className = 'md3-filter-chip';
        allBtn.setAttribute('aria-pressed', activeCategory === 'ALL' ? 'true' : 'false');
        allBtn.innerHTML = `<span>ALL</span><span class="chip-count">${allPlaces.length}</span>`;
        allBtn.addEventListener('click', () => setCategory('ALL'));
        frag.appendChild(allBtn);

        sortedKeys.forEach((key) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'md3-filter-chip';
          btn.setAttribute('aria-pressed', activeCategory === key ? 'true' : 'false');
          btn.innerHTML = `<span>${escapeHtml(labels.get(key))}</span><span class="chip-count">${counts.get(key)}</span>`;
          btn.addEventListener('click', () => setCategory(key));
          frag.appendChild(btn);
        });

        els.categoryFilters.innerHTML = '';
        els.categoryFilters.appendChild(frag);
      }

      function setCategory(cat) {
        const normalized = cat === 'ALL' ? 'ALL' : String(cat).toLowerCase();
        if (normalized !== 'ALL' && activeCategory === normalized) {
          activeCategory = 'ALL';
        } else {
          activeCategory = normalized;
        }
        populateCategoryFilters();
        filterPlaces();
      }

      function updateResultsSummary() {
        const total = visiblePlaces.length;
        const hasFilters = activeCategory !== 'ALL' || Boolean(searchQuery.trim());
        els.resetFiltersInlineBtn.classList.toggle('hidden', !hasFilters);

        if (total === 0) {
          els.resultsSummary.textContent = '0 places found';
        } else if (hasFilters) {
          els.resultsSummary.textContent = `${total} matching ${total === 1 ? 'place' : 'places'}`;
        } else {
          els.resultsSummary.textContent = `${total} curated places across Taiwan`;
        }
      }

      function filterPlaces() {
        const rawTokens = searchQuery
          .trim()
          .toLowerCase()
          .split(/\s+/)
          .filter(Boolean);

        visiblePlaces = allPlaces.filter((place) => {
          if (activeCategory !== 'ALL') {
            const matchesCat = place.categories.some(
              (c) => c.toLowerCase() === activeCategory
            );
            if (!matchesCat) return false;
          }

          if (rawTokens.length > 0) {
            const searchable = [
              place.title,
              place.description,
              place.categories.join(' '),
              place.city
            ]
              .join(' ')
              .toLowerCase();

            if (!rawTokens.every((tok) => searchable.includes(tok))) {
              return false;
            }
          }

          return true;
        });

        if (sortOrder === 'alpha') {
          visiblePlaces.sort((a, b) =>
            a.title.localeCompare(b.title, undefined, { sensitivity: 'base' })
          );
        }

        displayedCount = PAGE_SIZE;
        updateResultsSummary();
        updateUrlState(activeModalIndex !== -1 && visiblePlaces[activeModalIndex] ? visiblePlaces[activeModalIndex].slug : null);
        renderCards();
      }

      function toggleSortOrder() {
        sortOrder = sortOrder === 'newest' ? 'alpha' : 'newest';
        if (sortOrder === 'alpha') {
          els.sortToggleIcon.textContent = 'sort_by_alpha';
          els.sortToggleLabel.textContent = 'Sorted A–Z';
        } else {
          els.sortToggleIcon.textContent = 'sort';
          els.sortToggleLabel.textContent = 'Sorted newest first';
        }
        filterPlaces();
      }

      function buildAutocompleteIndex() {
        const seen = new Set();
        const entries = [];
        const cityCounts = new Map();

        allPlaces.forEach((p) => {
          if (p.city) {
            const key = p.city.toLowerCase();
            cityCounts.set(key, (cityCounts.get(key) || 0) + 1);
          }
        });

        const addTerm = (term, type, priority, count) => {
          const clean = String(term || '').trim().replace(/\s+/g, ' ');
          const lower = clean.toLowerCase();
          if (!clean || seen.has(lower)) return;
          seen.add(lower);
          entries.push({ term: clean, lower, type, priority, count });
        };

        // Priority 1: Cities (with spot counts)
        allPlaces.forEach((p) => {
          if (p.city) {
            addTerm(p.city, 'city', 1, cityCounts.get(p.city.toLowerCase()) || 0);
          }
        });

        // Priority 2: Categories
        allPlaces.forEach((p) => {
          p.categories.forEach((cat) => addTerm(cat, 'food', 2));
        });

        // Priority 3: Place Titles
        allPlaces.forEach((p) => {
          addTerm(p.title, 'place', 3);
        });

        // Priority 4: Non-stop words of length 3+ from titles and descriptions
        allPlaces.forEach((p) => {
          const blob = `${p.title} ${p.description}`;
          const words = blob.match(/[a-zA-Z0-9\u4e00-\u9fff]{3,}/g) || [];
          words.forEach((w) => {
            if (!STOP_WORDS.has(w.toLowerCase())) {
              addTerm(w, 'word', 4);
            }
          });
        });

        entries.sort((a, b) => a.priority - b.priority || a.term.localeCompare(b.term));
        autocompleteIndex = entries;
      }

      function triggerFeelingLucky() {
        hideAutocomplete();
        if (!allPlaces.length) return;
        const randomPlace = allPlaces[Math.floor(Math.random() * allPlaces.length)];
        activeCategory = 'ALL';
        populateCategoryFilters();
        searchQuery = randomPlace.title;
        els.searchInput.value = randomPlace.title;
        els.clearSearchBtn.classList.remove('hidden');
        filterPlaces();
        const idx = visiblePlaces.findIndex((p) => p.slug === randomPlace.slug);
        if (idx !== -1) {
          openModal(idx);
        }
      }

      function updateAutocompleteSuggestions(rawInput) {
        const query = String(rawInput || '').trim().toLowerCase();
        highlightedSuggestionIdx = -1;

        let matches = [];
        if (!query) {
          // On click/focus with empty query: list cities in reverse alphabetical order (starting from Taipei)
          matches = autocompleteIndex
            .filter((item) => item.type === 'city')
            .sort((a, b) => b.term.localeCompare(a.term));
        } else {
          matches = autocompleteIndex
            .filter((item) => item.lower.includes(query))
            .slice(0, 8);
        }

        // Always append "I Feel Lucky" at the end of the dropdown list
        const luckyItem = {
          term: 'I Feel Lucky',
          lower: 'i feel lucky',
          type: 'lucky',
          priority: 99
        };
        currentSuggestions = [...matches, luckyItem];

        const iconMap = {
          city: 'location_on',
          food: 'restaurant',
          place: 'storefront',
          word: 'tag',
          lucky: 'casino'
        };

        const badgeMap = {
          city: 'City',
          food: 'Category',
          place: 'Spot',
          word: 'Keyword',
          lucky: 'Random'
        };

        const frag = document.createDocumentFragment();
        currentSuggestions.forEach((item, idx) => {
          const li = document.createElement('li');
          li.className = 'md3-autocomplete-item';
          li.setAttribute('role', 'option');
          const isLucky = item.type === 'lucky';
          const countHtml =
            item.type === 'city' && typeof item.count === 'number'
              ? ` <span class="font-semibold" style="color: var(--md-sys-color-primary);">(${item.count})</span>`
              : '';

          li.innerHTML = `
            <span class="flex items-center gap-2.5 min-w-0">
              <span class="material-symbols-outlined ${isLucky ? 'filled' : ''} text-lg shrink-0" style="color: ${isLucky ? 'var(--md-sys-color-tertiary)' : 'var(--md-sys-color-primary)'};">
                ${iconMap[item.type] || 'search'}
              </span>
              <span class="text-sm ${isLucky ? 'font-bold' : 'font-medium'} truncate">${escapeHtml(item.term)}${countHtml}</span>
            </span>
            <span class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full shrink-0 ml-2"
              style="background-color: ${isLucky ? 'var(--md-sys-color-tertiary-container)' : 'var(--md-sys-color-surface-container)'}; color: ${isLucky ? 'var(--md-sys-color-on-tertiary-container)' : 'var(--md-sys-color-on-surface-variant)'};">
              ${badgeMap[item.type] || ''}
            </span>
          `;

          li.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            selectAutocompleteSuggestion(item);
          });

          frag.appendChild(li);
        });

        els.autocompleteList.innerHTML = '';
        els.autocompleteList.appendChild(frag);
        els.autocompleteDropdown.classList.remove('hidden');
        els.searchInput.setAttribute('aria-expanded', 'true');
      }

      function selectAutocompleteSuggestion(item) {
        if (!item) return;
        if (item.type === 'lucky') {
          triggerFeelingLucky();
          return;
        }
        els.searchInput.value = item.term;
        searchQuery = item.term;
        els.clearSearchBtn.classList.remove('hidden');
        hideAutocomplete();
        filterPlaces();
      }

      function hideAutocomplete() {
        els.autocompleteDropdown.classList.add('hidden');
        els.searchInput.setAttribute('aria-expanded', 'false');
        highlightedSuggestionIdx = -1;
      }

      function highlightAutocompleteItem(newIdx) {
        const items = els.autocompleteList.querySelectorAll('.md3-autocomplete-item');
        if (!items.length) return;

        if (newIdx < 0) newIdx = items.length - 1;
        if (newIdx >= items.length) newIdx = 0;
        highlightedSuggestionIdx = newIdx;

        items.forEach((el, i) => {
          el.classList.toggle('active', i === highlightedSuggestionIdx);
        });
        items[highlightedSuggestionIdx].scrollIntoView({ block: 'nearest' });
      }

      /* ----------------------------------------------------------------------
         3. GRID RENDERING, PAGINATION & DETAIL MODAL
         ---------------------------------------------------------------------- */

      /**
       * Creates a single square place card DOM element.
       */
      function createPlaceCardElement(place, index) {
        const card = document.createElement('article');
        card.className = 'md3-place-card group';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${place.title}${place.city ? ', ' + place.city : ''}`);

        const primaryCat = place.categories[0] || '';

        card.innerHTML = `
          <img
            src="${escapeHtml(place.photo)}"
            alt="${escapeHtml(place.title)}"
            loading="lazy"
            decoding="async"
          />
          <div class="md3-card-scrim"></div>

          <!-- Top City Pill -->
          ${
            place.city
              ? `<div class="absolute top-3.5 left-3.5 right-3.5 flex items-center justify-between gap-1 pointer-events-none">
                  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md bg-black/50 text-white border border-white/15 truncate max-w-full">
                    <span class="material-symbols-outlined filled text-sm text-emerald-300">location_on</span>
                    <span class="truncate">${escapeHtml(place.city)}</span>
                  </span>
                </div>`
              : ''
          }

          <!-- Bottom Title & Primary Category -->
          <div class="absolute bottom-0 left-0 right-0 p-4 sm:p-5 flex flex-col justify-end pointer-events-none">
            ${
              primaryCat
                ? `<span class="text-xs uppercase tracking-wider font-bold text-emerald-300 mb-1 truncate">
                    ${escapeHtml(primaryCat)}
                  </span>`
                : ''
            }
            <h3 class="text-white font-bold text-lg sm:text-xl leading-snug line-clamp-2 drop-shadow">
              ${escapeHtml(place.title)}
            </h3>
          </div>
        `;

        // Fallback image on load error
        const imgEl = card.querySelector('img');
        imgEl.addEventListener('error', function onImgError() {
          if (this.src !== FALLBACK_PHOTO) {
            this.src = FALLBACK_PHOTO;
          }
        });

        card.addEventListener('click', () => openModal(index));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openModal(index);
          }
        });

        return card;
      }

      /**
       * Clears #places-grid and renders up to displayedCount square cards using DocumentFragment.
       * Handles empty-state runner game activation when visiblePlaces.length === 0.
       */
      function renderCards() {
        els.loadingSkeleton.classList.add('hidden');
        els.placesGrid.innerHTML = '';

        if (visiblePlaces.length === 0) {
          els.placesGrid.classList.add('hidden');
          els.loadMoreContainer.classList.add('hidden');
          showEmptyState(false);
          return;
        }

        // Hide empty state and stop game when results exist
        hideEmptyState();
        els.placesGrid.classList.remove('hidden');

        const slice = visiblePlaces.slice(0, displayedCount);
        const fragment = document.createDocumentFragment();
        slice.forEach((place, idx) => {
          fragment.appendChild(createPlaceCardElement(place, idx));
        });
        els.placesGrid.appendChild(fragment);

        updatePaginationControls();
      }

      /**
       * Appends the next PAGE_SIZE (24) items from visiblePlaces to #places-grid.
       */
      function appendNextBatch() {
        if (displayedCount >= visiblePlaces.length) return;

        const start = displayedCount;
        const end = Math.min(displayedCount + PAGE_SIZE, visiblePlaces.length);
        const nextSlice = visiblePlaces.slice(start, end);

        const fragment = document.createDocumentFragment();
        nextSlice.forEach((place, offset) => {
          fragment.appendChild(createPlaceCardElement(place, start + offset));
        });

        els.placesGrid.appendChild(fragment);
        displayedCount = end;
        updateResultsSummary();
        updatePaginationControls();
      }

      function updatePaginationControls() {
        const totalVisible = visiblePlaces.length;
        const currentlyShown = Math.min(displayedCount, totalVisible);

        if (currentlyShown < totalVisible) {
          const remaining = totalVisible - currentlyShown;
          els.loadMoreContainer.classList.remove('hidden');
          els.loadMoreLabel.textContent = `Load More (${remaining} remaining)`;
        } else {
          els.loadMoreContainer.classList.add('hidden');
        }
      }

      /**
       * Opens the detail modal for visiblePlaces[index] and synchronizes the URL slug.
       */
      function openModal(index) {
        if (index < 0 || index >= visiblePlaces.length) return;
        activeModalIndex = index;
        const place = visiblePlaces[index];

        // Ensure card batch is loaded up to this index if navigated via arrow keys
        if (index >= displayedCount) {
          while (displayedCount <= index && displayedCount < visiblePlaces.length) {
            appendNextBatch();
          }
        }

        // Image with fallback
        els.modalImage.src = place.photo || FALLBACK_PHOTO;
        els.modalImage.alt = place.title;
        els.modalImage.onerror = function () {
          if (this.src !== FALLBACK_PHOTO) {
            this.src = FALLBACK_PHOTO;
          }
        };

        // Title & Counter
        els.modalTitle.textContent = place.title;
        els.modalCounter.textContent = `${index + 1} / ${visiblePlaces.length}`;

        // Prev / Next button states
        els.modalPrevBtn.disabled = visiblePlaces.length <= 1;
        els.modalNextBtn.disabled = visiblePlaces.length <= 1;

        // Clickable City Badge
        if (place.city) {
          els.modalCityBtn.classList.remove('hidden');
          els.modalCityText.textContent = place.city;
          els.modalCityBtn.onclick = () => {
            closeModal();
            activeCategory = 'ALL';
            populateCategoryFilters();
            searchQuery = place.city;
            els.searchInput.value = place.city;
            els.clearSearchBtn.classList.remove('hidden');
            filterPlaces();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        } else {
          els.modalCityBtn.classList.add('hidden');
        }

        // Clickable Category Tags
        els.modalCategories.innerHTML = '';
        place.categories.forEach((cat) => {
          const tagBtn = document.createElement('button');
          tagBtn.type = 'button';
          tagBtn.className = 'md3-filter-chip !h-8 !text-xs';
          tagBtn.setAttribute(
            'aria-pressed',
            activeCategory === cat.toLowerCase() ? 'true' : 'false'
          );
          tagBtn.textContent = cat;
          tagBtn.addEventListener('click', () => {
            closeModal();
            searchQuery = '';
            els.searchInput.value = '';
            els.clearSearchBtn.classList.add('hidden');
            setCategory(cat.toLowerCase());
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          els.modalCategories.appendChild(tagBtn);
        });

        // Description
        els.modalDescription.textContent =
          place.description ||
          `Curated recommendation in ${place.city || 'Taiwan'} from @albyantoniazzi's Taiwan Top list.`;

        // Google Maps Link (provided or dynamically constructed)
        const mapsUrl =
          place.link ||
          `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
            `${place.title} ${place.city || 'Taiwan'}`
          )}`;
        els.modalMapsLink.href = mapsUrl;

        // Show Modal
        resetShareButtonState();
        els.placeModal.classList.add('open');
        els.placeModal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        updateUrlState(place.slug);
      }

      function closeModal() {
        if (activeModalIndex === -1) return;
        activeModalIndex = -1;
        resetShareButtonState();
        els.placeModal.classList.remove('open');
        els.placeModal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        updateUrlState(null);
      }

      function stepModal(delta) {
        if (activeModalIndex === -1 || visiblePlaces.length <= 1) return;
        const nextIdx =
          (activeModalIndex + delta + visiblePlaces.length) % visiblePlaces.length;
        openModal(nextIdx);
      }

      let shareResetTimeout = null;
      function resetShareButtonState() {
        clearTimeout(shareResetTimeout);
        if (els.modalShareIcon) els.modalShareIcon.textContent = 'share';
        if (els.modalShareLabel) els.modalShareLabel.textContent = 'Share';
      }

      /**
       * Copies window.location.href to clipboard using document.execCommand('copy') fallback
       * and updates the Share button inline to 'Copied' with a 'done' icon.
       */
      function shareCurrentSpot() {
        const shareUrl = window.location.href;
        const textArea = document.createElement('textarea');
        textArea.value = shareUrl;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
          const ok = document.execCommand('copy');
          if (ok) {
            els.modalShareIcon.textContent = 'done';
            els.modalShareLabel.textContent = 'Copied';
            clearTimeout(shareResetTimeout);
            shareResetTimeout = setTimeout(resetShareButtonState, 2200);
          }
        } catch {
          // Silently fail if clipboard access is blocked
        } finally {
          document.body.removeChild(textArea);
        }
      }

      /* ----------------------------------------------------------------------
         4. EMPTY STATE & HTML5 RUNNER MINI-GAME WITH WEB AUDIO SYNTHESIS
         ---------------------------------------------------------------------- */

      function showEmptyState(isFetchError = false) {
        els.emptyState.classList.remove('hidden');

        if (isFetchError) {
          els.emptyStateTitle.textContent = 'Could not reach the Google Sheets feed';
          els.emptyStateSubtitle.textContent =
            'Check your connection or retry fetching the live directory — in the meantime, play Hot Pot Goose Run!';
          els.emptyStateSubtitle.classList.remove('hidden');
          els.retryFetchBtn.classList.remove('hidden');
          els.emptyResetBtn.classList.add('hidden');
        } else {
          els.emptyStateTitle.textContent = 'Nothing here...';
          els.emptyStateSubtitle.textContent = '';
          els.emptyStateSubtitle.classList.add('hidden');
          els.retryFetchBtn.classList.add('hidden');
          els.emptyResetBtn.classList.remove('hidden');
        }

        startDinoGame();
      }

      function hideEmptyState() {
        els.emptyState.classList.add('hidden');
        stopDinoGame();
      }

      /**
       * Synthesizes a playful duck quack sound using Web Audio API (no external audio URLs).
       */
      function playQuackSound() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioCtx) {
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          const gain = audioCtx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.05);
          osc.frequency.exponentialRampToValueAtTime(250, now + 0.16);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(950, now);
          filter.Q.setValueAtTime(3.2, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.19);
        } catch {
          // Ignore audio context restrictions
        }
      }

      // Runner Game Controller
      let gameController = null;

      function startDinoGame() {
        if (dinoGameRunning) return;
        const canvas = els.dinoCanvas;
        if (!canvas) return;

        dinoGameRunning = true;
        const ctx = canvas.getContext('2d');

        let width = 600;
        let height = 338;
        let groundY = Math.round(height * 0.82);

        // Long-necked goose player with forgiving floaty jump physics
        const player = {
          x: 52,
          y: groundY - 42,
          w: 32,
          h: 42,
          vy: 0,
          gravity: 0.56,
          jumpForce: -12.4,
          grounded: true,
          jumpBuffer: 0
        };

        let obstacles = [];

        const resizeCanvas = () => {
          const rect = canvas.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const prevGroundY = groundY;
          width = Math.max(280, Math.floor(rect.width || 600));
          height = Math.max(158, Math.round(width * (9 / 16)));
          groundY = Math.round(height * 0.82);
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const deltaY = groundY - prevGroundY;
          player.y += deltaY;
          if (player.grounded) {
            player.y = groundY - player.h;
          }
          obstacles.forEach((obs) => {
            obs.y = groundY - obs.h;
          });
        };

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let clouds = [
          { x: 140, y: Math.round(height * 0.2), s: 0.9 },
          { x: 380, y: Math.round(height * 0.14), s: 1.1 },
          { x: 540, y: Math.round(height * 0.24), s: 0.8 }
        ];
        let score = 0;
        let highScore = Number(localStorage.getItem('taiwanTopDuckHigh') || 0);
        let speed = 4.2;
        let spawnCooldown = 85;
        let isGameOver = false;
        let frameTick = 0;

        const updateScoreUI = () => {
          const s = String(Math.floor(score)).padStart(4, '0');
          const b = String(Math.floor(highScore)).padStart(4, '0');
          els.gameScoreReadout.textContent = `SCORE: ${s} · BEST: ${b}`;
        };

        const resetRun = () => {
          obstacles = [];
          score = 0;
          speed = 4.2;
          spawnCooldown = 75;
          player.y = groundY - player.h;
          player.vy = 0;
          player.grounded = true;
          player.jumpBuffer = 0;
          isGameOver = false;
          updateScoreUI();
        };

        const triggerJump = () => {
          if (isGameOver) {
            resetRun();
            playQuackSound();
            return;
          }
          if (player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
            player.jumpBuffer = 0;
            playQuackSound();
          } else {
            // Buffer jump input right before landing for responsive feel
            player.jumpBuffer = 8;
          }
        };

        const onKeyDown = (e) => {
          if (!dinoGameRunning) return;
          if (document.activeElement === els.searchInput) return;
          if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp') {
            e.preventDefault();
            e.stopPropagation();
            triggerJump();
          }
        };

        const onPointerDown = (e) => {
          e.preventDefault();
          canvas.focus();
          triggerJump();
        };

        // Capture phase ensures Space always triggers jump reliably without scrolling
        window.addEventListener('keydown', onKeyDown, true);
        canvas.addEventListener('pointerdown', onPointerDown);

        gameController = {
          cleanup() {
            window.removeEventListener('resize', resizeCanvas);
            window.removeEventListener('keydown', onKeyDown, true);
            canvas.removeEventListener('pointerdown', onPointerDown);
          }
        };

        const drawGoose = (x, y, tick, monoColor, bgColor) => {
          const p = 3; // 3px crisp pixel grid
          const px = Math.round(x);
          const py = Math.round(y);
          const step = player.grounded ? Math.floor(tick / 6) % 2 : 0;

          ctx.fillStyle = monoColor;
          const rect = (gx, gy, gw, gh) => {
            ctx.fillRect(px + gx * p, py + gy * p, gw * p, gh * p);
          };

          // Pixel Goose Head
          rect(7, 0, 3, 3);   // Head

          // Goose Beak (#FFDAD4)
          ctx.fillStyle = '#FFDAD4';
          rect(10, 1, 3, 1);  // Upper beak
          rect(10, 2, 2, 1);  // Lower beak

          // Long Pixel Neck, Body & Tail
          ctx.fillStyle = monoColor;
          rect(7, 3, 2, 5);
          rect(0, 7, 2, 1);   // Tail tip
          rect(1, 8, 8, 3);   // Upper torso
          rect(2, 11, 6, 1);  // Lower belly

          // Eye cutout (single-color negative pixel like Chrome Dino)
          ctx.fillStyle = bgColor;
          rect(8, 1, 1, 1);

          // Animated Pixel Legs (#FFDAD4)
          ctx.fillStyle = '#FFDAD4';
          if (!player.grounded) {
            rect(3, 12, 1, 2);
            rect(6, 12, 1, 2);
          } else if (step === 0) {
            rect(3, 12, 1, 2);
            rect(3, 13, 2, 1);
            rect(6, 12, 1, 1);
          } else {
            rect(3, 12, 1, 1);
            rect(6, 12, 1, 2);
            rect(6, 13, 2, 1);
          }
        };

        const drawFlamingHotPot = (obs, tick, monoColor, bgColor) => {
          const p = 3; // 3px crisp pixel grid
          const px = Math.round(obs.x);
          const py = Math.round(obs.y);
          const flamePhase = Math.floor(tick / 7) % 2;

          const rect = (gx, gy, gw, gh) => {
            ctx.fillRect(px + gx * p, py + gy * p, gw * p, gh * p);
          };

          // Pixel Flames / Steam rising from pot (#FFDAD4)
          ctx.fillStyle = '#FFDAD4';
          if (flamePhase === 0) {
            rect(2, 0, 1, 2);
            rect(5, 1, 1, 2);
            rect(7, 0, 1, 2);
          } else {
            rect(3, 1, 1, 2);
            rect(5, 0, 1, 2);
            rect(8, 1, 1, 2);
          }

          // Hot Pot Rim & Side Handles
          ctx.fillStyle = monoColor;
          rect(0, 4, 1, 1);   // Left handle
          rect(1, 3, 8, 1);   // Top rim
          rect(9, 4, 1, 1);   // Right handle

          // Cast-Iron Pot Body
          rect(1, 4, 8, 3);
          rect(2, 7, 6, 1);

          // Single-color negative pixel flame/broth detail inside pot
          ctx.fillStyle = bgColor;
          rect(3, 5, 1, 1);
          rect(6, 5, 1, 1);

          // Base Burner & Flickering Bottom Flames (#FFDAD4)
          ctx.fillStyle = '#FFDAD4';
          rect(2, 8, 1, 1);
          rect(4, 8, 2, 1);
          rect(7, 8, 1, 1);
        };

        const loop = () => {
          if (!dinoGameRunning) return;
          if (!isGameOver) {
            frameTick++;
          }

          const styles = getComputedStyle(document.documentElement);
          const surfaceColor = styles.getPropertyValue('--md-sys-color-surface-container-lowest').trim() || '#FFFFFF';
          const outlineColor = styles.getPropertyValue('--md-sys-color-outline-variant').trim() || '#BFC9C2';
          const monoColor = styles.getPropertyValue('--md-sys-color-on-surface').trim() || '#171D1A';
          const mutedColor = styles.getPropertyValue('--md-sys-color-on-surface-variant').trim() || '#3F4944';

          ctx.fillStyle = surfaceColor;
          ctx.fillRect(0, 0, width, height);

          // Pixel Clouds (single-color subtle monochrome blocks)
          ctx.fillStyle = outlineColor;
          clouds.forEach((c) => {
            if (!isGameOver) c.x -= speed * 0.22;
            if (c.x < -50) c.x = width + 40;
            const cx = Math.round(c.x);
            const cy = Math.round(c.y);
            ctx.fillRect(cx + 6, cy, 18, 3);
            ctx.fillRect(cx, cy + 3, 30, 3);
          });

          // Pixel Ground Line & Pebbles (Chrome Dino style)
          ctx.fillStyle = monoColor;
          ctx.fillRect(0, groundY, width, 2);
          for (let gx = -((frameTick * Math.round(speed)) % 48); gx < width; gx += 48) {
            ctx.fillRect(gx + 8, groundY + 5, 6, 2);
            ctx.fillRect(gx + 26, groundY + 8, 3, 2);
          }

          if (!isGameOver) {
            if (player.jumpBuffer > 0) player.jumpBuffer--;

            // Player physics
            player.vy += player.gravity;
            player.y += player.vy;
            if (player.y >= groundY - player.h) {
              player.y = groundY - player.h;
              player.vy = 0;
              player.grounded = true;
              if (player.jumpBuffer > 0) {
                player.vy = player.jumpForce;
                player.grounded = false;
                player.jumpBuffer = 0;
                playQuackSound();
              }
            }

            // Generous spacing between hot pot obstacles for smooth playability
            spawnCooldown--;
            if (spawnCooldown <= 0) {
              const potW = 30;
              const potH = 27;
              obstacles.push({
                x: width + 20,
                y: groundY - potH,
                w: potW,
                h: potH
              });
              spawnCooldown = Math.floor(88 + Math.random() * 58 - Math.min(speed * 2.2, 18));
            }

            // Update obstacles & check forgiving collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
              const obs = obstacles[i];
              obs.x -= speed;

              // Generous hitbox padding around the pixel goose body/feet
              const padX = 7;
              const padTop = 14;
              const padBottom = 4;
              if (
                player.x + padX < obs.x + obs.w - 5 &&
                player.x + player.w - padX > obs.x + 5 &&
                player.y + padTop < obs.y + obs.h - 3 &&
                player.y + player.h - padBottom > obs.y + 8
              ) {
                isGameOver = true;
                if (score > highScore) {
                  highScore = Math.floor(score);
                  localStorage.setItem('taiwanTopDuckHigh', String(highScore));
                }
              }

              if (obs.x + obs.w < -30) {
                obstacles.splice(i, 1);
              }
            }

            if (!isGameOver) {
              score += 0.16;
              speed = Math.min(7.8, 4.2 + score * 0.0025);
              if (frameTick % 4 === 0) updateScoreUI();
            }
          }

          obstacles.forEach((obs) => drawFlamingHotPot(obs, frameTick, monoColor, surfaceColor));
          drawGoose(player.x, player.y, frameTick, monoColor, surfaceColor);

          if (isGameOver) {
            ctx.fillStyle = surfaceColor;
            ctx.globalAlpha = 0.82;
            ctx.fillRect(0, 0, width, height);
            ctx.globalAlpha = 1;

            ctx.fillStyle = monoColor;
            ctx.font = '700 16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('G A M E   O V E R', width / 2, height / 2 - 8);

            ctx.font = '500 12px monospace';
            ctx.fillStyle = mutedColor;
            ctx.fillText('Press Space or Tap to restart', width / 2, height / 2 + 14);
          } else if (score < 4) {
            ctx.fillStyle = mutedColor;
            ctx.font = '500 12px monospace';
            ctx.textAlign = 'right';
            ctx.fillText('Space / Tap to jump', width - 14, 24);
          }

          dinoAnimFrameId = requestAnimationFrame(loop);
        };

        updateScoreUI();
        dinoAnimFrameId = requestAnimationFrame(loop);
      }

      function stopDinoGame() {
        dinoGameRunning = false;
        if (dinoAnimFrameId) {
          cancelAnimationFrame(dinoAnimFrameId);
          dinoAnimFrameId = null;
        }
        if (gameController) {
          gameController.cleanup();
          gameController = null;
        }
      }

      /* ----------------------------------------------------------------------
         CSV DATA FETCHING & INITIALIZATION
         ---------------------------------------------------------------------- */

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderLoadingSkeletons() {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 12; i++) {
          const div = document.createElement('div');
          div.className = 'aspect-square rounded-2xl skeleton-pulse border';
          div.style.borderColor = 'var(--md-sys-color-outline-variant)';
          frag.appendChild(div);
        }
        els.loadingSkeleton.innerHTML = '';
        els.loadingSkeleton.appendChild(frag);
      }

      async function loadCuratedPlaces() {
        els.loadingSkeleton.classList.remove('hidden');
        els.placesGrid.classList.add('hidden');
        els.emptyState.classList.add('hidden');
        els.loadMoreContainer.classList.add('hidden');
        els.resultsSummary.textContent = 'Fetching curated spots from Google Sheets…';

        try {
          const response = await fetch(CSV_URL, { cache: 'no-cache' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const csvText = await response.text();

          if (typeof Papa === 'undefined') {
            throw new Error('PapaParse library unavailable');
          }

          const parsed = Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true
          });

          const normalized = [];
          (parsed.data || []).forEach((row, idx) => {
            const place = normalizePlaceRow(row, idx);
            if (place) normalized.push(place);
          });

          if (normalized.length === 0) {
            throw new Error('Parsed 0 valid rows from CSV');
          }

          // Sort descending by BigInt Flickr photo ID so newer items appear first
          normalized.sort((a, b) => {
            if (b.flickrId > a.flickrId) return 1;
            if (b.flickrId < a.flickrId) return -1;
            return a.id - b.id;
          });

          allPlaces = normalized;
          els.headerTotalBadge.textContent = `${allPlaces.length} spots`;

          buildAutocompleteIndex();
          populateCategoryFilters();
          filterPlaces();

          // Deep-link spot modal opening if ?spot= was present in URL
          if (pendingSpotSlug) {
            const matchIdx = visiblePlaces.findIndex(
              (p) => p.slug === pendingSpotSlug
            );
            if (matchIdx !== -1) {
              openModal(matchIdx);
            } else {
              // Check allPlaces in case active filters hid the deep-linked spot
              const globalIdx = allPlaces.findIndex(
                (p) => p.slug === pendingSpotSlug
              );
              if (globalIdx !== -1) {
                activeCategory = 'ALL';
                searchQuery = '';
                els.searchInput.value = '';
                els.clearSearchBtn.classList.add('hidden');
                populateCategoryFilters();
                filterPlaces();
                openModal(globalIdx);
              }
            }
            pendingSpotSlug = null;
          }
        } catch (err) {
          console.error('Failed to load or parse Taiwan Top CSV:', err);
          els.loadingSkeleton.classList.add('hidden');
          els.headerTotalBadge.textContent = 'Offline';
          els.resultsSummary.textContent = 'Unable to load directory feed.';
          showEmptyState(true);
        }
      }

      /* ----------------------------------------------------------------------
         THEME MANAGEMENT & EVENT WIRING
         ---------------------------------------------------------------------- */

      function initTheme() {
        const saved = localStorage.getItem('taiwanTopTheme');
        const prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        const activeTheme = saved || (prefersDark ? 'dark' : 'light');
        applyTheme(activeTheme);
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        els.themeIcon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
      }

      function resetAllFilters() {
        activeCategory = 'ALL';
        searchQuery = '';
        els.searchInput.value = '';
        els.clearSearchBtn.classList.add('hidden');
        hideAutocomplete();
        populateCategoryFilters();
        filterPlaces();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function bindEventListeners() {
        // Scroll elevation for Top App Bar
        window.addEventListener(
          'scroll',
          () => {
            els.topAppBar.classList.toggle('scrolled', window.scrollY > 8);
          },
          { passive: true }
        );

        // Theme toggle
        els.themeToggleBtn.addEventListener('click', () => {
          const current =
            document.documentElement.getAttribute('data-theme') || 'light';
          const next = current === 'dark' ? 'light' : 'dark';
          localStorage.setItem('taiwanTopTheme', next);
          applyTheme(next);
        });

        // Brand / Reset actions
        els.brandResetBtn.addEventListener('click', resetAllFilters);
        els.resetFiltersInlineBtn.addEventListener('click', resetAllFilters);
        els.emptyResetBtn.addEventListener('click', resetAllFilters);
        els.retryFetchBtn.addEventListener('click', loadCuratedPlaces);
        els.sortToggleBtn.addEventListener('click', toggleSortOrder);

        // Search Input (150ms debounce) & Autocomplete Keyboard Navigation
        els.searchInput.addEventListener('input', (e) => {
          const val = e.target.value;
          els.clearSearchBtn.classList.toggle('hidden', val.length === 0);
          updateAutocompleteSuggestions(val);

          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            searchQuery = val;
            filterPlaces();
          }, 150);
        });

        els.searchInput.addEventListener('focus', () => {
          updateAutocompleteSuggestions(els.searchInput.value);
        });

        els.searchInput.addEventListener('keydown', (e) => {
          const isDropdownOpen = !els.autocompleteDropdown.classList.contains('hidden');

          if (e.key === 'ArrowDown' && isDropdownOpen) {
            e.preventDefault();
            highlightAutocompleteItem(highlightedSuggestionIdx + 1);
          } else if (e.key === 'ArrowUp' && isDropdownOpen) {
            e.preventDefault();
            highlightAutocompleteItem(highlightedSuggestionIdx - 1);
          } else if (e.key === 'Enter') {
            if (isDropdownOpen && highlightedSuggestionIdx >= 0) {
              e.preventDefault();
              selectAutocompleteSuggestion(
                currentSuggestions[highlightedSuggestionIdx]
              );
            } else {
              hideAutocomplete();
              clearTimeout(searchDebounceTimer);
              searchQuery = els.searchInput.value;
              filterPlaces();
            }
          } else if (e.key === 'Escape') {
            if (isDropdownOpen) {
              e.stopPropagation();
              hideAutocomplete();
            } else if (els.searchInput.value) {
              els.searchInput.value = '';
              searchQuery = '';
              els.clearSearchBtn.classList.add('hidden');
              filterPlaces();
            }
          }
        });

        // Close autocomplete on outside click
        document.addEventListener('pointerdown', (e) => {
          if (
            !els.autocompleteDropdown.contains(e.target) &&
            e.target !== els.searchInput
          ) {
            hideAutocomplete();
          }
        });

        // Clear search button
        els.clearSearchBtn.addEventListener('click', () => {
          els.searchInput.value = '';
          searchQuery = '';
          els.clearSearchBtn.classList.add('hidden');
          hideAutocomplete();
          filterPlaces();
          els.searchInput.focus();
        });

        // Pagination Load More button
        els.loadMoreBtn.addEventListener('click', appendNextBatch);

        // Modal controls
        els.modalCloseBtn.addEventListener('click', closeModal);
        els.modalPrevBtn.addEventListener('click', () => stepModal(-1));
        els.modalNextBtn.addEventListener('click', () => stepModal(1));
        els.modalShareBtn.addEventListener('click', shareCurrentSpot);

        // Close modal on backdrop click
        els.placeModal.addEventListener('click', (e) => {
          if (e.target === els.placeModal) {
            closeModal();
          }
        });

        // Horizontal Touch Swipes (> 50px) inside Modal
        let touchStartX = 0;
        let touchStartY = 0;
        els.modalDialogCard.addEventListener(
          'touchstart',
          (e) => {
            if (e.touches.length === 1) {
              touchStartX = e.touches[0].clientX;
              touchStartY = e.touches[0].clientY;
            }
          },
          { passive: true }
        );

        els.modalDialogCard.addEventListener(
          'touchend',
          (e) => {
            if (activeModalIndex === -1 || e.changedTouches.length !== 1) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
              if (dx < 0) {
                stepModal(1); // Swipe left -> next spot
              } else {
                stepModal(-1); // Swipe right -> previous spot
              }
            }
          },
          { passive: true }
        );

        // Global keyboard shortcuts (Modal navigation & '/' quick search focus)
        document.addEventListener('keydown', (e) => {
          if (activeModalIndex !== -1) {
            if (e.key === 'Escape') {
              e.preventDefault();
              closeModal();
            } else if (e.key === 'ArrowLeft') {
              e.preventDefault();
              stepModal(-1);
            } else if (e.key === 'ArrowRight') {
              e.preventDefault();
              stepModal(1);
            }
            return;
          }

          if (
            e.key === '/' &&
            document.activeElement !== els.searchInput &&
            !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)
          ) {
            e.preventDefault();
            els.searchInput.focus();
          }
        });
      }

      /* ----------------------------------------------------------------------
         BOOTSTRAP APPLICATION
         ---------------------------------------------------------------------- */
      initTheme();
      renderLoadingSkeletons();
      parseUrlState();
      bindEventListeners();
      loadCuratedPlaces();
    })();
  </script>
</body>
