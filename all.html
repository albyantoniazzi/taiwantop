<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaiwanTop - HTML Index</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 1px solid #eaecef;
      padding-bottom: 0.3em;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin: 8px 0;
    }
    a {
      color: #0969da;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .status {
      color: #666;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>Directory Index</h1>
  <p id="status" class="status">Loading HTML files...</p>
  <ul id="file-list"></ul>

  <script>
    const OWNER = 'albyantoniazzi';
    const REPO = 'taiwantop';
    const DIRECTORY_PATH = ''; // Leave empty for root, or set e.g. 'pages'

    async function loadHtmlFiles() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('file-list');
      const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIRECTORY_PATH}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.status}`);
        }

        const items = await response.json();

        // Filter for .html files, excluding index.html itself
        const htmlFiles = items
          .filter(item =>
            item.type === 'file' &&
            item.name.toLowerCase().endsWith('.html') &&
            item.name.toLowerCase() !== 'index.html'
          )
          .sort((a, b) => a.name.localeCompare(b.name));

        if (htmlFiles.length === 0) {
          statusEl.textContent = 'No HTML files found in this directory.';
          return;
        }

        statusEl.remove();

        htmlFiles.forEach(file => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          
          // Uses relative path so it works seamlessly on GitHub Pages
          a.href = file.name;
          a.textContent = file.name;
          
          li.appendChild(a);
          listEl.appendChild(li);
        });
      } catch (error) {
        statusEl.textContent = `Failed to load file list: ${error.message}`;
      }
    }

    loadHtmlFiles();
  </script>
</body>
</html>
