<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAIWAN TOP</title>

  <!-- Open Graph & SEO Metadata -->
  <meta name="description" content="A curated directory of places in Taiwan by @albyantoniazzi" />
  <meta property="og:title" content="TAIWAN TOP" />
  <meta property="og:description" content="A curated directory of places in Taiwan by @albyantoniazzi" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TAIWAN TOP" />
  <meta name="twitter:description" content="A curated directory of places in Taiwan by @albyantoniazzi" />
  <meta name="twitter:image" content="https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg" />

  <!-- Martian Mono Variable (Width + Weight) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PapaParse for Google Sheets CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Martian Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --ground: #ff6a0d;
      --ink: #0a0a0a;
      --paper: #ffffff;
      --muted-ink: rgba(10, 10, 10, 0.72);
      --rule: #0a0a0a;
      --ease-mech: cubic-bezier(0.3, 0, 0.15, 1);
      --ease-wipe: cubic-bezier(0.3, 0, 0.2, 1);
      --ease-stagger: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    html.dark {
      --ground: #0a0a0a;
      --ink: #ff6a0d;
      --paper: #ffffff;
      --muted-ink: rgba(255, 106, 13, 0.8);
      --rule: #ff6a0d;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background-color: var(--ground);
      color: var(--ink);
      font-family: "Martian Mono", monospace;
      font-variation-settings: "wdth" 112.5;
      font-stretch: 112.5%;
      letter-spacing: -0.04em;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar utility */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Condensed stamped index tags & status chips */
    .tr-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      padding: 0 7px;
      background: var(--ink);
      color: var(--ground);
      font-variation-settings: "wdth" 75;
      font-stretch: 75%;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tr-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      background: var(--ink);
      color: var(--paper);
      font-variation-settings: "wdth" 75;
      font-stretch: 75%;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
      text-transform: uppercase;
    }

    .tr-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: var(--ink);
      flex: none;
    }

    /* Sharp geometric chevron */
    .tr-chev {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-right: 2.5px solid currentColor;
      border-bottom: 2.5px solid currentColor;
      transform: rotate(-45deg);
      transition: transform 260ms var(--ease-mech);
    }

    /* Directional Clip-Path Inversion Layer for Autocomplete & Category Buttons */
    .tr-wipe-host {
      position: relative;
      overflow: hidden;
    }

    .tr-wipe-inv {
      position: absolute;
      inset: 0;
      background: var(--ink);
      color: var(--paper);
      clip-path: inset(0 0 100% 0);
      transition: clip-path 180ms var(--ease-wipe);
      pointer-events: none;
    }

    .tr-wipe-host:hover .tr-wipe-inv,
    .tr-wipe-host:focus-visible .tr-wipe-inv,
    .tr-wipe-host[data-highlighted="true"] .tr-wipe-inv {
      clip-path: inset(0);
    }

    .tr-wipe-host[data-dir="up"] .tr-wipe-inv {
      clip-path: inset(100% 0 0 0);
    }

    .tr-wipe-host[data-dir="up"]:hover .tr-wipe-inv,
    .tr-wipe-host[data-dir="up"]:focus-visible .tr-wipe-inv,
    .tr-wipe-host[data-dir="up"][data-highlighted="true"] .tr-wipe-inv {
      clip-path: inset(0);
    }

    .tr-wipe-inv .tr-tag {
      background: var(--ground);
      color: var(--ink);
    }

    .tr-wipe-inv .tr-chip {
      background: var(--paper);
      color: var(--ink);
    }

    /* Selected Category State: Crisp Paper Surface */
    .cat-filter-btn[data-selected="true"] {
      background: var(--paper);
      color: #0a0a0a;
      border-color: var(--ink);
    }
    .cat-filter-btn[data-selected="true"] .cat-count-chip {
      background: #0a0a0a;
      color: var(--paper);
    }

    /* Staggered Card Entrance Choreography */
    @keyframes tr-card-enter {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tr-card-enter {
      animation: tr-card-enter 220ms var(--ease-stagger) both;
      animation-delay: calc(min(var(--i, 0), 12) * 35ms);
    }

    /* Card Hover Inverse Footer Strip */
    .place-card-footer {
      background: var(--ground);
      color: var(--ink);
      border-top: 2px solid var(--ink);
      transition: background-color 180ms var(--ease-wipe), color 180ms var(--ease-wipe);
    }

    .place-card:hover .place-card-footer,
    .place-card:focus-visible .place-card-footer {
      background: var(--ink);
      color: var(--paper);
    }

    .place-card:hover .place-card-index,
    .place-card:focus-visible .place-card-index {
      background: var(--ground);
      color: var(--ink);
    }

    /* Visible High-Contrast Keyboard Focus */
    :focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 2px;
    }

    /* Reduced Motion Fallback */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body class="selection:bg-[#0a0a0a] selection:text-[#ffffff]">

  <!-- Header: Swiss Structural Directory Header & Search -->
  <header class="w-full max-w-[1920px] mx-auto pt-4 sm:pt-6 pb-4 px-3 sm:px-[10vw] border-b-2 border-[var(--rule)]">
    <div class="relative flex flex-col items-center text-center">

      <!-- Top-Right Polarity Switch (Orange Ground <-> High-Contrast Dark Mode) -->
      <div class="w-full flex items-center justify-between mb-3 text-[11px] font-bold uppercase">
        <span class="inline-flex items-center gap-2">
          <span class="tr-dot" aria-hidden="true"></span>
          <span id="header-status-code" class="font-bold tracking-tight">TW // DIRECTORY</span>
        </span>

        <button
          id="theme-toggle"
          type="button"
          title="Invert Surface Polarity"
          aria-label="Invert Surface Polarity"
          class="inline-flex items-center gap-2 px-2.5 py-1 border-2 border-[var(--rule)] bg-[var(--ground)] text-[var(--ink)] hover:bg-[var(--ink)] hover:text-[var(--paper)] transition-colors cursor-pointer"
        >
          <span class="tr-tag !h-4 !px-1.5 !text-[10px]">INV</span>
          <svg
            id="yin-yang-icon"
            class="w-4 h-4 transition-transform duration-300 select-none"
            viewBox="0 0 100 100"
            aria-hidden="true"
          >
            <rect x="4" y="4" width="92" height="92" fill="#ffffff" stroke="#0a0a0a" stroke-width="8"/>
            <rect x="50" y="4" width="46" height="92" fill="#0a0a0a"/>
          </svg>
        </button>
      </div>

      <!-- Brand Title & Creator Credit -->
      <a
        href="index.html"
        class="text-2xl sm:text-3xl italic font-bold tracking-tight leading-none text-[var(--ink)] hover:bg-[var(--paper)] hover:text-[#0a0a0a] px-2 py-1 transition-colors"
      >
        Taiwan Top
      </a>
      <p class="mt-1.5 text-[11px] sm:text-xs font-medium text-[var(--ink)]">
        by <a
          href="https://www.instagram.com/alby.food/"
          target="_blank"
          rel="noopener noreferrer"
          class="underline decoration-2 underline-offset-2 font-bold hover:bg-[var(--ink)] hover:text-[var(--paper)] px-1 transition-colors"
        >@albyantoniazzi</a>
      </p>

      <!-- Rich Search Input (Integrates Cities, Categories, Titles & Descriptions) -->
      <div class="relative w-full max-w-lg mt-4 text-left" id="search-wrapper">
        <div class="relative flex items-center border-b-2 border-[var(--rule)] bg-transparent focus-within:bg-[var(--paper)] focus-within:text-[#0a0a0a] transition-colors">
          <span class="pl-2 pr-2 inline-flex items-center pointer-events-none">
            <i class="tr-chev" aria-hidden="true"></i>
          </span>
          <label for="search-input" class="sr-only">Search places, cities, food</label>
          <input
            type="text"
            id="search-input"
            placeholder="Search places, cities, food..."
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="search-autocomplete"
            class="w-full bg-transparent border-0 rounded-none pl-1 pr-9 py-2 text-[11px] sm:text-xs font-bold text-current placeholder:italic placeholder:font-normal placeholder:text-[11px] sm:placeholder:text-xs placeholder:opacity-70 focus:outline-none"
          />
          <button
            id="clear-search-btn"
            type="button"
            aria-label="Clear search"
            class="hidden absolute right-1.5 top-1/2 -translate-y-1/2 tr-chip hover:opacity-80 cursor-pointer"
          >
            ×
          </button>
        </div>

        <!-- Sharp Zero-Radius Autocomplete Dropdown with Directional Wipe Rows -->
        <ul
          id="search-autocomplete"
          role="listbox"
          class="hidden absolute left-0 right-0 top-full mt-0 z-40 max-h-64 overflow-y-auto rounded-none bg-[var(--paper)] text-[#0a0a0a] border-2 border-t-0 border-[var(--rule)] divide-y divide-[#0a0a0a]/20 scrollbar-none"
        ></ul>
      </div>

    </div>
  </header>

  <!-- Main Grid -->
  <main class="w-full max-w-[1920px] mx-auto px-3 sm:px-[10vw] pt-4 pb-16">

    <!-- Loading State -->
    <div id="loading-state" class="py-24 flex items-center justify-center">
      <div class="inline-flex items-center gap-3 px-4 py-2 border-2 border-[var(--rule)] bg-[var(--paper)] text-[#0a0a0a] text-xs font-bold uppercase">
        <span class="w-2.5 h-2.5 bg-[#0a0a0a] animate-ping"></span>
        <span>INDEXING DIRECTORY...</span>
      </div>
    </div>

    <!-- Empty State with Goose Runner Game -->
    <div id="empty-state" class="hidden py-12 flex flex-col items-center justify-center text-center">
      <p id="empty-state-title" class="text-sm sm:text-base font-bold uppercase text-[var(--ink)] mb-3 transition-opacity duration-200">
        [00] SORRY, NOTHING HERE...
      </p>

      <div class="relative w-full max-w-xl mx-auto flex flex-col items-center border-2 border-[var(--rule)] bg-[var(--paper)] p-3">
        <canvas
          id="dino-canvas"
          width="600"
          height="160"
          class="w-full h-[160px] bg-transparent cursor-pointer border-b-2 border-[#0a0a0a] select-none touch-none"
        ></canvas>
        <div class="mt-2.5 flex items-center justify-between w-full text-[11px] font-bold text-[#0a0a0a] uppercase px-1">
          <span class="tr-tag !bg-[#0a0a0a] !text-[#ff6a0d]">RUN</span>
          <span>PRESS [SPACE] OR TAP TO JUMP</span>
        </div>
      </div>
    </div>

    <!-- Responsive Adaptive Grid: Single column on mobile, multi-column on larger screens -->
    <div id="places-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4"></div>

    <!-- Load More Simple Link -->
    <div id="load-more-container" class="hidden pt-6 pb-1 flex justify-center items-center">
      <button
        id="load-more-btn"
        type="button"
        class="py-1 text-[var(--ink)] font-bold text-xs uppercase tracking-normal hover:underline decoration-2 underline-offset-4 transition cursor-pointer focus:outline-none"
      >
        LOAD MORE&nbsp;<span class="text-xs">↓</span>
      </button>
    </div>

  </main>

  <!-- Full-Width Bottom Categories Toolbar -->
  <nav
    aria-label="Category Filters"
    class="fixed bottom-0 left-0 right-0 z-30 w-full bg-[var(--ground)] border-t-2 border-[var(--rule)] py-2"
  >
    <div
      id="category-scroll-container"
      class="w-full overflow-x-auto scrollbar-none px-3 sm:px-6"
    >
      <div class="flex items-center justify-start sm:justify-center gap-1.5 flex-nowrap min-w-max mx-auto" id="category-filters">
        <button
          type="button"
          data-category="ALL"
          data-selected="true"
          class="cat-filter-btn inline-flex items-center justify-center flex-shrink-0 h-7 px-3 font-bold text-[11px] rounded-none uppercase tracking-tight transition-colors duration-150 border-2 border-[var(--rule)] bg-[var(--ink)] text-[var(--paper)] hover:bg-[var(--paper)] hover:text-[#0a0a0a] cursor-pointer"
        >
          ALL
        </button>
      </div>
    </div>
  </nav>

  <!-- Detail Modal -->
  <div
    id="detail-modal"
    class="fixed inset-0 z-50 flex items-center justify-center p-2.5 sm:p-4 lg:p-8 bg-[#0a0a0a]/80 opacity-0 pointer-events-none transition-opacity duration-200"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
  >
    <!-- Modal Wrapper with Centered Outside Navigation Arrows -->
    <div id="modal-container" class="relative w-full max-w-lg flex items-center justify-center">

      <!-- Previous Arrow (Desktop) -->
      <button
        id="modal-prev-btn"
        type="button"
        title="Previous spot (←)"
        aria-label="Previous spot"
        class="hidden md:flex items-center justify-center absolute md:-left-14 top-1/2 -translate-y-1/2 z-30 w-10 h-10 border-2 border-[var(--paper)] bg-[#0a0a0a] text-[var(--paper)] hover:bg-[var(--ground)] hover:text-[#0a0a0a] transition disabled:opacity-20 disabled:pointer-events-none cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Next Arrow (Desktop) -->
      <button
        id="modal-next-btn"
        type="button"
        title="Next spot (→)"
        aria-label="Next spot"
        class="hidden md:flex items-center justify-center absolute md:-right-14 top-1/2 -translate-y-1/2 z-30 w-10 h-10 border-2 border-[var(--paper)] bg-[#0a0a0a] text-[var(--paper)] hover:bg-[var(--ground)] hover:text-[#0a0a0a] transition disabled:opacity-20 disabled:pointer-events-none cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2.5" d="M9 5l7 7-7 7" />
        </svg>
      </button>

      <!-- Sharp Zero-Radius Swiss Modal Card Box -->
      <div
        id="modal-card"
        class="relative w-full max-h-[92vh] flex flex-col bg-[var(--paper)] text-[#0a0a0a] border-2 border-[#0a0a0a] rounded-none overflow-hidden transform scale-95 transition-transform duration-200"
      >
        <!-- Small Top-Right Close Button -->
        <button
          id="modal-close-btn"
          type="button"
          title="Close (Esc)"
          aria-label="Close modal"
          class="absolute top-2.5 right-2.5 z-30 w-7 h-7 flex items-center justify-center rounded-none border-2 border-[#0a0a0a] bg-[#0a0a0a] text-[var(--paper)] hover:bg-[var(--ground)] hover:text-[#0a0a0a] transition-colors cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <div class="overflow-y-auto flex-1 scrollbar-none">
          <!-- Hero Photo (1:1 square crop) -->
          <div class="relative w-full aspect-square bg-[#0a0a0a] overflow-hidden border-b-2 border-[#0a0a0a]">
            <img
              id="modal-image"
              src=""
              alt=""
              class="w-full h-full object-cover object-center"
            />
          </div>

          <!-- Body Details -->
          <div class="p-3.5 sm:p-4 space-y-2 bg-[var(--paper)] text-[#0a0a0a]">
            <div>
              <div class="flex items-center gap-1.5 mb-3 flex-wrap">
                <button type="button" id="modal-city-badge" class="cursor-pointer"></button>
                <div id="modal-tags" class="flex flex-wrap items-center gap-1.5"></div>
              </div>
              <h2 id="modal-title" class="text-xl sm:text-2xl font-bold tracking-tight text-[#0a0a0a]"></h2>
            </div>

            <p id="modal-description" class="text-[11px] sm:text-xs italic leading-relaxed text-[#0a0a0a]/90 font-medium whitespace-pre-line"></p>

            <!-- External Action Button Bar: View on Google Maps left, Share Place right -->
            <div class="pt-1.5 pb-0 flex flex-wrap items-center justify-between gap-2">
              <a
                id="modal-map-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="h-8 inline-flex items-center gap-1.5 px-3 rounded-none border-2 border-[#0a0a0a] bg-[#0a0a0a] text-[var(--paper)] hover:bg-[var(--ground)] hover:text-[#0a0a0a] font-bold text-xs normal-case tracking-tight transition-colors cursor-pointer"
              >
                <span>View on Google Maps</span>
                <span class="text-xs">↗</span>
              </a>

              <button
                id="modal-share-btn"
                type="button"
                title="Copy direct link to this spot"
                aria-label="Share Place"
                class="h-8 inline-flex items-center gap-1.5 px-3 rounded-none border-2 border-[#0a0a0a] bg-transparent text-[#0a0a0a] hover:bg-[#0a0a0a] hover:text-[var(--paper)] font-bold text-xs normal-case tracking-tight transition-colors cursor-pointer"
              >
                <svg id="modal-share-copy-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span id="modal-share-check-icon" class="hidden text-xs leading-none font-bold">✔</span>
                <span id="modal-share-label">Share Place</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div
    id="toast-notification"
    class="fixed bottom-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-[#0a0a0a] text-[var(--paper)] border-2 border-[var(--paper)] text-xs font-bold rounded-none opacity-0 translate-y-3 pointer-events-none transition-all duration-200 flex items-center gap-2"
  >
    <span class="tr-tag !bg-[#ff6a0d] !text-[#0a0a0a]">OK</span>
    <span id="toast-message">Link copied to clipboard!</span>
  </div>

  <script>
    // CSV URL & Fallback Image
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv";
    const DEFAULT_FALLBACK_IMAGE = "https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCityName(str) {
      if (!str) return '';
      return str
        .split(/\s+/)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
    }

    // State Variables
    let allPlaces = [];
    let visiblePlaces = [];
    let displayedCount = 24;
    const PAGE_SIZE = 24;
    let activeCategory = "ALL";
    let searchQuery = "";
    let searchDebounceTimer = null;
    let rotationDeg = 0;
    let activeModalIndex = -1;
    let autocompleteIndex = [];
    let activeSuggestionIdx = -1;

    // DOM Elements
    const gridEl = document.getElementById("places-grid");
    const loadMoreContainer = document.getElementById("load-more-container");
    const loadMoreBtn = document.getElementById("load-more-btn");
    const loadingEl = document.getElementById("loading-state");
    const emptyEl = document.getElementById("empty-state");
    const emptyTitleEl = document.getElementById("empty-state-title");
    const categoryContainer = document.getElementById("category-filters");
    const searchWrapper = document.getElementById("search-wrapper");
    const searchInput = document.getElementById("search-input");
    const searchAutocompleteEl = document.getElementById("search-autocomplete");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const themeToggleBtn = document.getElementById("theme-toggle");
    const yinYangIcon = document.getElementById("yin-yang-icon");
    const headerStatusCode = document.getElementById("header-status-code");

    // Modal & Toast Elements
    const modalEl = document.getElementById("detail-modal");
    const modalCardEl = document.getElementById("modal-card");
    const modalImageEl = document.getElementById("modal-image");
    const modalTitleEl = document.getElementById("modal-title");
    const modalDescEl = document.getElementById("modal-description");
    const modalCityBadge = document.getElementById("modal-city-badge");
    const modalTags = document.getElementById("modal-tags");
    const modalMapLink = document.getElementById("modal-map-link");
    const modalShareBtn = document.getElementById("modal-share-btn");
    const modalShareLabel = document.getElementById("modal-share-label");
    const modalShareCopyIcon = document.getElementById("modal-share-copy-icon");
    const modalShareCheckIcon = document.getElementById("modal-share-check-icon");
    const modalPrevBtn = document.getElementById("modal-prev-btn");
    const modalNextBtn = document.getElementById("modal-next-btn");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const toastEl = document.getElementById("toast-notification");
    const toastMsg = document.getElementById("toast-message");
    let shareResetTimeout = null;

    // Extract Flickr numerical photo ID safely as BigInt
    function extractFlickrPhotoId(url) {
      if (!url || typeof url !== 'string') return 0n;
      const match = url.match(/\/(\d+)_/);
      try {
        return match ? BigInt(match[1]) : 0n;
      } catch {
        return 0n;
      }
    }

    function slugify(str) {
      return String(str || '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function showToast(message) {
      if (!toastEl || !toastMsg) return;
      toastMsg.textContent = message;
      toastEl.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toastEl.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
      }, 2400);
    }

    function createCardElement(place, index) {
      const card = document.createElement('article');
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', place.title);
      card.style.setProperty('--i', index % PAGE_SIZE);
      card.className = "place-card tr-card-enter relative aspect-square w-full rounded-none border-2 border-[var(--rule)] overflow-hidden bg-[#0a0a0a] group cursor-pointer select-none";

      const fullImageSource = place.photo || DEFAULT_FALLBACK_IMAGE;
      const safeTitle = escapeHtml(place.title);
      const safeDesc = escapeHtml(place.description);
      const indexCode = String(index + 1).padStart(2, '0');

      card.innerHTML = `
        <!-- 1:1 Square Photo -->
        <img 
          src="${escapeHtml(fullImageSource)}" 
          alt="${safeTitle}" 
          loading="lazy"
          decoding="async"
          onerror="if(this.dataset.triedOriginal!=='true'){this.dataset.triedOriginal='true';this.src='${escapeHtml(place.photo || DEFAULT_FALLBACK_IMAGE)}';}else{this.onerror=null;this.src='${DEFAULT_FALLBACK_IMAGE}';}"
          class="w-full h-full object-cover object-center group-hover:scale-[1.03] transition-transform duration-300 ease-out"
        />

        <!-- Top-Left Monospace Index Stamp -->
        <div class="place-card-index absolute top-2 left-2 z-10 tr-tag pointer-events-none transition-colors duration-150">
          #${indexCode}
        </div>

        <!-- Swiss High-Contrast Bottom Strip (Inverts on Hover/Focus) -->
        <div class="place-card-footer absolute inset-x-0 bottom-0 p-2.5 sm:p-3 flex flex-col justify-end text-left pointer-events-none">
          <h2 class="text-xs sm:text-sm font-bold tracking-tight leading-snug line-clamp-1">
            ${safeTitle}
          </h2>
          ${safeDesc ? `
            <p class="text-[11px] opacity-85 font-medium mt-0.5 line-clamp-1 leading-snug">
              ${safeDesc}
            </p>
          ` : ''}
        </div>
      `;

      // Card click & keyboard Enter/Space opens modal
      card.addEventListener('click', () => openModal(index));
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal(index);
        }
      });

      return card;
    }

    function renderCards() {
      gridEl.innerHTML = "";
      if (headerStatusCode) {
        headerStatusCode.textContent = `TW // ${String(visiblePlaces.length).padStart(3, '0')} SPOTS`;
      }

      if (visiblePlaces.length === 0) {
        emptyEl.classList.remove("hidden");
        loadMoreContainer.classList.add("hidden");
        startDinoGame();
        return;
      }

      emptyEl.classList.add("hidden");
      stopDinoGame();

      const slice = visiblePlaces.slice(0, displayedCount);
      const fragment = document.createDocumentFragment();
      slice.forEach((place, idx) => {
        fragment.appendChild(createCardElement(place, idx));
      });
      gridEl.appendChild(fragment);

      loadMoreContainer.classList.toggle("hidden", displayedCount >= visiblePlaces.length);
    }

    function appendNextBatch() {
      const start = displayedCount;
      const end = Math.min(displayedCount + PAGE_SIZE, visiblePlaces.length);
      if (start >= end) return;

      const fragment = document.createDocumentFragment();
      for (let i = start; i < end; i++) {
        fragment.appendChild(createCardElement(visiblePlaces[i], i));
      }
      gridEl.appendChild(fragment);
      displayedCount = end;

      loadMoreContainer.classList.toggle("hidden", displayedCount >= visiblePlaces.length);
    }

    function filterPlaces() {
      const q = searchQuery.toLowerCase().trim();
      const rawTokens = q.split(/\s+/).filter(Boolean);

      visiblePlaces = allPlaces.filter(place => {
        const matchesCategory = (activeCategory === "ALL") || place.categories.some(c => c.toLowerCase() === activeCategory.toLowerCase());
        const searchable = `${place.title} ${place.description} ${place.categories.join(' ')} ${place.city}`.toLowerCase();
        const matchesSearch = rawTokens.length === 0 || rawTokens.every(tok => searchable.includes(tok));
        return matchesCategory && matchesSearch;
      });

      displayedCount = PAGE_SIZE;
      renderCards();
    }

    function updateToolbarStyles() {
      const buttons = categoryContainer.querySelectorAll(".cat-filter-btn");
      buttons.forEach(btn => {
        const btnCat = btn.getAttribute("data-category");
        const isActive = btnCat.toLowerCase() === activeCategory.toLowerCase();
        btn.setAttribute("data-selected", isActive ? "true" : "false");

        if (isActive) {
          btn.className = "cat-filter-btn inline-flex items-center justify-center flex-shrink-0 h-7 px-3 font-bold text-[11px] rounded-none uppercase tracking-tight transition-colors duration-150 border-2 border-[var(--rule)] bg-[var(--paper)] text-[#0a0a0a] cursor-pointer";
        } else {
          btn.className = "cat-filter-btn inline-flex items-center justify-center flex-shrink-0 h-7 px-3 font-bold text-[11px] rounded-none uppercase tracking-tight transition-colors duration-150 border-2 border-[var(--rule)] bg-[var(--ink)] text-[var(--paper)] hover:bg-[var(--paper)] hover:text-[#0a0a0a] cursor-pointer";
        }
      });
    }

    window.setCategory = function(cat) {
      activeCategory = (activeCategory.toLowerCase() === cat.toLowerCase() && cat.toLowerCase() !== "all") ? "ALL" : cat;
      updateToolbarStyles();
      updateUrlState();
      filterPlaces();
    };

    function populateCategoryFilters() {
      const catCount = {};
      const catDisplay = {};

      allPlaces.forEach(p => {
        const seenInPlace = new Set();
        p.categories.forEach(c => {
          const clean = c.trim().replace(/\s+/g, ' ');
          const key = clean.toLowerCase();
          if (key && !seenInPlace.has(key)) {
            seenInPlace.add(key);
            catCount[key] = (catCount[key] || 0) + 1;
            if (!catDisplay[key]) catDisplay[key] = clean;
          }
        });
      });

      // Sort categories alphabetically
      const sortedKeys = Object.keys(catCount).sort((a, b) => a.localeCompare(b));

      const allBtn = categoryContainer.querySelector('[data-category="ALL"]');
      categoryContainer.innerHTML = "";
      if (allBtn) {
        allBtn.innerHTML = `<span>ALL</span><span class="cat-count-chip ml-1.5 px-1 py-0.5 text-[9px] leading-none font-extrabold bg-[var(--ground)] text-[var(--ink)]">${allPlaces.length}</span>`;
        allBtn.onclick = () => setCategory("ALL");
        categoryContainer.appendChild(allBtn);
      }

      sortedKeys.forEach(key => {
        const count = catCount[key] || 0;
        const displayLabel = catDisplay[key];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("data-category", displayLabel);
        btn.setAttribute("data-selected", "false");
        btn.className = "cat-filter-btn inline-flex items-center justify-center flex-shrink-0 h-7 px-3 font-bold text-[11px] rounded-none uppercase tracking-tight transition-colors duration-150 border-2 border-[var(--rule)] bg-[var(--ink)] text-[var(--paper)] hover:bg-[var(--paper)] hover:text-[#0a0a0a] cursor-pointer";
        btn.innerHTML = `<span>${escapeHtml(displayLabel.toUpperCase())}</span><span class="cat-count-chip ml-1.5 px-1 py-0.5 text-[9px] leading-none font-extrabold bg-[var(--ground)] text-[var(--ink)]">${count}</span>`;
        btn.onclick = () => setCategory(displayLabel);
        categoryContainer.appendChild(btn);
      });
    }

    function parseUrlState() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.has("cat")) activeCategory = params.get("cat");
        const initialCity = params.get("city");
        const initialQ = params.get("q");
        if (initialQ || initialCity) {
          searchQuery = [initialCity, initialQ].filter(Boolean).join(" ").trim();
          searchInput.value = searchQuery;
          clearSearchBtn.classList.toggle("hidden", !searchQuery);
        }
        return params.get("spot");
      } catch {
        return null;
      }
    }

    function updateUrlState(targetSpotSlug = null) {
      if (window.location.protocol === 'blob:' || !window.location.origin || window.location.origin === 'null') {
        return;
      }
      try {
        const params = new URLSearchParams();
        if (activeCategory !== "ALL") params.set("cat", activeCategory);
        if (searchQuery.trim()) params.set("q", searchQuery.trim());
        if (targetSpotSlug) params.set("spot", targetSpotSlug);

        const queryString = params.toString();
        const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
        window.history.replaceState({}, '', newUrl);
      } catch {
        // Silently catch history API access errors in constrained iframes
      }
    }

    // Modal Operations with Scroll-Lock Prevention
    window.openModal = function(index) {
      if (!visiblePlaces[index]) return;
      activeModalIndex = index;
      const place = visiblePlaces[index];

      if (shareResetTimeout) clearTimeout(shareResetTimeout);
      if (modalShareLabel) modalShareLabel.textContent = "Share Place";
      if (modalShareCopyIcon) modalShareCopyIcon.classList.remove("hidden");
      if (modalShareCheckIcon) modalShareCheckIcon.classList.add("hidden");

      document.body.style.overflow = 'hidden';

      modalImageEl.src = place.photo || DEFAULT_FALLBACK_IMAGE;
      modalImageEl.alt = place.title;
      modalTitleEl.textContent = place.title;
      modalDescEl.textContent = place.description || "No description provided for this curated spot.";

      // City Badge in Modal
      if (place.city) {
        modalCityBadge.className = "tr-tag !h-6 !px-2.5 !bg-[#0a0a0a] !text-[#ff6a0d] hover:!bg-[#ff6a0d] hover:!text-[#0a0a0a] border border-[#0a0a0a] transition-colors cursor-pointer";
        modalCityBadge.innerHTML = `<span>${escapeHtml(place.city.toUpperCase())}</span>`;
        modalCityBadge.onclick = (e) => {
          e.stopPropagation();
          searchQuery = formatCityName(place.city);
          searchInput.value = searchQuery;
          clearSearchBtn.classList.remove("hidden");
          closeModal();
          updateUrlState();
          filterPlaces();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        modalCityBadge.classList.remove("hidden");
      } else {
        modalCityBadge.classList.add("hidden");
      }

      // Categories in Modal
      modalTags.innerHTML = "";
      place.categories.forEach(cat => {
        const tagBtn = document.createElement("button");
        tagBtn.type = "button";
        tagBtn.className = "tr-tag !h-6 !px-2.5 !bg-transparent !text-[#0a0a0a] border border-[#0a0a0a] hover:!bg-[#0a0a0a] hover:!text-[#ffffff] transition-colors cursor-pointer";
        tagBtn.textContent = cat.toUpperCase();
        tagBtn.onclick = (e) => {
          e.stopPropagation();
          closeModal();
          setCategory(cat);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        modalTags.appendChild(tagBtn);
      });

      const queryMap = encodeURIComponent(`${place.title} ${place.city || 'Taiwan'}`);
      modalMapLink.href = place.link || `https://www.google.com/maps/search/?api=1&query=${queryMap}`;

      if (modalPrevBtn) modalPrevBtn.disabled = index <= 0;
      if (modalNextBtn) modalNextBtn.disabled = index >= visiblePlaces.length - 1;

      updateUrlState(place.slug);

      modalEl.classList.remove("opacity-0", "pointer-events-none");
      modalEl.setAttribute("aria-hidden", "false");
      modalCardEl.classList.remove("scale-95");
      modalCardEl.classList.add("scale-100");
    };

    window.closeModal = function() {
      activeModalIndex = -1;
      document.body.style.overflow = '';
      modalEl.classList.add("opacity-0", "pointer-events-none");
      modalEl.setAttribute("aria-hidden", "true");
      modalCardEl.classList.remove("scale-100");
      modalCardEl.classList.add("scale-95");
      updateUrlState();
    };

    function navigateModal(delta) {
      if (activeModalIndex === -1) return;
      const nextIdx = activeModalIndex + delta;
      if (nextIdx >= 0 && nextIdx < visiblePlaces.length) {
        openModal(nextIdx);
      }
    }

    // Parse CSV Data & Hydrate UI
    function processPlacesData(rows) {
      const parsedPlaces = [];

      rows.forEach((row, idx) => {
        const title = (row.Title || row.title || row.Name || row.name || "").trim();
        if (!title) return;

        const city = (row.City || row.city || row.Location || row.location || "").trim();
        const rawCats = (row.Category || row.category || row.Categories || row.categories || row.Tags || row.tags || "").trim();
        const seenCats = new Set();
        const categories = [];
        if (rawCats) {
          rawCats.split(/[,;|]+/).forEach(c => {
            const clean = c.trim().replace(/\s+/g, ' ');
            const key = clean.toLowerCase();
            if (clean && !seenCats.has(key)) {
              seenCats.add(key);
              categories.push(clean);
            }
          });
        }
        const description = (row.Description || row.description || row.Notes || row.notes || "").trim();
        const photo = (row.Photo || row.photo || row.Image || row.image || row.URL || "").trim();
        const link = (row.Link || row.link || row.Maps || row.maps || row["Google Maps"] || "").trim();

        parsedPlaces.push({
          id: idx,
          slug: slugify(title),
          title,
          city,
          categories,
          description,
          photo,
          link,
          flickrId: extractFlickrPhotoId(photo)
        });
      });

      // Sort in descending order by Flickr photo ID (highest ID / newest first)
      allPlaces = parsedPlaces.sort((a, b) => {
        if (b.flickrId > a.flickrId) return 1;
        if (b.flickrId < a.flickrId) return -1;
        return 0;
      });

      buildAutocompleteIndex();
      populateCategoryFilters();

      const deepLinkedSpotSlug = parseUrlState();
      updateToolbarStyles();
      filterPlaces();

      if (deepLinkedSpotSlug) {
        const targetIndex = visiblePlaces.findIndex(p => p.slug === deepLinkedSpotSlug);
        if (targetIndex !== -1) openModal(targetIndex);
      }

      loadingEl.classList.add("hidden");
    }

    async function fetchPlaces() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: results => processPlacesData(results.data || []),
          error: err => {
            console.error("CSV Parse Error:", err);
            loadingEl.classList.add("hidden");
            emptyEl.classList.remove("hidden");
            startDinoGame();
          }
        });
      } catch (err) {
        console.error("Fetch Error:", err);
        loadingEl.classList.add("hidden");
        emptyEl.classList.remove("hidden");
        startDinoGame();
      }
    }

    // Rich Search Autocomplete Indexing & Rendering
    function buildAutocompleteIndex() {
      const seen = new Map();
      const stopWords = new Set(["the", "and", "for", "with", "from", "that", "this", "are", "was", "have", "has", "not", "but", "you", "your", "all", "can", "into", "very", "just", "one", "out", "about"]);

      const addTerm = (label, type, priority) => {
        const clean = label.trim();
        if (!clean || clean.length < 2) return;
        const key = clean.toLowerCase();
        const existing = seen.get(key);
        if (!existing || priority < existing.priority) {
          seen.set(key, { label: clean, type, priority });
        }
      };

      allPlaces.forEach(p => {
        if (p.city) addTerm(formatCityName(p.city), "city", 1);
        p.categories.forEach(c => addTerm(c.toLowerCase(), "food", 2));
        if (p.title) addTerm(p.title, "place", 3);

        const words = `${p.title} ${p.description}`.toLowerCase().match(/[a-z0-9\u4e00-\u9fa5]{3,}/g) || [];
        words.forEach(w => {
          if (!stopWords.has(w)) addTerm(w, "word", 4);
        });
      });

      autocompleteIndex = Array.from(seen.values()).sort((a, b) => a.priority - b.priority || a.label.localeCompare(b.label));
    }

    function hideAutocomplete() {
      activeSuggestionIdx = -1;
      searchAutocompleteEl.classList.add("hidden");
      searchAutocompleteEl.innerHTML = "";
    }

    function applyAutocompleteSuggestion(suggestionLabel) {
      const currentVal = searchInput.value;
      const parts = currentVal.split(/\s+/);
      if (parts.length > 1 && currentVal.slice(-1) !== " ") {
        parts[parts.length - 1] = suggestionLabel;
        searchInput.value = parts.join(" ");
      } else {
        searchInput.value = suggestionLabel;
      }
      searchQuery = searchInput.value;
      clearSearchBtn.classList.toggle("hidden", !searchQuery);
      hideAutocomplete();
      updateUrlState();
      filterPlaces();
    }

    function renderAutocompleteSuggestions(val) {
      const raw = val.trim().toLowerCase();
      if (!raw) {
        hideAutocomplete();
        return;
      }

      const tokens = raw.split(/\s+/);
      const lastToken = tokens[tokens.length - 1];

      const topMatches = autocompleteIndex
        .filter(item => {
          const lower = item.label.toLowerCase();
          return lower.includes(raw) || (lastToken.length >= 2 && lower.startsWith(lastToken));
        })
        .slice(0, 8);

      if (topMatches.length === 0) {
        hideAutocomplete();
        return;
      }

      activeSuggestionIdx = -1;
      searchAutocompleteEl.innerHTML = "";

      topMatches.forEach((match) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.className = "tr-wipe-host px-3 py-2 text-xs font-bold text-[#0a0a0a] cursor-pointer flex items-center justify-between gap-2 select-none";

        const badgeMarkup = match.type === 'word'
          ? ''
          : `<span class="tr-tag !h-5 !px-1.5 !bg-[#0a0a0a] !text-[#ff6a0d] flex-shrink-0">${escapeHtml(match.type)}</span>`;

        const invBadgeMarkup = match.type === 'word'
          ? ''
          : `<span class="tr-tag !h-5 !px-1.5 !bg-[#ff6a0d] !text-[#0a0a0a] flex-shrink-0">${escapeHtml(match.type)}</span>`;

        li.innerHTML = `
          <span class="truncate">${escapeHtml(match.label)}</span>
          ${badgeMarkup}
          <span class="tr-wipe-inv px-3 py-2 flex items-center justify-between gap-2" aria-hidden="true">
            <span class="truncate">${escapeHtml(match.label)}</span>
            ${invBadgeMarkup}
          </span>
        `;

        li.addEventListener('mousedown', (e) => {
          e.preventDefault();
          applyAutocompleteSuggestion(match.label);
        });

        searchAutocompleteEl.appendChild(li);
      });

      searchAutocompleteEl.classList.remove('hidden');
    }

    // Debounced Search Input Events
    searchInput.addEventListener("input", () => {
      const val = searchInput.value;
      clearSearchBtn.classList.toggle("hidden", !val);
      renderAutocompleteSuggestions(val);

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchQuery = val;
        updateUrlState();
        filterPlaces();
      }, 150);
    });

    searchInput.addEventListener("keydown", (e) => {
      const items = searchAutocompleteEl.querySelectorAll("li");
      if (searchAutocompleteEl.classList.contains("hidden") || items.length === 0) return;

      const prevIdx = activeSuggestionIdx;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        activeSuggestionIdx = (activeSuggestionIdx + 1) % items.length;
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeSuggestionIdx = (activeSuggestionIdx - 1 + items.length) % items.length;
      } else if (e.key === "Enter" && activeSuggestionIdx >= 0) {
        e.preventDefault();
        const label = items[activeSuggestionIdx].querySelector("span").textContent;
        applyAutocompleteSuggestion(label);
        return;
      } else if (e.key === "Escape") {
        hideAutocomplete();
        return;
      } else {
        return;
      }

      const dir = prevIdx !== -1 && activeSuggestionIdx < prevIdx ? "up" : "down";
      items.forEach((el, i) => {
        el.setAttribute("data-dir", dir);
        el.setAttribute("data-highlighted", i === activeSuggestionIdx ? "true" : "false");
      });
    });

    document.addEventListener("click", (e) => {
      if (searchWrapper && !searchWrapper.contains(e.target)) {
        hideAutocomplete();
      }
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      hideAutocomplete();
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      updateUrlState();
      filterPlaces();
    });

    // Modal & Global Keyboard / Touch Listeners
    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl || e.target.id === "modal-container") {
        closeModal();
      }
    });

    if (modalPrevBtn) modalPrevBtn.addEventListener("click", (e) => { e.stopPropagation(); navigateModal(-1); });
    if (modalNextBtn) modalNextBtn.addEventListener("click", (e) => { e.stopPropagation(); navigateModal(1); });
    if (modalCloseBtn) modalCloseBtn.addEventListener("click", (e) => { e.stopPropagation(); closeModal(); });

    if (modalShareBtn) {
      modalShareBtn.addEventListener("click", () => {
        const tempInput = document.createElement("input");
        tempInput.value = window.location.href;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          document.execCommand("copy");
          if (modalShareLabel) modalShareLabel.textContent = "Copied";
          if (modalShareCopyIcon) modalShareCopyIcon.classList.add("hidden");
          if (modalShareCheckIcon) modalShareCheckIcon.classList.remove("hidden");
          if (shareResetTimeout) clearTimeout(shareResetTimeout);
          shareResetTimeout = setTimeout(() => {
            if (modalShareLabel) modalShareLabel.textContent = "Share Place";
            if (modalShareCopyIcon) modalShareCopyIcon.classList.remove("hidden");
            if (modalShareCheckIcon) modalShareCheckIcon.classList.add("hidden");
          }, 2200);
        } catch {
          // Silently ignore if copy command fails
        }
        document.body.removeChild(tempInput);
      });
    }

    // Touch Swipe Support inside Modal
    let touchStartX = 0;
    modalCardEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    modalCardEl.addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 50) {
        navigateModal(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if (activeModalIndex !== -1) {
        if (e.key === "Escape") closeModal();
        else if (e.key === "ArrowLeft") navigateModal(-1);
        else if (e.key === "ArrowRight") navigateModal(1);
      }
    });

    // 404 Mini-Game: Long-Necked Goose Runner with Web Audio Quack
    const dinoCanvas = document.getElementById("dino-canvas");
    const dinoCtx = dinoCanvas ? dinoCanvas.getContext("2d") : null;
    let gameLoopId = null;
    let gameRunning = false;
    let gameOver = false;
    let gameScore = 0;
    let gameSpeed = 4.2;
    let frameTick = 0;
    let audioCtx = null;

    const goose = {
      x: 48,
      y: 112,
      w: 28,
      h: 34,
      vy: 0,
      gravity: 0.58,
      jumpPower: -8.8,
      grounded: true
    };
    let obstacles = [];

    function playQuackSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(210, now + 0.14);

        filter.type = "bandpass";
        filter.frequency.setValueAtTime(950, now);
        filter.Q.setValueAtTime(3.2, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.17);
      } catch {
        // Ignore audio errors if blocked
      }
    }

    function resetDinoGame() {
      goose.y = 112;
      goose.vy = 0;
      goose.grounded = true;
      obstacles = [];
      gameScore = 0;
      gameSpeed = 4.2;
      gameOver = false;
      gameRunning = true;
      if (emptyTitleEl) emptyTitleEl.classList.add("opacity-0");
    }

    function jumpGoose() {
      if (emptyEl.classList.contains("hidden")) return;
      if (!gameRunning || gameOver) {
        resetDinoGame();
      }
      if (goose.grounded) {
        goose.vy = goose.jumpPower;
        goose.grounded = false;
        playQuackSound();
      }
    }

    function spawnObstacle() {
      const types = ["hotpot", "flame", "oven"];
      const type = types[Math.floor(Math.random() * types.length)];
      const specs = {
        hotpot: { w: 28, h: 24 },
        flame: { w: 20, h: 28 },
        oven: { w: 30, h: 30 }
      };
      const spec = specs[type];
      obstacles.push({
        x: 620,
        y: 146 - spec.h,
        w: spec.w,
        h: spec.h,
        type
      });
    }

    function drawGoose(ctx, ink) {
      const x = Math.round(goose.x);
      const y = Math.round(goose.y);
      ctx.fillStyle = ink;

      // Body
      ctx.fillRect(x, y + 14, 18, 11);
      ctx.fillRect(x - 3, y + 12, 5, 5);

      // Long Upright Neck & Head
      ctx.fillRect(x + 13, y + 2, 5, 14);
      ctx.fillRect(x + 13, y, 9, 6);

      // Beak
      ctx.fillStyle = "#ff6a0d";
      ctx.fillRect(x + 22, y + 2, 6, 3);

      // Eye
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x + 18, y + 1, 2, 2);

      // Animated Legs
      ctx.fillStyle = "#ff6a0d";
      const step = goose.grounded ? Math.floor(frameTick / 5) % 2 : 0;
      if (step === 0) {
        ctx.fillRect(x + 5, y + 25, 2, 9);
        ctx.fillRect(x + 12, y + 25, 2, 6);
      } else {
        ctx.fillRect(x + 5, y + 25, 2, 6);
        ctx.fillRect(x + 12, y + 25, 2, 9);
      }
    }

    function drawObstacle(ctx, obs, ink) {
      const x = Math.round(obs.x);
      const y = Math.round(obs.y);
      const flicker = Math.floor(frameTick / 4) % 2 === 0;

      if (obs.type === "hotpot") {
        ctx.fillStyle = ink;
        ctx.fillRect(x + 3, y + 5, 22, 13);
        ctx.fillRect(x, y + 7, 3, 4);
        ctx.fillRect(x + 25, y + 7, 3, 4);
        ctx.fillStyle = "#ff6a0d";
        ctx.fillRect(x + 7, y + 19, 14, flicker ? 5 : 3);
      } else if (obs.type === "flame") {
        ctx.fillStyle = ink;
        ctx.fillRect(x + 2, y + 23, 16, 5);
        ctx.fillStyle = "#ff6a0d";
        ctx.fillRect(x + 4, y + 8, 12, 15);
        ctx.fillRect(x + 7, y + (flicker ? 1 : 4), 6, 8);
      } else {
        ctx.fillStyle = ink;
        ctx.fillRect(x + 4, y, 22, 6);
        ctx.fillRect(x, y + 6, 30, 24);
        ctx.fillStyle = "#ff6a0d";
        ctx.fillRect(x + 9, y + 16, 12, flicker ? 14 : 12);
      }
    }

    function updateDinoGame() {
      if (!dinoCtx || emptyEl.classList.contains("hidden")) {
        gameLoopId = null;
        return;
      }

      const ink = "#0a0a0a";
      dinoCtx.clearRect(0, 0, dinoCanvas.width, dinoCanvas.height);

      // Ground line
      dinoCtx.fillStyle = ink;
      dinoCtx.fillRect(0, 146, dinoCanvas.width, 2);

      if (gameRunning && !gameOver) {
        frameTick++;
        goose.vy += goose.gravity;
        goose.y += goose.vy;

        if (goose.y >= 112) {
          goose.y = 112;
          goose.vy = 0;
          goose.grounded = true;
        }

        if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 360 - Math.random() * 140) {
          spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= gameSpeed;
          if (obs.x + obs.w < 0) {
            obstacles.splice(i, 1);
            gameScore++;
            gameSpeed = Math.min(8.2, 4.2 + gameScore * 0.12);
            continue;
          }

          if (
            goose.x + 4 < obs.x + obs.w - 4 &&
            goose.x + goose.w - 6 > obs.x + 4 &&
            goose.y + 4 < obs.y + obs.h - 2 &&
            goose.y + goose.h - 2 > obs.y + 4
          ) {
            gameOver = true;
            gameRunning = false;
            if (emptyTitleEl) emptyTitleEl.classList.remove("opacity-0");
          }
        }
      }

      drawGoose(dinoCtx, ink);
      obstacles.forEach(obs => drawObstacle(dinoCtx, obs, ink));

      // HUD Score
      dinoCtx.fillStyle = ink;
      dinoCtx.font = "bold 11px 'Martian Mono', monospace";
      dinoCtx.textAlign = "right";
      dinoCtx.fillText(`SCORE ${String(gameScore).padStart(3, "0")}`, dinoCanvas.width - 12, 20);

      if (gameOver) {
        dinoCtx.textAlign = "center";
        dinoCtx.fillText("GAME OVER — TAP OR SPACE TO RETRY", dinoCanvas.width / 2, 74);
      }

      gameLoopId = requestAnimationFrame(updateDinoGame);
    }

    function startDinoGame() {
      if (!dinoCanvas || gameLoopId) return;
      gameLoopId = requestAnimationFrame(updateDinoGame);
    }

    function stopDinoGame() {
      if (gameLoopId) {
        cancelAnimationFrame(gameLoopId);
        gameLoopId = null;
      }
      gameRunning = false;
      if (emptyTitleEl) emptyTitleEl.classList.remove("opacity-0");
    }

    if (dinoCanvas) {
      dinoCanvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        jumpGoose();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && document.activeElement !== searchInput && !emptyEl.classList.contains("hidden")) {
        e.preventDefault();
        jumpGoose();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopDinoGame();
      } else if (!emptyEl.classList.contains("hidden")) {
        startDinoGame();
      }
    });

    // Theme Initialization & Polarity Toggle (Defaults to Safety Orange Ground)
    function initTheme() {
      const savedTheme = localStorage.getItem("taiwantop-theme");
      const isDark = savedTheme === "dark";
      document.documentElement.classList.toggle("dark", isDark);
      rotationDeg = isDark ? 180 : 0;
      if (yinYangIcon) yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("taiwantop-theme", isDark ? "dark" : "light");
        rotationDeg += 180;
        if (yinYangIcon) yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;
      });
    }

    loadMoreBtn.addEventListener("click", () => {
      appendNextBatch();
    });

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      fetchPlaces();
    });
  </script>
</body>
</html>
