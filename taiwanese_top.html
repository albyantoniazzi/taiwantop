    :root {
      --bg-canvas: #0b0b0c;
      --bg-card: #141416;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(255, 255, 255, 0.28);
      --text-primary: #f4f4f6;
      --text-secondary: #9898a0;
      --accent-jade: #38d9a9;
      --accent-amber: #f59f00;

    * {
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-primary);

    }

    .font-cjk-thin {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 300;
    }

    /* Subtle architectural dot matrix background that shifts with pan */
    #grid-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.11) 1px, transparent 1px);
      background-size: 36px 36px;
      z-index: 0;
      will-change: background-position, background-size;
    }

    /* Ambient vignette for depth */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 48%, rgba(5, 5, 7, 0.82) 100%);
      z-index: 2;
    }

    /* Infinite Viewport */
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      z-index: 1;
      touch-action: none;
    }

    #viewport.is-dragging {
      cursor: grabbing;
    }

    #world-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      will-change: transform;
    }

    /* Spatial Card Tile */
    .spatial-card {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 20px 44px -12px rgba(0, 0, 0, 0.78), 0 0 0 1px rgba(255,255,255,0.03);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform, opacity;
    }

    .spatial-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 28px 58px -12px rgba(0, 0, 0, 0.9), 0 0 24px rgba(56, 217, 169, 0.14);
      z-index: 20;
    }

    .spatial-card .card-media {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #1a1a1e;
    }

    .spatial-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .spatial-card:hover img {
      transform: scale(1.06);
    }

    /* Glassmorphic Floating HUD */
    .hud-glass {
      background: rgba(16, 16, 19, 0.72);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    /* Custom Scrollbar inside modal */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 99px;
    }

    /* Filter Pill Active State */
    .filter-pill.active {
      background: #f4f4f6;
      color: #0b0b0c;
      border: 1px solid #f4f4f6;
      font-weight: 600;
    }

    .filter-pill.active:hover {
      background: #ffffff;
      color: #0b0b0c;
    }

    .filter-pill:not(.active) {
      background: rgba(11, 11, 12, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .filter-pill:not(.active):hover {
      background: rgba(11, 11, 12, 0.82);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    /* Hide scrollbar on bottom category dock while preserving smooth horizontal scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    /**
     * RFC-4180 compliant CSV parser supporting quoted multiline fields & escaped quotes
     */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (char === '"' && next === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            field += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            row.push(field.trim());
            field = '';
          } else if (char === '\r' && next === '\n') {
            row.push(field.trim());
            rows.push(row);
            row = [];
            field = '';
            i++;
          } else if (char === '\n' || char === '\r') {
            row.push(field.trim());
            rows.push(row);
            row = [];
            field = '';
          } else {
            field += char;
          }
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        rows.push(row);
      }

      return rows.filter(r => r.some(cell => cell !== ''));
    }

      const rawCategory = getCol(['category', 'categories', 'type', 'tag', '分類', '類別']) || 'Curated';
      const categories = rawCategory
        .split(',')
        .map(c => c.trim())
        .filter(Boolean);
      const description = getCol(['description', 'desc', 'notes', 'note', 'review', 'about', 'summary', '簡介', '備註']) ||
        `Curated destination in ${city}, Taiwan.`;
      const rawImage = getCol(['image', 'photo', 'img', 'pic', 'picture', 'thumbnail', 'flickr', '照片', '圖片']) ||
        FALLBACK_PLACES[index % FALLBACK_PLACES.length].image;
      const mapsUrl = getCol(['map', 'google', 'link', 'url', 'coords', '地圖']) ||
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${title} ${city} Taiwan`)}`;
      const coords = getCol(['coord', 'lat', 'gps']) || '';

      return {
        id: index + 1,
        title,
        city,
        categories: categories.length ? categories : ['Curated'],
        category: categories[0] || 'Curated',
        coords,
        description,
        image: rawImage,
        modalImage: rawImage,
        mapsUrl,
        aspectRatio: 0.92
      };
    }

    /**
     * Preload image dimensions to preserve original uncropped aspect ratios in the masonry grid
     */
    function preloadPlaceAspectRatio(place) {
      return new Promise((resolve) => {
        if (!place.image) {
          resolve();
          return;
        }
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth > 0 && img.naturalHeight > 0) {
            const rawRatio = img.naturalHeight / img.naturalWidth;
            place.aspectRatio = Math.max(0.55, Math.min(1.85, rawRatio));
          }
          resolve();
        };
        img.onerror = () => {
          place.aspectRatio = 0.92;
          resolve();
        };
        img.src = place.image;
      });
    }

    /**
     * Fetch published Google Sheets CSV, parse places, preload aspect ratios, and initialize view
     */
    async function loadDatabase() {
      let loadedPlaces = [];

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length >= 2) {
          const headers = rows[0].map(h => h.toLowerCase().trim());
          loadedPlaces = rows.slice(1)
            .filter(r => r.some(cell => cell.trim() !== ''))
            .map((cells, idx) => mapRowToPlace(headers, cells, idx));
        }
      } catch (err) {
        console.warn('Falling back to curated dataset:', err);
      }

      if (loadedPlaces.length === 0) {
        loadedPlaces = FALLBACK_PLACES.map(p => ({ ...p, aspectRatio: 0.92 }));
      }

      state.places = loadedPlaces;
      state.filteredPlaces = [...loadedPlaces];

      // Preload first batch immediately for crisp initial masonry proportions
      await Promise.all(loadedPlaces.slice(0, 14).map(preloadPlaceAspectRatio));

      buildCategoryBar();
      rebuildSpatialBlueprint();

      // Center initial viewport on the first cluster
      if (state.slots.length > 0) {
        const firstSlot = state.slots[0];
        state.camX = -(firstSlot.baseX + firstSlot.width * 0.5);
        state.camY = -(firstSlot.baseY + firstSlot.height * 0.5);
        state.targetX = state.camX;
        state.targetY = state.camY;
      }

      // Check for ?place= deep link
      try {
        const params = new URLSearchParams(window.location.search);
        const sharedSlug = params.get('place');
        if (sharedSlug) {
          const matchIdx = state.filteredPlaces.findIndex(
            p => slugifyPlace(p.title) === sharedSlug || String(p.id) === sharedSlug
          );
          if (matchIdx !== -1) {
            flyToPlace(matchIdx);
            openDetailModal(matchIdx);
          }
        }
      } catch (e) {
        // Ignore URL parsing errors
      }

      // Progressively measure remaining photos in the background
      if (loadedPlaces.length > 14) {
        Promise.all(loadedPlaces.slice(14).map(preloadPlaceAspectRatio)).then(() => {
          rebuildSpatialBlueprint();
        });
      }
    }

    /**
     * Build uniform masonry blueprint with equal 14px spacing and interleaved empty architectural boxes when sparse
     */
    function rebuildSpatialBlueprint() {
      const gap = 14;
      const isMobile = window.innerWidth < 640;
      const colWidth = isMobile ? 220 : 286;
      const cols = isMobile ? 4 : 6;
      const colHeights = new Array(cols).fill(0);

      const items = state.filteredPlaces;
      const minSlots = Math.max(items.length, cols * 3);
      const slots = [];

      // Interleave real photo indices with empty placeholder slots evenly across the grid
      const slotAssignments = new Array(minSlots).fill(-1);
      if (items.length > 0 && items.length < minSlots) {
        const stride = minSlots / items.length;
        const usedPositions = new Set();
        for (let idx = 0; idx < items.length; idx++) {
          const jitter = ((idx * 7) % 3) - 1;
          let pos = Math.round(idx * stride + (idx % 2 === 1 ? 1 : 0) + jitter * 0.4);
          pos = ((pos % minSlots) + minSlots) % minSlots;
          while (usedPositions.has(pos)) {
            pos = (pos + 1) % minSlots;
          }
          usedPositions.add(pos);
          slotAssignments[pos] = idx;
        }
      } else {
        for (let idx = 0; idx < items.length; idx++) {
          slotAssignments[idx] = idx;
        }
      }

      for (let i = 0; i < minSlots; i++) {
        // Pick shortest column for uniform masonry packing
        let shortestCol = 0;
        for (let c = 1; c < cols; c++) {
          if (colHeights[c] < colHeights[shortestCol]) shortestCol = c;
        }

        const placeIdx = slotAssignments[i];
        const isEmpty = placeIdx === -1;
        const place = isEmpty ? null : items[placeIdx];
        const ratio = isEmpty ? (0.78 + ((i * 31) % 38) / 100) : (place.aspectRatio || 0.92);
        const height = Math.round(colWidth * ratio);

        const baseX = shortestCol * (colWidth + gap);
        const baseY = colHeights[shortestCol];

        slots.push({
          slotIndex: i,
          isEmpty,
          placeIndex: placeIdx,
          place,
          baseX,
          baseY,
          width: colWidth,
          height
        });

        colHeights[shortestCol] += height + gap;
      }

      // Normalize column bottoms so vertical wrap seam maintains uniform 14px spacing
      const maxColHeight = Math.max(...colHeights, 600);
      state.sectorW = cols * (colWidth + gap);
      state.sectorH = maxColHeight;

      // Clear existing DOM tiles so updated slots render cleanly
      state.tilePool.forEach(el => el.remove());
      state.tilePool.clear();
      state.slots = slots;
    }

    /**
     * Smoothly pan camera to center a specific filtered place index
     */
    function flyToPlace(index) {
      if (!state.slots || state.slots.length === 0) return;
      const slot = state.slots.find(s => !s.isEmpty && s.placeIndex === index) || state.slots[0];
      if (!slot) return;

      pauseAmbientDrift(1600);
      state.velX = 0;
      state.velY = 0;
      state.targetX = -(slot.baseX + slot.width * 0.5);
      state.targetY = -(slot.baseY + slot.height * 0.5);
    }

    /**
     * Temporarily pause the gentle ambient flow while the user is interacting
     */
    function pauseAmbientDrift(delayMs = 1100) {
      state.driftFactor = 0;
      state.driftResumeAt = performance.now() + delayMs;
    }

    /**
     * Wrap Traditional/Simplified Chinese character sequences in a thin Noto Sans TC span
     */
    function formatCJKThin(text) {
      if (!text) return '';
      const escaped = String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return escaped.replace(/([\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]+)/g, '<span class="font-cjk-thin">$1</span>');
    }

    /**
     * Create URL-safe slug for shareable place links
     */
    function slugifyPlace(title) {
      return String(title || '')
        .toLowerCase()
        .trim()
        .replace(/[^\w\u4e00-\u9fff-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    /**
     * Sync URL query string (?place=...) when opening/closing the detail modal
     */
    function updateShareableUrl(place) {
      try {
        const url = new URL(window.location.href);
        if (place) {
          url.searchParams.set('place', slugifyPlace(place.title) || String(place.id));
        } else {
          url.searchParams.delete('place');
        }
        window.history.replaceState({}, '', url.toString());
      } catch (e) {
        // Ignore history errors in sandboxed iframes
      }
    }

    /**
     * Build individual comma-separated category badges in the bottom toolbar
     */
    function buildCategoryBar() {
      const bar = document.getElementById('category-bar');
      if (!bar) return;

      const counts = new Map();
      state.places.forEach(place => {
        (place.categories || []).forEach(cat => {
          const clean = cat.trim();
          if (clean) counts.set(clean, (counts.get(clean) || 0) + 1);
        });
      });

      const sortedCats = Array.from(counts.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

      let html = `
        <button data-category="ALL" class="filter-pill ${state.activeCategory === 'ALL' && state.activeCity === 'ALL' ? 'active' : ''} font-mono-tech text-[11px] uppercase tracking-wider h-11 px-4 rounded-full text-zinc-200 transition whitespace-nowrap inline-flex items-center cursor-pointer">
          <span>All<sup class="opacity-65 text-[8px] leading-none ml-0.5 font-normal">${state.places.length}</sup></span>
        </button>
      `;

      if (state.activeCity !== 'ALL') {
        html += `
          <button data-clear-city="1" class="filter-pill active font-mono-tech text-[11px] uppercase tracking-wider h-11 px-4 rounded-full transition whitespace-nowrap flex items-center gap-1.5 cursor-pointer">
            <span>📍 ${state.activeCity}</span>
            <span class="text-[10px] opacity-75">✕</span>
          </button>
        `;
      }

      sortedCats.forEach(([cat, count]) => {
        const isActive = state.activeCategory === cat;
        html += `
          <button data-category="${cat.replace(/"/g, '&quot;')}" class="filter-pill ${isActive ? 'active' : ''} font-mono-tech text-[11px] uppercase tracking-wider h-11 px-4 rounded-full text-zinc-200 transition whitespace-nowrap inline-flex items-center cursor-pointer">
            <span>${cat}<sup class="opacity-65 text-[8px] leading-none ml-0.5 font-normal">${count}</sup></span>
          </button>
        `;
      });

      bar.innerHTML = html;

      bar.querySelectorAll('[data-category]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.getAttribute('data-category');
          state.activeCategory = cat;
          if (cat === 'ALL') state.activeCity = 'ALL';
          buildCategoryBar();
          applyFilters(true);
        });
      });

      const clearCityBtn = bar.querySelector('[data-clear-city]');
      if (clearCityBtn) {
        clearCityBtn.addEventListener('click', () => {
          state.activeCity = 'ALL';
          buildCategoryBar();
          applyFilters(true);
        });
      }
    }

    /**
     * Filter places by active category, city, and search query, then rebuild masonry
     */
    function applyFilters(shouldFly = false) {
      const q = state.searchQuery.trim().toLowerCase();

      state.filteredPlaces = state.places.filter(place => {
        const matchesCat = state.activeCategory === 'ALL' || (place.categories || []).includes(state.activeCategory);
        const matchesCity = state.activeCity === 'ALL' || place.city.toLowerCase() === state.activeCity.toLowerCase();
        const matchesSearch = !q ||
          place.title.toLowerCase().includes(q) ||
          place.city.toLowerCase().includes(q) ||
          (place.categories || []).some(c => c.toLowerCase().includes(q)) ||
          place.description.toLowerCase().includes(q);
        return matchesCat && matchesCity && matchesSearch;
      });

      rebuildSpatialBlueprint();

      if (shouldFly && state.filteredPlaces.length > 0) {
        flyToPlace(0);
      }
    }

    /**
     * Render live autocomplete dropdown for categories, cities, and place names from CSV
     */
    function renderAutocomplete(query) {
      const dropdown = document.getElementById('autocomplete-dropdown');
      const q = query.trim().toLowerCase();
      if (!q) {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';
        return;
      }

      const matchingCategories = Array.from(
        new Set(
          state.places
            .flatMap(p => p.categories || [])
            .map(c => c.trim())
            .filter(c => c && c.toLowerCase().includes(q))
        )
      ).slice(0, 4);

      const matchingCities = Array.from(
        new Set(
          state.places
            .map(p => p.city)
            .filter(c => c && c.toLowerCase().includes(q))
        )
      ).slice(0, 3);

      const matchingPlaces = state.places
        .filter(p => p.title.toLowerCase().includes(q) || p.city.toLowerCase().includes(q))
        .slice(0, 6);

      if (matchingCategories.length === 0 && matchingCities.length === 0 && matchingPlaces.length === 0) {
        dropdown.innerHTML = `<div class="px-3 py-2.5 text-xs font-mono-tech text-zinc-400">No matches found</div>`;
        dropdown.classList.remove('hidden');
        return;
      }

      let html = '';

      matchingCategories.forEach(cat => {
        const count = state.places.filter(p => (p.categories || []).includes(cat)).length;
        html += `
          <button type="button" data-ac-cat="${cat.replace(/"/g, '&quot;')}" class="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 transition flex items-center justify-between gap-2 text-xs font-mono-tech text-amber-300">
            <span class="truncate"># ${cat} <sup class="opacity-70 text-[9px]">${count}</sup></span>
            <span class="text-[10px] text-zinc-400 uppercase shrink-0">Category</span>
          </button>
        `;
      });

      matchingCities.forEach(city => {
        html += `
          <button type="button" data-ac-city="${city.replace(/"/g, '&quot;')}" class="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 transition flex items-center justify-between gap-2 text-xs font-mono-tech text-emerald-300">
            <span class="truncate">📍 ${city}</span>
            <span class="text-[10px] text-zinc-400 uppercase shrink-0">City</span>
          </button>
        `;
      });

      matchingPlaces.forEach(place => {
        html += `
          <button type="button" data-ac-id="${place.id}" class="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 transition flex items-center justify-between gap-2">
            <div class="truncate">
              <div class="text-xs text-white truncate">${formatCJKThin(place.title)}</div>
              <div class="text-[10px] font-mono-tech text-zinc-400 truncate">${place.city}</div>
            </div>
            <span class="text-[10px] font-mono-tech text-zinc-500 shrink-0">→</span>
          </button>
        `;
      });

      dropdown.innerHTML = html;
      dropdown.classList.remove('hidden');

      dropdown.querySelectorAll('[data-ac-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.getAttribute('data-ac-cat');
          state.activeCategory = cat;
          state.activeCity = 'ALL';
          state.searchQuery = '';
          document.getElementById('search-input').value = '';
          document.getElementById('clear-search-btn').classList.add('hidden');
          dropdown.classList.add('hidden');
          buildCategoryBar();
          applyFilters(true);
        });
      });

      dropdown.querySelectorAll('[data-ac-city]').forEach(btn => {
        btn.addEventListener('click', () => {
          const city = btn.getAttribute('data-ac-city');
          state.activeCity = city;
          state.activeCategory = 'ALL';
          state.searchQuery = '';
          document.getElementById('search-input').value = '';
          document.getElementById('clear-search-btn').classList.add('hidden');
          dropdown.classList.add('hidden');
          buildCategoryBar();
          applyFilters(true);
        });
      });

      dropdown.querySelectorAll('[data-ac-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.getAttribute('data-ac-id'));
          state.activeCategory = 'ALL';
          state.activeCity = 'ALL';
          state.searchQuery = '';
          document.getElementById('search-input').value = '';
          document.getElementById('clear-search-btn').classList.add('hidden');
          dropdown.classList.add('hidden');
          buildCategoryBar();
          applyFilters(false);

          const idx = state.filteredPlaces.findIndex(p => p.id === id);
          if (idx !== -1) {
            flyToPlace(idx);
            openDetailModal(idx);
          }
        });
      });
    }

    /**
     * Open detail lightbox modal for a filtered place index
     */
    function openDetailModal(index) {
      const place = state.filteredPlaces[index];
      if (!place) return;

      state.activeModalIndex = index;
      pauseAmbientDrift(2000);
      updateShareableUrl(place);

      const modal = document.getElementById('detail-modal');
      document.getElementById('modal-img').src = place.modalImage || place.image;
      document.getElementById('modal-img').alt = place.title;
      document.getElementById('modal-title').innerHTML = formatCJKThin(place.title);
      document.getElementById('modal-city-text').textContent = place.city;
      document.getElementById('modal-coords').textContent = place.coords || '';
      document.getElementById('modal-desc').textContent = place.description;
      document.getElementById('modal-map-link').href = place.mapsUrl;
      document.getElementById('modal-share-text').textContent = 'Share';

      const catContainer = document.getElementById('modal-category');
      catContainer.innerHTML = (place.categories || []).map(cat => `
        <button
          type="button"
          data-modal-cat="${cat.replace(/"/g, '&quot;')}"
          class="hud-glass font-mono-tech text-[11px] uppercase tracking-wider h-9 px-3.5 rounded-full text-zinc-200 hover:bg-white hover:text-black transition cursor-pointer"
        >${cat}</button>
      `).join('');

      catContainer.querySelectorAll('[data-modal-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          const selectedCat = btn.getAttribute('data-modal-cat');
          closeDetailModal();
          state.activeCategory = selectedCat;
          state.activeCity = 'ALL';
          buildCategoryBar();
          applyFilters(true);
        });
      });

      const cityBtn = document.getElementById('modal-city-btn');
      cityBtn.onclick = () => {
        closeDetailModal();
        state.activeCity = place.city;
        state.activeCategory = 'ALL';
        buildCategoryBar();
        applyFilters(true);
      };

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    /**
     * Close detail modal and resume ambient drift
     */
    function closeDetailModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      state.activeModalIndex = -1;
      updateShareableUrl(null);
      pauseAmbientDrift(900);
    }

    function bindInteractions() {
      // Mouse Pan
      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        pauseAmbientDrift(1100);
        state.isDragging = true;
        state.dragMoved = false;
        state.lastPointerX = e.clientX;
        state.lastPointerY = e.clientY;
        state.velX = 0;
        state.velY = 0;
        viewport.classList.add('is-dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.isDragging) return;
        pauseAmbientDrift(1100);
        const dx = e.clientX - state.lastPointerX;
        const dy = e.clientY - state.lastPointerY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          state.dragMoved = true;
        }

        state.targetX += dx;
        state.targetY += dy;
        state.velX = dx * 0.65;
        state.velY = dy * 0.65;

        state.lastPointerX = e.clientX;
        state.lastPointerY = e.clientY;
      });

      window.addEventListener('mouseup', () => {
        if (state.isDragging) {
          pauseAmbientDrift(1100);
        }
        state.isDragging = false;
        viewport.classList.remove('is-dragging');
        setTimeout(() => { state.dragMoved = false; }, 40);
      });

      // Trackpad / Mouse Wheel Pan (No Zoom)
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        pauseAmbientDrift(1100);
        state.targetX -= e.deltaX;
        state.targetY -= e.deltaY;
      }, { passive: false });

      // Single-Finger Touch Pan (Pinch Zoom Disabled)
      viewport.addEventListener('touchstart', (e) => {
        pauseAmbientDrift(1100);
        if (e.touches.length === 1) {
          state.isDragging = true;
          state.dragMoved = false;
          state.lastPointerX = e.touches[0].clientX;
          state.lastPointerY = e.touches[0].clientY;
          state.velX = 0;
          state.velY = 0;
        } else {
          state.isDragging = false;
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && state.isDragging) {
          pauseAmbientDrift(1100);
          const dx = e.touches[0].clientX - state.lastPointerX;
          const dy = e.touches[0].clientY - state.lastPointerY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) state.dragMoved = true;

          state.targetX += dx;
          state.targetY += dy;
          state.velX = dx * 0.6;
          state.velY = dy * 0.6;

          state.lastPointerX = e.touches[0].clientX;
          state.lastPointerY = e.touches[0].clientY;
        }
      }, { passive: true });

      viewport.addEventListener('touchend', () => {
        pauseAmbientDrift(1100);
        state.isDragging = false;
        setTimeout(() => { state.dragMoved = false; }, 50);
      });

      // Keyboard Navigation (Arrow keys + Escape)
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === document.getElementById('search-input')) return;
        const step = 180;
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
          pauseAmbientDrift(1100);
        }
        if (e.key === 'ArrowLeft') state.targetX += step;
        if (e.key === 'ArrowRight') state.targetX -= step;
        if (e.key === 'ArrowUp') state.targetY += step;
        if (e.key === 'ArrowDown') state.targetY -= step;
        if (e.key === 'Escape') {
          closeDetailModal();
          document.getElementById('autocomplete-dropdown').classList.add('hidden');
        }
      });

      // Search & Autocomplete Listeners
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-search-btn');

      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        clearBtn.classList.toggle('hidden', !state.searchQuery);
        renderAutocomplete(state.searchQuery);
        applyFilters(false);
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        state.searchQuery = '';
        clearBtn.classList.add('hidden');
        document.getElementById('autocomplete-dropdown').classList.add('hidden');
        applyFilters(false);
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#search-input') && !e.target.closest('#autocomplete-dropdown')) {
          document.getElementById('autocomplete-dropdown').classList.add('hidden');
        }
      });

      // Modal Controls
      document.getElementById('close-modal-btn').addEventListener('click', closeDetailModal);
      document.getElementById('detail-modal').addEventListener('click', (e) => {
        if (e.target.id === 'detail-modal' || e.target.parentElement?.id === 'detail-modal') {
          closeDetailModal();
        }
      });

      document.getElementById('modal-prev-btn').addEventListener('click', () => {
        if (state.filteredPlaces.length === 0) return;
        const nextIdx = (state.activeModalIndex - 1 + state.filteredPlaces.length) % state.filteredPlaces.length;
        flyToPlace(nextIdx);
        openDetailModal(nextIdx);
      });

      document.getElementById('modal-next-btn').addEventListener('click', () => {
        if (state.filteredPlaces.length === 0) return;
        const nextIdx = (state.activeModalIndex + 1) % state.filteredPlaces.length;
        flyToPlace(nextIdx);
        openDetailModal(nextIdx);
      });

      document.getElementById('modal-share-btn').addEventListener('click', () => {
        const shareUrl = window.location.href;
        const tempInput = document.createElement('input');
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);

        const label = document.getElementById('modal-share-text');
        label.textContent = 'Copied!';
        setTimeout(() => { label.textContent = 'Share'; }, 1600);
      });

      window.addEventListener('resize', () => {
        rebuildSpatialBlueprint();
      });
    }

    /**
     * Infinite Toroidal Viewport Culling & Inertial Camera Loop (60fps)
     */
    function updateCanvas() {
      const modalOpen = !document.getElementById('detail-modal').classList.contains('hidden');

      if (!state.isDragging) {
        state.targetX += state.velX;
        state.targetY += state.velY;
        state.velX *= 0.92;
        state.velY *= 0.92;

        if (Math.abs(state.velX) < 0.01) state.velX = 0;
        if (Math.abs(state.velY) < 0.01) state.velY = 0;

        // Resume gentle ambient drift smoothly once user stops interacting
        if (!modalOpen && performance.now() >= state.driftResumeAt && Math.abs(state.velX) < 0.15 && Math.abs(state.velY) < 0.15) {
          state.driftFactor += (1 - state.driftFactor) * 0.025;
          state.targetX += state.driftX * state.driftFactor;
          state.targetY += state.driftY * state.driftFactor;
        } else {
          state.driftFactor = 0;
        }
      } else {
        state.driftFactor = 0;
      }

      // Smooth spring damping toward target camera coordinates
      state.camX += (state.targetX - state.camX) * 0.14;
      state.camY += (state.targetY - state.camY) * 0.14;

      // Subtle parallax on background dot matrix
      gridBackdrop.style.backgroundPosition = `${state.camX * 0.35}px ${state.camY * 0.35}px`;

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const halfW = vw * 0.5;
      const halfH = vh * 0.5;
      const margin = 380;

      const sW = state.sectorW;
      const sH = state.sectorH;

      const minSecX = Math.floor((-state.camX - halfW - margin) / sW);
      const maxSecX = Math.floor((-state.camX + halfW + margin) / sW);
      const minSecY = Math.floor((-state.camY - halfH - margin) / sH);
      const maxSecY = Math.floor((-state.camY + halfH + margin) / sH);

      const visibleKeys = new Set();

      for (let sx = minSecX; sx <= maxSecX; sx++) {
        for (let sy = minSecY; sy <= maxSecY; sy++) {
          const offsetX = sx * sW;
          const offsetY = sy * sH;

          for (let i = 0; i < state.slots.length; i++) {
            const slot = state.slots[i];
            const screenX = halfW + state.camX + offsetX + slot.baseX;
            const screenY = halfH + state.camY + offsetY + slot.baseY;

            if (
              screenX + slot.width < -margin ||
              screenX > vw + margin ||
              screenY + slot.height < -margin ||
              screenY > vh + margin
            ) {
              continue;
            }

            const key = `${sx}:${sy}:${slot.slotIndex}`;
            visibleKeys.add(key);

            let el = state.tilePool.get(key);
            if (!el) {
              if (slot.isEmpty) {
                el = document.createElement('div');
                el.className = 'spatial-card pointer-events-none opacity-40';
                el.style.width = `${slot.width}px`;
                el.style.height = `${slot.height}px`;
                el.style.background = 'rgba(20, 20, 24, 0.55)';
              } else {
                const place = slot.place;
                el = document.createElement('article');
                el.className = 'spatial-card group';
                el.style.width = `${slot.width}px`;
                el.innerHTML = `
                  <div class="card-media" style="min-height: ${slot.height}px;">
                    <img src="${place.image}" alt="${place.title.replace(/"/g, '&quot;')}" loading="lazy" />
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/15 to-transparent opacity-90 group-hover:opacity-100 transition-opacity"></div>
                    <div class="absolute bottom-3 left-3.5 right-3.5">
                      <h3 class="font-normal text-base sm:text-lg text-white leading-snug drop-shadow">${formatCJKThin(place.title)}</h3>
                    </div>
                  </div>
                `;
                el.addEventListener('click', () => {
                  if (!state.dragMoved) {
                    openDetailModal(slot.placeIndex);
                  }
                });
              }

              worldLayer.appendChild(el);
              state.tilePool.set(key, el);
            }

            el.style.transform = `translate3d(${screenX.toFixed(1)}px, ${screenY.toFixed(1)}px, 0)`;
          }
        }
      }

      // Recycle offscreen tiles
      for (const [key, el] of state.tilePool.entries()) {
        if (!visibleKeys.has(key)) {
          el.remove();
          state.tilePool.delete(key);
        }
      }

      requestAnimationFrame(updateCanvas);
    }

    // Boot application
    bindInteractions();
    loadDatabase();
    requestAnimationFrame(updateCanvas);
  </script>
</body>
</html>
