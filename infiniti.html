          <span id="footer-total-cats" class="text-3xl font-bold tracking-tight">0</span>
          <span class="text-xs uppercase tracking-wide font-semibold">categories</span>
        </div>
      </div>

      <div class="mt-6">
        <h3 class="text-xs font-bold uppercase tracking-wider mb-3">Top 5 Categories</h3>
        <div id="footer-top-categories" class="flex flex-col gap-2.5"></div>
      </div>

      <div class="mt-6 pt-4 border-t border-[#292929] dark:border-white flex items-center justify-between text-xs">
        <span class="opacity-75">Curated spatial archive</span>
        <a href="https://albyantoniazzi.github.io/" target="_blank" rel="noopener noreferrer" class="underline font-semibold hover:opacity-75">@albyantoniazzi</a>
      </div>
    </div>
  </div>

  <!-- DETAIL LIGHTBOX MODAL -->
  <!-- Removed: Photos now expand directly in-place on the infinite canvas -->

  <!-- Toast Notification -->
  <div 
    id="toast-notification" 
    class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-[#292929] text-[#EBF1E5] dark:bg-white dark:text-[#292929] text-xs font-semibold rounded-full shadow-xl opacity-0 translate-y-3 pointer-events-none transition-all duration-200 flex items-center gap-2"
  >
    <svg class="w-4 h-4 text-emerald-400 dark:text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
    </svg>
    <span id="toast-message">Link copied to clipboard!</span>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQjjP1I4FaaHacoyWro_hFtrBLnc9ANaobCo3RBSpvyBQ49Dl0MExGOJOHzLoWY6Pz9YqxTPyRDAfIv/pub?output=csv";
    const DEFAULT_FALLBACK_IMAGE = "https://live.staticflickr.com/65535/54854428883_2f3d72425e_b.jpg";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatCityName(str) {
      if (!str) return '';
      return str
        .split(/\s+/)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
    }

    function extractFlickrPhotoId(url) {
      if (!url || typeof url !== 'string') return 0n;
      const match = url.match(/\/(\d+)_/);
      if (match && match[1]) {
        try { return BigInt(match[1]); } catch (e) { return 0n; }
      }
      return 0n;
    }

    function createSlug(title) {
      return (title || '')
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // Deterministic pseudo-random helper for organic collage jitter
    function seededRandom(seed) {
      const x = Math.sin(seed * 9301 + 49297) * 233280;
      return x - Math.floor(x);
    }

    // State Variables
    let allPlaces = [];
    let visiblePlaces = [];
    let activeCity = "ALL";
    let activeCategory = "ALL";
    let searchQuery = "";
    let searchDebounceTimer = null;
    let rotationDeg = 0;
    let expandedNodeIndex = -1;

    // Infinite Canvas Camera & Spatial State
    const camera = {
      x: 0,
      y: 0,
      zoom: 0.9,
      targetX: 0,
      targetY: 0,
      targetZoom: 0.9,
      minZoom: 0.18,
      maxZoom: 2.6
    };
    let spatialNodes = []; // { place, index, x, y, baseWidth, width, height, el, mounted }
    let worldBounds = { minX: -500, minY: -500, maxX: 500, maxY: 500 };
    let isDraggingCanvas = false;
    let dragStartScreen = { x: 0, y: 0 };
    let dragStartCam = { x: 0, y: 0 };
    let pointerTravelDist = 0;
    let initialPinchDist = null;
    let initialPinchZoom = 1;
    let cameraAnimFrame = null;
    let masonryColumns = [];
    let masonryColWidth = 310;
    let masonryGap = 14;

    // DOM Elements
    const viewportEl = document.getElementById("canvas-viewport");
    const worldEl = document.getElementById("canvas-world");
    const loadingEl = document.getElementById("loading-state");
    const emptyEl = document.getElementById("empty-state");
    const emptyTitleEl = document.getElementById("empty-state-title");
    const categoryContainer = document.getElementById("category-filters");
    const cityFilterSelect = document.getElementById("city-filter");
    const searchInput = document.getElementById("search-input");
    const clearSearchBtn = document.getElementById("clear-search-btn");
    const themeToggleBtn = document.getElementById("theme-toggle");
    const yinYangIcon = document.getElementById("yin-yang-icon");
    const brandResetBtn = document.getElementById("brand-reset-btn");
    const emptyResetBtn = document.getElementById("empty-reset-btn");
    const visibleCountBadge = document.getElementById("visible-count-badge");

    // Stats Modal Elements
    const statsModal = document.getElementById("stats-modal");
    const statsModalCard = document.getElementById("stats-modal-card");
    const openStatsBtn = document.getElementById("open-stats-btn");
    const closeStatsBtn = document.getElementById("close-stats-btn");
    const footerPlacesCount = document.getElementById("footer-total-places");
    const footerCitiesCount = document.getElementById("footer-total-cities");
    const footerCatsCount = document.getElementById("footer-total-cats");
    const footerTopCatsContainer = document.getElementById("footer-top-categories");

    // Toast Elements
    const toastEl = document.getElementById("toast-notification");
    const toastMsg = document.getElementById("toast-message");

    // ==========================================
    // MASONRY LAYOUT & VIEWPORT CULLING
    // ==========================================

    function computeSpatialLayout(places) {
      worldEl.innerHTML = '';
      spatialNodes = [];
      masonryColumns = [];
      expandedNodeIndex = -1;

      if (places.length === 0) {
        worldBounds = { minX: -400, minY: -300, maxX: 400, maxY: 300 };
        return;
      }

      // Balanced multi-column masonry grid centered around (0, 0)
      const colCount = Math.min(places.length, Math.max(3, Math.min(8, Math.ceil(Math.sqrt(places.length * 1.35)))));
      masonryColWidth = window.innerWidth < 640 ? 250 : 320;
      masonryGap = 14;

      const totalGridWidth = colCount * masonryColWidth + (colCount - 1) * masonryGap;
      const startX = -totalGridWidth / 2;

      const colHeights = new Array(colCount).fill(0);
      for (let c = 0; c < colCount; c++) {
        masonryColumns.push([]);
      }

      places.forEach((place, idx) => {
        // Pick shortest column for balanced masonry flow
        let targetCol = 0;
        for (let c = 1; c < colCount; c++) {
          if (colHeights[c] < colHeights[targetCol]) {
            targetCol = c;
          }
        }

        const r1 = seededRandom(idx + 17);
        const estHeight = Math.round(masonryColWidth * (0.72 + r1 * 0.45));
        const x = startX + targetCol * (masonryColWidth + masonryGap);
        const y = colHeights[targetCol];

        const node = {
          place,
          index: idx,
          col: targetCol,
          x,
          y,
          baseWidth: masonryColWidth,
          width: masonryColWidth,
          height: estHeight,
          el: null,
          mounted: false
        };

        spatialNodes.push(node);
        masonryColumns[targetCol].push(node);
        colHeights[targetCol] += estHeight + masonryGap;
      });

      // Center vertical stack around y = 0
      const maxColH = Math.max(...colHeights, 300);
      const offsetY = -maxColH / 2;

      spatialNodes.forEach(node => {
        node.y += offsetY;
      });

      worldBounds = {
        minX: startX - 180,
        minY: offsetY - 180,
        maxX: startX + totalGridWidth + 180,
        maxY: offsetY + maxColH + 180
      };

      updateVisibleNodes();
    }

    function reflowMasonryColumn(colIdx) {
      const colNodes = masonryColumns[colIdx];
      if (!colNodes || colNodes.length === 0) return;

      let currentY = colNodes[0].y;
      for (let i = 0; i < colNodes.length; i++) {
        const n = colNodes[i];
        n.y = currentY;
        if (n.mounted && n.el) {
          n.el.style.transform = `translate3d(${n.x}px, ${n.y}px, 0)`;
        }
        currentY += n.height + masonryGap;
      }
      updateVisibleNodes();
    }

    function createPhotoNodeElement(node) {
      const { place, index, baseWidth } = node;
      const wrapper = document.createElement('article');
      // Borderless masonry card with slightly rounded corners
      wrapper.className = "canvas-photo-node group cursor-pointer rounded-xl bg-[#EBF1E5] dark:bg-[#292929] shadow-md hover:shadow-2xl hover:z-20 overflow-hidden";
      wrapper.style.width = `${baseWidth}px`;
      wrapper.style.transform = `translate3d(${node.x}px, ${node.y}px, 0)`;

      const fullImageSource = place.photo || DEFAULT_FALLBACK_IMAGE;
      const safeTitle = escapeHtml(place.title);
      const safeCity = place.city ? escapeHtml(formatCityName(place.city)) : '';
      const safeDesc = escapeHtml(place.description || "No description provided for this curated spot.");
      const firstCat = place.categories && place.categories.length > 0 ? escapeHtml(place.categories[0].toLowerCase()) : '';

      const cityBadgeHtml = place.city ? `
        <button 
          type="button"
          data-city="${escapeHtml(place.city)}"
          class="node-city-btn badge-pill inline-flex items-center gap-1 px-3 py-1 rounded-full font-bold capitalize border border-[#292929] bg-[#292929] text-[#EBF1E5] dark:border-white dark:bg-white dark:text-[#292929] shadow-sm cursor-pointer"
        >
          <svg class="w-3 h-3 flex-shrink-0 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
          <span>${safeCity}</span>
        </button>
      ` : '';

      const catBadgeHtml = firstCat ? `
        <button 
          type="button"
          data-category="${firstCat}"
          class="node-cat-badge badge-pill inline-flex items-center px-3 py-1 rounded-full font-bold lowercase border border-[#292929] bg-[#292929] text-[#EBF1E5] dark:border-white dark:bg-white dark:text-[#292929] shadow-sm cursor-pointer"
        >
          ${firstCat}
        </button>
      ` : '';

      const tagsHtml = place.categories.map(cat => `
        <button 
          type="button"
          data-category="${escapeHtml(cat.toLowerCase())}"
          class="node-cat-btn badge-pill inline-flex items-center px-2.5 py-0.5 rounded-full font-bold lowercase border border-[#292929] bg-[#292929] text-[#EBF1E5] hover:bg-transparent hover:text-[#292929] dark:border-white dark:bg-white dark:text-[#292929] dark:hover:bg-transparent dark:hover:text-white transition-all duration-150 cursor-pointer"
        >
          ${escapeHtml(cat.toLowerCase())}
        </button>
      `).join('');

      const mapLinkHtml = place.mapLink ? `
        <a 
          href="${encodeURI(place.mapLink)}" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="node-action-link h-7 inline-flex items-center gap-1 px-3 rounded-full border border-[#292929] dark:border-white bg-transparent hover:bg-[#292929] hover:text-[#EBF1E5] dark:hover:bg-white dark:hover:text-[#292929] text-[#292929] dark:text-white font-semibold text-[11px] transition cursor-pointer"
        >
          <span>Google Maps</span>
          <span>↗</span>
        </a>
      ` : '';

      wrapper.innerHTML = `
        <div class="relative w-full bg-stone-300 dark:bg-stone-800 overflow-hidden">
          <img 
            src="${escapeHtml(fullImageSource)}" 
            alt="${safeTitle}" 
            loading="lazy"
            decoding="async"
            draggable="false"
            class="w-full h-auto block opacity-0 transition-opacity duration-300 group-hover:scale-[1.02] transition-transform duration-300"
          />

          <!-- City Badge on Top-Left of Photo -->
          ${place.city ? `
            <div class="absolute top-2.5 left-2.5 z-10 pointer-events-auto">
              <button 
                type="button"
                data-city="${escapeHtml(place.city)}"
                class="node-city-btn badge-pill inline-flex items-center gap-1 px-3 py-1 rounded-full font-bold capitalize border border-[#292929] bg-[#292929] text-[#EBF1E5] dark:border-white dark:bg-white dark:text-[#292929] shadow-md cursor-pointer"
              >
                <svg class="w-3 h-3 flex-shrink-0 fill-current" viewBox="0 0 24 24">
                  <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
                </svg>
                <span>${safeCity}</span>
              </button>
            </div>
          ` : ''}

          <!-- Minimal Hover Overlay (Bigger Title Text) -->
          <div class="node-hover-overlay absolute inset-x-0 bottom-0 p-3.5 bg-gradient-to-t from-black/85 via-black/45 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex flex-col justify-end pointer-events-none">
            <span class="text-white text-sm sm:text-base font-bold leading-snug drop-shadow">${safeTitle}</span>
            ${safeCity ? `<span class="text-white/85 text-xs font-semibold mt-0.5">${safeCity}</span>` : ''}
          </div>

          <!-- Collapse Button (Shown only when expanded) -->
          <button
            type="button"
            aria-label="Collapse spot"
            class="node-close-btn hidden absolute top-2.5 right-2.5 z-20 w-7 h-7 items-center justify-center rounded-full bg-[#EBF1E5]/90 dark:bg-[#292929]/90 border border-[#292929] dark:border-white text-[#292929] dark:text-white font-bold text-xs hover:bg-[#292929] hover:text-[#EBF1E5] dark:hover:bg-white dark:hover:text-[#292929] transition cursor-pointer shadow"
          >
            ×
          </button>
        </div>

        <!-- In-Place Expanded Details Drawer -->
        <div class="node-details hidden p-4 space-y-3 select-text">
          <h3 class="text-lg sm:text-xl font-bold tracking-tight text-[#292929] dark:text-white leading-snug">
            ${safeTitle}
          </h3>

          ${firstCat ? `
            <div>
              <button 
                type="button"
                data-category="${firstCat}"
                class="node-cat-badge badge-pill inline-flex items-center px-3 py-1 rounded-full font-bold lowercase border border-[#292929] bg-[#292929] text-[#EBF1E5] dark:border-white dark:bg-white dark:text-[#292929] shadow-sm cursor-pointer"
              >
                ${firstCat}
              </button>
            </div>
          ` : ''}

          <p class="text-[11px] leading-relaxed text-[#292929] dark:text-white font-semibold whitespace-pre-line">
            ${safeDesc}
          </p>

          <div class="pt-1 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5">
              <button 
                type="button" 
                class="node-share-btn h-7 inline-flex items-center gap-1 px-3 rounded-full border border-[#292929] dark:border-white bg-transparent hover:bg-[#292929] hover:text-[#EBF1E5] dark:hover:bg-white dark:hover:text-[#292929] text-[#292929] dark:text-white font-semibold text-[11px] transition cursor-pointer"
              >
                <span>Copy link</span>
              </button>
              ${mapLinkHtml}
            </div>

            <!-- Inline Prev/Next Spot Stepper -->
            <div class="flex items-center gap-1">
              <button 
                type="button" 
                title="Previous spot (←)"
                class="node-prev-btn w-7 h-7 flex items-center justify-center rounded-full border border-[#292929] dark:border-white text-xs font-bold hover:bg-[#292929] hover:text-[#EBF1E5] dark:hover:bg-white dark:hover:text-[#292929] disabled:opacity-25 disabled:pointer-events-none transition cursor-pointer"
              >
                ←
              </button>
              <button 
                type="button" 
                title="Next spot (→)"
                class="node-next-btn w-7 h-7 flex items-center justify-center rounded-full border border-[#292929] dark:border-white text-xs font-bold hover:bg-[#292929] hover:text-[#EBF1E5] dark:hover:bg-white dark:hover:text-[#292929] disabled:opacity-25 disabled:pointer-events-none transition cursor-pointer"
              >
                →
              </button>
            </div>
          </div>
        </div>
      `;

      const imgEl = wrapper.querySelector('img');
      imgEl.onload = () => {
        imgEl.classList.remove('opacity-0');
        imgEl.classList.add('opacity-100');
        if (imgEl.naturalWidth > 0 && imgEl.naturalHeight > 0) {
          const newHeight = Math.round(node.width * (imgEl.naturalHeight / imgEl.naturalWidth));
          if (Math.abs(newHeight - node.height) > 2) {
            node.height = newHeight;
            reflowMasonryColumn(node.col);
          }
        }
      };
      imgEl.onerror = () => {
        if (imgEl.src !== DEFAULT_FALLBACK_IMAGE) {
          imgEl.src = DEFAULT_FALLBACK_IMAGE;
        }
        imgEl.classList.remove('opacity-0');
        imgEl.classList.add('opacity-100');
      };

      wrapper.addEventListener('click', (e) => {
        if (pointerTravelDist > 6) return;
        if (expandedNodeIndex !== index) {
          e.stopPropagation();
          expandNodeInPlace(index);
        }
      });

      const closeBtn = wrapper.querySelector('.node-close-btn');
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        collapseExpandedNode();
      });

      wrapper.querySelectorAll('.node-city-btn').forEach(cityBtn => {
        cityBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const city = cityBtn.getAttribute('data-city');
          if (city) {
            collapseExpandedNode();
            activeCity = city;
            cityFilterSelect.value = city;
            updateUrlState();
            filterPlaces();
          }
        });
      });

      wrapper.querySelectorAll('.node-cat-badge').forEach(badgeBtn => {
        badgeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const cat = badgeBtn.getAttribute('data-category');
          if (cat) {
            collapseExpandedNode();
            setCategory(cat);
          }
        });
      });

      const shareBtn = wrapper.querySelector('.node-share-btn');
      shareBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        let base = `${window.location.origin}${window.location.pathname}`;
        if (window.location.protocol === 'blob:' || !window.location.origin || window.location.origin === 'null') {
          base = window.location.href.split('?')[0];
        }
        const shareUrl = `${base}?spot=${place.slug}`;
        copyTextToClipboard(shareUrl);
        showToast("Direct spot link copied!");
      });

      const mapAnchor = wrapper.querySelector('.node-action-link');
      if (mapAnchor) {
        mapAnchor.addEventListener('click', (e) => e.stopPropagation());
      }

      const prevBtn = wrapper.querySelector('.node-prev-btn');
      const nextBtn = wrapper.querySelector('.node-next-btn');
      prevBtn.disabled = index <= 0;
      nextBtn.disabled = index >= spatialNodes.length - 1;

      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (index > 0) expandNodeInPlace(index - 1);
      });
      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (index < spatialNodes.length - 1) expandNodeInPlace(index + 1);
      });

      return wrapper;
    }

    function expandNodeInPlace(index) {
      if (!spatialNodes[index]) return;
      if (expandedNodeIndex !== -1 && expandedNodeIndex !== index) {
        collapseExpandedNode(true);
      }

      expandedNodeIndex = index;
      const node = spatialNodes[index];

      if (!node.mounted) {
        node.el = createPhotoNodeElement(node);
        worldEl.appendChild(node.el);
        node.mounted = true;
      }

      const expandedWidth = Math.min(460, Math.max(320, window.innerWidth * 0.85));
      node.width = expandedWidth;
      node.el.style.width = `${expandedWidth}px`;
      node.el.classList.add('is-expanded', 'shadow-2xl');

      const hoverOverlay = node.el.querySelector('.node-hover-overlay');
      const closeBtn = node.el.querySelector('.node-close-btn');
      const detailsDrawer = node.el.querySelector('.node-details');

      if (hoverOverlay) hoverOverlay.classList.add('hidden');
      if (closeBtn) {
        closeBtn.classList.remove('hidden');
        closeBtn.classList.add('flex');
      }
      if (detailsDrawer) detailsDrawer.classList.remove('hidden');

      spatialNodes.forEach((other, idx) => {
        if (other.mounted && other.el) {
          other.el.style.opacity = idx === index ? '1' : '0.32';
        }
      });

      const targetZoom = Math.max(camera.zoom, window.innerWidth < 640 ? 0.92 : 1.05);
      const cardCenterX = node.x + expandedWidth / 2;
      const cardCenterY = node.y + Math.min(node.height, 260) * 0.7;

      camera.targetZoom = Math.min(camera.maxZoom, targetZoom);
      camera.targetX = window.innerWidth / 2 - cardCenterX * camera.targetZoom;
      camera.targetY = window.innerHeight / 2 - cardCenterY * camera.targetZoom + 35;
      startCameraAnimation();

      updateUrlState(node.place.slug);
    }

    function collapseExpandedNode(skipUrlClear = false) {
      if (expandedNodeIndex === -1) return;
      const node = spatialNodes[expandedNodeIndex];
      if (node && node.mounted && node.el) {
        node.width = node.baseWidth;
        node.el.style.width = `${node.baseWidth}px`;
        node.el.classList.remove('is-expanded', 'shadow-2xl');

        const hoverOverlay = node.el.querySelector('.node-hover-overlay');
        const closeBtn = node.el.querySelector('.node-close-btn');
        const detailsDrawer = node.el.querySelector('.node-details');

        if (hoverOverlay) hoverOverlay.classList.remove('hidden');
        if (closeBtn) {
          closeBtn.classList.add('hidden');
          closeBtn.classList.remove('flex');
        }
        if (detailsDrawer) detailsDrawer.classList.add('hidden');
      }

      spatialNodes.forEach((other) => {
        if (other.mounted && other.el) {
          other.el.style.opacity = '1';
        }
      });

      expandedNodeIndex = -1;
      if (!skipUrlClear) updateUrlState(null);
      updateVisibleNodes();
    }

    function updateVisibleNodes() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const buffer = 420;

      const worldLeft = (-camera.x - buffer) / camera.zoom;
      const worldTop = (-camera.y - buffer) / camera.zoom;
      const worldRight = (vw - camera.x + buffer) / camera.zoom;
      const worldBottom = (vh - camera.y + buffer) / camera.zoom;

      for (let i = 0; i < spatialNodes.length; i++) {
        const node = spatialNodes[i];
        const isExpanded = i === expandedNodeIndex;
        const inView = isExpanded || (
          node.x + node.width >= worldLeft &&
          node.x <= worldRight &&
          node.y + node.height >= worldTop &&
          node.y <= worldBottom
        );

        if (inView && !node.mounted) {
          node.el = createPhotoNodeElement(node);
          if (expandedNodeIndex !== -1 && !isExpanded) {
            node.el.style.opacity = '0.32';
          }
          worldEl.appendChild(node.el);
          node.mounted = true;
        } else if (!inView && node.mounted && !isExpanded) {
          node.el.remove();
          node.el = null;
          node.mounted = false;
        }
      }
    }

    // ==========================================
    // CAMERA TRANSFORM, PAN & ZOOM CONTROLLERS
    // ==========================================

    function applyCameraTransform() {
      worldEl.style.transform = `translate3d(${camera.x}px, ${camera.y}px, 0) scale(${camera.zoom})`;
      updateVisibleNodes();
    }

    function startCameraAnimation() {
      if (cameraAnimFrame) return;
      const step = () => {
        const dx = camera.targetX - camera.x;
        const dy = camera.targetY - camera.y;
        const dz = camera.targetZoom - camera.zoom;

        if (Math.abs(dx) < 0.2 && Math.abs(dy) < 0.2 && Math.abs(dz) < 0.0008) {
          camera.x = camera.targetX;
          camera.y = camera.targetY;
          camera.zoom = camera.targetZoom;
          applyCameraTransform();
          cameraAnimFrame = null;
          return;
        }

        camera.x += dx * 0.18;
        camera.y += dy * 0.18;
        camera.zoom += dz * 0.18;
        applyCameraTransform();
        cameraAnimFrame = requestAnimationFrame(step);
      };
      cameraAnimFrame = requestAnimationFrame(step);
    }

    function zoomAtPoint(newZoom, screenX, screenY, animate = false) {
      const clampedZoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, newZoom));
      const worldX = (screenX - camera.x) / camera.zoom;
      const worldY = (screenY - camera.y) / camera.zoom;

      const nextX = screenX - worldX * clampedZoom;
      const nextY = screenY - worldY * clampedZoom;

      camera.targetZoom = clampedZoom;
      camera.targetX = nextX;
      camera.targetY = nextY;

      if (animate) {
        startCameraAnimation();
      } else {
        if (cameraAnimFrame) {
          cancelAnimationFrame(cameraAnimFrame);
          cameraAnimFrame = null;
        }
        camera.zoom = clampedZoom;
        camera.x = nextX;
        camera.y = nextY;
        applyCameraTransform();
      }
    }

    function centerCanvas(animate = true, customZoom = null) {
      const defaultZoom = window.innerWidth < 640 ? 0.72 : 0.92;
      const targetZ = customZoom !== null ? customZoom : defaultZoom;
      camera.targetZoom = targetZ;
      camera.targetX = window.innerWidth / 2;
      camera.targetY = window.innerHeight / 2 + 24;

      if (animate) {
        startCameraAnimation();
      } else {
        camera.zoom = camera.targetZoom;
        camera.x = camera.targetX;
        camera.y = camera.targetY;
        applyCameraTransform();
      }
    }

    viewportEl.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      isDraggingCanvas = true;
      pointerTravelDist = 0;
      dragStartScreen = { x: e.clientX, y: e.clientY };
      dragStartCam = { x: camera.x, y: camera.y };
      viewportEl.classList.add('is-grabbing');
      if (cameraAnimFrame) {
        cancelAnimationFrame(cameraAnimFrame);
        cameraAnimFrame = null;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDraggingCanvas) return;
      const dx = e.clientX - dragStartScreen.x;
      const dy = e.clientY - dragStartScreen.y;
      pointerTravelDist = Math.hypot(dx, dy);

      camera.x = dragStartCam.x + dx;
      camera.y = dragStartCam.y + dy;
      camera.targetX = camera.x;
      camera.targetY = camera.y;
      applyCameraTransform();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDraggingCanvas) return;
      isDraggingCanvas = false;
      viewportEl.classList.remove('is-grabbing');

    viewportEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        const zoomFactor = Math.exp(-e.deltaY * 0.008);
        zoomAtPoint(camera.zoom * zoomFactor, e.clientX, e.clientY, false);
      } else if (Math.abs(e.deltaX) > 2) {
        camera.x -= e.deltaX;
        camera.y -= e.deltaY;
        camera.targetX = camera.x;
        camera.targetY = camera.y;
        applyCameraTransform();
      } else {
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.91;
        zoomAtPoint(camera.zoom * zoomFactor, e.clientX, e.clientY, false);
      }
    }, { passive: false });

        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialPinchZoom = camera.zoom;
      }
    }, { passive: true });

    viewportEl.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const scaleRatio = dist / initialPinchDist;
        zoomAtPoint(initialPinchZoom * scaleRatio, midX, midY, false);
      }
    }, { passive: false });

        const matchesCity = (activeCity === "ALL") || (place.city.toLowerCase() === activeCity.toLowerCase());
        const matchesCategory = (activeCategory === "ALL") || place.categories.some(c => c.toLowerCase() === activeCategory.toLowerCase());
        const searchable = `${place.title} ${place.description} ${place.categories.join(' ')} ${place.city}`.toLowerCase();
        const matchesSearch = rawTokens.length === 0 || rawTokens.every(tok => searchable.includes(tok));
        return matchesCity && matchesCategory && matchesSearch;
      });

      if (visibleCountBadge) {
        visibleCountBadge.textContent = `${visiblePlaces.length} ${visiblePlaces.length === 1 ? 'spot' : 'spots'}`;

    function parseUrlState() {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.has("city")) activeCity = params.get("city");
        if (params.has("cat")) activeCategory = params.get("cat");
        if (params.has("q")) {
          searchQuery = params.get("q");
          searchInput.value = searchQuery;
          clearSearchBtn.classList.toggle("hidden", !searchQuery);
        }
        return params.get("spot");
      } catch (err) {
        return null;
      }
    }

    function updateUrlState(targetSpotSlug = null) {
      if (window.location.protocol === 'blob:' || !window.location.origin || window.location.origin === 'null') {
        return;
      }
      try {
        const params = new URLSearchParams();
        if (activeCity !== "ALL") params.set("city", activeCity);
        if (activeCategory !== "ALL") params.set("cat", activeCategory);
        if (searchQuery.trim()) params.set("q", searchQuery.trim());
        if (targetSpotSlug) params.set("spot", targetSpotSlug);

        const queryString = params.toString();
        const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
        window.history.replaceState({}, '', newUrl);
      } catch (err) {}
    }

          startCameraAnimation();

          camera.targetY = camera.y + panStep;

        }

    function getFieldValue(row, possibleKeys) {
      const rowKeys = Object.keys(row);
      for (const key of possibleKeys) {
        const match = rowKeys.find(k => k.trim().toLowerCase() === key.toLowerCase());
        if (match && row[match] !== undefined && row[match] !== null && String(row[match]).trim() !== '') {
          return String(row[match]).trim();
        }
      }
      return '';
    }

    function processPlacesData(rows) {
      const parsedPlaces = rows
        .map(row => {
          const title = getFieldValue(row, ['title', 'name', 'place']);
          if (!title) return null;

          const rawCategories = getFieldValue(row, ['categories', 'category', 'tags', 'tag']);
          const categories = rawCategories
            ? rawCategories.split(',').map(s => s.trim()).filter(Boolean)
            : [];

          const city = getFieldValue(row, ['city', 'location', 'town']);
          const description = getFieldValue(row, ['description', 'desc', 'notes', 'about']);
          const photo = getFieldValue(row, ['photo', 'image', 'picture', 'url', 'photo_url']);
          const mapLink = getFieldValue(row, ['map_link', 'map', 'google_map_url', 'google map url link', 'link']);
          const slug = createSlug(title);
          const flickrId = extractFlickrPhotoId(photo);

          return { title, slug, city, categories, description, photo, mapLink, flickrId };
        })
        .filter(Boolean);

      allPlaces = parsedPlaces.sort((a, b) => {
        if (b.flickrId > a.flickrId) return 1;
        if (b.flickrId < a.flickrId) return -1;
        return 0;
      });

      populateCityFilter();
      populateCategoryFilters();
      renderStatsOverview();

      const deepLinkedSpotSlug = parseUrlState();
      cityFilterSelect.value = activeCity;
      updateToolbarStyles();
      filterPlaces(false);
      centerCanvas(false);

      if (deepLinkedSpotSlug) {
        const targetIndex = spatialNodes.findIndex(n => n.place.slug === deepLinkedSpotSlug);
        if (targetIndex !== -1) expandNodeInPlace(targetIndex);
      }

      loadingEl.classList.add("hidden");
    }

    async function fetchPlaces() {
      try {
        const cacheBuster = `&_t=${Date.now()}`;
        const response = await fetch(`${SHEET_CSV_URL}${cacheBuster}`);
        if (!response.ok) throw new Error("Network error fetching CSV");
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          transformHeader: h => h.trim().toLowerCase(),
          complete: results => processPlacesData(results.data),
          error: () => handleFetchError()
        });
      } catch (err) {
        console.error("Fetch failed:", err);
        handleFetchError();
      }
    }

    function playQuackSound() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const bandpass = audioCtx.createBiquadFilter();
        const gainNode = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'triangle';

        bandpass.type = 'bandpass';
        bandpass.frequency.setValueAtTime(750, now);
        bandpass.frequency.exponentialRampToValueAtTime(420, now + 0.16);
        bandpass.Q.setValueAtTime(3.2, now);

        osc1.frequency.setValueAtTime(290, now);
        osc1.frequency.exponentialRampToValueAtTime(380, now + 0.04);
        osc1.frequency.exponentialRampToValueAtTime(210, now + 0.16);

        osc2.frequency.setValueAtTime(145, now);
        osc2.frequency.exponentialRampToValueAtTime(190, now + 0.04);
        osc2.frequency.exponentialRampToValueAtTime(105, now + 0.16);

        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.linearRampToValueAtTime(0.24, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

        osc1.connect(bandpass);
        osc2.connect(bandpass);
        bandpass.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.17);
        osc2.stop(now + 0.17);
      } catch (e) {}
    }

      " ###   ######   ### ",
      " ###  ########  ### ",
      " ###  ########  ### ",
      " ###  ########  ### ",
      " ###  ########  ### ",
      " ###  ########  ### ",
      " ####          #### ",
      " ################## ",
      " ################## ",
      "####################",
      "####################"
    ];

    function initDinoState() {
      if (emptyTitleEl) {
        emptyTitleEl.classList.remove('opacity-0', 'pointer-events-none');
        emptyTitleEl.classList.add('opacity-100');
      }
      return {
        dino: { x: 40, y: 104, vy: 0, width: 28, height: 31, isJumping: false, legTimer: 0, legToggle: false },
        obstacles: [],
        clouds: [{ x: 120, y: 25, speed: 0.5 }, { x: 380, y: 18, speed: 0.65 }],
        score: 0,
        highScore: parseInt(localStorage.getItem('tot-dino-hi') || '0', 10),
        speed: 4.2,
        spawnTimer: 0,
        isGameOver: false,
        groundTicks: [],
        flameTick: 0
      };
    }

    function jumpDino() {
      if (!dinoState) return;
      if (emptyTitleEl && !dinoState.isGameOver) {
        emptyTitleEl.classList.remove('opacity-100');
        emptyTitleEl.classList.add('opacity-0', 'pointer-events-none');
      }
      if (dinoState.isGameOver) {
        dinoState = initDinoState();
        return;
      }
      if (!dinoState.dino.isJumping) {
        dinoState.dino.vy = -8.6;
        dinoState.dino.isJumping = true;
        playQuackSound();
      }
    }

    function drawPixelMap(ctx, map, startX, startY, pixelSize, color) {
      ctx.fillStyle = color;
      for (let r = 0; r < map.length; r++) {
        const row = map[r];
        for (let c = 0; c < row.length; c++) {
          if (row[c] === '#') {
            ctx.fillRect(startX + c * pixelSize, startY + r * pixelSize, pixelSize, pixelSize);
          }
        }
      }
    }

    function updateDinoGame() {
      if (!dinoGameActive || !dinoCtx || !dinoState) return;

      const canvasW = dinoCanvas.width;
      const canvasH = dinoCanvas.height;
      const groundY = 135;
      const themeColor = document.documentElement.classList.contains('dark') ? '#ffffff' : '#292929';

      dinoCtx.clearRect(0, 0, canvasW, canvasH);

      dinoCtx.fillStyle = themeColor;
      dinoState.clouds.forEach(cloud => {
        if (!dinoState.isGameOver) cloud.x -= cloud.speed;
        if (cloud.x < -60) cloud.x = canvasW + Math.random() * 90;
        dinoCtx.globalAlpha = 0.3;
        dinoCtx.fillRect(cloud.x, cloud.y, 34, 7);
        dinoCtx.fillRect(cloud.x + 8, cloud.y - 5, 18, 5);
        dinoCtx.globalAlpha = 1.0;
      });

      dinoCtx.fillStyle = themeColor;
      dinoCtx.fillRect(0, groundY, canvasW, 1);

      if (!dinoState.isGameOver) {
        if (Math.random() < 0.22) {
          dinoState.groundTicks.push({ x: canvasW, y: groundY + 3 + Math.floor(Math.random() * 4), w: 3 + Math.floor(Math.random() * 5) });
        }
        for (let i = dinoState.groundTicks.length - 1; i >= 0; i--) {
          dinoState.groundTicks[i].x -= dinoState.speed;
          if (dinoState.groundTicks[i].x < -15) dinoState.groundTicks.splice(i, 1);
        }
      }
      dinoState.groundTicks.forEach(tick => dinoCtx.fillRect(tick.x, tick.y, tick.w, 1));

      const dino = dinoState.dino;
      if (!dinoState.isGameOver) {
        dino.y += dino.vy;
        dino.vy += 0.58;
        if (dino.y >= groundY - dino.height) {
          dino.y = groundY - dino.height;
          dino.vy = 0;
          dino.isJumping = false;
        }
        dino.legTimer++;
        if (dino.legTimer > 5) {
          dino.legToggle = !dino.legToggle;
          dino.legTimer = 0;
        }
        dinoState.score += 0.16;
        if (dinoState.score > dinoState.highScore) {
          dinoState.highScore = Math.floor(dinoState.score);
          localStorage.setItem('tot-dino-hi', String(dinoState.highScore));
        }
        dinoState.speed = Math.min(8.2, 4.2 + Math.floor(dinoState.score / 100) * 0.35);

        dinoState.spawnTimer++;
        const spawnThreshold = Math.max(55, 95 - Math.floor(dinoState.speed * 4.5));
        if (dinoState.spawnTimer > spawnThreshold && Math.random() < 0.05) {
          const types = ['hotpot', 'flame', 'oven'];
          const chosenType = types[Math.floor(Math.random() * types.length)];
          let obsH = 18, obsW = 24;
          if (chosenType === 'oven') { obsH = 22; obsW = 20; }
          else if (chosenType === 'flame') { obsH = 20; obsW = 18; }
          dinoState.obstacles.push({ type: chosenType, x: canvasW + 20, y: groundY - obsH, width: obsW, height: obsH });
          dinoState.spawnTimer = 0;
        }
      }

      drawPixelMap(dinoCtx, GOOSE_SPRITE, dino.x, dino.y, 1, themeColor);
      dinoCtx.fillStyle = themeColor;
      dinoCtx.fillRect(dino.x + 20, dino.y + 2, 7, 3);
      dinoCtx.fillRect(dino.x + 22, dino.y + 5, 4, 1);

      if (!dino.isJumping && !dinoState.isGameOver) {
        dinoCtx.fillStyle = themeColor;
        if (dino.legToggle) dinoCtx.fillRect(dino.x + 7, dino.y + 28, 6, 3);
        else dinoCtx.fillRect(dino.x + 15, dino.y + 28, 6, 3);
      }

      dinoState.flameTick++;

      for (let i = dinoState.obstacles.length - 1; i >= 0; i--) {
        const obs = dinoState.obstacles[i];
        if (!dinoState.isGameOver) obs.x -= dinoState.speed;

        if (obs.type === 'hotpot') {
          drawPixelMap(dinoCtx, HOTPOT_SPRITE, obs.x, obs.y + 1, 1, themeColor);
          const flamePhase = Math.floor((dinoState.flameTick + i * 4) / 5) % 3;
          const flameCenterX = obs.x + 12;
          const flameBaseY = obs.y;
          dinoCtx.fillStyle = themeColor;
          if (flamePhase === 0) {
            dinoCtx.fillRect(flameCenterX - 3, flameBaseY - 6, 6, 5);
            dinoCtx.fillRect(flameCenterX - 1, flameBaseY - 10, 3, 4);
            dinoCtx.fillRect(flameCenterX + 4, flameBaseY - 5, 2, 4);
          } else if (flamePhase === 1) {
            dinoCtx.fillRect(flameCenterX - 4, flameBaseY - 5, 7, 4);
            dinoCtx.fillRect(flameCenterX, flameBaseY - 9, 3, 5);
            dinoCtx.fillRect(flameCenterX - 3, flameBaseY - 8, 2, 3);
          } else {
            dinoCtx.fillRect(flameCenterX - 2, flameBaseY - 8, 4, 7);
            dinoCtx.fillRect(flameCenterX + 2, flameBaseY - 11, 2, 4);
            dinoCtx.fillRect(flameCenterX - 4, flameBaseY - 5, 3, 3);
          }
        } else if (obs.type === 'flame') {
          drawPixelMap(dinoCtx, SIMPLE_FLAME_SPRITE, obs.x, obs.y, 1, themeColor);
          const sparkPhase = Math.floor((dinoState.flameTick + i * 3) / 4) % 3;
          dinoCtx.fillStyle = themeColor;
          if (sparkPhase === 0) {
            dinoCtx.fillRect(obs.x + 8, obs.y - 4, 3, 3);
            dinoCtx.fillRect(obs.x + 3, obs.y - 2, 2, 2);
          } else if (sparkPhase === 1) {
            dinoCtx.fillRect(obs.x + 10, obs.y - 6, 2, 3);
            dinoCtx.fillRect(obs.x + 12, obs.y - 3, 2, 2);
          } else {
            dinoCtx.fillRect(obs.x + 7, obs.y - 5, 4, 2);
            dinoCtx.fillRect(obs.x + 13, obs.y - 2, 2, 2);
          }
        } else if (obs.type === 'oven') {
          drawPixelMap(dinoCtx, CLAY_OVEN_SPRITE, obs.x, obs.y, 1, themeColor);
          const emberPhase = Math.floor((dinoState.flameTick + i * 2) / 4) % 2;
          dinoCtx.fillStyle = themeColor;
          if (emberPhase === 0) dinoCtx.fillRect(obs.x + 8, obs.y + 13, 4, 3);
          else dinoCtx.fillRect(obs.x + 7, obs.y + 12, 6, 4);
        }

        const dBox = { x: dino.x + 4, y: dino.y + 2, w: dino.width - 8, h: dino.height - 3 };
        const oBox = { x: obs.x + 2, y: obs.y - 2, w: obs.width - 4, h: obs.height + 2 };

        if (dBox.x < oBox.x + oBox.w && dBox.x + dBox.w > oBox.x && dBox.y < oBox.y + oBox.h && dBox.y + dBox.h > oBox.y) {
          dinoState.isGameOver = true;
          if (emptyTitleEl) {
            emptyTitleEl.classList.remove('opacity-0', 'pointer-events-none');
            emptyTitleEl.classList.add('opacity-100');
          }
        }

        if (obs.x < -40) dinoState.obstacles.splice(i, 1);
      }

      dinoCtx.fillStyle = themeColor;
      dinoCtx.font = "bold 11px 'Google Sans Code', monospace";
      dinoCtx.textAlign = "right";
      const curScoreStr = String(Math.floor(dinoState.score)).padStart(5, '0');
      const hiScoreStr = String(dinoState.highScore).padStart(5, '0');
      dinoCtx.fillText(`HI ${hiScoreStr}  ${curScoreStr}`, canvasW - 8, 20);

      if (dinoState.isGameOver) {
        dinoCtx.textAlign = "center";
        dinoCtx.font = "bold 14px 'Google Sans Code', monospace";
        dinoCtx.fillText("G A M E   O V E R", canvasW / 2, 68);
        dinoCtx.font = "11px 'Google Sans Code', monospace";
        dinoCtx.fillText("TAP OR PRESS SPACE TO RESTART", canvasW / 2, 90);
      }

      dinoAnimId = requestAnimationFrame(updateDinoGame);
    }

    function startDinoGame() {
      if (dinoGameActive) return;
      dinoGameActive = true;
      dinoState = initDinoState();
      if (dinoAnimId) cancelAnimationFrame(dinoAnimId);
      dinoAnimId = requestAnimationFrame(updateDinoGame);
    }

    function stopDinoGame() {
      dinoGameActive = false;
      if (dinoAnimId) {
        cancelAnimationFrame(dinoAnimId);
        dinoAnimId = null;
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && dinoGameActive) {
        if (dinoAnimId) {
          cancelAnimationFrame(dinoAnimId);
          dinoAnimId = null;
        }
      } else if (!document.hidden && dinoGameActive && !dinoAnimId) {
        dinoAnimId = requestAnimationFrame(updateDinoGame);
      }
    });

    if (dinoCanvas) {
      dinoCanvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        jumpDino();
      });
    }

    function initTheme() {
      const savedTheme = localStorage.getItem("tot-theme");
      const isDark = savedTheme !== null ? savedTheme === "dark" : false;
      document.documentElement.classList.toggle("dark", isDark);

      themeToggleBtn.addEventListener("click", () => {
        rotationDeg += 180;
        yinYangIcon.style.transform = `rotate(${rotationDeg}deg)`;

        const toggleThemeLogic = () => {
          const currentlyDark = document.documentElement.classList.toggle("dark");
          localStorage.setItem("tot-theme", currentlyDark ? "dark" : "light");
          updateToolbarStyles();
        };

        if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.startViewTransition(() => toggleThemeLogic());
        } else {
          document.documentElement.classList.add("theme-transition");
          toggleThemeLogic();
          setTimeout(() => document.documentElement.classList.remove("theme-transition"), 300);
        }
      });
    }

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("hidden", !searchQuery);
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        updateUrlState();
        filterPlaces();
      }, 150);
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.classList.add("hidden");
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      updateUrlState();
      filterPlaces();
    });

    cityFilterSelect.addEventListener("change", (e) => {
      activeCity = e.target.value;
      updateUrlState();
      filterPlaces();
    });

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      fetchPlaces();
    });
  </script>
</body>
</html>
