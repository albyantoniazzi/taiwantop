        <!-- Controls Group: Search, City Filter, Drift Toggle, and Yin-Yang Toggle inline -->
        <div class="flex items-center gap-2.5 sm:gap-3.5 flex-1 justify-end">
          
          <!-- Search Input -->
          <div class="relative flex-1 max-w-[180px] sm:max-w-xs">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Search..." 
              class="w-full bg-transparent dark:bg-[#333333] border border-[#292929] dark:border-white rounded-full px-4 py-1 text-xs sm:text-sm font-semibold text-[#292929] dark:text-white placeholder-[#292929] dark:placeholder-white focus:outline-none transition"
            />
            <button 
              id="clear-search-btn" 
              type="button" 
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-[#292929] dark:text-white"
            >
              ×
            </button>
          </div>

          <!-- City Dropdown -->
          <div class="relative flex-shrink-0">
            <select 
              id="city-filter" 
              aria-label="Filter by City"
              class="appearance-none bg-transparent dark:bg-[#333333] border border-[#292929] dark:border-white rounded-md pl-3 pr-7 py-1 text-xs sm:text-sm font-semibold text-[#292929] dark:text-white focus:outline-none transition cursor-pointer"
            >
              <option value="ALL" class="dark:bg-[#333333]">All Cities</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-[#292929] dark:text-white">
              <svg class="w-3 h-3 fill-current" viewBox="0 0 20 20">
                <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
              </svg>
            </div>
          </div>

          <!-- Ambient Drift Toggle Button -->
          <button 
            id="drift-toggle-btn" 
            type="button" 
            title="Pause / Resume ambient drift"
            aria-label="Toggle ambient drift"
            class="h-7 w-7 flex-shrink-0 flex items-center justify-center rounded-full border border-[#292929] dark:border-white text-[#292929] dark:text-white hover:bg-[#292929] hover:text-[#EBF1E5] dark:hover:bg-white dark:hover:text-[#292929] transition cursor-pointer focus:outline-none"
          >
            <svg id="drift-pause-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

              <path d="M8 5v14l11-7z" />
            </svg>
          </button>

          <!-- Taoist Pure Black & White Yin-Yang Theme Toggle -->

            id="theme-toggle"

  <!-- Infinite Canvas Viewport -->
  <main id="canvas-viewport" class="relative w-full h-full overflow-hidden canvas-bg">

    <!-- Virtual Transformed World Layer -->
    <div id="canvas-world"></div>

    <!-- Loading State -->
    <div id="loading-state" class="absolute inset-0 flex items-center justify-center pointer-events-none z-30">
      <div class="flex items-center gap-3 px-5 py-2.5 border border-[#292929] dark:border-white bg-[#EBF1E5] dark:bg-[#333333] text-xs sm:text-sm font-semibold text-[#292929] dark:text-white shadow-lg">
        <span class="w-3 h-3 rounded-full bg-[#292929] dark:bg-white animate-ping"></span>
        <span id="loading-text">Loading places...</span>
      </div>
    </div>

    <!-- Empty State with Goose Runner Game -->
    <div id="empty-state" class="hidden absolute inset-0 pt-24 flex-col items-center justify-center text-center z-20 px-4">
      <p id="empty-state-title" class="text-base sm:text-lg font-bold text-[#292929] dark:text-white mb-2 transition-opacity duration-200">Sorry, nothing here...</p>
      
      <!-- Dino / Goose Game Container -->
      <div class="relative w-full max-w-xl mx-auto flex flex-col items-center">
        <canvas 
          id="dino-canvas" 
          width="600" 
          height="160" 
          class="w-full h-[160px] bg-transparent cursor-pointer border-b border-[#292929] dark:border-white select-none touch-none"
        ></canvas>
        <div class="mt-3 flex items-center justify-between w-full text-[11px] font-semibold text-[#292929] dark:text-white px-1">
          <span>Press [SPACE] or Tap to Jump</span>
          <button 
            id="reset-filter-btn" 
            type="button" 
            class="underline font-bold hover:opacity-75 cursor-pointer"
          >
            Reset filters
          </button>
        </div>
      </div>
    </div>

    <!-- Floating Bottom-Right Canvas Controls (Matching #EBF1E5 / #292929 palette) -->
    <aside class="fixed bottom-4 right-4 z-40 pointer-events-none flex items-center gap-2">
      <!-- Live Spot Counter Pill -->
      <div class="pointer-events-auto hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full border border-[#292929] dark:border-white bg-[#EBF1E5]/90 dark:bg-[#333333]/90 backdrop-blur-md text-[11px] font-bold text-[#292929] dark:text-white shadow-sm">
        <span id="places-count">0</span>
        <span>spots</span>

, vx: 0, vy: 0, friction: 0.93,  cardWidth: 295, cardHeight: 335, gapX: 18, gapY: 18, cols: 6, rows: 6, worldWidth: 0, worldHeight: 0, tiles: [] };  function setZoom(newScale, focalX = window.innerWidth / 2, focalY = window.innerHeight / 2) { const clamped = Math.min(CANVAS.maxScale, Math.max(CANVAS.minScale, newScale)); if (Math.abs(clamped - CANVAS.scale) < 0.001) return;  const worldFocalX = CANVAS.camX + focalX / CANVAS.scale; const worldFocalY = CANVAS.camY + focalY / CANVAS.scale;  CANVAS.scale = clamped; CANVAS.camX = worldFocalX - focalX / CANVAS.scale; CANVAS.camY = worldFocalY - focalY / CANVAS.scale;  zoomResetBtn.textContent = `${Math.round(CANVAS.scale * 100)}%`;
    }

      const count = visiblePlaces.length;
