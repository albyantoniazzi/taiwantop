<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #0b0b0c;
      --bg-card: #141416;
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(255, 255, 255, 0.28);
      --text-primary: #f4f4f6;
      --text-secondary: #9898a0;
      --accent-jade: #38d9a9;
      --accent-amber: #f59f00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .font-editorial {
      font-family: 'Instrument Serif', Georgia, serif;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Subtle architectural dot matrix background that shifts with pan */
    #grid-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.11) 1px, transparent 1px);
      background-size: 36px 36px;
      z-index: 0;
      will-change: background-position, background-size;
    }

    /* Ambient vignette for depth */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 48%, rgba(5, 5, 7, 0.82) 100%);
      z-index: 2;
    }

    /* Infinite Viewport */
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      z-index: 1;
      touch-action: none;
    }

    #viewport.is-dragging {
      cursor: grabbing;
    }

    #world-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      will-change: transform;
    }

    /* Spatial Card Tile */
    .spatial-card {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 20px 44px -12px rgba(0, 0, 0, 0.78), 0 0 0 1px rgba(255,255,255,0.03);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform, opacity;
    }

    .spatial-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 28px 58px -12px rgba(0, 0, 0, 0.9), 0 0 24px rgba(56, 217, 169, 0.14);
      z-index: 20;
    }

    .spatial-card .card-media {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #1a1a1e;
    }

    .spatial-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .spatial-card:hover img {
      transform: scale(1.06);
    }

    /* Glassmorphic Floating HUD */
    .hud-glass {
      background: rgba(16, 16, 19, 0.72);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    /* Custom Scrollbar inside modal */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 99px;
    }

    /* Filter Pill Active State */
    .filter-pill.active {
      background: #f4f4f6;
      color: #0b0b0c;
      border-color: #f4f4f6;
      font-weight: 500;
    }

    /* Hide scrollbar on bottom category dock while preserving smooth horizontal scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .live-dot {
      animation: pulseDot 2.2s infinite ease-in-out;
    }
  </style>
</head>

    // Application State
    const state = {
      places: [],

      velX: 0,

      // World Tiling Dimensions (Mosaic Masonry Pattern)
      tileCols: 4,
      tileRows: 4,
      cellW: 276,
      cellH: 256,

      imageRatios: new Map(),

      // Active DOM Pool for Virtualized Infinite Tiling

    /**
     * Preload natural image dimensions so every mosaic card matches its photo's exact uncropped aspect ratio
     */
    function preloadImageRatios(places) {
      return Promise.all(places.map(p => new Promise((resolve) => {
        if (!p.image || state.imageRatios.has(p.image)) {
          resolve();
          return;
        }
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth > 0 && img.naturalHeight > 0) {
            state.imageRatios.set(p.image, img.naturalHeight / img.naturalWidth);
          }
          resolve();
        };
        img.onerror = () => {
          state.imageRatios.set(p.image, 0.75);
          resolve();
        };
        img.src = p.image;
      })));
    }

    /**
     * Builds a uniform-gap masonry layout using each photo's original uncropped aspect ratio
     * with identical horizontal and vertical spacing across infinite X/Y sectors.
     */
    function rebuildSpatialBlueprint() {
      // Clear existing DOM nodes
      worldLayer.innerHTML = '';
      state.nodePool.clear();

      const count = state.filteredPlaces.length;
      state.tileCols = Math.max(4, Math.ceil(Math.sqrt(count * 1.4)));
      state.tileRows = Math.max(3, Math.ceil(count / state.tileCols));

      const colWidth = 264;
      const gap = 14;
      state.cellW = colWidth + gap;
      state.cellH = 264;
      state.worldW = state.tileCols * state.cellW;

      // Distribute items into shortest column so column heights stay naturally balanced
      const columns = Array.from({ length: state.tileCols }, (_, c) => ({
        col: c,
        initialOffset: (c % 2 === 1) ? 84 : ((c % 3 === 2) ? 42 : 0),
        items: [],
        totalH: 0
      }));

      const totalSlots = state.tileCols * state.tileRows;
      for (let idx = 0; idx < totalSlots; idx++) {
        const place = state.filteredPlaces[idx % count];
        const ratio = state.imageRatios.get(place.image) || 0.75;
        const cardH = Math.max(120, Math.round(colWidth * ratio));

        // Pick column with smallest current height (including stagger) for balanced masonry
        let targetCol = columns[0];
        for (let c = 1; c < columns.length; c++) {
          if (columns[c].initialOffset + columns[c].totalH < targetCol.initialOffset + targetCol.totalH) {
            targetCol = columns[c];
          }
        }

        targetCol.items.push({
          slotIndex: idx,
          placeIndex: idx % count,
          place,
          col: targetCol.col,
          width: colWidth,
          height: cardH
        });
        targetCol.totalH += cardH + gap;
      }

      // Equalize column period cleanly with uniform `gap` horizontally & vertically
      const maxTotalH = Math.max(...columns.map(col => col.totalH));
      state.worldH = maxTotalH;
      state.slots = [];

      columns.forEach(colObj => {
        const slack = maxTotalH - colObj.totalH;
        const perItemAdjust = colObj.items.length > 0 ? slack / colObj.items.length : 0;
        let runningY = colObj.initialOffset;

        colObj.items.forEach(item => {
          const adjustedH = Math.max(110, Math.round(item.height + perItemAdjust));
          state.slots.push({
            ...item,
            baseX: colObj.col * state.cellW,
            baseY: Math.round(runningY),
            height: adjustedH
          });
          runningY += adjustedH + gap;
        });
      });

      // Center initial view on the first card
      if (state.slots.length > 0 && state.camX === 0 && state.camY === 0) {
        state.camX = state.targetX = -state.slots[0].baseX - (state.slots[0].width * 0.5);
        state.camY = state.targetY = -state.slots[0].baseY - (state.slots[0].height * 0.5);
      }
    }

    /**
     * Smoothly glide camera to center on a specific filtered place index
     */
    function flyToPlace(placeIdx) {
      if (!state.slots || state.slots.length === 0) return;
      const targetSlot = state.slots.find(s => s.placeIndex === placeIdx) || state.slots[0];
      state.velX = 0;
      state.velY = 0;
      state.targetX = -targetSlot.baseX - (targetSlot.width * 0.5);
      state.targetY = -targetSlot.baseY - (targetSlot.height * 0.5);
    }

    /**

    /**

    /**
     * Render CSV Name Autocomplete Dropdown
     */
    function renderAutocomplete(queryText) {
      const dropdown = document.getElementById('autocomplete-dropdown');
      const q = queryText.toLowerCase().trim();

      if (!q) {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';

      const matches = state.places
        .filter(p =>
          p.title.toLowerCase().includes(q) ||
          (p.subtitle && p.subtitle.toLowerCase().includes(q))

      if (matches.length === 0) {

      dropdown.innerHTML = matches.map(p => `
        <button
          type="button"

      dropdown.querySelectorAll('.autocomplete-item').forEach(btn => {

          const selectedPlace = state.places.find(item => item.id === placeId);
          if (!selectedPlace) return;

          const searchInput = document.getElementById('search-input');
          const clearSearchBtn = document.getElementById('clear-search-btn');

          searchInput.value = selectedPlace.title;
          state.searchQuery = selectedPlace.title;
          clearSearchBtn.classList.remove('hidden');
          dropdown.classList.add('hidden');

          // Reset category to ALL if needed so the selected place is guaranteed visible
          const placeCats = Array.isArray(selectedPlace.categories) ? selectedPlace.categories : [selectedPlace.category];
          if (state.activeCategory !== 'ALL' && !placeCats.includes(state.activeCategory)) {
            state.activeCategory = 'ALL';
            document.querySelectorAll('#category-bar .filter-pill').forEach(b => {
              b.classList.toggle('active', b.dataset.category === 'ALL');
            });
          }

          applyFilters();
          const filteredIdx = state.filteredPlaces.findIndex(item => item.id === placeId);
          flyToPlace(filteredIdx >= 0 ? filteredIdx : 0);
        });
      });

      dropdown.classList.remove('hidden');
    }

    /**
     * Pointer & Touch Pan Gestures (Fixed Scale — Zoom Disabled)
     */
    function bindInteractions() {
      // Mouse Pan
      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        state.isDragging = true;
        state.dragMoved = false;
        state.lastPointerX = e.clientX;
        state.lastPointerY = e.clientY;
        state.velX = 0;
        state.velY = 0;
        viewport.classList.add('is-dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.isDragging) return;
        const dx = e.clientX - state.lastPointerX;
        const dy = e.clientY - state.lastPointerY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          state.dragMoved = true;
        }

        state.targetX += dx;
        state.targetY += dy;
        state.velX = dx * 0.65;
        state.velY = dy * 0.65;

        state.lastPointerX = e.clientX;
        state.lastPointerY = e.clientY;
      });

      window.addEventListener('mouseup', () => {
        state.isDragging = false;
        viewport.classList.remove('is-dragging');
        setTimeout(() => { state.dragMoved = false; }, 40);
      });

      // Trackpad / Mouse Wheel Pan (No Zoom)
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        state.targetX -= e.deltaX;
        state.targetY -= e.deltaY;
      }, { passive: false });

      // Single-Finger Touch Pan (Pinch Zoom Disabled)
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          state.isDragging = true;
          state.dragMoved = false;
          state.lastPointerX = e.touches[0].clientX;
          state.lastPointerY = e.touches[0].clientY;
          state.velX = 0;
          state.velY = 0;
        } else {
          state.isDragging = false;
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && state.isDragging) {
          const dx = e.touches[0].clientX - state.lastPointerX;
          const dy = e.touches[0].clientY - state.lastPointerY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) state.dragMoved = true;

          state.targetX += dx;
          state.targetY += dy;
          state.velX = dx * 0.6;
          state.velY = dy * 0.6;

          state.lastPointerX = e.touches[0].clientX;
          state.lastPointerY = e.touches[0].clientY;
        }
      }, { passive: true });

      viewport.addEventListener('touchend', () => {
        state.isDragging = false;
        setTimeout(() => { state.dragMoved = false; }, 50);
      });

      // Keyboard Navigation (Arrow keys + Escape)
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === document.getElementById('search-input')) return;
        const step = 180;
        if (e.key === 'ArrowLeft') state.targetX += step;
        if (e.key === 'ArrowRight') state.targetX -= step;
        if (e.key === 'ArrowUp') state.targetY += step;
        if (e.key === 'ArrowDown') state.targetY -= step;
        if (e.key === 'Escape') {
          closeDetailModal();
          document.getElementById('autocomplete-dropdown').classList.add('hidden');
        }
      });

      // Search Input & CSV Autocomplete
      const searchInput = document.getElementById('search-input');
      const clearSearchBtn = document.getElementById('clear-search-btn');
      const autocompleteDropdown = document.getElementById('autocomplete-dropdown');

      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        clearSearchBtn.classList.toggle('hidden', !state.searchQuery);
        renderAutocomplete(state.searchQuery);
        applyFilters();
        flyToPlace(0);
      });

      searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim()) {
          renderAutocomplete(searchInput.value);
        }
      });

      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !autocompleteDropdown.contains(e.target)) {
          autocompleteDropdown.classList.add('hidden');
        }
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        state.searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        autocompleteDropdown.classList.add('hidden');
        applyFilters();
      });

      // Detail Modal Controls
      document.getElementById('close-modal-btn').addEventListener('click', closeDetailModal);
      document.getElementById('detail-modal').addEventListener('click', (e) => {
        if (e.target.id === 'detail-modal') closeDetailModal();
      });
      document.getElementById('modal-prev-btn').addEventListener('click', () => {
        const nextIdx = (state.selectedIndex - 1 + state.filteredPlaces.length) % state.filteredPlaces.length;
        openDetailModal(nextIdx);
        flyToPlace(nextIdx);
      });
      document.getElementById('modal-next-btn').addEventListener('click', () => {
        const nextIdx = (state.selectedIndex + 1) % state.filteredPlaces.length;
        openDetailModal(nextIdx);
        flyToPlace(nextIdx);
      });
    }

    /**
     * RFC-4180 Compliant CSV Parser
     */
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (insideQuotes) {
          if (char === '"' && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            insideQuotes = false;
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            insideQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (char === '\r' && nextChar === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (char === '\n' || char === '\r') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += char;
          }
        }
      }

      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      return rows.filter(r => r.some(cell => cell.length > 0));
    }

    /**
     * Normalize region strings from CSV into filter buckets
     */
    function normalizeRegion(rawRegion, city = '') {
      const text = `${rawRegion} ${city}`.toLowerCase();
      if (text.includes('north') || text.includes('taipei') || text.includes('keelung') || text.includes('taoyuan') || text.includes('hsinchu') || text.includes('yilan')) {
        return 'North';
      }
      if (text.includes('central') || text.includes('taichung') || text.includes('nantou') || text.includes('changhua') || text.includes('miaoli') || text.includes('yunlin') || text.includes('chiayi') || text.includes('alishan')) {
        return 'Central';
      }
      if (text.includes('south') || text.includes('tainan') || text.includes('kaohsiung') || text.includes('pingtung') || text.includes('kenting')) {
        return 'South';
      }
      if (text.includes('east') || text.includes('hualien') || text.includes('taitung') || text.includes('island') || text.includes('penghu') || text.includes('kinmen') || text.includes('matsu') || text.includes('lanyu')) {
        return 'East & Islands';
      }
      return 'North';
    }

    /**
     * Map flexible CSV columns onto structured place objects
     */
    function mapRowToPlace(headers, row, index) {
      const record = {};
      headers.forEach((h, i) => {
        record[h.toLowerCase().trim()] = row[i] || '';
      });

      const pick = (...keys) => {
        for (const k of keys) {
          const foundKey = Object.keys(record).find(rk => rk === k || rk.includes(k));
          if (foundKey && record[foundKey]) return record[foundKey];
        }
        return '';
      };

      const title = pick('name', 'title', 'place', 'spot', 'destination', 'location') || row[0] || `Taiwan Spot #${index + 1}`;
      const subtitle = pick('chinese', 'mandarin', 'subtitle', 'zh', 'local');
      const city = pick('city', 'county', 'area', 'district', 'address') || 'Taiwan';
      const rawRegion = pick('region', 'zone', 'part');
      const region = normalizeRegion(rawRegion, city);
      const rawCategory = pick('category', 'type', 'tag', 'theme') || 'Curated Spot';
      const categories = rawCategory.split(',').map(c => c.trim()).filter(Boolean);
      const category = categories.join(' · ') || 'Curated Spot';
      const rating = pick('rating', 'score', 'stars') || '4.8';
      const coords = pick('coords', 'coordinates', 'lat', 'gps') || '23.6978° N, 120.9605° E';
      const description = pick('description', 'desc', 'about', 'notes', 'summary', 'info', 'review') ||
        `Selected highlight in ${city}, featured in the TAIWANESE TOP spatial collection.`;
      const highlight = pick('highlight', 'must', 'specialty', 'tip', 'recommendation');

      let image = pick('image', 'photo', 'img', 'pic', 'thumbnail', 'cover', 'url');
      if (image && !image.startsWith('http')) {
        image = '';
      }
      if (!image) {
        const fallbackHero = FALLBACK_PLACES[index % FALLBACK_PLACES.length].image;
        image = fallbackHero;
      }

      const mapsUrl = pick('map', 'google', 'link', 'directions') ||
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${title} ${city} Taiwan`)}`;

      // Capture any remaining unmapped CSV columns for the detail modal
      const standardTokens = ['name', 'title', 'place', 'spot', 'destination', 'location', 'chinese', 'mandarin', 'subtitle', 'zh', 'local', 'city', 'county', 'area', 'district', 'address', 'region', 'zone', 'part', 'category', 'type', 'tag', 'theme', 'rating', 'score', 'stars', 'coords', 'coordinates', 'lat', 'gps', 'description', 'desc', 'about', 'notes', 'summary', 'info', 'review', 'highlight', 'must', 'specialty', 'tip', 'recommendation', 'image', 'photo', 'img', 'pic', 'thumbnail', 'cover', 'url', 'map', 'google', 'link', 'directions'];
      const extraFields = {};
      headers.forEach((h, i) => {
        const keyLower = h.toLowerCase().trim();
        if (h && row[i] && !standardTokens.some(tok => keyLower.includes(tok))) {
          extraFields[h] = row[i];
        }
      });

      return {
        id: index + 1,
        title,
        subtitle,
        city,
        region,
        category,
        categories: categories.length ? categories : ['Curated Spot'],
        rating,
        coords,
        description,
        image,
        mapsUrl,
        highlight,
        extraFields: Object.keys(extraFields).length ? extraFields : null
      };
    }

    /**
     * Fetch & Parse Google Sheets CSV with fallback safety
     */
    async function loadDatabase() {
      let loadedFromSheet = false;

      for (const url of CSV_ENDPOINTS) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) continue;
          const csvText = await response.text();
          if (!csvText || csvText.trim().startsWith('<!DOCTYPE')) continue;

          const rows = parseCSV(csvText);
          if (rows.length >= 2) {
            const headers = rows[0];
            const parsedPlaces = rows
              .slice(1)
              .map((row, idx) => mapRowToPlace(headers, row, idx))
              .filter(p => p.title && p.title.length > 0);

            if (parsedPlaces.length > 0) {
              state.places = parsedPlaces;
              state.isLiveSheet = true;
              loadedFromSheet = true;
              break;
            }
          }
        } catch (err) {
          console.warn('CSV fetch attempt failed, falling back if needed:', err);
        }
      }

      if (!loadedFromSheet) {
        state.places = FALLBACK_PLACES.map(p => ({
          ...p,
          categories: p.category.split(',').map(c => c.trim()).filter(Boolean)
        }));
        state.isLiveSheet = false;
      }

      buildCategoryToolbar();
      await preloadImageRatios(state.places);
      applyFilters();
    }

    /**
     * Filter places by active single category and search input, then rebuild mosaic
     */
    function applyFilters() {
      const q = state.searchQuery.toLowerCase().trim();

      state.filteredPlaces = state.places.filter(p => {
        const placeCats = Array.isArray(p.categories) ? p.categories : [p.category];
        const matchesCategory = state.activeCategory === 'ALL' || placeCats.includes(state.activeCategory);
        const matchesQuery = !q ||
          p.title.toLowerCase().includes(q) ||
          (p.subtitle && p.subtitle.toLowerCase().includes(q)) ||
          (p.city && p.city.toLowerCase().includes(q)) ||
          (p.category && p.category.toLowerCase().includes(q));
        return matchesCategory && matchesQuery;
      });

      if (state.filteredPlaces.length === 0) {
        state.filteredPlaces = [...state.places];
      }

      rebuildSpatialBlueprint();
    }

    /**
     * Infinite Toroidal Viewport Culling & Inertial Camera Loop (60fps)
     */
    function updateCanvas() {
      if (!state.isDragging) {
        state.targetX += state.velX;
        state.targetY += state.velY;
        state.velX *= 0.92;
        state.velY *= 0.92;

        if (Math.abs(state.velX) < 0.01) state.velX = 0;
        if (Math.abs(state.velY) < 0.01) state.velY = 0;
      }

      // Smooth spring damping toward target camera coordinates
      state.camX += (state.targetX - state.camX) * 0.14;
      state.camY += (state.targetY - state.camY) * 0.14;

      // Parallax dot-matrix backdrop
      gridBackdrop.style.backgroundPosition = `${state.camX * 0.35}px ${state.camY * 0.35}px`;

      if (state.slots && state.slots.length > 0 && state.worldW > 0 && state.worldH > 0) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const buffer = 360;

        // Visible bounds in world space (camera centered on viewport)
        const minWorldX = -state.camX - (vw * 0.5) - buffer;
        const maxWorldX = -state.camX + (vw * 0.5) + buffer;
        const minWorldY = -state.camY - (vh * 0.5) - buffer;
        const maxWorldY = -state.camY + (vh * 0.5) + buffer;

        const startSecX = Math.floor(minWorldX / state.worldW);
        const endSecX = Math.floor(maxWorldX / state.worldW);
        const startSecY = Math.floor(minWorldY / state.worldH);
        const endSecY = Math.floor(maxWorldY / state.worldH);

        const activeKeys = new Set();

        for (let sx = startSecX; sx <= endSecX; sx++) {
          const offsetX = sx * state.worldW;
          for (let sy = startSecY; sy <= endSecY; sy++) {
            const offsetY = sy * state.worldH;

            for (let i = 0; i < state.slots.length; i++) {
              const slot = state.slots[i];
              const worldX = offsetX + slot.baseX;
              const worldY = offsetY + slot.baseY;

              if (
                worldX + slot.width < minWorldX ||
                worldX > maxWorldX ||
                worldY + slot.height < minWorldY ||
                worldY > maxWorldY
              ) {
                continue;
              }

              const key = `${sx}:${sy}:${slot.slotIndex}`;
              activeKeys.add(key);

              let el = state.nodePool.get(key);
              if (!el) {
                el = createCardElement(slot);
                state.nodePool.set(key, el);
                worldLayer.appendChild(el);
              }

              const screenX = Math.round(worldX + state.camX + vw * 0.5);
              const screenY = Math.round(worldY + state.camY + vh * 0.5);
              el.style.transform = `translate3d(${screenX}px, ${screenY}px, 0)`;
            }
          }
        }

        // Recycle tiles outside viewport frustum
        for (const [key, el] of state.nodePool.entries()) {
          if (!activeKeys.has(key)) {
            el.remove();
            state.nodePool.delete(key);
          }
        }
      }

      requestAnimationFrame(updateCanvas);
    }

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => {
      bindInteractions();
      loadDatabase();
      requestAnimationFrame(updateCanvas);
    });
  </script>
</body>
