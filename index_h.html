<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAIWAN TOP — Curated Places by @albyantoniazzi</title>
  <meta name="description" content="A curated directory of top places, eats, and hidden gems across Taiwan compiled by @albyantoniazzi (@alby.food)." />

  <!-- Fonts: Hellovetica & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..500,0..1,0&icon_names=casino,check_circle,chevron_left,chevron_right,close,dark_mode,done,expand_more,light_mode,location_on,map,open_in_new,refresh,restart_alt,restaurant,search,share,sort,sort_by_alpha,sports_esports,storefront,tag&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS for responsive layout utilities -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Hellovetica"', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['"Hellovetica"', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- PapaParse for client-side CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaTfpa48djpNbZ18legh+9h+9h6Q1A1jYx81Y1b+9h6Q1A1jYx81Y1b+9w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Fallback CDN for PapaParse if integrity hash differs across mirrors -->
  <script>
    if (typeof Papa === 'undefined') {
      document.write('<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"><\/script>');
    }
  </script>

  <style>
    /* ==========================================================================
       CUSTOM FONT FACE: HELLOVETICA
       Place hellovetica.ttf in the same GitHub repository directory as index.html
       ========================================================================== */
    @font-face {
      font-family: 'Hellovetica';
      src: url('./hellovetica.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* ==========================================================================
       MATERIAL DESIGN 3 (MD3) DESIGN TOKENS
       Dynamic Taiwan-inspired seed palette (Alishan Jade & Night Market Lantern Terracotta)
       ========================================================================== */
    :root {
      /* Light Scheme Color Tokens */
      --md-sys-color-primary: #1B6B52;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #A5F2D3;
      --md-sys-color-on-primary-container: #002116;

      --md-sys-color-secondary: #4C6358;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #CEE9DA;
      --md-sys-color-on-secondary-container: #092017;

      --md-sys-color-tertiary: #9C4233;
      --md-sys-color-on-tertiary: #FFFFFF;
      --md-sys-color-tertiary-container: #FFDAD4;
      --md-sys-color-on-tertiary-container: #410000;

      --md-sys-color-error: #BA1A1A;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #410002;

      --md-sys-color-surface: #F6FBF7;
      --md-sys-color-on-surface: #171D1A;
      --md-sys-color-on-surface-variant: #3F4944;

      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F0F5F1;
      --md-sys-color-surface-container: #EAEFEB;
      --md-sys-color-surface-container-high: #E4EAE5;
      --md-sys-color-surface-container-highest: #DFE4E0;

      --md-sys-color-inverse-surface: #2C322F;
      --md-sys-color-inverse-on-surface: #EDF2EE;
      --md-sys-color-inverse-primary: #8AD6B8;

      --md-sys-color-outline: #707973;
      --md-sys-color-outline-variant: #BFC9C2;
      --md-sys-color-scrim: rgba(0, 0, 0, 0.48);
      --goose-accent-color: #9C4233;

      /* Typography Tokens */
      --md-sys-typescale-font-family: 'Hellovetica', Helvetica, Arial, sans-serif;

      /* Shape Tokens */
      --md-sys-shape-corner-extra-small: 4px;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-large: 16px;
      --md-sys-shape-corner-large-increased: 20px;
      --md-sys-shape-corner-extra-large: 28px;
      --md-sys-shape-corner-full: 9999px;

      /* Motion Tokens */
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
      --md-sys-motion-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
      --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-duration-short: 200ms;
      --md-sys-motion-duration-medium: 300ms;
      --md-sys-motion-duration-long: 450ms;
    }

    /* Dark Mode Theme Tokens */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #8AD6B8;
        --md-sys-color-on-primary: #003828;
        --md-sys-color-primary-container: #00513C;
        --md-sys-color-on-primary-container: #A5F2D3;

        --md-sys-color-secondary: #B3CCBE;
        --md-sys-color-on-secondary: #1E352B;
        --md-sys-color-secondary-container: #354B41;
        --md-sys-color-on-secondary-container: #CEE9DA;

        --md-sys-color-tertiary: #FFB4A7;
        --md-sys-color-on-tertiary: #5F150B;
        --md-sys-color-tertiary-container: #7D2B1F;
        --md-sys-color-on-tertiary-container: #FFDAD4;

        --md-sys-color-error: #FFB4AB;
        --md-sys-color-on-error: #690005;
        --md-sys-color-error-container: #93000A;
        --md-sys-color-on-error-container: #FFDAD6;

        --md-sys-color-surface: #0F1512;
        --md-sys-color-on-surface: #DFE4E0;
        --md-sys-color-on-surface-variant: #BFC9C2;

        --md-sys-color-surface-container-lowest: #0A0F0D;
        --md-sys-color-surface-container-low: #171D1A;
        --md-sys-color-surface-container: #1B211E;
        --md-sys-color-surface-container-high: #262B28;
        --md-sys-color-surface-container-highest: #303633;

        --md-sys-color-inverse-surface: #DFE4E0;
        --md-sys-color-inverse-on-surface: #2C322F;
        --md-sys-color-inverse-primary: #1B6B52;

        --md-sys-color-outline: #89938D;
        --md-sys-color-outline-variant: #3F4944;
        --md-sys-color-scrim: rgba(0, 0, 0, 0.68);
        --goose-accent-color: #FFDAD4;
      }
    }

    :root[data-theme="dark"] {
      --md-sys-color-primary: #8AD6B8;
      --md-sys-color-on-primary: #003828;
      --md-sys-color-primary-container: #00513C;
      --md-sys-color-on-primary-container: #A5F2D3;

      --md-sys-color-secondary: #B3CCBE;
      --md-sys-color-on-secondary: #1E352B;
      --md-sys-color-secondary-container: #354B41;
      --md-sys-color-on-secondary-container: #CEE9DA;

      --md-sys-color-tertiary: #FFB4A7;
      --md-sys-color-on-tertiary: #5F150B;
      --md-sys-color-tertiary-container: #7D2B1F;
      --md-sys-color-on-tertiary-container: #FFDAD4;

      --md-sys-color-surface: #0F1512;
      --md-sys-color-on-surface: #DFE4E0;
      --md-sys-color-on-surface-variant: #BFC9C2;

      --md-sys-color-surface-container-lowest: #0A0F0D;
      --md-sys-color-surface-container-low: #171D1A;
      --md-sys-color-surface-container: #1B211E;
      --md-sys-color-surface-container-high: #262B28;
      --md-sys-color-surface-container-highest: #303633;

      --md-sys-color-inverse-surface: #DFE4E0;
      --md-sys-color-inverse-on-surface: #2C322F;
      --md-sys-color-inverse-primary: #1B6B52;

      --md-sys-color-outline: #89938D;
      --md-sys-color-outline-variant: #3F4944;
      --md-sys-color-scrim: rgba(0, 0, 0, 0.68);
      --goose-accent-color: #FFDAD4;
    }

    /* Spots Badge: Consistent #FFDAD4 / #410000 in both light and dark modes */
    #header-total-badge {
      background-color: #FFDAD4;
      color: #410000;
    }

    html {
      font-family: 'Hellovetica', Helvetica, Arial, sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      scroll-behavior: smooth;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    *:not(.material-symbols-outlined) {
      font-family: 'Hellovetica', Helvetica, Arial, sans-serif !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 58px;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      transition: background-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard),
                  color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      vertical-align: middle;
    }

    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

    /* MD3 Top App Bar */
    .md3-top-app-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--md-sys-color-surface);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }

    .md3-top-app-bar.scrolled {
      background-color: var(--md-sys-color-surface-container);
      border-bottom-color: var(--md-sys-color-outline-variant);
    }

    /* MD3 Search Bar (Docked Pill) */
    .md3-search-bar {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid transparent;
      transition: background-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  box-shadow var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }

    .md3-search-bar:focus-within {
      background-color: var(--md-sys-color-surface-container-highest);
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Autocomplete Dropdown Menu (MD3 Menu) */
    .md3-autocomplete-menu {
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-sys-shape-corner-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      transform-origin: top center;
      animation: menuEnter var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized-decelerate);
    }

    @keyframes menuEnter {
      from { opacity: 0; transform: translateY(-6px) scaleY(0.96); }
      to { opacity: 1; transform: translateY(0) scaleY(1); }
    }

    .md3-autocomplete-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      min-height: 48px;
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    .md3-autocomplete-item + .md3-autocomplete-item::before {
      content: "";
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 1px;
      background-color: var(--md-sys-color-outline-variant);
      pointer-events: none;
    }

    .md3-autocomplete-item:hover,
    .md3-autocomplete-item.active {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* MD3 Filter Chips */
    .md3-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface-variant);
      transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
    }

    .md3-filter-chip:hover {
      background-color: var(--md-sys-color-surface-container-high);
      border-color: var(--md-sys-color-outline);
    }

    .md3-filter-chip:active {
      transform: scale(0.97);
    }

    .md3-filter-chip[aria-pressed="true"] {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: transparent;
      font-weight: 600;
    }

    .md3-filter-chip .chip-count {
      font-size: 0.75rem;
      padding: 1px 7px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
    }

    .md3-filter-chip[aria-pressed="true"] .chip-count {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    /* Modal Category Tag (matches footer filter badge hover & press states) */
    .md3-modal-cat-tag {
      padding: 4px 12px;
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface-variant);
      transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
    }

    .md3-modal-cat-tag:hover {
      background-color: var(--md-sys-color-surface-container-high);
      border-color: var(--md-sys-color-outline);
      color: var(--md-sys-color-on-surface);
    }

    .md3-modal-cat-tag:active {
      transform: scale(0.97);
    }

    /* Horizontal chip scroll container with subtle scrollbar hiding */
    .chip-scroll-strip {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chip-scroll-strip::-webkit-scrollbar {
      display: none;
    }

    /* Hide vertical scrollbar inside modal while keeping scrolling enabled */
    #modal-scroll-body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #modal-scroll-body::-webkit-scrollbar {
      display: none;
    }

    /* MD3 Place Card (Square aspect-ratio visual card) */
    .md3-place-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--md-sys-shape-corner-large);
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized),
                  border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard),
                  box-shadow var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
    }

    .md3-place-card:hover {
      transform: translateY(-3px);
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    }

    .md3-place-card:focus-visible {
      outline: 3px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    .md3-place-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 500ms var(--md-sys-motion-easing-emphasized);
    }

    .md3-place-card:hover img {
      transform: scale(1.05);
    }

    .md3-card-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(10, 16, 13, 0.88) 0%,
        rgba(10, 16, 13, 0.45) 26%,
        rgba(10, 16, 13, 0) 42%
      );
      pointer-events: none;
    }

    /* MD3 Buttons */
    .md3-btn-filled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 24px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-weight: 600;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      border: none;
      transition: filter 150ms ease, transform 150ms ease;
    }

    .md3-btn-filled:hover {
      filter: brightness(1.06);
    }

    .md3-btn-filled:active {
      transform: scale(0.98);
    }

    .md3-btn-tonal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      border: none;
      transition: filter 150ms ease, transform 150ms ease;
    }

    .md3-btn-tonal:hover {
      filter: brightness(0.96);
    }

    .md3-btn-tonal:active {
      transform: scale(0.98);
    }

    .md3-btn-outlined {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: transparent;
      color: var(--md-sys-color-primary);
      border: 1px solid var(--md-sys-color-outline);
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .md3-btn-outlined:hover {
      background-color: var(--md-sys-color-surface-container-high);
    }

    .md3-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--md-sys-shape-corner-full);
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .md3-icon-btn:hover {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .md3-icon-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* MD3 Dialog / Detail Modal */
    .md3-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background-color: var(--md-sys-color-scrim);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px 16px 32px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
    }

    @media (min-width: 768px) {
      .md3-modal-backdrop {
        padding-top: 24px;
        padding-bottom: 48px;
      }
    }

    .md3-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .md3-modal-dialog {
      width: 100%;
      max-width: 735px;
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-sys-shape-corner-extra-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transform: scale(0.94) translateY(12px);
      transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized-decelerate);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
    }

    @media (min-width: 1024px) {
      .md3-modal-dialog {
        max-width: 958px;
      }
    }

    @media (min-width: 1440px) {
      .md3-modal-dialog {
        max-width: 1060px;
      }
    }

    .md3-modal-backdrop.open .md3-modal-dialog {
      transform: scale(1) translateY(0);
    }

    /* MD3 Snackbar */
    .md3-snackbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      z-index: 80;
      background-color: var(--md-sys-color-inverse-surface);
      color: var(--md-sys-color-inverse-on-surface);
      padding: 12px 20px;
      border-radius: var(--md-sys-shape-corner-small);
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.24);
      opacity: 0;
      pointer-events: none;

        var(--md-sys-color-surface-container) 25%,
        var(--md-sys-color-surface-container-highest) 50%,
        var(--md-sys-color-surface-container) 75%
      );

      100% { background-position: -200% 0; }
    }

    /* Fast Pixel Goose Walk Animation on Header Hover (matches mini-game stride) */
    @keyframes gooseLegLeft {
      0%, 49.9% {
        transform: translateY(-15px);

      50%, 100% {
        transform: translateY(0);
      }
    }

    @keyframes gooseLegRight {
      0%, 49.9% {
        transform: translateY(0);
      }
      50%, 100% {
        transform: translateY(-15px);
      }
    }

    @keyframes gooseBodyBob {
      0%, 49.9% {
        transform: translateY(0);
      }
      50%, 100% {
        transform: translateY(-6px);
      }
    }
