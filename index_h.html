        modalCloseBtn: document.getElementById('modal-close-btn'),
        modalImage: document.getElementById('modal-image'),
        modalCityBtn: document.getElementById('modal-city-btn'),
        modalCityText: document.getElementById('modal-city-text'),
        modalTitle: document.getElementById('modal-title'),
        modalCategories: document.getElementById('modal-categories'),
        modalDescription: document.getElementById('modal-description'),
        modalMapsLink: document.getElementById('modal-maps-link'),
        snackbar: document.getElementById('snackbar'),
        snackbarText: document.getElementById('snackbar-text')
      };

      /* ----------------------------------------------------------------------
         NORMALIZATION & UTILITY HELPERS
         ---------------------------------------------------------------------- */

      function slugify(str) {
        return String(str || '')
          .toLowerCase()
          .normalize('NFKD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9\u4e00-\u9fff]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'spot';
      }

      function formatCityName(raw) {
        const clean = String(raw || '').trim().replace(/\s+/g, ' ');
        if (!clean) return '';
        return clean
          .split(' ')
          .map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
          .join(' ');
      }

      function extractFlickrPhotoId(photoUrl) {
        const url = String(photoUrl || '');
        const match = url.match(/\/(\d{8,})_[a-z0-9]+/i) || url.match(/(\d{9,})/);
        if (!match) return 0n;
        try {
          return BigInt(match[1]);
        } catch {
          return 0n;
        }
      }

      /**
       * Extracts and normalizes the first valid image URL from a CSV cell
       * (handles HTML <img> tags, multi-line cells, http://, and Flickr variants).
       */
      function normalizePhotoUrl(rawUrl) {
        let raw = String(rawUrl || '').trim();
        if (!raw) return '';

        // Extract the first clean http(s) URL (stops at whitespace, quotes, angle brackets, or commas)
        const urlMatch = raw.match(/https?:\/\/[^\s"'<>,]+/i);
        let url = urlMatch ? urlMatch[0] : raw.split(/[\s,]+/)[0];

        if (url.startsWith('http://')) {
          url = 'https://' + url.slice(7);
        }

        // Convert Google Drive share links to direct viewable image links if present
        const gdriveMatch = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]+)/i);
        if (gdriveMatch) {
          return `https://lh3.googleusercontent.com/d/${gdriveMatch[1]}=s1200`;
        }

        return url;
      }

      function getFlickrVariantUrl(photoUrl, sizeSuffix) {
        const url = normalizePhotoUrl(photoUrl);
        if (!/staticflickr\.com\//i.test(url)) return url;
        // Standard shared-secret suffixes (_s, _q, _t, _m, _n, _w, _z, _c, _b, _h, _k)
        const standardSuffixRegex = /_(s|q|t|m|n|w|z|c|b|h|k)(\.(?:jpe?g|png|webp|gif))(?=$|\?)/i;
        if (standardSuffixRegex.test(url)) {
          return url.replace(standardSuffixRegex, `_${sizeSuffix}$2`);
        }
        // Flickr medium-500 URL without size suffix: /{id}_{secret}.jpg
        const unsuffixedRegex = /(\/\d+_[a-f0-9]+)(\.(?:jpe?g|png|webp|gif))(?=$|\?)/i;
        if (unsuffixedRegex.test(url)) {
          return url.replace(unsuffixedRegex, `$1_${sizeSuffix}$2`);
        }
        return url;
      }

      function buildPhotoCandidates(rawPhoto, preferLarge = false) {
        const original = normalizePhotoUrl(rawPhoto);
        if (!original) return [FALLBACK_PHOTO];

        const candidates = [];
        const add = (u) => {
          if (u && !candidates.includes(u)) candidates.push(u);
        };

        if (/staticflickr\.com\//i.test(original)) {
          // Always try exact original first if it's a custom/original (_o) secret URL
          const isOriginalSecret = /_o\.(?:jpe?g|png|webp|gif)(?=$|\?)/i.test(original);
          if (isOriginalSecret) {
            add(original);
          }

          if (preferLarge) {
            add(getFlickrVariantUrl(original, 'b'));
            add(getFlickrVariantUrl(original, 'h'));
            add(getFlickrVariantUrl(original, 'c'));
            add(getFlickrVariantUrl(original, 'z'));
            add(original);
          } else {
            add(getFlickrVariantUrl(original, 'z'));
            add(getFlickrVariantUrl(original, 'c'));
            add(getFlickrVariantUrl(original, 'b'));
            add(original);
          }
          // Also try unsuffixed 500px standard Flickr format if suffix failed
          const unsuffixed = original.replace(
            /_(s|q|t|m|n|w|z|c|b|h|k|o)(\.(?:jpe?g|png|webp|gif))(?=$|\?)/i,
            '$2'
          );
          add(unsuffixed);
        } else {
          add(original);
        }

        add(FALLBACK_PHOTO);
        return candidates;
      }

      async function resolveFlickrPagePhoto(pageUrl, imgEl, preferLarge) {
        try {
          const oembedUrl = `https://www.flickr.com/services/oembed/?format=json&url=${encodeURIComponent(pageUrl)}`;
          const res = await fetch(oembedUrl);
          if (!res.ok) return false;
          const data = await res.json();
          if (data && data.url) {
            const resolved = preferLarge
              ? getFlickrVariantUrl(data.url, 'b')
              : getFlickrVariantUrl(data.url, 'z');
            imgEl.src = resolved || data.url;
            return true;
          }
        } catch {
          // Ignore oEmbed failure and proceed to fallback
        }
        return false;
      }

      function attachImageFallbackChain(imgEl, candidates) {
        let attemptIndex = 0;

        const applySrc = (url) => {
          // Only omit referrer for staticflickr.com; keep default referrer for other CDNs
          imgEl.referrerPolicy = /staticflickr\.com/i.test(url)
            ? 'no-referrer'
            : 'strict-origin-when-cross-origin';
          imgEl.src = url;
        };

        const firstUrl = candidates[0] || FALLBACK_PHOTO;

        // If the cell contains a flickr.com/photos/... page link instead of a direct staticflickr image URL, resolve via oEmbed
        if (/flickr\.com\/photos\//i.test(firstUrl) || /flic\.kr\/p\//i.test(firstUrl)) {
          imgEl.onerror = () => {
            imgEl.onerror = null;
            imgEl.src = FALLBACK_PHOTO;
          };
          resolveFlickrPagePhoto(firstUrl, imgEl, candidates.length > 2).then((ok) => {
            if (!ok) imgEl.src = FALLBACK_PHOTO;
          });
          return;
        }

        imgEl.onerror = function () {
          attemptIndex += 1;
          if (attemptIndex < candidates.length) {
            applySrc(candidates[attemptIndex]);
          } else {
            this.onerror = null;
          }
        };
        applySrc(firstUrl);
      }

      function parseCategories(rawCat) {
        if (!rawCat) return [];
        const seen = new Set();
        const result = [];
        String(rawCat)
          .split(/[,;|]/)
          .forEach((token) => {
            const clean = token.trim().replace(/\s+/g, ' ');
            if (!clean) return;
            const key = clean.toLowerCase();
            if (!seen.has(key)) {
              seen.add(key);
              result.push(clean);
            }
          });
        return result;
      }

      function normalizePlaceRow(row, index) {
        if (!row || typeof row !== 'object') return null;

        const title = String(
          row.Title ?? row.title ?? row.Name ?? row.name ?? ''
        )
          .trim()
          .replace(/\s+/g, ' ');
        if (!title) return null;

        const city = formatCityName(
          row.City ?? row.city ?? row.Location ?? row.location ?? ''
        );

        const rawCategories =
          row.Category ??
          row.category ??
          row.Categories ??
          row.categories ??
          row.Tags ??
          row.tags ??
          '';
        const categories = parseCategories(rawCategories);

        const description = String(
          row.Description ?? row.description ?? row.Notes ?? row.notes ?? ''
        ).trim();

        const rawPhoto = String(
          row.Photo ?? row.photo ?? row.Image ?? row.image ?? row.URL ?? ''
        ).trim();
        const basePhoto = normalizePhotoUrl(rawPhoto) || FALLBACK_PHOTO;
        const thumbCandidates = buildPhotoCandidates(basePhoto, false);
        const largeCandidates = buildPhotoCandidates(basePhoto, true);
        const photo = thumbCandidates[0];
        const photoLarge = largeCandidates[0];
        const flickrId = extractFlickrPhotoId(basePhoto);

        const link = String(
          row.Link ?? row.link ?? row.Maps ?? row.maps ?? row['Google Maps'] ?? ''
        ).trim();

        return {
          id: index,
          title,
          slug: slugify(title),
          city,
          categories,
          description,
          photo,
          photoLarge,
          photoOriginal: basePhoto,
          thumbCandidates,
          largeCandidates,
          flickrId,
          link
        };
      }

      /* ----------------------------------------------------------------------
         1. STATE MANAGEMENT & URL SYNCHRONIZATION
         ---------------------------------------------------------------------- */

      function parseUrlState() {
        try {
          const params = new URLSearchParams(window.location.search);
          const catParam = params.get('cat');
          const cityParam = params.get('city');
          const qParam = params.get('q');
          const spotParam = params.get('spot');

          if (catParam) {
            activeCategory = catParam.trim().toLowerCase();
          }

          if (qParam) {
            searchQuery = qParam.trim();
            els.searchInput.value = searchQuery;
            els.clearSearchBtn.classList.remove('hidden');
          } else if (cityParam) {
            searchQuery = cityParam.trim();
            els.searchInput.value = searchQuery;
            els.clearSearchBtn.classList.remove('hidden');
          }

          if (spotParam) {
            pendingSpotSlug = spotParam.trim();
          }
        } catch {
          // Ignore URL parsing issues in restricted environments
        }
      }

      function updateUrlState(targetSpotSlug) {
        try {
          const origin = window.location.origin;
          if (!origin || origin === 'null' || window.location.protocol === 'blob:') {
            return;
          }

          const url = new URL(window.location.href);
          if (activeCategory && activeCategory !== 'ALL') {
            url.searchParams.set('cat', activeCategory);
          } else {
            url.searchParams.delete('cat');
          }

          if (searchQuery && searchQuery.trim()) {
            url.searchParams.set('q', searchQuery.trim());
          } else {
            url.searchParams.delete('q');
          }
          url.searchParams.delete('city');

          if (targetSpotSlug) {
            url.searchParams.set('spot', targetSpotSlug);
          } else {
            url.searchParams.delete('spot');
          }

          window.history.replaceState({}, '', url.toString());
        } catch {
          // Skip history updates when running inside sandboxed/blob origins
        }
      }

      /* ----------------------------------------------------------------------
         2. FILTERING, SEARCH & AUTOCOMPLETE ENGINE
         ---------------------------------------------------------------------- */

      function populateCategoryFilters() {
        const counts = new Map();
        const labels = new Map();

        allPlaces.forEach((place) => {
          place.categories.forEach((cat) => {
            const key = cat.toLowerCase();
            counts.set(key, (counts.get(key) || 0) + 1);
            if (!labels.has(key)) labels.set(key, cat);
          });
        });

        const sortedKeys = Array.from(counts.keys()).sort((a, b) => a.localeCompare(b));
        const frag = document.createDocumentFragment();

        // ALL button
        const allBtn = document.createElement('button');
        allBtn.type = 'button';
        allBtn.className = 'md3-filter-chip';
        allBtn.setAttribute('aria-pressed', activeCategory === 'ALL' ? 'true' : 'false');
        allBtn.innerHTML = `<span>ALL</span><span class="chip-count">${allPlaces.length}</span>`;
        allBtn.addEventListener('click', () => setCategory('ALL'));
        frag.appendChild(allBtn);

        sortedKeys.forEach((key) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'md3-filter-chip';
          btn.setAttribute('aria-pressed', activeCategory === key ? 'true' : 'false');
          btn.innerHTML = `<span>${escapeHtml(labels.get(key))}</span><span class="chip-count">${counts.get(key)}</span>`;
          btn.addEventListener('click', () => setCategory(key));
          frag.appendChild(btn);
        });

        els.categoryFilters.innerHTML = '';
        els.categoryFilters.appendChild(frag);
      }

      function setCategory(cat) {
        const normalized = cat === 'ALL' ? 'ALL' : String(cat).toLowerCase();
        if (normalized !== 'ALL' && activeCategory === normalized) {
          activeCategory = 'ALL';
        } else {
          activeCategory = normalized;
        }
        populateCategoryFilters();
        filterPlaces();
      }

      function updateResultsSummary() {
        const total = visiblePlaces.length;
        const hasFilters = activeCategory !== 'ALL' || Boolean(searchQuery.trim());
        els.resetFiltersInlineBtn.classList.toggle('hidden', !hasFilters);

        if (total === 0) {
          els.resultsSummary.textContent = '0 places found';
        } else if (hasFilters) {
          els.resultsSummary.textContent = `${total} matching ${total === 1 ? 'place' : 'places'}`;
        } else {
          els.resultsSummary.textContent = `${total} curated places across Taiwan`;
        }
      }

      function filterPlaces() {
        const rawTokens = searchQuery
          .trim()
          .toLowerCase()
          .split(/\s+/)
          .filter(Boolean);

        visiblePlaces = allPlaces.filter((place) => {
          if (activeCategory !== 'ALL') {
            const matchesCat = place.categories.some(
              (c) => c.toLowerCase() === activeCategory
            );
            if (!matchesCat) return false;
          }

          if (rawTokens.length > 0) {
            const searchable = [
              place.title,
              place.description,
              place.categories.join(' '),
              place.city
            ]
              .join(' ')
              .toLowerCase();

            if (!rawTokens.every((tok) => searchable.includes(tok))) {
              return false;
            }
          }

          return true;
        });

        if (sortOrder === 'alpha') {
          visiblePlaces.sort((a, b) =>
            a.title.localeCompare(b.title, undefined, { sensitivity: 'base' })
          );
        }

        displayedCount = PAGE_SIZE;
        updateResultsSummary();
        updateUrlState(activeModalIndex !== -1 && visiblePlaces[activeModalIndex] ? visiblePlaces[activeModalIndex].slug : null);
        renderCards();
      }

      function toggleSortOrder() {
        sortOrder = sortOrder === 'newest' ? 'alpha' : 'newest';
        if (sortOrder === 'alpha') {
          els.sortToggleIcon.textContent = 'sort_by_alpha';
          els.sortToggleLabel.textContent = 'Sorted A–Z';
        } else {
          els.sortToggleIcon.textContent = 'sort';
          els.sortToggleLabel.textContent = 'Sorted newest first';
        }
        filterPlaces();
      }

      function buildAutocompleteIndex() {
        const seen = new Set();
        const entries = [];
        const cityCounts = new Map();

        allPlaces.forEach((p) => {
          if (p.city) {
            const key = p.city.toLowerCase();
            cityCounts.set(key, (cityCounts.get(key) || 0) + 1);
          }
        });

        const addTerm = (term, type, priority, count) => {
          const clean = String(term || '').trim().replace(/\s+/g, ' ');
          const lower = clean.toLowerCase();
          if (!clean || seen.has(lower)) return;
          seen.add(lower);
          entries.push({ term: clean, lower, type, priority, count });
        };

        // Priority 1: Cities (with spot counts)
        allPlaces.forEach((p) => {
          if (p.city) {
            addTerm(p.city, 'city', 1, cityCounts.get(p.city.toLowerCase()) || 0);
          }
        });

        // Priority 2: Categories
        allPlaces.forEach((p) => {
          p.categories.forEach((cat) => addTerm(cat, 'food', 2));
        });

        // Priority 3: Place Titles
        allPlaces.forEach((p) => {
          addTerm(p.title, 'place', 3);
        });

        // Priority 4: Non-stop words of length 3+ from titles and descriptions
        allPlaces.forEach((p) => {
          const blob = `${p.title} ${p.description}`;
          const words = blob.match(/[a-zA-Z0-9\u4e00-\u9fff]{3,}/g) || [];
          words.forEach((w) => {
            if (!STOP_WORDS.has(w.toLowerCase())) {
              addTerm(w, 'word', 4);
            }
          });
        });

        entries.sort((a, b) => a.priority - b.priority || a.term.localeCompare(b.term));
        autocompleteIndex = entries;
      }

      function triggerFeelingLucky() {
        els.searchInput.blur();
        hideAutocomplete();
        if (!allPlaces.length) return;
        const randomPlace = allPlaces[Math.floor(Math.random() * allPlaces.length)];
        activeCategory = 'ALL';
        populateCategoryFilters();
        searchQuery = randomPlace.title;
        els.searchInput.value = randomPlace.title;
        els.clearSearchBtn.classList.remove('hidden');
        filterPlaces();
        const idx = visiblePlaces.findIndex((p) => p.slug === randomPlace.slug);
        if (idx !== -1) {
          openModal(idx);
          launchConfettiBurst();
        }
      }

      /**
       * Launches a celebratory confetti animation across the viewport
       * when a spot is chosen via "I Feel Lucky".
       */
      function launchConfettiBurst() {
        const existing = document.getElementById('lucky-confetti-canvas');
        if (existing) existing.remove();

        const canvas = document.createElement('canvas');
        canvas.id = 'lucky-confetti-canvas';
        canvas.setAttribute('aria-hidden', 'true');
        canvas.style.cssText =
          'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:75;';
        document.body.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const colors = [
          '#1B6B52',
          '#8AD6B8',
          '#9C4233',
          '#FFB4A7',
          '#F59E0B',
          '#FBBF24',
          '#34D399',
          '#FB7185'
        ];

        const particles = [];
        const origins = [
          { x: width * 0.25, y: height * 0.55 },
          { x: width * 0.5, y: height * 0.45 },
          { x: width * 0.75, y: height * 0.55 }
        ];

        origins.forEach((origin) => {
          for (let i = 0; i < 42; i++) {
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.45;
            const speed = 7 + Math.random() * 11;
            particles.push({
              x: origin.x + (Math.random() - 0.5) * 40,
              y: origin.y + (Math.random() - 0.5) * 20,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 2,
              w: 6 + Math.random() * 6,
              h: 4 + Math.random() * 5,
              color: colors[Math.floor(Math.random() * colors.length)],
              rotation: Math.random() * Math.PI * 2,
              vr: (Math.random() - 0.5) * 0.28,
              wobble: Math.random() * Math.PI * 2,
              wobbleSpeed: 0.08 + Math.random() * 0.08,
              alpha: 1
            });
          }
        });

        let startTime = null;
        const duration = 2600;

        function frame(now) {
          if (!startTime) startTime = now;
          const elapsed = now - startTime;

          ctx.clearRect(0, 0, width, height);

          let aliveCount = 0;
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.vy += 0.34; // Gravity
            p.vx *= 0.985; // Air resistance
            p.wobble += p.wobbleSpeed;
            p.x += p.vx + Math.sin(p.wobble) * 1.1;
            p.y += p.vy;
            p.rotation += p.vr;

            if (elapsed > duration - 700) {
              p.alpha = Math.max(0, (duration - elapsed) / 700);
            }

            if (p.y < height + 30 && p.alpha > 0.01) {
              aliveCount++;
              ctx.save();
              ctx.globalAlpha = p.alpha;
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rotation);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              ctx.restore();
            }
          }

          if (elapsed < duration && aliveCount > 0) {
            requestAnimationFrame(frame);
          } else {
            canvas.remove();
          }
        }

        requestAnimationFrame(frame);
      }

      function updateAutocompleteSuggestions(rawInput) {
        const query = String(rawInput || '').trim().toLowerCase();
        highlightedSuggestionIdx = -1;

        let matches = [];
        if (!query) {
          // On click/focus with empty query: list cities in reverse alphabetical order (starting from Taipei)
          matches = autocompleteIndex
            .filter((item) => item.type === 'city')
            .sort((a, b) => b.term.localeCompare(a.term));
        } else {
          matches = autocompleteIndex
            .filter((item) => item.lower.includes(query))
            .slice(0, 8);
        }

        // Always append "I Feel Lucky" at the end of the dropdown list
        const luckyItem = {
          term: 'I Feel Lucky',
          lower: 'i feel lucky',
          type: 'lucky',
          priority: 99
        };
        currentSuggestions = [...matches, luckyItem];

        const iconMap = {
          city: 'location_on',
          food: 'restaurant',
          place: 'storefront',
          word: 'tag',
          lucky: 'casino'
        };

        const badgeMap = {
          city: 'City',
          food: 'Category',
          place: 'Spot',
          word: 'Keyword',
          lucky: 'Random'
        };

        const frag = document.createDocumentFragment();
        currentSuggestions.forEach((item, idx) => {
          const li = document.createElement('li');
          li.className = 'md3-autocomplete-item';
          li.setAttribute('role', 'option');
          const isLucky = item.type === 'lucky';
          const countHtml =
            item.type === 'city' && typeof item.count === 'number'
              ? ` <span class="font-semibold" style="color: var(--md-sys-color-primary);">(${item.count})</span>`
              : '';

          li.innerHTML = `
            <span class="flex items-center gap-2.5 min-w-0">
              <span class="material-symbols-outlined ${isLucky ? 'filled' : ''} text-lg shrink-0" style="color: ${isLucky ? 'var(--md-sys-color-tertiary)' : 'var(--md-sys-color-primary)'};">
                ${iconMap[item.type] || 'search'}
              </span>
              <span class="text-sm ${isLucky ? 'font-bold' : 'font-medium'} truncate">${escapeHtml(item.term)}${countHtml}</span>
            </span>
            <span class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full shrink-0 ml-2"
              style="background-color: ${isLucky ? 'var(--md-sys-color-tertiary-container)' : 'var(--md-sys-color-surface-container)'}; color: ${isLucky ? 'var(--md-sys-color-on-tertiary-container)' : 'var(--md-sys-color-on-surface-variant)'};">
              ${badgeMap[item.type] || ''}
            </span>
          `;

          li.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            selectAutocompleteSuggestion(item);
          });

          frag.appendChild(li);
        });

        els.autocompleteList.innerHTML = '';
        els.autocompleteList.appendChild(frag);
        els.autocompleteDropdown.classList.remove('hidden');
        els.searchInput.setAttribute('aria-expanded', 'true');
      }

      function selectAutocompleteSuggestion(item) {
        if (!item) return;
        // Dismiss mobile virtual keyboard immediately
        els.searchInput.blur();

        if (item.type === 'lucky') {
          triggerFeelingLucky();
          return;
        }
        els.searchInput.value = item.term;
        searchQuery = item.term;
        els.clearSearchBtn.classList.remove('hidden');
        hideAutocomplete();
        filterPlaces();

        // If the user selected a specific spot, open its detail modal immediately
        if (item.type === 'place') {
          const idx = visiblePlaces.findIndex(
            (p) => p.title.toLowerCase() === item.lower
          );
          if (idx !== -1) {
            openModal(idx);
          }
        }
      }

      function hideAutocomplete() {
        els.autocompleteDropdown.classList.add('hidden');
        els.searchInput.setAttribute('aria-expanded', 'false');
        highlightedSuggestionIdx = -1;
      }

      function highlightSuggestion(index) {
        const items = els.autocompleteList.querySelectorAll('.md3-autocomplete-item');
        if (!items.length) return;
        items.forEach((el) => el.classList.remove('active'));
        if (index < 0) index = items.length - 1;
        if (index >= items.length) index = 0;
        highlightedSuggestionIdx = index;
        items[index].classList.add('active');
        items[index].scrollIntoView({ block: 'nearest' });
      }

      /* ----------------------------------------------------------------------
         3. CARD GRID & PAGINATION RENDERING
         ---------------------------------------------------------------------- */

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderLoadingSkeletons() {
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 12; i++) {
          const skel = document.createElement('div');
          skel.className = 'aspect-square rounded-2xl skeleton-pulse border';
          skel.style.borderColor = 'var(--md-sys-color-outline-variant)';
          frag.appendChild(skel);
        }
        els.loadingSkeleton.innerHTML = '';
        els.loadingSkeleton.appendChild(frag);
      }

      function createPlaceCardElement(place, index) {
        const card = document.createElement('article');
        card.className = 'md3-place-card group';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${place.title}${place.city ? ', ' + place.city : ''}`);

        const isAboveFold = index < 6;
        const loadingAttr = isAboveFold ? 'eager' : 'lazy';
        const priorityAttr = index === 0 ? 'fetchpriority="high"' : '';

        const cityPill = place.city
          ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold backdrop-blur-md bg-black/55 text-white border border-white/15">
              <span class="material-symbols-outlined filled text-[13px] text-emerald-300">location_on</span>
              ${escapeHtml(place.city)}
            </span>`
          : '';

        const catBadges = place.categories
          .slice(0, 1)
          .map(
            (cat) =>
              `<span class="text-[11px] font-bold uppercase tracking-wider text-emerald-300 drop-shadow-sm">${escapeHtml(cat)}</span>`
          )
          .join('');

        card.innerHTML = `
          <img
            alt="${escapeHtml(place.title)}"
            loading="${loadingAttr}"
            decoding="async"
            ${priorityAttr}
          />
          <div class="md3-card-scrim"></div>
          <div class="absolute top-3 left-3 right-3 flex items-center justify-between gap-2 pointer-events-none">
            ${cityPill}
          </div>
          <div class="absolute bottom-3 left-3.5 right-3.5 text-white pointer-events-none">
            <div class="flex flex-wrap gap-1 mb-1.5">
              ${catBadges}
            </div>
            <h2 class="text-base sm:text-lg font-bold leading-snug line-clamp-2 drop-shadow-sm">
              ${escapeHtml(place.title)}
            </h2>
          </div>
        `;

        const imgEl = card.querySelector('img');
        attachImageFallbackChain(imgEl, place.thumbCandidates);

        card.addEventListener('click', () => openModal(index));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openModal(index);
          }
        });

        return card;
      }

      function renderCards() {
        els.loadingSkeleton.classList.add('hidden');

        if (visiblePlaces.length === 0) {
          els.placesGrid.innerHTML = '';
          els.loadMoreContainer.classList.add('hidden');
          els.resultsToolbar.classList.add('hidden');
          els.emptyState.classList.remove('hidden');
          startDinoGame();
          return;
        }

        els.resultsToolbar.classList.remove('hidden');
        els.emptyState.classList.add('hidden');
        stopDinoGame();

        const slice = visiblePlaces.slice(0, displayedCount);
        const frag = document.createDocumentFragment();
        slice.forEach((place, idx) => {
          frag.appendChild(createPlaceCardElement(place, idx));
        });

        els.placesGrid.innerHTML = '';
        els.placesGrid.appendChild(frag);

        const remaining = visiblePlaces.length - slice.length;
        if (remaining > 0) {
          els.loadMoreContainer.classList.remove('hidden');
          els.loadMoreLabel.textContent = `Load More (${remaining} remaining)`;
        } else {
          els.loadMoreContainer.classList.add('hidden');
        }
      }

      function handleLoadMore() {
        const prevCount = displayedCount;
        displayedCount = Math.min(displayedCount + PAGE_SIZE, visiblePlaces.length);
        const newSlice = visiblePlaces.slice(prevCount, displayedCount);

        const frag = document.createDocumentFragment();
        newSlice.forEach((place, offset) => {
          frag.appendChild(createPlaceCardElement(place, prevCount + offset));
        });
        els.placesGrid.appendChild(frag);

        const remaining = visiblePlaces.length - displayedCount;
        if (remaining > 0) {
          els.loadMoreLabel.textContent = `Load More (${remaining} remaining)`;
        } else {
          els.loadMoreContainer.classList.add('hidden');
        }
      }

      /* ----------------------------------------------------------------------
         4. DETAIL MODAL & SHARE LINK
         ---------------------------------------------------------------------- */

      function openModal(index) {
        if (index < 0 || index >= visiblePlaces.length) return;
        activeModalIndex = index;
        const place = visiblePlaces[index];

        els.placeModal.scrollTop = 0;
        els.modalCounter.textContent = `${index + 1} / ${visiblePlaces.length}`;
        els.modalPrevBtn.disabled = visiblePlaces.length <= 1;
        els.modalNextBtn.disabled = visiblePlaces.length <= 1;

        els.modalImage.alt = place.title;
        attachImageFallbackChain(els.modalImage, place.largeCandidates);

        if (place.city) {
          els.modalCityBtn.classList.remove('hidden');
          els.modalCityText.textContent = place.city;
        } else {
          els.modalCityBtn.classList.add('hidden');
        }

        els.modalTitle.textContent = place.title;

        els.modalCategories.innerHTML = '';
        place.categories.forEach((cat) => {
          const tag = document.createElement('button');
          tag.type = 'button';
          tag.className = 'md3-modal-cat-tag';
          tag.textContent = cat;
          tag.title = `Filter by ${cat}`;
          tag.addEventListener('click', () => {
            closeModal();
            setCategory(cat);
          });
          els.modalCategories.appendChild(tag);
        });

        els.modalDescription.textContent =
          place.description || 'A hand-picked spot in Taiwan curated by @alby.food.';

        const mapsHref =
          place.link ||
          `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
            `${place.title} ${place.city} Taiwan`
          )}`;
        els.modalMapsLink.href = mapsHref;

        els.placeModal.classList.add('open');
        els.placeModal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        updateUrlState(place.slug);
      }

      function closeModal() {
        activeModalIndex = -1;
        els.placeModal.classList.remove('open');
        els.placeModal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        updateUrlState(null);
      }

      function navigateModal(delta) {
        if (activeModalIndex === -1 || visiblePlaces.length <= 1) return;
        const nextIdx =
          (activeModalIndex + delta + visiblePlaces.length) % visiblePlaces.length;
        if (nextIdx >= displayedCount) {
          displayedCount = nextIdx + 1;
          renderCards();
        }
        openModal(nextIdx);
      }

      function showSnackbar(message) {
        els.snackbarText.textContent = message;
        els.snackbar.classList.add('show');
        clearTimeout(showSnackbar._timer);
        showSnackbar._timer = setTimeout(() => {
          els.snackbar.classList.remove('show');
        }, 2800);
      }

      function copyDirectSpotLink() {
        if (activeModalIndex === -1 || !visiblePlaces[activeModalIndex]) return;
        const place = visiblePlaces[activeModalIndex];
        let shareUrl = window.location.href;
        try {
          if (window.location.origin && window.location.origin !== 'null') {
            const u = new URL(window.location.origin + window.location.pathname);
            u.searchParams.set('spot', place.slug);
            shareUrl = u.toString();
          }
        } catch {
          // Fallback to current href
        }

        const tempInput = document.createElement('textarea');
        tempInput.value = shareUrl;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          document.execCommand('copy');
          els.modalShareIcon.textContent = 'done';
          els.modalShareLabel.textContent = 'Copied';
          showSnackbar(`Copied link for "${place.title}"`);
          setTimeout(() => {
            els.modalShareIcon.textContent = 'share';
            els.modalShareLabel.textContent = 'Share';
          }, 2000);
        } catch {
          showSnackbar('Unable to copy link');
        }
        document.body.removeChild(tempInput);
      }

      /* ----------------------------------------------------------------------
         5. THEME TOGGLE
         ---------------------------------------------------------------------- */

      function initTheme() {
        const saved = localStorage.getItem('taiwanTopTheme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
        updateThemeIcon();
      }

      function updateThemeIcon() {
        const explicit = document.documentElement.getAttribute('data-theme');
        const prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = explicit ? explicit === 'dark' : prefersDark;
        els.themeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
      }

      function toggleTheme() {
        const explicit = document.documentElement.getAttribute('data-theme');
        const prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        const currentlyDark = explicit ? explicit === 'dark' : prefersDark;
        const next = currentlyDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('taiwanTopTheme', next);
        updateThemeIcon();
      }

      /* ----------------------------------------------------------------------
         6. CSV PARSING & STALE-WHILE-REVALIDATE CACHE
         ---------------------------------------------------------------------- */

      function parseCsvTextToPlaces(csvText) {
        if (!csvText || typeof Papa === 'undefined') return [];
        const parsed = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true
        });
        if (!parsed || !Array.isArray(parsed.data)) return [];

        const normalized = [];
        parsed.data.forEach((row, idx) => {
          const item = normalizePlaceRow(row, idx);
          if (item) normalized.push(item);
        });

        // Sort newest first by Flickr photo ID (or CSV row order fallback)
        normalized.sort((a, b) => {
          if (a.flickrId !== b.flickrId) {
            return b.flickrId > a.flickrId ? 1 : -1;
          }
          return b.id - a.id;
        });

        return normalized;
      }

      function applyDataset(places) {
        allPlaces = places;
        els.headerTotalBadge.textContent = `${allPlaces.length} spots`;
        buildAutocompleteIndex();
        populateCategoryFilters();
        filterPlaces();

        if (pendingSpotSlug) {
          const targetSlug = pendingSpotSlug;
          pendingSpotSlug = null;
          const idx = visiblePlaces.findIndex((p) => p.slug === targetSlug);
          if (idx !== -1) {
            openModal(idx);
          }
        }
      }

      async function loadPlacesData() {
        els.retryFetchBtn.classList.add('hidden');
        let cachedCsv = null;

        try {
          cachedCsv = localStorage.getItem(CACHE_STORAGE_KEY);
          if (cachedCsv) {
            const cachedPlaces = parseCsvTextToPlaces(cachedCsv);
            if (cachedPlaces.length > 0) {
              applyDataset(cachedPlaces);
            }
          }
        } catch {
          // Ignore storage read errors
        }

        try {
          const bustUrl = `${CSV_URL}&_t=${Date.now()}`;
          const response = await fetch(bustUrl, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const freshCsv = await response.text();
          const freshPlaces = parseCsvTextToPlaces(freshCsv);

          if (freshPlaces.length > 0) {
            if (freshCsv !== cachedCsv) {
              try {
                localStorage.setItem(CACHE_STORAGE_KEY, freshCsv);
              } catch {
                // Ignore storage quota errors
              }
              applyDataset(freshPlaces);
            }
          } else if (!allPlaces.length) {
            throw new Error('Empty CSV dataset');
          }
        } catch (err) {
          if (!allPlaces.length) {
            els.loadingSkeleton.classList.add('hidden');
            els.headerTotalBadge.textContent = 'Offline';
            els.resultsSummary.textContent = 'Unable to load curated places';
            els.emptyStateTitle.textContent = 'Could not reach Google Sheets';
            els.emptyStateSubtitle.textContent =
              'Play Hot Pot Goose Run while waiting, or retry fetching the sheet.';
            els.emptyStateSubtitle.classList.remove('hidden');
            els.retryFetchBtn.classList.remove('hidden');
            els.emptyState.classList.remove('hidden');
            startDinoGame();
          }
        }
      }

      /* ----------------------------------------------------------------------
         7. HOT POT GOOSE RUN MINI-GAME (EMPTY STATE)
         ---------------------------------------------------------------------- */

      const dinoState = {
        y: 0,
        vy: 0,
        grounded: true,
        obstacles: [],
        clouds: [],
        score: 0,
        best: Number(localStorage.getItem('taiwanTopGooseBest') || 0),
        speed: 4.5,
        spawnTimer: 0,
        gameOver: false,
        frameTick: 0
      };

      function playJumpTone() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (!audioCtx) return;
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(620, audioCtx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } catch {
          // Audio optional
        }
      }

      function playGameOverTone() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) audioCtx = new Ctx();
          }
          if (!audioCtx) return;
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.045, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.24);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.24);
        } catch {
          // Audio optional
        }
      }

      function triggerDinoJump() {
        if (!dinoGameRunning) return;
        if (dinoState.gameOver) {
          resetDinoGame();
          return;
        }
        if (dinoState.grounded) {
          dinoState.vy = -10.5;
          dinoState.grounded = false;
          playJumpTone();
        }
      }

      function resetDinoGame() {
        dinoState.y = 0;
        dinoState.vy = 0;
        dinoState.grounded = true;
        dinoState.obstacles = [];
        dinoState.clouds = [
          { x: 140, y: 38, s: 1 },
          { x: 380, y: 26, s: 0.8 },
          { x: 540, y: 46, s: 1.1 }
        ];
        dinoState.score = 0;
        dinoState.speed = 4.5;
        dinoState.spawnTimer = 60;
        dinoState.gameOver = false;
      }

      /**
       * Renders the pixel goose matching the brand logo silhouette on canvas
       */
      function drawPixelGoose(ctx, x, y, scale, strideFrame, isDead, fg, accent) {
        const u = scale; // 1 unit = 1/16 of 240px grid
        ctx.save();
        ctx.translate(x, y);

        // Body & Neck (matches SVG 240x240 pixel grid scaled down)
        ctx.fillStyle = fg;
        // Neck & head: x=8..11, y=0..12
        ctx.fillRect(8 * u, 0, 3 * u, 3 * u);
        ctx.fillRect(8 * u, 3 * u, 2 * u, 9 * u);
        // Torso: x=1..9, y=8..13
        ctx.fillRect(0, 8 * u, 3 * u, 1 * u);
        ctx.fillRect(1 * u, 9 * u, 8 * u, 3 * u);
        ctx.fillRect(2 * u, 12 * u, 7 * u, 1 * u);

        // Eye (cutout or X when bonked)
        if (isDead) {
          ctx.fillStyle = accent;
          ctx.fillRect(9 * u, 1 * u, 1.2 * u, 1.2 * u);
        } else {
          ctx.clearRect(9 * u, 1 * u, 1 * u, 1 * u);
        }

        // Beak
        ctx.fillStyle = accent;
        ctx.fillRect(11 * u, 1 * u, 3 * u, 1 * u);
        ctx.fillRect(11 * u, 2 * u, 2 * u, 1 * u);

        // Animated Pixel Legs
        const leftLift = !dinoState.grounded ? 1 * u : strideFrame === 0 ? 1 * u : 0;
        const rightLift = !dinoState.grounded ? 0.5 * u : strideFrame === 1 ? 1 * u : 0;

        // Left Leg
        ctx.fillRect(3 * u, 13 * u, 1 * u, 3 * u - leftLift);
        ctx.fillRect(4 * u, 15 * u - leftLift, 1 * u, 1 * u);

        // Right Leg
        ctx.fillRect(7 * u, 13 * u, 1 * u, 3 * u - rightLift);
        ctx.fillRect(8 * u, 15 * u - rightLift, 1 * u, 1 * u);

        ctx.restore();
      }

      /**
       * Renders a steaming Taiwanese hot pot obstacle with broth, handles, chopsticks & steam
       */
      function drawHotPotObstacle(ctx, ob, groundY, tick, fg, accent, primary) {
        const x = Math.round(ob.x);
        const w = Math.round(ob.w);
        const h = Math.round(ob.h);
        const topY = Math.round(groundY - h);

        // Chopsticks sticking out diagonally
        ctx.strokeStyle = fg;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.35, topY + 6);
        ctx.lineTo(x + w * 0.1, topY - 8);
        ctx.moveTo(x + w * 0.65, topY + 6);
        ctx.lineTo(x + w * 0.9, topY - 7);
        ctx.stroke();

        // Pot side handles
        ctx.fillStyle = fg;
        ctx.fillRect(x - 3, topY + 9, 3, 4);
        ctx.fillRect(x + w, topY + 9, 3, 4);

        // Pot body
        ctx.fillStyle = accent;
        ctx.fillRect(x, topY + 6, w, h - 8);
        // Base foot
        ctx.fillStyle = fg;
        ctx.fillRect(x + 3, groundY - 2, w - 6, 2);

        // Simmering broth & toppings rim
        ctx.fillStyle = primary;
        ctx.fillRect(x + 2, topY + 3, w - 4, 4);
        ctx.fillStyle = '#F59E0B';
        ctx.fillRect(x + 5, topY + 2, 4, 3);
        ctx.fillRect(x + w - 9, topY + 2, 4, 3);

        // Animated rising pixel steam wisps
        const phase = Math.floor((tick + x) / 10) % 2;
        ctx.fillStyle = fg;
        ctx.globalAlpha = 0.45;
        ctx.fillRect(x + Math.floor(w * 0.3), topY - 5 - phase * 3, 2, 4);
        ctx.fillRect(x + Math.floor(w * 0.68), topY - 7 + phase * 3, 2, 4);
        ctx.globalAlpha = 1;
      }

      function startDinoGame() {
        if (dinoGameRunning) return;
        dinoGameRunning = true;
        resetDinoGame();
        if (document.activeElement === els.searchInput) {
          els.searchInput.blur();
        }
        els.dinoCanvas.focus({ preventScroll: true });

        const canvas = els.dinoCanvas;
        const ctx = canvas.getContext('2d');

        function step() {
          if (!dinoGameRunning) return;

          const rect = canvas.getBoundingClientRect();
          const w = Math.max(300, Math.floor(rect.width || 600));
          const h = Math.max(160, Math.floor(rect.height || 337));
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }

          const styles = getComputedStyle(document.documentElement);
          const fg = styles.getPropertyValue('--md-sys-color-on-surface').trim() || '#171D1A';
          const accent = styles.getPropertyValue('--md-sys-color-tertiary').trim() || '#9C4233';
          const primary = styles.getPropertyValue('--md-sys-color-primary').trim() || '#1B6B52';
          const lineCol = styles.getPropertyValue('--md-sys-color-outline-variant').trim() || '#BFC9C2';

          const groundY = h - 34;

          if (!dinoState.gameOver) {
            dinoState.frameTick++;
            dinoState.score += 0.2;
            dinoState.speed = Math.min(10.5, 4.5 + dinoState.score / 220);

            dinoState.vy += 0.55;
            dinoState.y += dinoState.vy;
            if (dinoState.y >= 0) {
              dinoState.y = 0;
              dinoState.vy = 0;
              dinoState.grounded = true;
            }

            // Drift background clouds
            dinoState.clouds.forEach((c) => {
              c.x -= dinoState.speed * 0.25;
              if (c.x < -50) {
                c.x = w + 30 + Math.random() * 60;
                c.y = 20 + Math.random() * 40;
              }
            });

            dinoState.spawnTimer--;
            if (dinoState.spawnTimer <= 0) {
              const isDouble = dinoState.score > 60 && Math.random() < 0.35;
              dinoState.obstacles.push({
                x: w + 20,
                w: isDouble ? 36 : 22 + Math.random() * 8,
                h: 22 + Math.random() * 8
              });
              dinoState.spawnTimer = Math.floor(65 + Math.random() * 55);
            }

            const gooseBox = { x: 46, y: groundY - 36 + dinoState.y, w: 28, h: 34 };

            for (let i = dinoState.obstacles.length - 1; i >= 0; i--) {
              const ob = dinoState.obstacles[i];
              ob.x -= dinoState.speed;
              if (ob.x + ob.w < -15) {
                dinoState.obstacles.splice(i, 1);
                continue;
              }
              const obBox = { x: ob.x + 3, y: groundY - ob.h + 4, w: ob.w - 6, h: ob.h - 4 };
              if (
                gooseBox.x < obBox.x + obBox.w &&
                gooseBox.x + gooseBox.w > obBox.x &&
                gooseBox.y < obBox.y + obBox.h &&
                gooseBox.y + gooseBox.h > obBox.y
              ) {
                dinoState.gameOver = true;
                playGameOverTone();
                const finalInt = Math.floor(dinoState.score);
                if (finalInt > dinoState.best) {
                  dinoState.best = finalInt;
                  localStorage.setItem('taiwanTopGooseBest', String(finalInt));
                }
              }
            }
          }

          ctx.clearRect(0, 0, w, h);

          // Pixel Clouds
          ctx.fillStyle = lineCol;
          ctx.globalAlpha = 0.55;
          dinoState.clouds.forEach((c) => {
            const cx = Math.round(c.x);
            const cy = Math.round(c.y);
            ctx.fillRect(cx + 6, cy, 20, 5);
            ctx.fillRect(cx, cy + 4, 32, 6);
          });
          ctx.globalAlpha = 1;

          // Ground line & scrolling pebbles
          ctx.strokeStyle = lineCol;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(16, groundY);
          ctx.lineTo(w - 16, groundY);
          ctx.stroke();

          ctx.fillStyle = lineCol;
          for (let px = 24; px < w - 24; px += 48) {
            const offset = Math.floor((dinoState.frameTick * dinoState.speed) % 48);
            const drawX = px - offset;
            if (drawX > 18 && drawX < w - 22) {
              ctx.fillRect(drawX, groundY + 6, 6, 2);
              ctx.fillRect(drawX + 18, groundY + 11, 3, 2);
            }
          }

          // Pixel Goose
          const strideFrame = Math.floor(dinoState.frameTick / 5) % 2;
          drawPixelGoose(
            ctx,
            42,
            groundY - 38 + dinoState.y,
            2.4,
            strideFrame,
            dinoState.gameOver,
            fg,
            accent
          );

          // Steaming Hot Pot Obstacles
          dinoState.obstacles.forEach((ob) => {
            drawHotPotObstacle(ctx, ob, groundY, dinoState.frameTick, fg, accent, primary);
          });

          if (dinoState.gameOver) {
            ctx.fillStyle = fg;
            ctx.font = '14px "Hellovetica", Helvetica, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('BONK! Tap or Press Space to Run Again', w / 2, h / 2 - 6);
          }

          const sStr = String(Math.floor(dinoState.score)).padStart(4, '0');
          const bStr = String(dinoState.best).padStart(4, '0');
          els.gameScoreReadout.textContent = `SCORE: ${sStr} · BEST: ${bStr}`;

          dinoAnimFrameId = requestAnimationFrame(step);
        }

        dinoAnimFrameId = requestAnimationFrame(step);
      }

      function stopDinoGame() {
        dinoGameRunning = false;
        if (dinoAnimFrameId) {
          cancelAnimationFrame(dinoAnimFrameId);
          dinoAnimFrameId = null;
        }
      }

      /* ----------------------------------------------------------------------
         8. EVENT LISTENERS & INITIALIZATION
         ---------------------------------------------------------------------- */

      function resetAllFilters() {
        activeCategory = 'ALL';
        searchQuery = '';
        els.searchInput.value = '';
        els.clearSearchBtn.classList.add('hidden');
        hideAutocomplete();
        populateCategoryFilters();
        filterPlaces();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function initEventListeners() {
        window.addEventListener(
          'scroll',
          () => {
            els.topAppBar.classList.toggle('scrolled', window.scrollY > 12);
          },
          { passive: true }
        );

        els.brandResetBtn.addEventListener('click', resetAllFilters);
        els.resetFiltersInlineBtn.addEventListener('click', resetAllFilters);
        els.emptyResetBtn.addEventListener('click', resetAllFilters);
        els.retryFetchBtn.addEventListener('click', loadPlacesData);
        els.sortToggleBtn.addEventListener('click', toggleSortOrder);
        els.themeToggleBtn.addEventListener('click', toggleTheme);
        els.loadMoreBtn.addEventListener('click', handleLoadMore);

        // Search input & autocomplete
        els.searchInput.addEventListener('focus', () => {
          updateAutocompleteSuggestions(els.searchInput.value);
        });

        els.searchInput.addEventListener('click', () => {
          updateAutocompleteSuggestions(els.searchInput.value);
        });

        els.searchInput.addEventListener('input', () => {
          const val = els.searchInput.value;
          els.clearSearchBtn.classList.toggle('hidden', !val.length);
          updateAutocompleteSuggestions(val);

          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            searchQuery = val;
            filterPlaces();
          }, 120);
        });

        els.searchInput.addEventListener('keydown', (e) => {
          const dropdownOpen = !els.autocompleteDropdown.classList.contains('hidden');
          if (e.key === 'ArrowDown' && dropdownOpen) {
            e.preventDefault();
            highlightSuggestion(highlightedSuggestionIdx + 1);
          } else if (e.key === 'ArrowUp' && dropdownOpen) {
            e.preventDefault();
            highlightSuggestion(highlightedSuggestionIdx - 1);
          } else if (e.key === 'Enter') {
            if (dropdownOpen && highlightedSuggestionIdx >= 0 && currentSuggestions[highlightedSuggestionIdx]) {
              e.preventDefault();
              selectAutocompleteSuggestion(currentSuggestions[highlightedSuggestionIdx]);
            } else {
              els.searchInput.blur();
              hideAutocomplete();
              searchQuery = els.searchInput.value;
              filterPlaces();
            }
          } else if (e.key === 'Escape') {
            hideAutocomplete();
          }
        });

        els.clearSearchBtn.addEventListener('click', () => {
          els.searchInput.value = '';
          searchQuery = '';
          els.clearSearchBtn.classList.add('hidden');
          hideAutocomplete();
          filterPlaces();
          els.searchInput.focus();
        });

        document.addEventListener('pointerdown', (e) => {
          if (
            !els.autocompleteDropdown.contains(e.target) &&
            e.target !== els.searchInput
          ) {
            hideAutocomplete();
          }
        });

        // Modal controls
        els.modalCloseBtn.addEventListener('click', closeModal);
        els.modalPrevBtn.addEventListener('click', () => navigateModal(-1));
        els.modalNextBtn.addEventListener('click', () => navigateModal(1));
        els.modalShareBtn.addEventListener('click', copyDirectSpotLink);

        els.modalCityBtn.addEventListener('click', () => {
          const city = els.modalCityText.textContent;
          closeModal();
          els.searchInput.value = city;
          searchQuery = city;
          els.clearSearchBtn.classList.remove('hidden');
          filterPlaces();
        });

        els.placeModal.addEventListener('click', (e) => {
          if (e.target === els.placeModal) {
            closeModal();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (activeModalIndex !== -1) {
            if (e.key === 'Escape') closeModal();
            else if (e.key === 'ArrowLeft') navigateModal(-1);
            else if (e.key === 'ArrowRight') navigateModal(1);
          } else if (
            dinoGameRunning &&
            (e.code === 'Space' || e.code === 'ArrowUp')
          ) {
            if (document.activeElement === els.searchInput) {
              els.searchInput.blur();
            }
            e.preventDefault();
            triggerDinoJump();
          }
        });

        els.dinoCanvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          triggerDinoJump();
        });
      }

      // Boot sequence
      initTheme();
      renderLoadingSkeletons();
      parseUrlState();
      initEventListeners();
      loadPlacesData();
    })();
  </script>
</body>
</html>
